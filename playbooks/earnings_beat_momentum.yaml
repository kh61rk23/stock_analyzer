# イベントドリブン・プレイブック（Wave R4-1 / S5）
id: earnings_beat_momentum
event_source: earnings_surprise
description: 決算サプライズ（直近四半期 +5% 以上）＋2四半期以上の連続上振れのモメンタム追随。
entry:
  side: BUY
  conditions:
    - {field: surprise_pct, op: ">=", value: 5}
    # ガイダンス（会社予想）の上方修正はどのデータ源にも無いので、連続の上振れで勢いを見る
    - {field: consecutive_pos, op: ">=", value: 2}
  timing: next_open
  max_concurrent: 3
  size_pct_of_casino: 5
exit:
  hold_days_max: 30
  take_profit_pct: 12
  stop_loss_pct: -7
status: paper
