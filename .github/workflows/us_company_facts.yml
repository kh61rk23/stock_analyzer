name: 米国株の財務・企業情報の更新

# 全上場の米国株（NYSE・Nasdaq 普通株）の年次財務・社名・業種・発行済株式数を
# SEC の無料 API から取り、BigQuery の us.company_profile / us.financials_annual を更新する。
# SEC の daily-index で「その日 10-K / 10-Q を出した会社」だけを取り直す（1日あたり数十〜数百社）ので数分で終わる。
# 本体の daily_run（約40分）とは別ジョブにして、無料枠（月2,000分）への上乗せを月 約70分に抑える。
#   火〜土 20:07 JST（米国の前営業日の提出がインデックスに載った後）  cron UTC 11:07 火〜土
# 初回の全件取得（バックフィル）は manual_task の us_company_facts_backfill で行う。
on:
  schedule:
    - cron: "7 11 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us-company-facts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      STOCK_ANALYZER_BASE: ${{ github.workspace }}/stock_data
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-prices.txt
      - name: Install dependencies
        run: pip install -r requirements-prices.txt
      - name: Fetch SEC facts and load to BigQuery
        id: run
        env:
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
          BQ_CREDENTIALS: ${{ secrets.BQ_CREDENTIALS }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALERT_GMAIL_FROM: ${{ secrets.ALERT_GMAIL_FROM }}
          ALERT_GMAIL_PASSWORD: ${{ secrets.ALERT_GMAIL_PASSWORD }}
          ALERT_GMAIL_TO: ${{ secrets.ALERT_GMAIL_TO }}
        run: python -u us_company_facts.py --mode update --budget-minutes 25
      - name: Commit state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_data/data/us_company_facts/ stock_data/logs/ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "auto: us company facts $(date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push && exit 0; sleep 10; done
