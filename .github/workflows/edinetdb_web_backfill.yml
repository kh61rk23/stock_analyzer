name: EdinetDB Web Backfill

# 2026-10-03: EdinetDB の公開会社ページ（API枠を使わない）から財務・財務細目・書類一覧を補完する。
# 手動実行のみ。1秒に1社のペースで読む（約480社で約10分）。
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "ingested=BQに取込済みの会社 / all=上場全社"
        default: "ingested"
        type: choice
        options: [ingested, all]
      limit:
        description: "対象社数の上限（空=全部）"
        default: ""
      years:
        description: "直近何年度ぶん入れるか"
        default: "10"

permissions:
  contents: write
  actions: write

concurrency:
  # 日次（stock-analyzer）と同じ組にすると、自分を起動し直した時に待機中の日次が置き換えられて消える
  group: edinetdb-web-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Asia/Tokyo
      # 状態の置き場（config BLOCK 64）。git / dual / bq。Actions の変数 STATE_STORE_MODE で切り替える（未設定は bq）
      STATE_STORE_MODE: ${{ vars.STATE_STORE_MODE || 'bq' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install google-cloud-bigquery google-auth pandas requests
      # dual: checkout 直後の sha を基準として記録 ／ bq: BigQuery から状態を書き戻す（失敗したら止める）
      - name: Prepare state
        env:
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
          BQ_CREDENTIALS: ${{ secrets.BQ_CREDENTIALS }}
        run: python state_store.py prepare --profile fetch || [ "$STATE_STORE_MODE" = "dual" ]
      - name: Backfill from EdinetDB web pages
        id: backfill
        env:
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
          BQ_CREDENTIALS: ${{ secrets.BQ_CREDENTIALS }}
          STOCK_ANALYZER_BASE: ${{ github.workspace }}/stock_data
        run: |
          # 6時間のジョブ上限より手前で止め、メタを保存してから終える（次回は続きから）
          ARGS="--scope ${{ inputs.scope }} --years ${{ inputs.years }} --time-budget-min 320"
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          python actions_log.py --workflow edinetdb_web_backfill --step backfill -- python -u edinetdb_web_backfill.py $ARGS
      # 取り込んだ内容（ステップの成否・要点・表の行数の増減・保存量）を Gmail で知らせる（workflow_notify.py）
      - name: Notify
        if: always()
        continue-on-error: true
        env:
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
          BQ_CREDENTIALS: ${{ secrets.BQ_CREDENTIALS }}
          ALERT_GMAIL_FROM: ${{ secrets.ALERT_GMAIL_FROM }}
          ALERT_GMAIL_PASSWORD: ${{ secrets.ALERT_GMAIL_PASSWORD }}
          ALERT_GMAIL_TO: ${{ secrets.ALERT_GMAIL_TO }}
        run: python workflow_notify.py --workflow edinetdb_web_backfill --title "EdinetDB の会社ページからの財務補完" --tables edinet.financials,edinet.financial_items
      # 変わったファイルだけを load job で BigQuery（private.state_files）へ
      - name: Save state to BigQuery
        if: always() && env.STATE_STORE_MODE != 'git'
        env:
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
          BQ_CREDENTIALS: ${{ secrets.BQ_CREDENTIALS }}
        run: |
          python state_store.py save --source edinetdb_web_backfill --profile fetch || {
            echo "::warning::状態を BigQuery に保存できなかった"
            [ "$STATE_STORE_MODE" = "dual" ]
          }
      - name: Commit state
        if: always()
        run: |
          if [ "$STATE_STORE_MODE" = "bq" ]; then echo "⏩ STATE_STORE_MODE=bq: git には commit しない"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_data/data/edinetdb_rotation_meta.json stock_data/data/edinetdb_web_last.json
          git diff --cached --quiet && exit 0
          git commit -q -m "auto: edinetdb web backfill state"
          for i in 1 2 3; do git pull -q --rebase --autostash -X theirs origin main && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep 15; done
          echo "::error::状態ファイルを push できなかった（この回の結果は保存されていない）"; exit 1
      # 2026-10-03: 時間切れで中断した場合は、同じ条件で自分をもう一度起動する（全社は約7〜8時間かかる）。
      # GITHUB_TOKEN による workflow_dispatch は新しい実行を作れる（GitHub の例外規定）。
      - name: Continue if paused
        if: steps.backfill.outputs.paused == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run edinetdb_web_backfill.yml --ref main \
            -f scope=${{ inputs.scope }} -f years=${{ inputs.years }} -f limit="${{ inputs.limit }}"
          echo "▶ 続きを起動しました"
