name: 検証ラボの週次検証

# quant/（FX・コモディティ・株価指数・信用・オプションの戦略の検証）を回し、採用の門を通った戦略の一覧を作る。
#   python3 -m quant.runner research → stock_data/quant/registry.json と stock_data/insights/quant/research_<日付>.md
# 毎週土曜 12:17 JST（cron UTC 03:17）。価格は yfinance・金利は BIS の公開ファイル（どちらもキー不要・BigQuery は使わない）。
# 結果は状態として BigQuery（private.state_files）へ置く。git には commit しない（価格・検証結果・提案は公開しない）。
on:
  schedule:
    - cron: "17 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quant-research
  cancel-in-progress: false

jobs:
  run:
    name: 🔬 週次の検証
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Tokyo
      STOCK_ANALYZER_BASE: ${{ github.workspace }}/stock_data
      # 状態の置き場（config BLOCK 64）。git / dual / bq。Actions の変数 STATE_STORE_MODE で切り替える（未設定は bq）
      STATE_STORE_MODE: ${{ vars.STATE_STORE_MODE || 'bq' }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-invest.txt
      - name: Install dependencies
        run: pip install -r requirements-invest.txt
      # 前回の registry・監視の実績（stock_data/quant/）と、外部の実績に使う仮想トレードの口座（stock_data/paper/）だけを戻す
      - name: Restore state
        env:
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
          BQ_CREDENTIALS: ${{ secrets.BQ_CREDENTIALS }}
        run: python state_store.py prepare --paths stock_data/quant/ stock_data/paper/ || [ "$STATE_STORE_MODE" = "dual" ]
      - name: Research
        id: research
        run: python actions_log.py --workflow quant_research --step research -- python -u -m quant.runner research
      # 結果（ステップの成否・要点）を Gmail で知らせる（workflow_notify.py）
      - name: Notify
        if: always()
        continue-on-error: true
        env:
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
          BQ_CREDENTIALS: ${{ secrets.BQ_CREDENTIALS }}
          ALERT_GMAIL_FROM: ${{ secrets.ALERT_GMAIL_FROM }}
          ALERT_GMAIL_PASSWORD: ${{ secrets.ALERT_GMAIL_PASSWORD }}
          ALERT_GMAIL_TO: ${{ secrets.ALERT_GMAIL_TO }}
        run: python workflow_notify.py --workflow quant_research --title "検証ラボの週次検証"
      # 検証が成功した回だけ、registry と成績表を load job で BigQuery（private.state_files）へ
      - name: Save state to BigQuery
        if: always() && steps.research.outcome == 'success' && env.STATE_STORE_MODE != 'git'
        env:
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
          BQ_CREDENTIALS: ${{ secrets.BQ_CREDENTIALS }}
        run: |
          python state_store.py save --paths stock_data/quant/ stock_data/insights/quant/ --source quant_research || {
            echo "::warning::状態を BigQuery に保存できなかった"
            [ "$STATE_STORE_MODE" = "dual" ]
          }
