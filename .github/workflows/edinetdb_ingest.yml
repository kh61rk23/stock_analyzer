name: EdinetDB scheduled ingest

on:
  schedule:
    # EdinetDBの公式データ更新は毎朝08:00 JST。30分の余裕を置く。
    - cron: "30 23 * * *" # UTC 23:30 = JST 08:30
  workflow_dispatch:
    inputs:
      limit:
        description: "対象企業数上限（空欄は日次予算内で自動選択）"
        required: false
        default: ""
        type: string

concurrency:
  group: stock-analyzer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Tokyo
      STOCK_ANALYZER_BASE: ${{ github.workspace }}/stock_data
      ENABLE_EDINETDB_INGEST: "1"
      EDINETDB_API_KEY: ${{ secrets.EDINETDB_API_KEY }}
      BQ_CREDENTIALS: ${{ secrets.BQ_CREDENTIALS }}
      BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure BigQuery integration schema
        run: python setup_db_integration_bq.py

      - name: Ingest EdinetDB into BigQuery
        env:
          TARGET_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          python - <<'PY'
          import json
          import os

          import config as cfg
          from edinet_doc_indexer import run_doc_indexer
          from edinetdb_ingestor import run_edinetdb_ingest

          raw_limit = os.environ.get("TARGET_LIMIT", "").strip()
          limit = int(raw_limit) if raw_limit else None
          ingest = run_edinetdb_ingest(cfg, target_limit=limit)
          print(json.dumps({"ingest": ingest}, ensure_ascii=False, indent=2))
          if ingest.get("skipped"):
              raise SystemExit(f"EdinetDB ingest skipped: {ingest.get('reason')}")

          docs = run_doc_indexer(
              days_back=int(getattr(cfg, "EDINETDB_LOOKBACK_DAYS", 7)), cfg=cfg
          )
          print(json.dumps({"doc_index": docs}, ensure_ascii=False, indent=2))
          if docs.get("skipped"):
              raise SystemExit(f"EdinetDB doc index skipped: {docs.get('reason')}")
          PY

      - name: Persist rotation state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_data/data/edinetdb_company_cache.json 2>/dev/null || true
          git add stock_data/data/edinetdb_rotation_meta.json 2>/dev/null || true
          git add stock_data/data/edinetdb_cache/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No EdinetDB state changes"
          else
            git commit -m "chore: persist EdinetDB rotation state"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
