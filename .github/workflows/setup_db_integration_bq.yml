name: Setup DB Integration BigQuery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install BigQuery dependencies
        run: pip install google-cloud-bigquery google-auth pandas
      - name: Create and migrate W3/W5 tables
        env:
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
          BQ_CREDENTIALS: ${{ secrets.BQ_CREDENTIALS }}
        run: python setup_db_integration_bq.py
