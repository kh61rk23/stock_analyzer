name: Manual Task

# 2026-10-03: 日次以外の処理を手動で1回だけ動かす（BQ認証が必要なもの）。
on:
  workflow_dispatch:
    inputs:
      task:
        description: "実行する処理"
        type: choice
        options:
          - geo_exposure_force
          - country_profile
          - monthly_mail_prev_month
          - seisakudb_probe
          - bi_export
          - price_universe_jp
          - price_universe_us
          - price_universe_backfill
          - us_company_facts_update
          - us_company_facts_backfill
          - us_company_facts_segments
          - arxiv_backfill
          - arxiv_enrich
          - report_backfill
          - edinetdb_ingest
          - stock_real_estate
          - rental_property_ingest
          - alert_backfill
          - ontology_export
          - monthly_catchup
          - edinet_gov_probe
          - edinet_gov_fv_ingest
          - taxonomy_mapper
          - edinet_gov_segment_probe

permissions:
  contents: write

concurrency:
  group: ${{ startsWith(inputs.task, 'us_company_facts') && 'us-company-facts' || format('manual-{0}', inputs.task) }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # 状態の置き場（config BLOCK 64）。git / dual / bq。Actions の変数 STATE_STORE_MODE で切り替える（未設定は bq）
      STATE_STORE_MODE: ${{ vars.STATE_STORE_MODE || 'bq' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          case "${{ inputs.task }}" in
            price_universe_*|us_company_facts_*|stock_real_estate|alert_backfill|ontology_export|edinet_gov_probe|edinet_gov_fv_ingest|edinet_gov_segment_probe) pip install -r requirements-prices.txt ;;
            *) pip install -r requirements.txt ;;
          esac
      # dual: checkout 直後の sha を基準として記録 ／ bq: BigQuery から状態を書き戻す（失敗したら止める）
      - name: Prepare state
        env:
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
          BQ_CREDENTIALS: ${{ secrets.BQ_CREDENTIALS }}
        run: python state_store.py prepare || [ "$STATE_STORE_MODE" = "dual" ]
      - name: Run task
        id: run
        env:
          TZ: Asia/Tokyo
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
          BQ_CREDENTIALS: ${{ secrets.BQ_CREDENTIALS }}
          ALERT_GMAIL_FROM: ${{ secrets.ALERT_GMAIL_FROM }}
          ALERT_GMAIL_PASSWORD: ${{ secrets.ALERT_GMAIL_PASSWORD }}
          ALERT_GMAIL_TO: ${{ secrets.ALERT_GMAIL_TO }}
          SEISAKUDB_API_KEY: ${{ secrets.SEISAKUDB_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          EDINETDB_API_KEY: ${{ secrets.EDINETDB_API_KEY }}
          EDINET_GOV_API_KEY: ${{ secrets.EDINET_GOV_API_KEY }}
          FUDOSAN_API_KEY: ${{ secrets.FUDOSAN_API_KEY }}
          POLICY_FRED_API_KEY: ${{ secrets.POLICY_FRED_API_KEY }}
          STOCK_ANALYZER_BASE: ${{ github.workspace }}/stock_data
        # Python の出力は stock_data/logs/actions_manual_task_<日付>.log へ（actions_log.py）。ログには要約だけを出す。
        run: |
          cat > "$RUNNER_TEMP/task.sh" <<'TASK'
          case "$TASK" in
            geo_exposure_force) python -u geo_exposure_runner.py --force ;;
            country_profile) python -u country_profile_builder.py ;;
            monthly_mail_prev_month) python -u monthly_mail.py "$(date -d "$(date +%Y-%m-01) -1 day" +%Y%m)" ;;
            seisakudb_probe) python -u seisakudb_ingestor.py --probe ;;
            bi_export) python -u bi_export.py ;;
            price_universe_jp) python -u price_universe.py --market jp ;;
            price_universe_us) python -u price_universe.py --market us ;;
            price_universe_backfill) python -u price_universe.py --market all --backfill ;;
            us_company_facts_update) python -u us_company_facts.py --mode update ;;
            us_company_facts_backfill) python -u us_company_facts.py --mode backfill --budget-minutes 100 ;;
            us_company_facts_segments) python -u us_segments.py ;;
            arxiv_backfill) python -u arxiv_store.py --backfill ;;
            arxiv_enrich) python -u arxiv_store.py --enrich ;;
            report_backfill) python -u report_store.py ;;
            # 日次処理の EdinetDB 関連だけ（会社ページの年次財務 → API の本文・セグメント・四半期 → 書類一覧）。その日の残り枠を使う
            edinetdb_ingest) python -u edinetdb_web_backfill.py --scope due --years 3 --time-budget-min 15 && python -u edinetdb_ingestor.py && python -u -c "import config as c, edinet_doc_indexer as d; print(d.run_doc_indexer(cfg=c))" ;;
            # 銘柄単位の不動産ボーナス（bi.m_screener から全上場分）と業種マスタ・company_master ビューだけを作り直す
            stock_real_estate) python -u stock_real_estate.py ;;
            # 賃貸等不動産（EdinetDB real-estate）を設定どおりに取る（無効の間は試行の10社。EdinetDB の日次枠を使う）
            rental_property_ingest) python -u rental_property_ingestor.py ;;
            # 送信済みの日次メール（IMAP）から、全節と銘柄を analytics.alert_sections / alert_items へ
            alert_backfill) python -u alert_store.py --backfill ;;
            # オントロジー（企業・シグナル・テーマ・判断）を週次を待たずに作り直す
            ontology_export) python -u ontology_exporter.py ;;
            # 直近3か月で月次レビューが抜けている月を作り直す（メールは送らない）
            monthly_catchup) python -u monthly_runner.py --catch-up ;;
            # 政府 EDINET API で IFRS 会社（J.フロント・三井物産・NTT）の有報 XBRL から投資不動産の要素を書き出す（EDINET_GOV_API_KEY が要る）
            edinet_gov_probe) python -u edinet_gov_xbrl.py --probe E03516 E02513 E04430 ;;
            # 政府 EDINET API で IFRS 会社の最新の有報から投資不動産の帳簿価額・公正価値を取り、real_estate.rental_property_fv へ書く（EDINET_GOV_API_KEY が要る・1日の社数は EDINET_GOV_FV_DAILY_LIMIT）
            edinet_gov_fv_ingest) python -u edinet_gov_xbrl.py --ingest ;;
            # 技術マップの会社への対応付け（セグメント・語の照合・補い）を週次を待たずに作り直す（埋め込みのモデルが要るので Actions で）
            taxonomy_mapper) python -u taxonomy_company_mapper.py ;;
            # 調べる用：三菱商事・ソニー・ソフトバンクG・信越化学の有報の CSV にあるセグメント別の売上の要素名を書き出す
            edinet_gov_segment_probe) python -u edinet_gov_text.py --probe-segments 8058 6758 9984 4063 7203 ;;
          esac
          TASK
          TASK="${{ inputs.task }}" python actions_log.py --workflow manual_task --step "${{ inputs.task }}" -- bash "$RUNNER_TEMP/task.sh"
      # 取り込んだ内容（ステップの成否・要点・表の行数の増減・保存量）を Gmail で知らせる（workflow_notify.py）
      - name: Notify
        if: always()
        continue-on-error: true
        env:
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
          BQ_CREDENTIALS: ${{ secrets.BQ_CREDENTIALS }}
          ALERT_GMAIL_FROM: ${{ secrets.ALERT_GMAIL_FROM }}
          ALERT_GMAIL_PASSWORD: ${{ secrets.ALERT_GMAIL_PASSWORD }}
          ALERT_GMAIL_TO: ${{ secrets.ALERT_GMAIL_TO }}
        run: python workflow_notify.py --workflow manual_task --title "手動タスク ${{ inputs.task }}"
      # 変わったファイルだけを load job で BigQuery（private.state_files）へ
      - name: Save state to BigQuery
        if: always() && env.STATE_STORE_MODE != 'git'
        env:
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
          BQ_CREDENTIALS: ${{ secrets.BQ_CREDENTIALS }}
        run: |
          EXCL=""
          # タスクが失敗した回は stock_data/bi を保存しない（bi_export は全部成功か全部なし）
          if [ "${{ steps.run.outcome }}" != "success" ]; then EXCL="--exclude stock_data/bi/"; fi
          python state_store.py save --source "manual_task:${{ inputs.task }}" $EXCL || {
            echo "::warning::状態を BigQuery に保存できなかった"
            [ "$STATE_STORE_MODE" = "dual" ]
          }
      - name: Commit state
        if: always()
        run: |
          if [ "$STATE_STORE_MODE" = "bq" ]; then echo "⏩ STATE_STORE_MODE=bq: git には commit しない"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # タスクが失敗した回は stock_data/bi を前回のコミットへ戻す（bi_export は全部成功か全部なし）
          if [ "${{ steps.run.outcome }}" != "success" ]; then
            git checkout -- stock_data/bi 2>/dev/null || true
            git clean -fdq -- stock_data/bi 2>/dev/null || true
          fi
          git add stock_data/data/ 2>/dev/null || true
          git add stock_data/bi/ 2>/dev/null || true
          git add stock_data/logs/ 2>/dev/null || true
          # 月次の作り直し等が書くレポートとペーパー口座（ここに無いと作っても保存されない）
          git add stock_data/insights/ stock_data/paper/ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "auto: manual task ${{ inputs.task }}"
          for i in 1 2 3; do git pull -q --rebase --autostash -X theirs origin main && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep 15; done
          echo "::error::状態ファイルを push できなかった（この回の結果は保存されていない）"; exit 1
