name: Manual Task

# 2026-10-03: 日次以外の処理を手動で1回だけ動かす（BQ認証が必要なもの）。
on:
  workflow_dispatch:
    inputs:
      task:
        description: "実行する処理"
        type: choice
        options:
          - geo_exposure_force
          - country_profile
          - monthly_mail_prev_month
          - seisakudb_probe

permissions:
  contents: write

concurrency:
  group: manual-${{ inputs.task }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run task
        env:
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
          BQ_CREDENTIALS: ${{ secrets.BQ_CREDENTIALS }}
          ALERT_GMAIL_FROM: ${{ secrets.ALERT_GMAIL_FROM }}
          ALERT_GMAIL_PASSWORD: ${{ secrets.ALERT_GMAIL_PASSWORD }}
          ALERT_GMAIL_TO: ${{ secrets.ALERT_GMAIL_TO }}
          SEISAKUDB_API_KEY: ${{ secrets.SEISAKUDB_API_KEY }}
          STOCK_ANALYZER_BASE: ${{ github.workspace }}/stock_data
        run: |
          case "${{ inputs.task }}" in
            geo_exposure_force) python -u geo_exposure_runner.py --force ;;
            country_profile) python -u country_profile_builder.py ;;
            monthly_mail_prev_month) python -u monthly_mail.py "$(date -d "$(date +%Y-%m-01) -1 day" +%Y%m)" ;;
            seisakudb_probe) python -u seisakudb_ingestor.py --probe ;;
          esac
      - name: Commit state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_data/data/ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "auto: manual task ${{ inputs.task }}"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 10; done
