name: Manual Task

# 2026-10-03: 日次以外の処理を手動で1回だけ動かす（BQ認証が必要なもの）。
on:
  workflow_dispatch:
    inputs:
      task:
        description: "実行する処理"
        type: choice
        options:
          - geo_exposure_force
          - country_profile
          - monthly_mail_prev_month
          - seisakudb_probe
          - bi_export
          - price_universe_jp
          - price_universe_us
          - price_universe_backfill
          - us_company_facts_update
          - us_company_facts_backfill
          - us_company_facts_segments
          - arxiv_backfill
          - arxiv_enrich
          - report_backfill
          - edinetdb_ingest
          - stock_real_estate
          - rental_property_ingest
          - alert_backfill
          - ontology_export

permissions:
  contents: write

concurrency:
  group: ${{ startsWith(inputs.task, 'us_company_facts') && 'us-company-facts' || format('manual-{0}', inputs.task) }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          case "${{ inputs.task }}" in
            price_universe_*|us_company_facts_*|stock_real_estate|alert_backfill|ontology_export) pip install -r requirements-prices.txt ;;
            *) pip install -r requirements.txt ;;
          esac
      - name: Run task
        id: run
        env:
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
          BQ_CREDENTIALS: ${{ secrets.BQ_CREDENTIALS }}
          ALERT_GMAIL_FROM: ${{ secrets.ALERT_GMAIL_FROM }}
          ALERT_GMAIL_PASSWORD: ${{ secrets.ALERT_GMAIL_PASSWORD }}
          ALERT_GMAIL_TO: ${{ secrets.ALERT_GMAIL_TO }}
          SEISAKUDB_API_KEY: ${{ secrets.SEISAKUDB_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          EDINETDB_API_KEY: ${{ secrets.EDINETDB_API_KEY }}
          STOCK_ANALYZER_BASE: ${{ github.workspace }}/stock_data
        run: |
          case "${{ inputs.task }}" in
            geo_exposure_force) python -u geo_exposure_runner.py --force ;;
            country_profile) python -u country_profile_builder.py ;;
            monthly_mail_prev_month) python -u monthly_mail.py "$(date -d "$(date +%Y-%m-01) -1 day" +%Y%m)" ;;
            seisakudb_probe) python -u seisakudb_ingestor.py --probe ;;
            bi_export) python -u bi_export.py ;;
            price_universe_jp) python -u price_universe.py --market jp ;;
            price_universe_us) python -u price_universe.py --market us ;;
            price_universe_backfill) python -u price_universe.py --market all --backfill ;;
            us_company_facts_update) python -u us_company_facts.py --mode update ;;
            us_company_facts_backfill) python -u us_company_facts.py --mode backfill --budget-minutes 100 ;;
            us_company_facts_segments) python -u us_segments.py ;;
            arxiv_backfill) python -u arxiv_store.py --backfill ;;
            arxiv_enrich) python -u arxiv_store.py --enrich ;;
            report_backfill) python -u report_store.py ;;
            # 日次処理の EdinetDB 関連だけ（会社ページの年次財務 → API の本文・セグメント・四半期 → 書類一覧）。その日の残り枠を使う
            edinetdb_ingest) python -u edinetdb_web_backfill.py --scope due --years 3 --time-budget-min 15; python -u edinetdb_ingestor.py; python -u -c "import config as c, edinet_doc_indexer as d; print(d.run_doc_indexer(cfg=c))" ;;
            # 銘柄単位の不動産ボーナス（bi.m_screener から全上場分）と業種マスタ・company_master ビューだけを作り直す
            stock_real_estate) python -u stock_real_estate.py ;;
            # 賃貸等不動産（EdinetDB real-estate）を設定どおりに取る（無効の間は試行の10社。EdinetDB の日次枠を使う）
            rental_property_ingest) python -u rental_property_ingestor.py ;;
            # 送信済みの日次メール（IMAP）から、全節と銘柄を analytics.alert_sections / alert_items へ
            alert_backfill) python -u alert_store.py --backfill ;;
            # オントロジー（企業・シグナル・テーマ・判断）を週次を待たずに作り直す
            ontology_export) python -u ontology_exporter.py ;;
          esac
      - name: Commit state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # タスクが失敗した回は stock_data/bi を前回のコミットへ戻す（bi_export は全部成功か全部なし）
          if [ "${{ steps.run.outcome }}" != "success" ]; then
            git checkout -- stock_data/bi 2>/dev/null || true
            git clean -fdq -- stock_data/bi 2>/dev/null || true
          fi
          git add stock_data/data/ 2>/dev/null || true
          git add stock_data/bi/ 2>/dev/null || true
          git add stock_data/logs/ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "auto: manual task ${{ inputs.task }}"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 10; done
