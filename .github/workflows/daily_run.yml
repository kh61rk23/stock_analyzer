            git add stock_data/cache/latent_pearl_cache.json 2>/dev/null || true
            git add stock_data/cache/pearl_backtest_log.json 2>/dev/null || true
            # ── Wave R0〜R5: 状態ファイル永続化（2026-07-12追加）──────
            # これらは日次で蓄積・更新される「状態」。永続化しないと毎朝リセットされ
            # 蓄積(ML特徴量/S2口座/DD peak/hotnessベースライン/繰越キュー)が始まらない。
            git add stock_data/data/edinet_retry_queue.json 2>/dev/null || true
            git add stock_data/data/exit_engine_baseline.json 2>/dev/null || true
            git add stock_data/data/dd_state.json 2>/dev/null || true
            git add stock_data/paper/ 2>/dev/null || true
            git add stock_data/cache/taxonomy/ 2>/dev/null || true
            git add stock_data/data/ml_dataset/ 2>/dev/null || true
            # ── GDELT「最後に取れた値」永続キャッシュ（2026-07-17追加・Issue J-1）──
            git add stock_data/cache/gdelt_instability_cache.json 2>/dev/null || true
            # ── 月次ランナーの成果物（2026-07-25 B-5追加）──────────
            # 提案系の注文票と月次ループの実行状況。insights/ は上で add 済み。
            git add stock_data/orders/ 2>/dev/null || true
            git add stock_data/monthly_loop_status.json 2>/dev/null || true
            # 実行間隔の判定に使う状態ファイル。これが永続化されないと
            # 毎回「初回」扱いになり、30日間隔・隔週間隔が効かなくなる。
            git add stock_data/data/geo_exposure_state.json 2>/dev/null || true
            git add stock_data/data/deliberation_state.json 2>/dev/null || true
            git diff --cached --quiet || git commit -m "auto: daily update $(date '+%Y-%m-%d')"
            # 2026-07-16是正: 未ステージ変更が残ると pull --rebase が
            # 「You have unstaged changes」で失敗し、リモートが先行している日は
            # push が黙って拒否され状態ファイルが一切保存されない実害があった
            # （健太が同日にコード修正をプッシュ→リモート先行→全ロスト）。
            # --autostash で未ステージ分を自動退避し、push失敗はログで可視化する。
            git pull --rebase --autostash origin main || echo "⚠️ pull --rebase失敗（ログ要確認）"
            git push && echo "✅ 状態ファイル・キャッシュをコミット/プッシュしました" \
                     || echo "⚠️ git push失敗: 状態ファイルは保存されていない（次回実行で再試行）"

      # ── 6. 結果を Artifacts として保存（7日間保持）──────
      - name: 📁 Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-results-${{ github.run_number }}
          path: |
            stock_data/insights/
            stock_data/logs/
          retention-days: 7

      # ── 7. 失敗時のサマリー出力 ───────────────────────────
      - name: 📋 Output summary
        if: always()
        run: |
          echo "## 📊 Stock Analyzer 実行結果" >> $GITHUB_STEP_SUMMARY
          echo "- **モード**: ${{ steps.set-mode.outputs.mode }}" >> $GITHUB_STEP_SUMMARY
          echo "- **実行日時**: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          if [ -d "stock_data/insights" ]; then
            FILE_COUNT=$(find stock_data/insights -name "*.md" | wc -l)
            echo "- **生成レポート数**: ${FILE_COUNT} ファイル" >> $GITHUB_STEP_SUMMARY
          fi
