            git add stock_data/cache/ignition_alerts.json 2>/dev/null || true
            git add stock_data/cache/ignition_history.json 2>/dev/null || true
            # ── Wave 5 - E4 テキストシグナルキャッシュ ────────────
            git add stock_data/cache/text_signal_cache.json 2>/dev/null || true
            git add stock_data/cache/text_extractor/ 2>/dev/null || true
            # ── Wave 5 - Idea3-P3 policy_radar 文意判定キャッシュ ──
            git add stock_data/cache/policy_radar_cache.json 2>/dev/null || true
            # ── Wave 7: 新規キャッシュファイル ────────────────────
            git add stock_data/cache/standardization_cache.json 2>/dev/null || true
