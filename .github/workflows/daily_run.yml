# ==============================================================
# .github/workflows/daily_run.yml  (5-C)
# GitHub Actions 自律実行ワークフロー
# ==============================================================
# 【スケジュール】
#   デイリー : 月〜土 09:17 JST (= UTC 00:17)  cron "17 0 * * 1-6"
#   ウィークリー: 毎週月曜 09:17 JST に自動切替
#       └ デイリー cron は月〜土の UTC 00:17 に発火する。月曜 UTC 00:17 =
#         月曜 09:17 JST であり、その回を "Set execution mode" が
#         UTC 月曜と判定して weekly モードへ自動昇格する。
#         専用 cron は不要（重複起動を避けるため）。
#   ※ 2026-09-09 に "0 0 * * *"（毎日 UTC 00:00）から変更。理由は
#     UTC 00:00 のジョブ集中による遅延回避と、日曜実行の停止による
#     Actions 無料枠（2,000分/月）の節約。詳細は下の `on:` 直上を参照。
#
# 【手動実行】
#   GitHub の Actions タブ → "Run workflow" でも実行可能
#   mode を daily / weekly / all から選択できる
#
# 【必要な GitHub Secrets 設定箇所】
#   リポジトリ Settings > Secrets and variables > Actions > New repository secret
#   ─────────────────────────────────────────────────────
#   ALERT_GMAIL_FROM      送信元 Gmail アドレス
#   ALERT_GMAIL_PASSWORD  Gmail App Password（16桁）
#   ALERT_GMAIL_TO        送信先アドレス（同じアドレスでも可）
#   ALERT_LINE_TOKEN      LINE Messaging API チャネルアクセストークン（任意）
#   ALERT_LINE_USER_ID    通知先 LINE ユーザーID（任意）
#   POLICY_FRED_API_KEY   FRED API キー（任意）
#   BQ_PROJECT_ID         BigQuery プロジェクト ID
#   BQ_CREDENTIALS        BigQuery サービスアカウント JSON（文字列）
#   ANTHROPIC_API_KEY     Claude API キー（任意）
#   GOOGLE_CSE_API_KEY    Google Custom Search API キー（任意）
#   GOOGLE_CSE_ID         Google CSE ID（任意）
#   GOOGLE_OAUTH_*        Google Drive OAuth 認証（3種）
#   GOOGLE_DRIVE_FOLDER_ID    GDrive バックアップ先フォルダ ID
#   ESTAT_API_KEY         e-Stat API キー（任意）
#   EDINETDB_API_KEY      EdinetDB API キー（任意）
#   FUDOSAN_API_KEY       不動産DB API キー（任意）
#   SEISAKUDB_API_KEY     政策DB API キー（任意・未設定なら取り込みをスキップ）
#   DEEPL_API_KEY         DeepL API キー（任意）
#   SEC_USER_AGENT        SEC EDGAR User-Agent（例: MyApp/1.0 your@email.com）
#                         ※ institutional_13f_monitor.py が参照（任意・未設定時はデフォルト値使用）
# ==============================================================

name: 📊 Stock Analyzer 自律実行

on:
  # ── デイリー: 月〜土 09:17 JST ────────────────────────────
  #   日本は DST がないため UTC+9 固定。UTC 00:17 = JST 09:17。
  #   月曜 JST（= 月曜 UTC）の回は "Set execution mode" が weekly に昇格する。
  #   日曜だけ止める: 土 09:17 JST は米国金曜の引け後で取得価値があるが、
  #   日 09:17 JST は日米とも市場が動いておらず、Actions 無料枠を
  #   消費するだけになる（2026-09 に月間枠 2,000分を超過した経緯）。
  #
  #   ★ 2026-09-09: UTC 00:00 ちょうどは世界中のジョブが集中し、実測で
  #     10日連続 3時間20分〜4時間13分の遅延が発生していた（GitHubは高負荷時の
  #     遅延とドロップを公式に明記）。混雑を避けるため :17 へずらす。
  #   ★ 前倒し（UTC 23:40）は採らない。JST月曜の回が UTC では日曜になり、
  #     weekly 判定（UTC曜日で月曜を見る）が一度も成立しなくなるため。
  #     同じUTC日の中でずらせば曜日ロジックに一切触れずに済む。
  schedule:
    - cron: "17 0 * * 1-6"    # UTC 00:17 = JST 09:17（月〜土）

  # ── 手動実行 ──────────────────────────────────────────────
  # 実行モードは四種類ある。
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - weekly
          - all
          - single 
      module:             # ← 以下全行を追加
        description: "単体テスト対象モジュール（mode=single の時のみ有効）"
        required: false
        default: ""
        type: string

# 同時実行を防止（前回が終わっていない場合はキャンセル）
concurrency:
  group: stock-analyzer
  cancel-in-progress: false
  
permissions:
  contents: write   # git push を許可
  actions: read     # actions_usage.py が当月の実行履歴（使用分数）を読む

jobs:
  run-analyzer:
    name: 📈 アナライザー実行
    runs-on: ubuntu-latest
    timeout-minutes: 180   # タイムアウト 180分
    env:
      TZ: Asia/Tokyo
      BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
      # 状態の置き場（config BLOCK 64）。git / dual / bq。Actions の変数 STATE_STORE_MODE で切り替える（未設定は bq）
      STATE_STORE_MODE: ${{ vars.STATE_STORE_MODE || 'bq' }}
    # BQ_CREDENTIALSは各stepで個別指定（JSONをそのままenvに渡すため）
    steps:
      # ── 1. リポジトリのチェックアウト ─────────────────────
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # 書き込み用トークン

      # ── 2. Python セットアップ ────────────────────────────
      - name: 🐍 Setup Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          # pip のダウンロード キャッシュは使わない（下でインストール済みの環境ごと戻すので、毎回の復元時間が無駄になる）

      # ── 3. 依存パッケージインストール ─────────────────────
      # torch・transformers（FinBERT が毎日使う）を含むので、pip の展開だけで毎回約1分半かかる。
      # インストール済みの Python ごと保存して戻し、当たった日は pip を飛ばす。
      # requirements.txt は下限指定（>=）なので、キーに年月を入れて月に1回は入れ直す（yfinance 等の更新を取り込む）。
      - name: 🗓️ Cache key month
        id: ym
        run: echo "ym=$(date -u +%Y%m)" >> "$GITHUB_OUTPUT"

      - name: ♻️ Restore installed packages
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: pydeps-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}-${{ steps.ym.outputs.ym }}

      - name: 📦 Install dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      # ── 3-0. 状態の準備（state_store.py）─────────────────────
      # dual: checkout 直後のファイルの sha を基準として記録する（save が「この実行で変えたファイル」を見分ける）。
      # bq  : BigQuery の private.state_files から状態を書き戻す。失敗したら状態なしで走らせないよう止める。
      # 下の Set execution mode が stock_data/data/last_weekly_run.json を読むので、それより前に置く。
      - name: ☁️ Prepare state
        env:
          BQ_CREDENTIALS: ${{ secrets.BQ_CREDENTIALS }}
        run: python state_store.py prepare || [ "$STATE_STORE_MODE" = "dual" ]

      # ── 3-A. 実行モード決定 ───────────────────────────────
      #   手動実行       → inputs.mode を使用（daily / weekly / all / single）
      #   スケジュール実行 → UTC 月曜（= 月曜 JST）なら weekly、それ以外は daily
      #   ※ 後続の週次専用ステップ（text_extractor）がこの出力を参照するため、
      #     それらより前に実行する必要がある。
      - name: 🎯 Set execution mode
        id: set-mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          elif [ "$(date -u +%u)" = "1" ]; then
            # 月曜 UTC 00:17 = 月曜 JST 09:17 → weekly
            # ※ cron を UTC 00:xx に保つ限り UTC曜日 = JST曜日 で一致する。
            #   前倒しして UTC 23:xx にすると日付がずれてこの判定が壊れる。
            MODE="weekly"
          else
            MODE="daily"
            # 月曜の回が落ちた・GitHub に落とされた週は、週次（ontology・backtest・rule_optimizer・
            # 週次レポート等）がまるごと抜ける。最後に週次が成功してから8日以上なら、この回を weekly に上げる。
            # 印（stock_data/data/last_weekly_run.json）は週次の分析が成功した回だけ下の Commit で書く。
            LAST=$(python3 -c "import json;print(json.load(open('stock_data/data/last_weekly_run.json')).get('date',''))" 2>/dev/null || true)
            if [ -n "$LAST" ]; then
              AGE=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 86400 ))
              if [ "$AGE" -ge 8 ]; then
                MODE="weekly"
                echo "↗️ 最後の週次成功が ${LAST}（${AGE}日前）のため weekly で追いつく"
              fi
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "▶ 実行モード: $MODE"

      # ── 3-B1. EdinetDB同期（公式更新08:00 JST後・日次分析より先）────
      - name: 🗄️ Ensure EdinetDB BigQuery schema
        id: db-schema
        continue-on-error: true
        env:
          STOCK_ANALYZER_BASE: ${{ github.workspace }}/stock_data
          BQ_CREDENTIALS: ${{ secrets.BQ_CREDENTIALS }}
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
        run: python actions_log.py --workflow daily_run --step setup_db_integration_bq -- python -u setup_db_integration_bq.py

      # ── 3-B2. EdinetDB同期は削除（2026-09-09）─────────────────
      #   ここに run_edinetdb_ingest / run_doc_indexer を直接呼ぶ専用ステップが
      #   あったが、両者は DAILY_MODULES にも登録されており
      #   stock_analyzer_main 内でも実行されていた。つまり1日2回叩いており、
      #   このステップが日次予算46をほぼ使い切ったあとに本体側が走るため、
      #   本体の edinetdb_ingest は毎回 success 0 / 予算到達で終わっていた
      #   （2026-09-09 実測: api_calls 46・success 0・failure 2、
      #     doc_indexer も「巡回9/10社」の直後に「巡回0/10社」で二重実行）。
      #   本体側の実行だけを残す。results / 実行台帳 / pipeline_registry に
      #   統合されており、DAILY_MODULES で制御できるのはそちらのため。

      # 13F（機関投資家）は本体 stock_analyzer_main.py が四半期の提出期間の判定つきで呼ぶ（専用の事前ステップは持たない）。
      # ── 3-B2. Wave 5 - E4: テキストシグナル抽出（週次のみ・50社上限）──
      # 2026-09-26: 停止。config.SECTORS に銘柄リストが無く（銘柄はBQから取る方式へ移行済み）
      # 毎週「対象銘柄リストが空のためスキップ」で空振りしていた。リスク減点自体も
      # ENABLE_TEXT_RISK_BONUS=False で当面無効（健太の判断）。
      - name: 📝 Run text extractor (weekly, first-run limit 50)
        if: false && steps.set-mode.outputs.mode == 'weekly'
        env:
          BQ_CREDENTIALS: ${{ secrets.BQ_CREDENTIALS }}
          BQ_PROJECT_ID:  ${{ secrets.BQ_PROJECT_ID }}
          EDINETDB_API_KEY: ${{ secrets.EDINETDB_API_KEY }}
          STOCK_ANALYZER_BASE: ${{ github.workspace }}/stock_data
        run: |
          python - <<'EOF'
          import importlib.util, sys, pathlib

          # config ロード
          cfg_path = pathlib.Path("config.py")
          if not cfg_path.exists():
              print("ERROR: config.py not found"); sys.exit(1)
          spec = importlib.util.spec_from_file_location("config", cfg_path)
          cfg  = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(cfg)

          # 初回実行ガードレール: 最大50社
          import os
          cfg.ENABLE_TEXT_SIGNAL           = True
          cfg.TEXT_SIGNAL_FIRST_RUN_LIMIT  = int(os.environ.get("TEXT_SIGNAL_LIMIT", "50"))

          # text_extractor バッチ実行
          sys.path.insert(0, str(pathlib.Path(__file__).parent if hasattr(__file__, '__file__') else pathlib.Path(".")))
          from text_extractor import batch_extract_sections

          # 対象銘柄リストを config.SECTORS から収集
          codes = []
          for sec in getattr(cfg, "SECTORS", {}).values():
              for ticker in sec.get("tickers", []):
                  codes.append(str(ticker))

          if not codes:
              print("⚠️  対象銘柄リストが空のためスキップ")
              sys.exit(0)

          sections_map = batch_extract_sections(cfg, codes)
          print(f"✅ text_extractor 完了: {len(sections_map)}社")

          # text_signal バッチ計算
          from finbert_analyzer import analyze_sections
          from text_signal import batch_calc_text_risk_bonus

          analysis_map = {}
          for code, sec_dict in sections_map.items():
              try:
                  result = analyze_sections(sec_dict, nlp=None, cfg=cfg)
                  if result:
                      analysis_map[code] = result
              except Exception as e:
                  print(f"  ⚠️  analyze_sections失敗 ({code}): {e}")

          bonus_map = batch_calc_text_risk_bonus(
              cfg              = cfg,
              analysis_results = analysis_map,
              prev_results     = None,
              sections_by_code = sections_map,
          )
          nonzero = sum(1 for v in bonus_map.values() if v != 0.0)
          print(f"✅ text_signal 完了: {nonzero}/{len(bonus_map)}社でリスク検出")
          EOF

      # ── 3-B4. taxonomy台帳の投入（週次・2026-07-25追加）──────────
      # T-1後半 / T-2A。どちらも実装・テストまで揃っていたのに Actions にも
      # launchd にも登録が無く、承認済みseed 293ノードが BQ に入らないまま
      # taxonomy 信号（BLOCK 55）が空のテーブルを参照していた。
      #
      # 実行順は固定: node（親テーブル）を先に MERGE してから、企業×node の
      # マッピングを入れる。逆順だと参照先ノードが無い行ができる。
      # どちらも MERGE で冪等。taxonomy_loader は _meta.status=APPROVED の
      # バッチしか投入しないため、自動実行でも未承認データは入らない。
      # continue-on-error: taxonomy が落ちても日次分析は続ける（信号1本ぶん）。
      - name: 🗂️ Load taxonomy nodes & company map (weekly)
        id: taxonomy
        if: steps.set-mode.outputs.mode == 'weekly'
        continue-on-error: true
        env:
          STOCK_ANALYZER_BASE: ${{ github.workspace }}/stock_data
          BQ_CREDENTIALS:      ${{ secrets.BQ_CREDENTIALS }}
          BQ_PROJECT_ID:       ${{ secrets.BQ_PROJECT_ID }}
          EDINETDB_API_KEY:    ${{ secrets.EDINETDB_API_KEY }}
        run: |
          python actions_log.py --workflow daily_run --step taxonomy_loader -- python -u taxonomy_loader.py
          python actions_log.py --workflow daily_run --step taxonomy_company_mapper -- python -u taxonomy_company_mapper.py

      # ── 5. アナライザー実行 ───────────────────────────────
      # github actionsのAPIキーやファイルパスをそれぞれ定義している。
      # シングルモードの時は指定モジュールを実行。そうでないときはrun_headless.pyから参照する。
      # 2026-10-03（健太決定）: 年次財務は EdinetDB の会社ページから取る。
      # 2026-10-05: 分析の前に移動（API取込が held_fy を使い、メールが結果を載せるため）。新しい年度の有報が出た会社と
      # 未取得の会社を最大100社（1秒1社・15分で打ち切り）。API は本文・セグメント・四半期に使う。
      - name: 🌐 EdinetDB web refresh (annual financials)
        id: web-refresh
        if: steps.set-mode.outputs.mode != 'single'
        continue-on-error: true
        env:
          STOCK_ANALYZER_BASE:  ${{ github.workspace }}/stock_data
          BQ_PROJECT_ID:        ${{ secrets.BQ_PROJECT_ID }}
          BQ_CREDENTIALS:       ${{ secrets.BQ_CREDENTIALS }}
        run: python actions_log.py --workflow daily_run --step edinetdb_web_refresh -- python -u edinetdb_web_backfill.py --scope due --years 3 --time-budget-min 15

      # 当月の Actions 使用分数を数えて logs/actions_usage.json へ（日次メールの「運用の監視」が読む）。
      # 無料枠を超えると月末まで全 workflow が止まり、メールも来なくなるので、超える前に知らせる。
      - name: ⏱️ Count Actions usage
        if: steps.set-mode.outputs.mode != 'single'
        continue-on-error: true
        env:
          GH_TOKEN:            ${{ secrets.GITHUB_TOKEN }}
          STOCK_ANALYZER_BASE: ${{ github.workspace }}/stock_data
        run: python actions_log.py --workflow daily_run --step actions_usage -- python -u actions_usage.py

      - name: 🚀 Run analyzer
        id: analyzer
        env:
          STOCK_ANALYZER_MODE:  ${{ steps.set-mode.outputs.mode }}
          STOCK_ANALYZER_BASE:  ${{ github.workspace }}/stock_data
          BQ_CREDENTIALS:       ${{ secrets.BQ_CREDENTIALS }}
          BQ_PROJECT_ID:        ${{ secrets.BQ_PROJECT_ID }}
          SEC_USER_AGENT:       ${{ secrets.SEC_USER_AGENT }}
          ALERT_GMAIL_FROM:     ${{ secrets.ALERT_GMAIL_FROM }}
          ALERT_GMAIL_PASSWORD: ${{ secrets.ALERT_GMAIL_PASSWORD }}
          ALERT_GMAIL_TO:       ${{ secrets.ALERT_GMAIL_TO }}
          ALERT_LINE_TOKEN:     ${{ secrets.ALERT_LINE_TOKEN }}
          ALERT_LINE_USER_ID:   ${{ secrets.ALERT_LINE_USER_ID }}
          POLICY_FRED_API_KEY:  ${{ secrets.POLICY_FRED_API_KEY }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CSE_API_KEY:   ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID:        ${{ secrets.GOOGLE_CSE_ID }}
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID:     ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          ESTAT_API_KEY:              ${{ secrets.ESTAT_API_KEY }}
          EDINETDB_API_KEY:           ${{ secrets.EDINETDB_API_KEY }}
          EDINET_GOV_API_KEY:         ${{ secrets.EDINET_GOV_API_KEY }}
          FUDOSAN_API_KEY:            ${{ secrets.FUDOSAN_API_KEY }}
          SEISAKUDB_API_KEY:          ${{ secrets.SEISAKUDB_API_KEY }}
          DEEPL_API_KEY:              ${{ secrets.DEEPL_API_KEY }}
          NOTION_API_KEY:             ${{ secrets.NOTION_API_KEY }}  # 2026-06-10 ハードコード廃止に伴い追加
          CONGRESS_API_KEY:           ${{ secrets.CONGRESS_API_KEY }}  # 2026-06-10 congress_monitor配線復元に伴い追加
          SINGLE_MODULE:              ${{ github.event.inputs.module }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "single" ]; then
            SINGLE_MODULE="${{ github.event.inputs.module }}" \
              python actions_log.py --workflow daily_run --step analyzer -- python -u run_headless.py --mode all
          else
            python actions_log.py --workflow daily_run --step analyzer -- python -u run_headless.py --mode ${{ steps.set-mode.outputs.mode }}
          fi

      # ── 5-A2. 月次・四半期ランナー（2026-07-25 B-5追加）──────────
      # 月初のみ実行。E4淘汰 / S2月次成績 / S11配分提案 / S6コモディティ /
      # S10税・NISA / E12戦略レビューを依存順に流す（monthly_runner.py）。
      #
      # 【なぜ日次に内包するか】これらは設計・実装・テストまで揃っていたのに
      # Actions にも launchd にも実行主体が無く、2026-07-25 の棚卸しまで
      # 一度も走っていなかった。専用ワークフローを増やすと Secrets 定義と
      # commit 処理が二重管理になるため、CHANGELOG 2026-07-22 の
      # 「Actions正本は daily_run.yml だけ」方針に合わせて内包する。
      #
      # 月初判定は monthly_runner 側（config.MONTHLY_RUN_MAX_DAY）が持つので
      # ここは常時呼び、対象外の日は runner が自分でスキップする。
      # continue-on-error: 月次提案の失敗で日次の状態コミットを落とさない。
      # 2026-10-03: 自然言語→SQL 用の DB構造台帳（stock_data/data/db_catalog.md）を毎日作り直す。
      # INFORMATION_SCHEMA と __TABLES__ だけを読むので課金はほぼ0。失敗しても日次は止めない。
      - name: 🗂️ Refresh DB catalog
        id: db-catalog
        if: steps.set-mode.outputs.mode != 'single'
        continue-on-error: true
        env:
          STOCK_ANALYZER_BASE:  ${{ github.workspace }}/stock_data
          BQ_PROJECT_ID:        ${{ secrets.BQ_PROJECT_ID }}
          BQ_CREDENTIALS:       ${{ secrets.BQ_CREDENTIALS }}
        run: python actions_log.py --workflow daily_run --step db_catalog -- python -u db_catalog_gen.py

      - name: 🗓️ Run monthly runner (month start only)
        id: monthly
        if: steps.set-mode.outputs.mode != 'single'
        continue-on-error: true
        env:
          STOCK_ANALYZER_BASE:  ${{ github.workspace }}/stock_data
          BQ_CREDENTIALS:       ${{ secrets.BQ_CREDENTIALS }}
          BQ_PROJECT_ID:        ${{ secrets.BQ_PROJECT_ID }}
          EDINETDB_API_KEY:     ${{ secrets.EDINETDB_API_KEY }}
          FUDOSAN_API_KEY:      ${{ secrets.FUDOSAN_API_KEY }}
          POLICY_FRED_API_KEY:  ${{ secrets.POLICY_FRED_API_KEY }}
          # 2026-10-05: 月次メール（monthly_mail.py）用
          SEC_USER_AGENT:       ${{ secrets.SEC_USER_AGENT }}
          ALERT_GMAIL_FROM:     ${{ secrets.ALERT_GMAIL_FROM }}
          ALERT_GMAIL_PASSWORD: ${{ secrets.ALERT_GMAIL_PASSWORD }}
          ALERT_GMAIL_TO:       ${{ secrets.ALERT_GMAIL_TO }}
        run: python actions_log.py --workflow daily_run --step monthly_runner -- python -u monthly_runner.py

      # insights 以下の md レポート（マクロ・業種・ニュース・ETF・IMF・政府統計・週次ほか全部）を読んで BigQuery analytics に追記する
      # （load job・無料）。取り込み記録 data/report_store_state.json と違うファイルだけ。BI export より前に置き、当日分をマートに載せる。
      - name: 📚 Reports to BigQuery
        id: report-store
        if: steps.set-mode.outputs.mode != 'single'
        continue-on-error: true
        env:
          STOCK_ANALYZER_BASE:  ${{ github.workspace }}/stock_data
          BQ_PROJECT_ID:        ${{ secrets.BQ_PROJECT_ID }}
          BQ_CREDENTIALS:       ${{ secrets.BQ_CREDENTIALS }}
        run: python actions_log.py --workflow daily_run --step report_store -- python -u report_store.py

      # BI基盤のマート（bi/marts/*.sql）を parquet にして stock_data/bi/ へ書き出す。
      # 1マート1クエリ。内容が前回と同じなら parquet は書き換えない（git肥大の防止）。
      # 失敗しても日次本体は止めないが、終了コード非0はログに ❌ で残す。
      # 書き出しは「全部成功か、全部なし」。失敗した回は stock_data/bi を commit しない（下の Commit state files）。
      - name: 📦 BI export (marts to parquet)
        id: bi-export
        if: steps.set-mode.outputs.mode != 'single'
        continue-on-error: true
        env:
          STOCK_ANALYZER_BASE:  ${{ github.workspace }}/stock_data
          BQ_PROJECT_ID:        ${{ secrets.BQ_PROJECT_ID }}
          BQ_CREDENTIALS:       ${{ secrets.BQ_CREDENTIALS }}
        run: |
          python actions_log.py --workflow daily_run --step bi_export -- python -u bi_export.py || { echo "❌ bi_export が失敗しました（日次本体は継続・stock_data/bi は前回のまま）"; exit 1; }

      # ── 5-A3. 外側ステップの結果を実行台帳へ ─────────────────────
      # ここまでの continue-on-error ステップは run_all_tasks の外なので RunLogger に載らず、
      # 失敗しても Actions は緑・メールは平常のままになる。outcome を台帳（record_external）に残し、
      # 翌日以降の連続失敗アラートと LEDGER_EXTERNAL_EXPECT（記録が来ない）の検知に乗せる。
      # 走らなかったステップ（outcome が空）は記録しない。report_store は自分で記録する。
      - name: 📒 Record outer step outcomes
        if: always()
        continue-on-error: true
        env:
          STOCK_ANALYZER_BASE: ${{ github.workspace }}/stock_data
        run: |
          python actions_log.py --workflow daily_run --step record_outer_steps -- python module_ledger.py steps \
            setup_db_integration_bq=${{ steps.db-schema.outcome }} \
            taxonomy_load=${{ steps.taxonomy.outcome }} \
            edinetdb_web_refresh=${{ steps.web-refresh.outcome }} \
            db_catalog=${{ steps.db-catalog.outcome }} \
            monthly_runner=${{ steps.monthly.outcome }} \
            report_store_step=${{ steps.report-store.outcome }} \
            bi_export=${{ steps.bi-export.outcome }}

      # ── 5-B0. 保存の前に書く印 ─────────────────────────────────
      # git の commit と BigQuery の save の両方に載るよう、保存より前に書く。
      - name: 🏷️ Mark state before saving
        if: always()
        env:
          STOCK_ANALYZER_BASE: ${{ github.workspace }}/stock_data
        run: |
            # 週次の分析が成功した回だけ印を書く（上の Set execution mode が、抜けた週を翌日以降に weekly で追いつかせる）
            if [ "${{ steps.analyzer.outcome }}" = "success" ] && { [ "${{ steps.set-mode.outputs.mode }}" = "weekly" ] || [ "${{ steps.set-mode.outputs.mode }}" = "all" ]; }; then
              echo "{\"date\": \"$(date -u '+%Y-%m-%d')\", \"run_id\": \"${{ github.run_id }}\"}" > stock_data/data/last_weekly_run.json
            fi
            # 保存できた日の印。保存に失敗すると記録ごと届かないので、翌日以降「記録が来ない」で気づける
            python actions_log.py --workflow daily_run --step daily_state_push_mark -- python module_ledger.py steps daily_state_push=success || true

      # ── 5-B1. 状態を BigQuery へ（state_store.py）────────────────
      # 変わったファイルだけを load job（無料）で private.state_files に追記する。git モードでは走らない。
      # bi_export が失敗した回は stock_data/bi を保存しない（git 側と同じく前回の版のまま）。
      # dual では失敗しても git への commit は続ける。bq では失敗＝状態が残らないので赤にする。
      - name: ☁️ Save state to BigQuery
        if: always() && env.STATE_STORE_MODE != 'git'
        env:
          BQ_CREDENTIALS: ${{ secrets.BQ_CREDENTIALS }}
        run: |
          EXCL=""
          if [ "${{ steps.bi-export.outcome }}" = "failure" ]; then EXCL="--exclude stock_data/bi/"; fi
          python state_store.py save --source daily_run $EXCL || {
            echo "::warning::状態を BigQuery に保存できなかった"
            [ "$STATE_STORE_MODE" = "dual" ]
          }

      # 版が増えすぎないよう、週次の回だけパスごとに新しい3版を残して古い版を消す（dryRun で見積もり・1GB を超えたら実行しない）。
      - name: 🧽 Prune old state versions (weekly)
        if: always() && env.STATE_STORE_MODE != 'git' && steps.set-mode.outputs.mode == 'weekly'
        continue-on-error: true
        env:
          BQ_CREDENTIALS: ${{ secrets.BQ_CREDENTIALS }}
        run: python state_store.py prune

      # ── 5-B. 状態ファイル・キャッシュをリポジトリにコミット ───────
      # 2026-07-12 BUG-03対応: .iqy生成（Excel Webクエリ）は廃止（ENABLE_EXCEL_EXPORT=False）。
      # あわせて「ダッシュボードCSVが存在する時だけコミット」というゲートを撤去した。
      # ゲートが残っているとExcel出力停止と同時に全状態ファイル（ML特徴量/S2口座/
      # DD peak等）の永続化まで止まる事故になるため、コミットは無条件で行う。
      - name: 📊 Commit state files
        if: always()
        run: |
            if [ "$STATE_STORE_MODE" = "bq" ]; then
              echo "⏩ STATE_STORE_MODE=bq: 状態は BigQuery に保存済み（git には commit しない）"
              exit 0
            fi
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # bi_export が失敗した回は stock_data/bi を前回のコミットへ戻す（途中まで書かれた成功分を commit しない）。
            # continue-on-error なので conclusion は success になる。失敗の判定は outcome を使う。
            if [ "${{ steps.bi-export.outcome }}" = "failure" ]; then
              git checkout -- stock_data/bi 2>/dev/null || true
              git clean -fdq -- stock_data/bi 2>/dev/null || true
              echo "↩️ bi_export 失敗のため stock_data/bi は commit しない（前回のまま）"
            fi
            # ── 2026-09-10: 個別列挙（git add 126行）をディレクトリ単位へ集約 ──
            # 列挙方式は「新しい成果物を足したら1行追記する」運用が前提だが、
            # 実際には追記漏れと実態とのズレが溜まっていた（棚卸し時点で
            # 118パス中46パスが実在せず、うち下記は明確な誤りだった）:
            #   - stock_data/data/edinet.policy_support
            #       … BQのテーブル名がファイルパス欄に混入していた
            #   - stock_data/data/us_macro_cache.json
            #       … 実際の保存先は stock_data/cache/（＝一度も永続化されず、
            #         毎回のCI実行が素のチェックアウトから始まっていた）
            #   - stock_data/data/policy_radar_cache.json
            #       … 同上（cache/ 側の行が別にあるため実害はなかった）
            #   - stock_data/data/us_sector_mapping.json
            #       … 書き手が存在しない
            # また gov_cache/ は列挙自体が無く永続化されていなかった。
            #
            # stock_data/ 配下は全体で約25MBしかなく、重量物
            # （models/ と data/us_fundamentals_db/）は .gitignore 済みなので、
            # ディレクトリごと add しても増える分は実行の成果物だけになる。
            # 新しい状態ファイルを足しても、ここを触らずに永続化される。
            # 週次の印（last_weekly_run.json）と保存の印（daily_state_push）は上の Mark state before saving で書く
            git add stock_data/data/ 2>/dev/null || true
            git add stock_data/cache/ 2>/dev/null || true
            git add stock_data/insights/ 2>/dev/null || true
            git add stock_data/logs/ 2>/dev/null || true
            git add stock_data/orders/ 2>/dev/null || true
            git add stock_data/paper/ 2>/dev/null || true
            git add stock_data/ontology/ 2>/dev/null || true
            git add stock_data/bi/ 2>/dev/null || true
            git add stock_data/*.json 2>/dev/null || true
            git diff --cached --quiet || git commit -q -m "auto: daily update $(date '+%Y-%m-%d')"
            # 同じ時間帯に別の workflow や手元の push で origin が先に進んでいても保存できるよう、
            # 未ステージ分は --autostash で退避し、状態ファイルの衝突はこの回の内容（-X theirs＝再適用する側）を採る。
            # 次の実行は新しくチェックアウトするので再試行にはならない。3回とも失敗したら赤にして気づけるようにする。
            for i in 1 2 3; do
              git pull -q --rebase --autostash -X theirs origin main && git push -q \
                && { echo "✅ 状態ファイル・キャッシュをコミット/プッシュしました"; exit 0; }
              git rebase --abort 2>/dev/null || true
              sleep 15
            done
            echo "::error::状態ファイルを push できなかった（この回の結果は保存されていない）"
            exit 1

      # ── 5-C. 通知が届かなかった日はジョブを赤にする ─────────────
      # Gmail のアプリパスワード失効・送信失敗のときは、日次メール自体が来ないので気づく経路が無い。
      # alert_notifier / api_key_health が GITHUB_ENV に NOTIFY_FAILED を書いたら、状態の保存の後でここで落とし、
      # GitHub の失敗通知（別経路のメール）を出す。
      - name: 🚨 Fail if notification could not be sent
        if: always() && env.NOTIFY_FAILED != ''
        run: |
          echo "::error::通知が届いていない: ${NOTIFY_FAILED}"
          exit 1

      # ── 6. Artifacts は出さない（公開に備え、insights・logs は BigQuery の state_store にだけ置く）──
      #   後続の workflow・スクリプトで artifacts を読むものは無い。

      # ── 7. 失敗時のサマリー出力 ───────────────────────────
      - name: 📋 Output summary
        if: always()
        run: |
          echo "## 📊 Stock Analyzer 実行結果" >> $GITHUB_STEP_SUMMARY
          echo "- **モード**: ${{ steps.set-mode.outputs.mode }}" >> $GITHUB_STEP_SUMMARY
          echo "- **実行日時**: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          if [ -d "stock_data/insights" ]; then
            FILE_COUNT=$(find stock_data/insights -name "*.md" | wc -l)
            echo "- **生成レポート数**: ${FILE_COUNT} ファイル" >> $GITHUB_STEP_SUMMARY
          fi
