name: 全上場株価の日次取得

# 日本株・米国株の全上場企業の終値を BigQuery analytics.price_daily へ追記する（load job・無料）。
# 本体の daily_run（約40分）とは別ジョブ・別時刻にして、無料枠（月2,000分）を圧迫しない。
#   日本株: 月〜金 16:47 JST（東証の引け後）          cron UTC 07:47 月〜金
#   米国株: 火〜土 07:47 JST（米国の前営業日の引け後）  cron UTC 22:47 月〜金
# 日曜 JST は日米とも新しい終値が無いので動かさない。UTC 毎正時のジョブ集中を避けて :47 にずらす。
on:
  schedule:
    - cron: "47 7 * * 1-5"
    - cron: "47 22 * * 1-5"
  workflow_dispatch:
    inputs:
      market:
        description: "対象市場"
        type: choice
        default: all
        options: [all, jp, us]
      backfill:
        description: "過去1年分を一括取得（初回のみ）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: price-universe
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Tokyo
      STOCK_ANALYZER_BASE: ${{ github.workspace }}/stock_data
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-prices.txt
      - name: Install dependencies
        run: pip install -r requirements-prices.txt
      - name: Decide market
        id: sel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            M="${{ inputs.market }}"
            if [ "${{ inputs.backfill }}" = "true" ]; then B="--backfill"; else B=""; fi
          elif [ "${{ github.event.schedule }}" = "47 7 * * 1-5" ]; then
            M=jp; B=""
          else
            M=us; B=""
          fi
          echo "market=$M" >> "$GITHUB_OUTPUT"
          echo "backfill=$B" >> "$GITHUB_OUTPUT"
      - name: Fetch prices and load to BigQuery
        id: run
        env:
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
          BQ_CREDENTIALS: ${{ secrets.BQ_CREDENTIALS }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALERT_GMAIL_FROM: ${{ secrets.ALERT_GMAIL_FROM }}
          ALERT_GMAIL_PASSWORD: ${{ secrets.ALERT_GMAIL_PASSWORD }}
          ALERT_GMAIL_TO: ${{ secrets.ALERT_GMAIL_TO }}
        run: python -u price_universe.py --market ${{ steps.sel.outputs.market }} ${{ steps.sel.outputs.backfill }}
      - name: Commit state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_data/data/price_universe/ stock_data/logs/ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "auto: price universe $(date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs origin main && git push && exit 0; git rebase --abort 2>/dev/null || true; sleep 15; done
          echo "::error::状態ファイルを push できなかった（この回の結果は保存されていない）"; exit 1
