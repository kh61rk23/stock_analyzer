<title>株式DWH 分析室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* layout: 左＝テンプレの棚（有価証券報告書の目次のように領域→問い）、右＝作業台（パラメータ→グラフ→表→SQL）。自由分析と「Claudeに聞く」は作業台のタブ */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --ink:#18221f; --sub:#5b6964; --line:#d9e0dd;
  --accent:#1d6b5a; --accent-soft:#e2efeb; --warn:#a15c07; --bad:#b3261e; --good:#2f7d32;
  --chip:#eef2f0;
  --f-body:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --panel:#18201d; --ink:#e4ebe8; --sub:#93a39d; --line:#2b3632;
  --accent:#5cc2a7; --accent-soft:#1d3029; --warn:#e0a24a; --bad:#f08a80; --good:#7bc77e; --chip:#212b27; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --panel:#18201d; --ink:#e4ebe8; --sub:#93a39d; --line:#2b3632;
  --accent:#5cc2a7; --accent-soft:#1d3029; --warn:#e0a24a; --bad:#f08a80; --good:#7bc77e; --chip:#212b27; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
.wrap{padding-inline:16px;padding-block:16px 40px;max-width:1400px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:14px}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em}
.meta{color:var(--sub);font-size:12px}
.status{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--chip);color:var(--sub)}
.status.ok{color:var(--good)} .status.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.shelf,.bench{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.shelf{padding:12px;max-height:calc(100vh - 120px);overflow:auto;position:sticky;top:env(safe-area-inset-top,0px)}
@media (max-width:860px){.shelf{position:static;max-height:none}}
.shelf h2{font-size:11px;letter-spacing:.12em;color:var(--sub);margin:14px 4px 6px;text-transform:uppercase;font-weight:500}
.shelf h2:first-child{margin-top:4px}
.tpl{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;color:var(--ink);font:inherit;cursor:pointer}
.tpl:hover{background:var(--chip)} .tpl.on{background:var(--accent-soft)}
.tpl b{display:block;font-weight:500;font-size:13.5px}
.tpl span{display:block;font-size:12px;color:var(--sub)}
.bench{padding:14px 16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px -4px 14px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;font:inherit;color:var(--sub);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--sub)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{width:100%;font-family:var(--f-mono);font-size:12.5px;min-height:110px}
button.go{background:var(--accent);color:var(--panel);border:0;border-radius:6px;padding:7px 16px;font:inherit;font-weight:500;cursor:pointer}
button.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font:inherit;color:var(--ink);cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,.tpl:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{font-size:16px;font-weight:500;margin:0 0 2px;text-wrap:balance}
.note{color:var(--sub);font-size:12.5px;margin:2px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--accent-soft);border-radius:99px;padding:2px 4px 2px 10px;font-size:12px}
.chip button{background:none;border:0;color:var(--sub);cursor:pointer;font-size:14px;line-height:1;padding:0 6px}
.chartbox{position:relative;height:340px;margin:12px 0}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:6px;max-height:420px}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);color:var(--sub);font-weight:500}
td.n{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--chip)}
details.sql{margin-top:10px} details.sql pre{font-family:var(--f-mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto;white-space:pre-wrap}
.msg{padding:8px 10px;border-radius:6px;background:var(--chip);font-size:13px;margin:8px 0}
.msg.err{color:var(--bad)} .msg.warn{color:var(--warn)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mlist{display:flex;flex-direction:column;gap:6px}
.mrow{display:flex;gap:6px;flex-wrap:wrap}
.answer{white-space:pre-wrap;font-size:13.5px;margin:8px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
<header>
  <h1>株式DWH 分析室</h1>
  <span class="meta">BigQuery（stock-analyzer-edinet）を開いたその場で集計します。テンプレは board の「分析」タブと共通です。</span>
  <span id="status" class="status">接続を確認中…</span>
</header>
<div class="grid">
  <nav class="shelf" id="shelf" aria-label="テンプレート"></nav>
  <section class="bench">
    <div class="tabs" role="tablist">
      <button role="tab" id="t-tpl" aria-selected="true" data-tab="tpl">テンプレ</button>
      <button role="tab" id="t-free" aria-selected="false" data-tab="free">自由分析</button>
      <button role="tab" id="t-ask" aria-selected="false" data-tab="ask">Claudeに聞く</button>
      <button role="tab" id="t-scr" aria-selected="false" data-tab="scr">スクリーナー</button>
      <button role="tab" id="t-sql" aria-selected="false" data-tab="sql">SQL</button>
      <button role="tab" id="t-slot" aria-selected="false" data-tab="slot">スロット</button>
    </div>
    <div id="p-tpl"></div>
    <div id="p-free" hidden></div>
    <div id="p-ask" hidden>
      <p class="q">日本語で聞くと、Claude が SQL を組んで BigQuery で実行します</p>
      <p class="note">使える表はテンプレと同じマート（下の一覧）。質問は1回ごとにあなたの Claude の利用枠を使います。</p>
      <textarea id="askText" placeholder="例：情報・通信業で、直近3年の売上成長率が高い会社を10社。営業利益率も並べて"></textarea>
      <div class="row" style="margin-top:8px"><button class="go" id="askGo">質問する</button><button class="ghost" id="askStop" hidden>止める</button></div>
      <div id="askOut"></div>
    </div>
    <div id="p-scr" hidden></div>
    <div id="p-slot" hidden></div>
    <div id="p-sql" hidden>
      <p class="note">マート名（例 m_fin_annual）をそのまま FROM に書けます。読み取りのみ・最大1,000行。下のボタンで組み立てることもできます。</p>
      <details class="sql" id="builder" open><summary>ボタンで SQL を組み立てる</summary><div id="bld"></div></details>
      <textarea id="sqlText"></textarea>
      <div class="row" style="margin-top:8px"><button class="go" id="sqlGo">実行</button>
        <label class="f">スロット名<input id="slotName" placeholder="例：高ROE割安"></label><button class="ghost" id="slotSave">SQLをスロットに保存</button><span class="note" id="slotMsg"></span></div>
      <div id="sqlOut"></div>
    </div>
    <div id="result"></div>
  </section>
</div>
</div>

<script>
/* ── 埋め込みデータ（ビルド時に stock_analyzer/bi から差し込む）── */
const BI = /*__BI_DATA__*/{"project":"stock-analyzer-edinet","marts":{},"templates":[],"domains":{},"built_at":""}/*__END__*/;
const SERVER = "BigQuery MCP", TOOL = "execute_sql_readonly";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let mcp = null, sample = null, chart = null, CUR = null, FREE = {mart:"", dims:[], measures:[], filters:[], chart:"bar"};

/* ── SQL の組み立て ─────────────────────────────── */
function martsUsed(sql){ return Object.keys(BI.marts).filter(m => new RegExp("\\b"+m+"\\b").test(sql)); }
function wrapSql(sql){
  const used = martsUsed(sql);
  if(!used.length) throw new Error("マート名（"+Object.keys(BI.marts).join("・")+"）を FROM に書いてください");
  let body = sql.trim().replace(/;\s*$/,"");
  if(!/^(select|with)\b/i.test(body) || /;/.test(body)) throw new Error("SELECT または WITH で始まる1文だけ実行できます");
  // 実体化済みのマートは小さな表（bi データセット）を直接読む。未実体化のものだけ元の表から組み立てる（読む量が大きい）
  const tables = used.filter(m => BI.marts[m].table), ctes = used.filter(m => !BI.marts[m].table);
  tables.forEach(m => { body = body.replace(new RegExp("\\b"+m+"\\b","g"), "`"+BI.marts[m].table+"`"); });
  // 外側で SELECT * FROM (...) に包むと ORDER BY の順が保証されないため、本文はそのまま使い LIMIT が無ければ足す
  if(!/\blimit\s+\d+(\s+offset\s+\d+)?\s*$/i.test(body)) body += "\nLIMIT 1000";
  if(!ctes.length) return body;
  const defs = ctes.map(m => m + " AS (\n" + BI.marts[m].sql.trim().replace(/;\s*$/,"") + "\n)").join(",\n");
  return /^with\b/i.test(body) ? "WITH " + defs + ",\n" + body.replace(/^with\s+/i, "") : "WITH " + defs + "\n" + body;
}
function bindParams(sql, params, values){
  return sql.replace(/\{\{(\w+)\}\}/g, (_, name) => {
    const p = (params||[]).find(x => x.name === name);
    if(!p) throw new Error("未定義のパラメータ: "+name);
    const v = values[name] ?? p.default ?? "";
    if(p.type === "number" || p.type === "int"){
      const n = Number(v); if(String(v).trim()==="" || !Number.isFinite(n)) throw new Error((p.label||p.name)+" は数値で入れてください");
      if(p.type === "int" && !Number.isInteger(n)) throw new Error((p.label||p.name)+" は整数で入れてください");
      if(p.min != null && n < p.min || p.max != null && n > p.max) throw new Error(`${p.label||p.name} は ${p.min ?? "−∞"}〜${p.max ?? "∞"} の範囲で入れてください`);
      return String(n);
    }
    // BigQuery（GoogleSQL）の文字列はバックスラッシュでエスケープする（'' の二重化は受け付けない）
    return "'" + String(v).replace(/\\/g,"\\\\").replace(/'/g,"\\'") + "'";
  });
}

/* ── BigQuery 実行（ビューアの BigQuery コネクタで） ─────────── */
const ERR = {
  needs_reauth: "BigQuery コネクタの再接続が必要です。claude.ai の設定 → コネクタ で BigQuery MCP をつなぎ直してください。",
  server_not_connected: "BigQuery MCP コネクタが見つかりません。claude.ai の設定 → コネクタ で追加してください。",
  selection_required: "同じ名前の BigQuery コネクタが複数あります。表示された選択で1つ選んでください。",
  not_in_manifest: "このページでの BigQuery の利用が許可されていません。ページの権限設定から許可してください。",
  approval_required: "この実行には承認が必要です。もう一度「実行」を押すと承認を求められます。",
  blocked_by_policy: "組織のポリシーで BigQuery の実行が止められています。",
  server_unavailable: "BigQuery に一時的につながりません。少し待ってからもう一度実行してください。",
};
async function runBQ(sql){
  if(!mcp) throw {code:"not_granted", message:"このページでは BigQuery を呼べません（Claude の画面で開いてください）"};
  const r = await mcp.callTool(SERVER, TOOL, {projectId: BI.project, query: sql, timeoutMs: 60000}, {cache:{staleTime:300000, gcTime:3600000}});
  const p = r.payload || {};
  if(typeof p === "string") throw {code:"tool_error", message:p};
  if(p.jobComplete === false) throw {code:"tool_error", message:"60秒以内に終わりませんでした。条件を絞ってください。"};
  const fields = (p.schema && p.schema.fields) || [];
  const num = fields.map(f => /INT|FLOAT|NUMERIC|DOUBLE/.test(f.type));
  const rows = (p.rows||[]).map(r => r.f.map((c,i) => c.v === null ? null : num[i] ? Number(c.v) : c.v));
  return {columns: fields.map(f => f.name), num, rows, billed: Number(p.totalBytesBilled||0), cached: !!(r.cache)};
}
function errText(e){ return ERR[e && e.code] || (e && e.message) || "実行できませんでした"; }

/* ── 描画 ─────────────────────────────────────── */
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
const PALETTE = ["--accent","--warn","--good","--bad","--sub"];
function fmt(v){ if(v===null||v===undefined) return "–"; if(typeof v==="number"){ const a=Math.abs(v); if(a>=1e8) return (v/1e8).toLocaleString("ja-JP",{maximumFractionDigits:1})+"億"; if(a!==0&&a<1&&!Number.isInteger(v)) return (v*100).toFixed(1)+"%"; return v.toLocaleString("ja-JP",{maximumFractionDigits:2}); } return v; }
function render(res, spec, onPick){
  const out = $("result");
  if(chart){ chart.destroy(); chart = null; }
  const t = spec && spec.type || "table";
  const ci = n => res.columns.indexOf(n);
  let html = `<div class="note">${res.rows.length.toLocaleString()} 行${res.cached?"（5分以内の結果を再利用）":""}・BigQuery 無料枠から ${(res.billed/1048576).toFixed(0)}MB（月1TB＝約100万MBまで無料）</div>`;
  if(t !== "table" && res.rows.length) html += `<div class="chartbox"><canvas id="cv" aria-label="グラフ"></canvas></div>`;
  html += `<div class="tablebox"><table><thead><tr>${res.columns.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>`
    + res.rows.slice(0,1000).map((r,i)=>`<tr class="${onPick?"click":""}" data-i="${i}">${r.map((v,j)=>`<td class="${res.num[j]?"n":""}">${esc(fmt(v))}</td>`).join("")}</tr>`).join("")
    + `</tbody></table></div>`;
  out.innerHTML = html;
  if(onPick) out.querySelectorAll("tr.click").forEach(tr => tr.onclick = () => onPick(res.rows[+tr.dataset.i], res));
  if(t === "table" || !res.rows.length) return;
  const xi = ci(spec.x) >= 0 ? ci(spec.x) : 0;
  const ys = (Array.isArray(spec.y) ? spec.y : [spec.y]).filter(Boolean).map(ci).filter(i=>i>=0);
  const yi = ys.length ? ys : res.num.map((n,i)=>n&&i!==xi?i:-1).filter(i=>i>=0).slice(0,2);
  const si = spec.series ? ci(spec.series) : -1;
  const grid = css("--line"), ink = css("--sub");
  let datasets, labels;
  if(t === "scatter"){
    const [a,b] = yi.length>=2 ? yi : [xi, yi[0]];
    datasets = [{label:`${res.columns[a]} × ${res.columns[b]}`, data: res.rows.map(r=>({x:r[a],y:r[b],r0:r})), backgroundColor: css("--accent")}];
  } else if(si >= 0){
    labels = [...new Set(res.rows.map(r=>r[xi]))];
    const groups = [...new Set(res.rows.map(r=>r[si]))].slice(0,8);
    datasets = groups.map((g,k)=>({label:String(g), data: labels.map(l => { const r = res.rows.find(r=>r[xi]===l&&r[si]===g); return r? r[yi[0]] : null; }),
      borderColor: css(PALETTE[k%5]), backgroundColor: css(PALETTE[k%5]), spanGaps:true}));
  } else {
    labels = res.rows.map(r=>r[xi]);
    datasets = yi.map((i,k)=>({label:res.columns[i], data: res.rows.map(r=>r[i]), borderColor: css(PALETTE[k%5]), backgroundColor: css(PALETTE[k%5])}));
  }
  chart = new Chart($("cv"), {type: t==="scatter"?"scatter":t==="line"?"line":"bar",
    data:{labels, datasets},
    options:{responsive:true, maintainAspectRatio:false, animation:false,
      plugins:{legend:{labels:{color:ink}}, tooltip:{callbacks:{label:c=> `${c.dataset.label}: ${fmt(t==="scatter"? c.raw.y : c.raw)}`}}},
      scales:{x:{ticks:{color:ink,maxRotation:60}, grid:{color:grid}}, y:{ticks:{color:ink, callback:v=>fmt(v)}, grid:{color:grid}}},
      onClick:(ev, els) => { if(!onPick || !els.length) return; const e = els[0];
        const row = t==="scatter" ? datasets[e.datasetIndex].data[e.index].r0 : res.rows.find(r=>r[xi]===labels[e.index]); if(row) onPick(row, res); }}});
}
function showSql(sql, el){ el.insertAdjacentHTML("beforeend", `<details class="sql"><summary>実行したSQL</summary><pre>${esc(sql)}</pre></details>`); }

/* ── テンプレ ─────────────────────────────────── */
function buildShelf(){
  const by = {};
  BI.templates.forEach(t => (by[t.domain] = by[t.domain] || []).push(t));
  $("shelf").innerHTML = Object.keys(by).map(d => `<h2>${esc(BI.domains[d]||d)}</h2>` +
    by[d].map(t => `<button class="tpl" data-id="${esc(t.id)}"><b>${esc(t.title)}</b><span>${esc(t.question||"")}</span></button>`).join("")).join("")
    || `<p class="note">テンプレがまだありません。</p>`;
  $("shelf").querySelectorAll(".tpl").forEach(b => b.onclick = () => { tab("tpl"); openTpl(b.dataset.id); });
}
function openTpl(id){
  CUR = BI.templates.find(t => t.id === id); if(!CUR) return;
  document.querySelectorAll(".tpl").forEach(b => b.classList.toggle("on", b.dataset.id === id));
  $("p-tpl").innerHTML = `<p class="q">${esc(CUR.title)}</p><p class="note">${esc(CUR.question||"")}${CUR.note?"　"+esc(CUR.note):""}</p>
    <div class="row">${(CUR.params||[]).map(p=>`<label class="f">${esc(p.label||p.name)}<input id="pp-${esc(p.name)}" value="${esc(p.default??"")}" ${p.type==="number"||p.type==="int"?'inputmode="decimal"':""}></label>`).join("")}
    <button class="go" id="tplGo">実行</button><button class="ghost" id="tplFree">自由分析で開く</button></div>`;
  $("tplGo").onclick = runTpl; $("tplFree").onclick = () => { FREE = {mart: CUR.mart, dims:[], measures:[], filters:[], chart:"bar"}; tab("free"); buildFree(); };
  $("result").innerHTML = "";
  runTpl();
}
async function runTpl(){
  const vals = {}; (CUR.params||[]).forEach(p => vals[p.name] = $("pp-"+p.name).value);
  let sql;
  try{ sql = wrapSql(bindParams(CUR.sql, CUR.params, vals)); }catch(e){ $("result").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
  $("result").innerHTML = `<div class="msg">BigQuery で集計中…</div>`;
  try{ const res = await runBQ(sql); render(res, CUR.chart||{type:"table"}); showSql(sql, $("result")); logRun("テンプレ", CUR.title, bindParams(CUR.sql, CUR.params, vals)); }
  catch(e){ $("result").innerHTML = `<div class="msg err">${esc(errText(e))}</div>`; showSql(sql, $("result")); }
}

/* ── 自由分析（連動選択） ──────────────────────── */
function martCols(m){ return (BI.marts[m] && BI.marts[m].columns) || []; }
function isNum(c){ return /int|float|numeric|double|decimal/i.test(c.type||""); }
function buildFree(){
  const marts = Object.keys(BI.marts);
  if(!FREE.mart) FREE.mart = marts.includes("m_fin_annual") ? "m_fin_annual" : marts[0];
  const cols = martCols(FREE.mart);
  const dimCols = cols.filter(c => !isNum(c) || /year|code/.test(c.name));
  const numCols = cols.filter(c => isNum(c));
  if(!FREE.dims.length && dimCols.find(c=>c.name==="industry")) FREE.dims = ["industry"];
  if(!FREE.measures.length && numCols.length) FREE.measures = [{col:(numCols.find(c=>c.name==="net_sales")||numCols[0]).name, agg:"SUM"}, {col:"*", agg:"COUNT"}];
  const opt = (arr, sel) => arr.map(c=>`<option value="${esc(c.name)}" ${c.name===sel?"selected":""}>${esc(c.label||c.name)}</option>`).join("");
  $("p-free").innerHTML = `
    <div class="cols">
      <label class="f">マート<select id="fMart">${marts.map(m=>`<option ${m===FREE.mart?"selected":""}>${esc(m)}</option>`).join("")}</select></label>

  $("p-free").querySelectorAll("[data-delf]").forEach(b => b.onclick = () => { FREE.filters.splice(+b.dataset.delf,1); buildFree(); runFree(); });

  $("fAddMeas").onclick = () => { if(numCols[0]){ FREE.measures.push({col:numCols[0].name, agg:"AVG"}); buildFree(); } };
  $("fGo").onclick = runFree;
}
function qid(n){ if(!/^[A-Za-z_][A-Za-z0-9_]*$/.test(n)) throw new Error("列名が不正です: "+n); return n; }
function lit(v){ return typeof v === "number" ? String(v) : "'" + String(v).replace(/\\/g,"\\\\").replace(/'/g,"\\'") + "'"; }
function freeSql(){
  const cols = martCols(FREE.mart).map(c=>c.name);
  const ok = n => { if(!cols.includes(n)) throw new Error("このマートに無い列です: "+n); return qid(n); };
  const dims = FREE.dims.map(ok);
  const meas = FREE.measures.map(m => m.col==="*" ? `COUNT(*) AS cnt` : `${m.agg}(${ok(m.col)}) AS ${m.agg.toLowerCase()}_${m.col}`);
  if(!meas.length) throw new Error("指標を1つ以上選んでください");
  const where = FREE.filters.map(f => f.value === null ? `${ok(f.col)} IS NULL` : `${ok(f.col)} = ${lit(f.value)}`);
  return `SELECT ${[...dims, ...meas].join(", ")}\nFROM ${FREE.mart}` + (where.length?`\nWHERE ${where.join(" AND ")}`:"")
    + (dims.length ? `\nGROUP BY ${dims.join(", ")}\nORDER BY ` + (dims.length===1 && /year/.test(dims[0]) ? dims[0] : `${dims.length+1} DESC`) : "")
    + `\nLIMIT 500`;
}
async function runFree(){
  let sql;
  try{ sql = wrapSql(freeSql()); }catch(e){ $("result").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
  $("result").innerHTML = `<div class="msg">BigQuery で集計中…</div>`;
  try{
    const res = await runBQ(sql);
    const spec = {type: FREE.chart, x: FREE.dims[0], y: res.columns.filter((c,i)=>res.num[i] && !FREE.dims.includes(c)).slice(0, FREE.chart==="scatter"?2:3), series: FREE.dims[1]};
    render(res, spec, (row, r) => {   // 連動選択：クリックした行の軸の値で絞り込む
      FREE.dims.forEach(d => { const v = row[r.columns.indexOf(d)]; if(!FREE.filters.some(f=>f.col===d&&f.value===v)) FREE.filters.push({col:d, value:v}); });
      if(FREE.dims.length) FREE.dims = FREE.dims.length > 1 ? FREE.dims.slice(1) : FREE.dims;
      buildFree(); runFree();
    });
    showSql(sql, $("result")); logRun("自由分析", FREE.mart+"："+FREE.dims.join("×"), freeSql());
  }catch(e){ $("result").innerHTML = `<div class="msg err">${esc(errText(e))}</div>`; showSql(sql, $("result")); }
}

/* ── スロット（名前付き保存）と履歴：自分だけが読める data/users/<id>/ に保存する ── */
let db = null, me = null, SLOTS = [], HIST = [];
function ucol(name){ return db && me ? db.collection(`data/users/${me}/${name}`) : null; }
async function loadSlots(){
  const s = ucol("slots"), h = ucol("history"); if(!s) return;
  try{ SLOTS = (await s.orderBy("order").get()).docs.map(d => ({id:d.id, ...d.data()})); }catch(e){ SLOTS = []; }
  try{ HIST = (await h.orderBy("at","desc").limit(50).get()).docs.map(d => ({id:d.id, ...d.data()})); }catch(e){ HIST = []; }
}
let LASTLOG = "";
async function logRun(kind, title, sql){
  const h = ucol("history"); if(!h || !sql) return;
  const key = kind + "\u0000" + sql; if(key === LASTLOG) return; LASTLOG = key;   // 同じ実行の連打は1件に
  try{ await h.add({kind, title: String(title||"").slice(0,80), sql: String(sql).slice(0,20000), at: new Date().toISOString()}); }catch(e){}
}
async function saveSlot(name, sql){
  const s = ucol("slots"), msg = $("slotMsg");
  if(!s){ msg.textContent = "このページでは保存できません（Claude の画面で開くと使えます）"; return; }
  name = String(name||"").trim(); if(!name){ msg.textContent = "スロット名を入れてください"; return; }
  if(!String(sql||"").trim()){ msg.textContent = "保存する SQL がありません"; return; }
  const order = SLOTS.length ? Math.max(...SLOTS.map(x=>x.order||0)) + 1 : 1;
  try{ await s.add({name: name.slice(0,60), sql: String(sql).slice(0,20000), order, at: new Date().toISOString()}); msg.textContent = "保存しました"; await loadSlots(); }
  catch(e){ msg.textContent = "保存できませんでした（" + (e && e.code || "error") + "）"; }
}
async function renderSlots(){
  const el = $("p-slot");
  if(!db || !me){ el.innerHTML = `<div class="msg warn">スロットは Claude の画面で開いたときに使えます（自分だけが見える場所に保存します）。</div>`; return; }
  el.innerHTML = `<div class="msg">読み込み中…</div>`; await loadSlots();
  const row = (x, kind) => `<tr><td>${esc(kind==="slot"? x.name : x.title)}</td><td class="note">${esc(kind==="slot"? "" : x.kind)}</td><td class="note">${esc((x.at||"").slice(0,16).replace("T"," "))}</td>
    <td><button class="ghost" data-run="${kind}:${esc(x.id)}">実行</button> <button class="ghost" data-load="${kind}:${esc(x.id)}">SQL欄へ</button>
    ${kind==="slot"? `<button class="ghost" data-up="${esc(x.id)}" aria-label="上へ">↑</button> <button class="ghost" data-del="${esc(x.id)}">削除</button>` : `<button class="ghost" data-keep="${esc(x.id)}">スロットに保存</button>`}</td></tr>`;
  el.innerHTML = `<p class="q">スロット</p><p class="note">よく使う SQL に名前を付けて保存したもの。SQL タブの「SQLをスロットに保存」か、下の履歴から保存できます。</p>
    <div class="tablebox"><table><tbody>${SLOTS.map(x=>row(x,"slot")).join("") || `<tr><td class="note">まだありません</td></tr>`}</tbody></table></div>
    <p class="q" style="margin-top:16px">最近の実行（50件）</p>
    <div class="tablebox"><table><tbody>${HIST.map(x=>row(x,"hist")).join("") || `<tr><td class="note">まだありません</td></tr>`}</tbody></table></div>`;
  const find = k => { const [kind,id] = k.split(":"); return (kind==="slot"? SLOTS : HIST).find(x=>x.id===id); };
  el.querySelectorAll("[data-run]").forEach(b => b.onclick = () => { const x = find(b.dataset.run); if(x){ $("sqlText").value = x.sql; tab("sql"); $("sqlGo").click(); } });
  el.querySelectorAll("[data-load]").forEach(b => b.onclick = () => { const x = find(b.dataset.load); if(x){ $("sqlText").value = x.sql; tab("sql"); } });
  el.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { try{ await ucol("slots").doc(b.dataset.del).delete(); }catch(e){} renderSlots(); });
  el.querySelectorAll("[data-keep]").forEach(b => b.onclick = async () => { const x = HIST.find(h=>h.id===b.dataset.keep); if(x){ await saveSlot(x.title || x.kind, x.sql); renderSlots(); } });
  el.querySelectorAll("[data-up]").forEach(b => b.onclick = async () => {
    const i = SLOTS.findIndex(x=>x.id===b.dataset.up); if(i<=0) return;
    const a = SLOTS[i], p = SLOTS[i-1];
    try{ await ucol("slots").doc(a.id).update({order: p.order}); await ucol("slots").doc(p.id).update({order: a.order}); }catch(e){}
    renderSlots();
  });
}

let BLD = {mart:"", cols:[], aggs:{}, conds:[], order:"", dir:"DESC", limit:100};
function buildBuilder(){
  const marts = Object.keys(BI.marts); if(!BLD.mart) BLD.mart = marts.includes("m_screener") ? "m_screener" : marts[0];
  const cols = martCols(BLD.mart);
  const lab = c => esc(c.label ? `${c.label}（${c.name}）` : c.name);
  $("bld").innerHTML = `
    <div class="row"><label class="f">マート<select id="bMart">${marts.map(m=>`<option ${m===BLD.mart?"selected":""}>${esc(m)}</option>`).join("")}</select></label>
      <label class="f">件数<input id="bLimit" value="${BLD.limit}" inputmode="numeric" style="width:6em"></label>
      <label class="f">並べ替え<select id="bOrder"><option value="">（なし）</option>${cols.map(c=>`<option value="${esc(c.name)}" ${c.name===BLD.order?"selected":""}>${lab(c)}</option>`).join("")}</select></label>
      <label class="f">向き<select id="bDir"><option ${BLD.dir==="DESC"?"selected":""}>DESC</option><option ${BLD.dir==="ASC"?"selected":""}>ASC</option></select></label></div>
    <p class="note" style="margin:8px 0 4px">列（押すと選択。数値の列は集計も選べる。集計を付けると他の列でまとめる）</p>
    <div class="chips">${cols.map(c=>`<button class="ghost" data-col="${esc(c.name)}" aria-pressed="${BLD.cols.includes(c.name)}" style="${BLD.cols.includes(c.name)?"background:var(--accent-soft)":""}">${lab(c)}</button>`).join("")}</div>
    <div class="mlist">${BLD.cols.filter(n=>isNum(cols.find(c=>c.name===n)||{})).map(n=>`<div class="mrow"><span class="note">${esc(n)} の集計</span><select data-agg="${esc(n)}">${["","SUM","AVG","MIN","MAX","COUNT"].map(a=>`<option ${a===(BLD.aggs[n]||"")?"selected":""} value="${a}">${a||"そのまま"}</option>`).join("")}</select></div>`).join("")}</div>
    <p class="note" style="margin:8px 0 4px">条件</p>
    <div class="mlist">${BLD.conds.map((k,i)=>`<div class="mrow"><select data-ccol="${i}">${cols.map(c=>`<option value="${esc(c.name)}" ${c.name===k.col?"selected":""}>${lab(c)}</option>`).join("")}</select>
      <select data-cop="${i}">${["=","<>",">=","<=",">","<","LIKE","IS NULL","IS NOT NULL"].map(o=>`<option ${o===k.op?"selected":""}>${o}</option>`).join("")}</select>
      <input data-cval="${i}" value="${esc(k.val??"")}" placeholder="値"><button class="ghost" data-cdel="${i}" aria-label="条件を外す">×</button></div>`).join("")}</div>
    <div class="row" style="margin-top:6px"><button class="ghost" id="bAddCond">＋ 条件</button><button class="go" id="bMake">SQL を組み立てる</button></div>`;
  const re = () => buildBuilder();
  $("bMart").onchange = e => { BLD = {mart:e.target.value, cols:[], aggs:{}, conds:[], order:"", dir:"DESC", limit:BLD.limit}; re(); };
  $("bLimit").onchange = e => BLD.limit = e.target.value; $("bOrder").onchange = e => BLD.order = e.target.value; $("bDir").onchange = e => BLD.dir = e.target.value;
  $("bld").querySelectorAll("[data-col]").forEach(b => b.onclick = () => { const n=b.dataset.col; BLD.cols = BLD.cols.includes(n) ? BLD.cols.filter(x=>x!==n) : [...BLD.cols, n]; re(); });
  $("bld").querySelectorAll("[data-agg]").forEach(s => s.onchange = () => { BLD.aggs[s.dataset.agg] = s.value; });
  $("bld").querySelectorAll("[data-ccol]").forEach(s => s.onchange = () => BLD.conds[+s.dataset.ccol].col = s.value);
  $("bld").querySelectorAll("[data-cop]").forEach(s => s.onchange = () => BLD.conds[+s.dataset.cop].op = s.value);
  $("bld").querySelectorAll("[data-cval]").forEach(s => s.oninput = () => BLD.conds[+s.dataset.cval].val = s.value);
  $("bld").querySelectorAll("[data-cdel]").forEach(b => b.onclick = () => { BLD.conds.splice(+b.dataset.cdel,1); re(); });
  $("bAddCond").onclick = () => { BLD.conds.push({col: cols[0] && cols[0].name, op: ">=", val: ""}); re(); };
  $("bMake").onclick = () => { try{ $("sqlText").value = builderSql(); }catch(e){ $("slotMsg").textContent = e.message; } };
}
function builderSql(){
  const cols = martCols(BLD.mart), names = cols.map(c=>c.name);
  const ok = n => { if(!names.includes(n)) throw new Error("列がありません: "+n); return qid(n); };
  if(!BLD.cols.length) throw new Error("列を1つ以上選んでください");
  const agg = BLD.cols.filter(n => BLD.aggs[n]), plain = BLD.cols.filter(n => !BLD.aggs[n]);
  const sel = [...plain.map(ok), ...agg.map(n => `${BLD.aggs[n]}(${ok(n)}) AS ${BLD.aggs[n].toLowerCase()}_${n}`)];
  const num = n => isNum(cols.find(c=>c.name===n)||{});
  const where = BLD.conds.filter(k=>k.col).map(k => /NULL/.test(k.op) ? `${ok(k.col)} ${k.op}` :
    `${ok(k.col)} ${k.op} ${num(k.col) && k.op!=="LIKE" ? (Number.isFinite(Number(k.val)) && String(k.val).trim()!=="" ? Number(k.val) : (()=>{throw new Error(k.col+" は数値で入れてください")})()) : lit(k.op==="LIKE" && !/%/.test(k.val) ? "%"+k.val+"%" : k.val)}`);
  const lim = Math.min(1000, Math.max(1, parseInt(BLD.limit,10) || 100));
  let q = `SELECT ${sel.join(", ")}\nFROM ${BLD.mart}`;
  if(where.length) q += `\nWHERE ${where.join("\n  AND ")}`;
  if(agg.length && plain.length) q += `\nGROUP BY ${plain.map(ok).join(", ")}`;
  if(BLD.order) q += `\nORDER BY ${agg.includes(BLD.order) ? BLD.aggs[BLD.order].toLowerCase()+"_"+BLD.order : ok(BLD.order)} ${BLD.dir}`;
  return q + `\nLIMIT ${lim}`;
}

const SCR_PRESETS = {
  "割安高配当": [["pbr","<=",1],["dividend_yield",">=",0.03]],
  "高ROE×低PER": [["roe",">=",0.15],["per","<=",15],["per",">",0]],
  "増収増益": [["sales_growth_1y",">=",0.05],["op_income_growth_1y",">=",0.05]],
  "ネットキャッシュ": [["net_cash",">",0],["pbr","<=",1.2]],
  "高成長": [["sales_cagr_3y",">=",0.15]],
  "高配当": [["dividend_yield",">=",0.04]],
  "3か月モメンタム": [["return_3m",">=",0.2]],
  "売買代金が大きい割安株": [["avg_turnover_20d",">=",1e9],["pbr","<=",1]],
};
let SCR = {filters:[], set:"概要", sort:"market_cap", dir:"DESC", page:0, industries:[]};
function scrCols(){ return martCols(scrMart()); }
function buildScreener(){
  const el = $("p-scr");
  if(!BI.marts[scrMart()]){ el.innerHTML = `<div class="msg warn">スクリーナー用の表（m_screener）はまだ書き出されていません。次の書き出しのあとに再公開します。</div>`; return; }
  const cols = scrCols(), names = cols.map(c=>c.name), lab = n => { const c = cols.find(x=>x.name===n); return esc(c && c.label || n); };
  const numCols = cols.filter(isNum);
  el.innerHTML = `
    <div class="row"><p class="q" style="margin:0">企業スクリーナー</p>
      <label class="f">市場<select id="scrMkt"><option value="jp" ${SCR_MKT==="jp"?"selected":""}>日本株</option><option value="us" ${SCR_MKT==="us"?"selected":""}>米国株（USD）</option></select></label></div>
    <p class="note">${SCR_MKT==="us" ? "NYSE・Nasdaq の普通株（最新の決算×最新の終値）。財務が付くのは一部の銘柄のみ。金額は USD。" : "全上場企業（最新の決算期×最新の終値）。"}比率は % で入れてください（例 ROE 15 → 15%）。52週位置は 0〜100。</p>
    <div class="chips">${Object.keys(scrPresets()).map(k=>`<button class="ghost" data-pre="${esc(k)}">${esc(k)}</button>`).join("")}<button class="ghost" id="scrClear">条件をすべて外す</button></div>
    <div class="chips" id="scrChips">${SCR.filters.map((f,i)=>`<span class="chip">${lab(f[0])} ${esc(f[1])} ${esc(fmtIn(f[0],f[2]))}<button data-fdel="${i}" aria-label="条件を外す">×</button></span>`).join("") || `<span class="note" style="margin:0">条件なし（全社）</span>`}</div>
    <div class="row">
      <label class="f">列<select id="scrCol">${numCols.map(c=>`<option value="${esc(c.name)}">${lab(c.name)}</option>`).join("")}</select></label>
      <label class="f">比較<select id="scrOp"><option>&gt;=</option><option>&lt;=</option><option>&gt;</option><option>&lt;</option></select></label>
      <label class="f">値<input id="scrVal" inputmode="decimal" style="width:7em" placeholder="例 10"></label>
      <button class="ghost" id="scrAdd">＋ 条件</button>
      ${names.includes("industry") ? `<label class="f">業種（含む）<input id="scrInd" placeholder="例 情報・通信" value="${esc(SCR.industries.join(","))}"></label>` : ""}
    </div>
    <div class="row" style="margin-top:8px">
      <label class="f">列セット<select id="scrSet">${Object.keys(scrSets()).map(k=>`<option ${k===SCR.set?"selected":""}>${esc(k)}</option>`).join("")}</select></label>
      <label class="f">並べ替え<select id="scrSort">${numCols.map(c=>`<option value="${esc(c.name)}" ${c.name===SCR.sort?"selected":""}>${lab(c.name)}</option>`).join("")}</select></label>
      <label class="f">向き<select id="scrDir"><option ${SCR.dir==="DESC"?"selected":""} value="DESC">大きい順</option><option ${SCR.dir==="ASC"?"selected":""} value="ASC">小さい順</option></select></label>
      <button class="go" id="scrGo">検索</button>
      <label class="f">保存名<input id="scrName" placeholder="例：自分の割安株"></label><button class="ghost" id="scrSave">条件をスロットに保存</button><span class="note" id="scrMsg"></span>
    </div>`;
  $("scrMkt").onchange = e => { SCR_MKT = e.target.value; SCR = {filters:[], set:"概要", sort: SCR_MKT==="us" ? "market_cap_bn_usd" : "market_cap", dir:"DESC", page:0, industries:[]}; buildScreener(); runScreener(); };
  el.querySelectorAll("[data-pre]").forEach(b => b.onclick = () => { SCR.filters = scrPresets()[b.dataset.pre].filter(f=>names.includes(f[0])).map(f=>f.slice()); SCR.page = 0; buildScreener(); runScreener(); });
  el.querySelectorAll("[data-fdel]").forEach(b => b.onclick = () => { SCR.filters.splice(+b.dataset.fdel,1); SCR.page=0; buildScreener(); runScreener(); });
  $("scrClear").onclick = () => { SCR.filters = []; SCR.industries = []; SCR.page = 0; buildScreener(); runScreener(); };
  $("scrAdd").onclick = () => { const c=$("scrCol").value, raw=$("scrVal").value.trim(); const n = Number(raw);
    if(raw==="" || !Number.isFinite(n)){ $("scrMsg").textContent = "値は数値で入れてください"; return; }
    SCR.filters.push([c, $("scrOp").value, isRatio(c) ? n/100 : n]); SCR.page=0; buildScreener(); runScreener(); };
  if($("scrInd")) $("scrInd").onchange = e => { SCR.industries = e.target.value.split(/[,、]/).map(x=>x.trim()).filter(Boolean); SCR.page=0; runScreener(); };
  $("scrSet").onchange = e => { SCR.set = e.target.value; runScreener(); };
  $("scrSort").onchange = e => { SCR.sort = e.target.value; SCR.page=0; runScreener(); };
  $("scrDir").onchange = e => { SCR.dir = e.target.value; SCR.page=0; runScreener(); };
  $("scrGo").onclick = () => { SCR.page=0; runScreener(); };
  $("scrSave").onclick = async () => { try{ const q = screenerSql(); $("slotMsg").textContent=""; await saveSlot($("scrName").value, q); $("scrMsg").textContent = $("slotMsg").textContent || "保存しました"; }catch(e){ $("scrMsg").textContent = e.message; } };
}
function isRatio(n){ return /margin|ratio|roe|roa|yield|growth|cagr|return_|payout|to_mcap/.test(n) && !/de_ratio/.test(n); }
function fmtIn(n, v){ return isRatio(n) ? (v*100).toFixed(1).replace(/\.0$/,"")+"%" : Number(v).toLocaleString("ja-JP"); }
function screenerSql(){
  const names = scrCols().map(c=>c.name);
  const ok = n => { if(!names.includes(n)) throw new Error("列がありません: "+n); return qid(n); };
  const sets = scrSets(), show = [...new Set([...(sets[SCR.set]||sets["概要"]), ...SCR.filters.map(f=>f[0]), ...(names.includes("valuation_flag")?["valuation_flag"]:[])])].filter(n=>names.includes(n));
  const where = SCR.filters.map(f => { if(![">=","<=",">","<"].includes(f[1]) || !Number.isFinite(Number(f[2]))) throw new Error("条件が不正です"); return `${ok(f[0])} ${f[1]} ${Number(f[2])}`; });
  if(SCR.industries.length && names.includes("industry")) where.push("(" + SCR.industries.map(x => `industry LIKE ${lit("%"+x+"%")}`).join(" OR ") + ")");
  return `SELECT ${show.map(ok).join(", ")}, COUNT(*) OVER() AS total_hits\nFROM ${scrMart()}` + (where.length ? `\nWHERE ${where.join("\n  AND ")}` : "")
    + `\nORDER BY ${ok(SCR.sort)} ${SCR.dir === "ASC" ? "ASC" : "DESC"} NULLS LAST\nLIMIT 100 OFFSET ${SCR.page*100}`;
}
async function runScreener(){
  let q, sql; try{ q = screenerSql(); sql = wrapSql(q); }catch(e){ $("result").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
  $("result").innerHTML = `<div class="msg">BigQuery で検索中…</div>`;
  try{
    const res = await runBQ(sql);
    const ti = res.columns.indexOf("total_hits"), total = res.rows.length ? res.rows[0][ti] : 0;
    res.columns.splice(ti,1); res.num.splice(ti,1); res.rows.forEach(r=>r.splice(ti,1));
    const labs = scrCols(); res.columns = res.columns.map(n => (labs.find(c=>c.name===n)||{}).label || n);
    render(res, {type:"table"}, row => { const code = row[0]; const t = BI.templates.find(x=>x.id==="fin_company_10y"); if(SCR_MKT==="us"){ return; } if(t && code){ tab("tpl"); openTpl(t.id); const inp = $("pp-sec_code4"); if(inp){ inp.value = code; runTpl(); } } });
    const pages = Math.max(1, Math.ceil(total/100));
    $("result").insertAdjacentHTML("afterbegin", `<div class="row" style="margin:6px 0"><b>${Number(total).toLocaleString()} 社</b><span class="note">${SCR_MKT==="us" ? "" : "行をクリックで「会社の10年推移」"}</span>
      <button class="ghost" id="scrPrev" ${SCR.page<=0?"disabled":""}>前の100社</button><span class="note">${SCR.page+1} / ${pages}</span><button class="ghost" id="scrNext" ${SCR.page+1>=pages?"disabled":""}>次の100社</button></div>`);
    $("scrPrev").onclick = () => { SCR.page--; runScreener(); }; $("scrNext").onclick = () => { SCR.page++; runScreener(); };
    showSql(sql, $("result")); logRun("スクリーナー", SCR.filters.map(f=>f[0]+f[1]+f[2]).join(" ") || "全社", q);
  }catch(e){ $("result").innerHTML = `<div class="msg err">${esc(errText(e))}</div>`; showSql(sql, $("result")); }
}

/* ── タブと起動 ─────────────────────────────────── */
function tab(name){
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab===name));
  ["tpl","free","ask","scr","sql","slot"].forEach(n => $("p-"+n).hidden = n !== name);
  if(name==="slot") renderSlots(); if(name==="scr") buildScreener(); if(name==="sql") buildBuilder();
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { tab(b.dataset.tab); if(b.dataset.tab==="free"){ buildFree(); } });
$("askGo").onclick = ask; $("askStop").onclick = () => askCtl && askCtl.abort();
$("sqlGo").onclick = async () => {
  let sql; try{ sql = wrapSql($("sqlText").value); }catch(e){ $("result").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
  $("result").innerHTML = `<div class="msg">BigQuery で集計中…</div>`;
  try{ const res = await runBQ(sql); render(res, {type:"table"}); showSql(sql, $("result")); logRun("SQL", $("sqlText").value.trim().split("\n")[0].slice(0,60), $("sqlText").value); }
  catch(e){ $("result").innerHTML = `<div class="msg err">${esc(errText(e))}</div>`; showSql(sql, $("result")); }
};
$("slotSave").onclick = () => saveSlot($("slotName").value, $("sqlText").value);
$("sqlText").value = "SELECT industry, COUNT(*) AS n_companies, AVG(operating_margin) AS avg_op_margin\nFROM m_fin_annual\nWHERE fiscal_year = 2025\nGROUP BY industry\nORDER BY n_companies DESC";
buildShelf();
$("p-tpl").innerHTML = `<p class="q">左の棚からテンプレを選んでください</p><p class="note">テンプレ ${BI.templates.length} 本・マート ${Object.keys(BI.marts).length} 本（${esc(BI.built_at)} 時点の定義）。結果のクリックで「自由分析」に入ると、その値で絞り込んだまま深掘りできます。</p>`;
(async () => {
  try{ mcp = window.claude ? await window.claude.use("mcp") : null; }catch(e){ mcp = null; }
  try{ sample = window.claude ? await window.claude.use("sample") : null; }catch(e){ sample = null; }
  try{ db = window.claude ? await window.claude.use("db") : null; const u = window.claude ? await window.claude.use("user") : null; me = u ? await u.id() : null; }catch(e){ db = null; me = null; }
  const st = $("status");
  if(!mcp){ st.textContent = "BigQuery 未接続（Claude の画面で開くと使えます）"; st.className = "status bad"; return; }
  st.textContent = "BigQuery 接続可"; st.className = "status ok";
  if(BI.templates[0]) openTpl(BI.templates[0].id);
})();
</script>
