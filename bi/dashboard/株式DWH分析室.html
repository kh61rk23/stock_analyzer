sql": "SELECT sec_code4, name, industry, net_sales, operating_income,\n       ROUND(operating_margin * 100, 2) AS operating_margin_pct\nFROM m_fin_annual\nWHERE fiscal_year = {{fiscal_year}} AND net_sales IS NOT NULL\nORDER BY net_sales DESC\nLIMIT {{limit}}", "params": [{"name": "fiscal_year", "label": "決算年（期末の年）", "type": "int", "default": 2025, "min": 2016, "max": 2030}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 500}], "chart": {"type": "table", "x": "name", "y": ["net_sales", "operating_income", "operating_margin_pct"], "series": null}, "note": "単位は円。"}, {"id": "geo_country_risk_trend", "domain": "geo", "title": "国別リスクの推移", "question": "この国の総合リスクとGDELT不安定度は最近どう動いたか", "mart": "m_country_risk", "sql": "SELECT risk_date, country_name_ja, composite_risk_score, gdelt_instability\nFROM m_country_risk\nWHERE country_code = {{country_code}}\nORDER BY risk_date", "params": [{"name": "country_code", "label": "国コード（ISO3）", "type": "string", "default": "CHN"}], "chart": {"type": "line", "x": "risk_date", "y": ["composite_risk_score", "gdelt_instability"], "series": null}, "note": "国コードは ISO3（JPN・USA・CHN・RUS など）。総合リスクは大きいほど高リスク。日次データは2026-06-29以降。"}, {"id": "geo_risk_surge", "domain": "geo", "title": "リスクが急上昇した国", "question": "直近でリスクが大きく上がった国はどこか", "mart": "m_country_risk", "sql": "WITH ranked AS (\n  SELECT country_code, country_name_ja, region, composite_risk_score,\n         ROW_NUMBER() OVER (PARTITION BY country_code ORDER BY risk_date DESC) AS rn\n  FROM m_country_risk\n  WHERE composite_risk_score IS NOT NULL\n),\ncur AS (SELECT * FROM ranked WHERE rn = 1),\nprev AS (SELECT * FROM ranked WHERE rn = {{lookback}} + 1)\nSELECT cur.country_code, cur.country_name_ja, cur.region,\n       prev.composite_risk_score AS score_before,\n       cur.composite_risk_score AS score_now,\n       cur.composite_risk_score - prev.composite_risk_score AS change\nFROM cur\nJOIN prev ON prev.country_code = cur.country_code\nORDER BY change DESC\nLIMIT {{top_n}}", "params": [{"name": "lookback", "label": "何回前の観測と比べるか", "type": "int", "default": 14, "min": 1, "max": 60}, {"name": "top_n", "label": "表示する国数", "type": "int", "default": 15, "min": 1, "max": 59}], "chart": {"type": "bar", "x": "country_name_ja", "y": ["change"], "series": null}, "note": "「何回前」は日数ではなく観測行の数（日次に欠けがある国では実際の日数が少し長くなる）。マイナスは低下。"}, {"id": "geo_region_risk_now", "domain": "geo", "title": "地域別リスク平均（最新）", "question": "どの地域が今いちばんリスクが高いか", "mart": "m_country_risk", "sql": "SELECT region, ROUND(AVG(composite_risk_score), 2) AS avg_risk, COUNT(*) AS countries\nFROM m_country_risk\nWHERE risk_date = (SELECT MAX(risk_date) FROM m_country_risk)\nGROUP BY region\nORDER BY avg_risk DESC", "params": [], "chart": {"type": "bar", "x": "region", "y": ["avg_risk"], "series": null}, "note": "最新日の単純平均。国数が少ない地域（欧州・ロシア など）は1国の動きに左右される。"}, {"id": "geo_region_risk_trend", "domain": "geo", "title": "地域別リスク平均の推移", "question": "地域ごとのリスクは時間とともにどう動いたか", "mart": "m_country_risk", "sql": "SELECT risk_date, region, ROUND(AVG(composite_risk_score), 2) AS avg_risk\nFROM m_country_risk\nGROUP BY risk_date, region\nORDER BY risk_date, region", "params": [], "chart": {"type": "line", "x": "risk_date", "y": ["avg_risk"], "series": "region"}, "note": "地域内の国の単純平均。"}, {"id": "geo_high_risk_ranking", "domain": "geo", "title": "高リスク国ランキング（最新）", "question": "いま総合リスクが高い国はどこか", "mart": "m_country_risk", "sql": "SELECT country_name_ja, region, composite_risk_score, gdelt_instability,\n       foreign_ministry_level, state_dept_level, sanction_flag\nFROM m_country_risk\nWHERE risk_date = (SELECT MAX(risk_date) FROM m_country_risk)\nORDER BY composite_risk_score DESC\nLIMIT {{top_n}}", "params": [{"name": "top_n", "label": "表示する国数", "type": "int", "default": 15, "min": 1, "max": 59}], "chart": {"type": "bar", "x": "country_name_ja", "y": ["composite_risk_score"], "series": null}, "note": "外務省・国務省レベルは渡航情報の危険度（大きいほど危険）。"}, {"id": "geo_company_by_country", "domain": "geo", "title": "ある国に依存する会社", "question": "この国に権益・売上・調達で関わっている会社はどこか", "mart": "m_company_country", "sql": "SELECT COALESCE(name, ticker) AS company, ticker, exposure_type, exposure_strength,\n       revenue_share_est, latest_risk_score\nFROM m_company_country\nWHERE country_code = {{country_code}}\nORDER BY exposure_strength DESC, company", "params": [{"name": "country_code", "label": "国コード（ISO3）", "type": "string", "default": "AUS"}], "chart": {"type": "bar", "x": "company", "y": ["exposure_strength"], "series": null}, "note": "依存度は0〜1の目安（自動推定を含む）。取り込み済みの会社だけが対象で、全上場会社ではない。"}, {"id": "geo_company_countries", "domain": "geo", "title": "ある会社の依存国", "question": "この会社はどの国にどれだけ依存しているか", "mart": "m_company_country", "sql": "SELECT country_name_ja, region, exposure_type, exposure_strength, latest_risk_score, risk_weighted_score, sanction_flag\nFROM m_company_country\nWHERE sec_code4 = {{sec_code4}}\nORDER BY exposure_strength DESC, country_name_ja", "params": [{"name": "sec_code4", "label": "証券コード（4桁）", "type": "string", "default": "8058"}], "chart": {"type": "bar", "x": "country_name_ja", "y": ["exposure_strength", "risk_weighted_score"], "series": null}, "note": "日本株のみ（米国株の ticker は証券コードを持たない）。risk_weighted_score ＝ 依存度 × 最新の国リスク。"}, {"id": "geo_high_risk_dependence", "domain": "geo", "title": "高リスク国への依存が大きい会社", "question": "リスクの高い国に依存している会社はどこか", "mart": "m_company_country", "sql": "WITH d AS (\n  SELECT COALESCE(name, ticker) AS company, ticker, exposure_strength, risk_weighted_score\n  FROM m_company_country\n  WHERE latest_risk_score >= {{min_risk}}\n)\nSELECT company, ticker, COUNT(*) AS countries, SUM(exposure_strength) AS exposure_total,\n       ROUND(SUM(risk_weighted_score), 2) AS weighted_risk\nFROM d\nGROUP BY company, ticker\nORDER BY weighted_risk DESC\nLIMIT {{top_n}}", "params": [{"name": "min_risk", "label": "高リスクとみなす総合リスクの下限", "type": "number", "default": 30, "min": 0, "max": 100}, {"name": "top_n", "label": "表示する会社数", "type": "int", "default": 15, "min": 1, "max": 100}], "chart": {"type": "bar", "x": "company", "y": ["weighted_risk"], "series": null}, "note": "依存度を足し合わせた値は、権益が多い会社ほど大きくなる（会社間の優劣ではなく関与の広さの目安）。"}, {"id": "geo_sanction_exposure", "domain": "geo", "title": "制裁対象国への関与", "question": "制裁対象とされる国に関わっている会社はどこか", "mart": "m_company_country", "sql": "SELECT COALESCE(name, ticker) AS company, ticker, country_name_ja, exposure_type, exposure_strength,\n       latest_risk_score, review_flag\nFROM m_company_country\nWHERE sanction_flag = TRUE\nORDER BY exposure_strength DESC, company", "params": [], "chart": {"type": "bar", "x": "company", "y": ["exposure_strength"], "series": null}, "note": "制裁対象の判定は country_profile の sanction_flag（イラン・ミャンマー・ロシア・ベネズエラ）。review_flag が真のものは人の確認待ちの自動推定。"}, {"id": "geo_democracy_vs_risk", "domain": "geo", "title": "民主主義指数と総合リスク", "question": "民主主義の度合いと国リスクに関係はあるか", "mart": "m_country_profile", "sql": "SELECT p.country_name_ja, p.region, p.democracy_index, r.composite_risk_score\nFROM m_country_profile AS p\nJOIN m_country_risk AS r ON r.country_code = p.country_code\nWHERE r.risk_date = (SELECT MAX(risk_date) FROM m_country_risk)\n  AND p.democracy_index IS NOT NULL\nORDER BY p.democracy_index", "params": [], "chart": {"type": "scatter", "x": "democracy_index", "y": ["composite_risk_score"], "series": null}, "note": "最新日のリスクと静的な民主主義指数の散布図。相関は因果を意味しない。"}, {"id": "geo_exposure_type_mix", "domain": "geo", "title": "権益の種類別の件数", "question": "どんな種類の関与（資源権益・生産拠点・販売網など）が多いか", "mart": "m_company_country", "sql": "SELECT exposure_type, COUNT(*) AS pairs, ROUND(AVG(exposure_strength), 3) AS avg_strength\nFROM m_company_country\nGROUP BY exposure_type\nORDER BY pairs DESC", "params": [], "chart": {"type": "bar", "x": "exposure_type", "y": ["pairs"], "series": null}, "note": "会社×国の組の数。種類が複数ある組は最も強い種類で数える。"}, {"id": "sector_score_ranking", "domain": "macro", "title": "最新日の業種スコアランキング", "question": "いちばん新しい日の業種スコアはどの業種が高いか（前日・5日前との差つき）", "mart": "m_sector_scores", "sql": "SELECT score_rank, sector_code, sector_name, score, risk_level, ROUND(score_chg_1d, 1) AS score_chg_1d, ROUND(score_chg_5d, 1) AS score_chg_5d, ret_1m, ret_12m, signals\nFROM m_sector_scores\nWHERE market = {{market}} AND report_date = (SELECT MAX(report_date) FROM m_sector_scores WHERE market = {{market}})\nORDER BY score DESC", "params": [{"name": "market", "label": "市場（JP / US）", "type": "string", "default": "JP"}], "chart": {"type": "bar", "x": "sector_name", "y": "score", "series": null}, "note": "日本＝33業種（業種別レポートの総合スコア）、米国＝11セクター（ETF）。"}, {"id": "sector_score_trend", "domain": "macro", "title": "業種スコアの推移", "question": "ある業種のスコアは日ごとにどう動いてきたか", "mart": "m_sector_scores", "sql": "SELECT report_date, sector_name, score, risk_level\nFROM m_sector_scores\nWHERE market = {{market}} AND sector_name LIKE {{sector_like}}\nORDER BY report_date", "params": [{"name": "market", "label": "市場（JP / US）", "type": "string", "default": "JP"}, {"name": "sector_like", "label": "業種名の一部（% で前後を囲む）", "type": "string", "default": "%銀行%"}], "chart": {"type": "line", "x": "report_date", "y": "score", "series": "sector_name"}, "note": ""}, {"id": "sector_score_movers", "domain": "macro", "title": "スコアが大きく動いた業種", "question": "直近N記録日でスコアが大きく上がった・下がった業種はどれか", "mart": "m_sector_scores", "sql": "SELECT sector_code, sector_name, MIN(score) AS min_score, MAX(score) AS max_score,\n       MAX(CASE WHEN report_date = (SELECT MAX(report_date) FROM m_sector_scores WHERE market = {{market}}) THEN score END) AS latest_score,\n       MAX(CASE WHEN report_date = (SELECT MAX(report_date) FROM m_sector_scores WHERE market = {{market}}) THEN score END)\n         - MAX(CASE WHEN report_date = (SELECT MIN(report_date) FROM m_sector_scores WHERE market = {{market}} AND report_date >= (SELECT MAX(report_date) FROM m_sector_scores WHERE market = {{market}}) - {{days}}) THEN score END) AS change\nFROM m_sector_scores\nWHERE market = {{market}} AND report_date >= (SELECT MAX(report_date) FROM m_sector_scores WHERE market = {{market}}) - {{days}}\nGROUP BY sector_code, sector_name\nORDER BY change DESC", "params": [{"name": "market", "label": "市場（JP / US）", "type": "string", "default": "JP"}, {"name": "days", "label": "遡る日数", "type": "int", "default": 30, "min": 1, "max": 365}], "chart": {"type": "bar", "x": "sector_name", "y": "change", "series": null}, "note": "change＝最新日のスコア −（期間の最初の日のスコア）。"}, {"id": "macro_indicator_trend", "domain": "macro", "title": "マクロ指標の推移", "question": "ドル円・米10年債・原油・VIX・日経平均などは日ごとにどう動いたか", "mart": "m_macro_indicators", "sql": "SELECT report_date, indicator, value\nFROM m_macro_indicators\nWHERE source = 'macro_report' AND indicator LIKE {{indicator_like}}\nORDER BY report_date", "params": [{"name": "indicator_like", "label": "指標名の一部（% で前後を囲む。例 %USD% / %VIX% / %日経%）", "type": "string", "default": "%USD%"}], "chart": {"type": "line", "x": "report_date", "y": "value", "series": "indicator"}, "note": "2026-10-11 より前は有効3桁に丸めた値。"}, {"id": "yield_curve", "domain": "macro", "title": "米国債のイールドカーブ（最新日と1か月差）", "question": "いちばん新しい日の米国債の年限別利回りと、1か月前からの変化は", "mart": "m_macro_indicators", "sql": "SELECT indicator AS tenor, value AS yield_pct, change_1m\nFROM m_macro_indicators\nWHERE source = 'bond_commodity' AND report_date = (SELECT MAX(report_date) FROM m_macro_indicators WHERE source = 'bond_commodity')\nORDER BY CASE indicator WHEN '米1ヶ月' THEN 1 WHEN '米3ヶ月' THEN 2 WHEN '米6ヶ月' THEN 3 WHEN '米1年' THEN 4 WHEN '米2年' THEN 5 WHEN '米5年' THEN 6 WHEN '米10年' THEN 7 WHEN '米20年' THEN 8 WHEN '米30年' THEN 9 ELSE 10 END", "params": [], "chart": {"type": "line", "x": "tenor", "y": "yield_pct", "series": null}, "note": "出どころは FRED（債券・コモディティ統合レポート）。"}, {"id": "yield_trend", "domain": "macro", "title": "米国債利回りの推移（年限別）", "question": "米2年・10年などの利回りは日ごとにどう動いたか", "mart": "m_macro_indicators", "sql": "SELECT report_date, indicator AS tenor, value AS yield_pct\nFROM m_macro_indicators\nWHERE source = 'bond_commodity' AND indicator IN ('米2年', '米10年', '米30年')\nORDER BY report_date", "params": [], "chart": {"type": "line", "x": "report_date", "y": "yield_pct", "series": "tenor"}, "note": ""}, {"id": "macro_signal_sector_balance", "domain": "macro", "title": "業種ごとの追い風・逆風の日数", "question": "直近N日のマクロシグナルで、どの業種が追い風・逆風と判定された日が多いか", "mart": "m_macro_signals", "sql": "SELECT sector_name,\n       SUM(CASE WHEN judgement = 'tailwind' THEN 1 ELSE 0 END) AS tailwind,\n       SUM(CASE WHEN judgement = 'headwind' THEN 1 ELSE 0 END) AS headwind,\n       SUM(CASE WHEN judgement = 'watch' THEN 1 ELSE 0 END) AS watch\nFROM m_macro_signals\nWHERE report_date >= (SELECT MAX(report_date) FROM m_macro_signals) - {{days}}\nGROUP BY sector_name\nORDER BY tailwind - headwind DESC", "params": [{"name": "days", "label": "遡る日数", "type": "int", "default": 30, "min": 1, "max": 365}], "chart": {"type": "bar", "x": "sector_name", "y": ["tailwind", "headwind"], "series": null}, "note": "1日に複数のシグナルがあれば、それぞれ数える。"}, {"id": "macro_signal_latest", "domain": "macro", "title": "最新日のマクロシグナル", "question": "いちばん新しい日に出ているマクロシグナルと、業種への影響は", "mart": "m_macro_signals", "sql": "SELECT signal, trigger_value, sector_name, judgement_ja, reason\nFROM m_macro_signals\nWHERE report_date = (SELECT MAX(report_date) FROM m_macro_signals)\nORDER BY signal, judgement_ja", "params": [], "chart": {"type": "table", "x": "sector_name", "y": "judgement_ja", "series": null}, "note": ""}, {"id": "report_search", "domain": "macro", "title": "レポートを言葉で探す（直近31日）", "question": "マクロ・業種のレポートのうち、ある言葉を含むものはどれか", "mart": "m_reports", "sql": "SELECT report_date, report_type, report_key, title, source_path\nFROM m_reports\nWHERE body_head LIKE {{pattern}} OR title LIKE {{pattern}}\nORDER BY report_date DESC\nLIMIT {{limit}}", "params": [{"name": "pattern", "label": "探す言葉（% で前後を囲む）", "type": "string", "default": "%円安%"}, {"name": "limit", "label": "表示件数", "type": "int", "default": 40, "min": 1, "max": 200}], "chart": {"type": "table", "x": "title", "y": "report_date", "series": null}, "note": "本文の先頭3,000字だけを探す。全期間・全文は BigQuery の analytics.report_texts（分析室の SQL 欄で引ける）。"}, {"id": "report_read", "domain": "macro", "title": "レポートを読む", "question": "ある日・ある種類のレポートの中身は（業種は report_key に業種コード）", "mart": "m_reports", "sql": "SELECT report_date, report_type, report_key, title, body_head\nFROM m_reports\nWHERE report_type = {{report_type}} AND report_date = (SELECT MAX(report_date) FROM m_reports WHERE report_type = {{report_type}})\nORDER BY report_key", "params": [{"name": "report_type", "label": "種類（macro_report / sector / bond_commodity / daily_movers / anomaly / us_sector_report）", "type": "string", "default": "macro_report"}], "chart": {"type": "table", "x": "title", "y": "report_date", "series": null}, "note": "最新日のもの。本文は先頭3,000字。"}, {"id": "mkt_sector_returns", "domain": "market", "title": "業種別の騰落（1か月・3か月・年初来）", "question": "日本株の業種ごとに、直近1か月・3か月・年初来でどれだけ動いたか（時価総額加重）", "mart": "m_sector_perf", "sql": "SELECT industry, n_stocks, ROUND(ret_1m_cw * 100, 1) AS ret_1m_pct, ROUND(ret_3m_cw * 100, 1) AS ret_3m_pct,\n       ROUND(ret_ytd_cw * 100, 1) AS ret_ytd_pct, ROUND(up_ratio * 100, 0) AS up_ratio_pct\nFROM m_sector_perf\nWHERE trade_date = (SELECT MAX(trade_date) FROM m_sector_perf)\n  AND n_stocks >= {{min_stocks}}\nORDER BY ret_3m_cw DESC", "params": [{"name": "min_stocks", "label": "業種の銘柄数の下限", "type": "int", "default": 3, "min": 1, "max": 1000}], "chart": {"type": "bar", "x": "industry", "y": ["ret_1m_pct", "ret_3m_pct", "ret_ytd_pct"], "series": null}, "note": "最新の営業日の値（株価の取り込みが途中の日は除く）。時価総額加重は最新の時価総額を重みに固定した近似で、実際の業種指数（TOPIX-17 等）とは一致しない。年初来は前年最終営業日の指数との比（履歴が無ければ空）。up_ratio_pct はその日に上がった銘柄の割合。"}, {"id": "mkt_sector_ew_vs_cw", "domain": "market", "title": "業種の騰落：等加重と時価総額加重の差", "question": "業種の上昇は大型株だけか、それとも業種全体か（等加重と時価総額加重の3か月騰落の差）", "mart": "m_sector_perf", "sql": "SELECT industry, n_stocks, ROUND(ret_3m_ew * 100, 1) AS ret_3m_ew_pct, ROUND(ret_3m_cw * 100, 1) AS ret_3m_cw_pct,\n       ROUND((ret_3m_cw - ret_3m_ew) * 100, 1) AS cw_minus_ew_pct\nFROM m_sector_perf\nWHERE trade_date = (SELECT MAX(trade_date) FROM m_sector_perf)\n  AND n_stocks >= {{min_stocks}} AND ret_3m_ew IS NOT NULL AND ret_3m_cw IS NOT NULL\nORDER BY cw_minus_ew_pct DESC", "params": [{"name": "min_stocks", "label": "業種の銘柄数の下限", "type": "int", "default": 5, "min": 1, "max": 1000}], "chart": {"type": "bar", "x": "industry", "y": ["ret_3m_ew_pct", "ret_3m_cw_pct"], "series": null}, "note": "cw_minus_ew_pct が大きい業種は大型株が引っ張っている（小型株は付いてきていない）。逆に負なら小型株のほうが強い。時価総額の重みは最新値で固定。"}, {"id": "mkt_sector_index_trend", "domain": "market", "title": "業種指数の推移", "question": "ある業種の指数は直近1年でどう動いたか（等加重と時価総額加重）", "mart": "m_sector_perf", "sql": "SELECT trade_date, ROUND(idx_ew, 2) AS idx_ew, ROUND(idx_cw, 2) AS idx_cw, ROUND(up_ratio * 100, 0) AS up_ratio_pct\nFROM m_sector_perf\nWHERE industry = {{industry}}\nORDER BY trade_date", "params": [{"name": "industry", "label": "業種（EDINETの業種名。例 電気機器・銀行業・海運業）", "type": "string", "default": "電気機器"}], "chart": {"type": "line", "x": "trade_date", "y": ["idx_ew", "idx_cw"], "series": null}, "note": "指数は取得期間の頭の前営業日を100とする。業種名は表記が正確に一致しないと0行になる（mkt_sector_returns の industry 列をコピーする）。"}, {"id": "mkt_sector_rotation_monthly", "domain": "market", "title": "業種ローテーション（月ごとの業種騰落）", "question": "月ごとにどの業種が買われ、どの業種が売られたか（業種×月の表。ヒートマップ用）", "mart": "m_price_monthly", "sql": "SELECT industry, month, COUNT(*) AS n_stocks, ROUND(AVG(return_1m) * 100, 1) AS avg_return_pct\nFROM m_price_monthly\nWHERE market = 'JP' AND is_partial = FALSE AND industry IS NOT NULL AND return_1m IS NOT NULL\n  AND turnover >= {{min_turnover_m}} * 1000000\nGROUP BY industry, month\nHAVING COUNT(*) >= {{min_stocks}}\nORDER BY month, industry", "params": [{"name": "min_turnover_m", "label": "月間売買代金の下限（百万・現地通貨。日本株は百万円、米国株は百万ドル）", "type": "number", "default": 100, "min": 0, "max": 100000000}, {"name": "min_stocks", "label": "業種×月の銘柄数の下限", "type": "int", "default": 3, "min": 1, "max": 1000}], "chart": {"type": "table", "x": "month", "y": "avg_return_pct", "series": "industry"}, "note": "月間騰落率（月末終値の前月比）の業種内単純平均。月が終わっていない当月と、取得期間の頭の月（前月が無い）は含めない。月間売買代金が下限未満の銘柄は除く（小型株の極端な値動きで平均が歪むため）。表の行＝業種、列＝月で見る。"}, {"id": "mkt_breadth_ad_ratio", "domain": "market", "title": "騰落レシオと上昇銘柄比率の推移", "question": "市場全体の買われ方の広がりはどうか（騰落レシオ・その日に上がった銘柄の割合）", "mart": "m_market_breadth", "sql": "SELECT trade_date, n_stocks, ROUND(ad_ratio_25d, 1) AS ad_ratio_25d, ROUND(up_ratio * 100, 1) AS up_ratio_pct\nFROM m_market_breadth\nWHERE market = {{market}} AND is_complete = TRUE\nORDER BY trade_date", "params": [{"name": "market", "label": "市場（JP＝日本株・US＝米国株）", "type": "string", "default": "JP"}], "chart": {"type": "line", "x": "trade_date", "y": ["ad_ratio_25d"], "series": null}, "note": "騰落レシオは25営業日の上昇銘柄数合計÷下落銘柄数合計×100。120以上が過熱、70以下が売られすぎの目安。株価の取り込みが途中の日は除く。取得期間の頭の約25日は空。"}, {"id": "mkt_breadth_new_highs_lows", "domain": "market", "title": "新高値・新安値の銘柄数の推移", "question": "新高値をつけた銘柄と新安値をつけた銘柄はどちらが多いか", "mart": "m_market_breadth", "sql": "SELECT trade_date, n_hl_base, n_new_high, n_new_low, n_new_high - n_new_low AS net_new_high\nFROM m_market_breadth\nWHERE market = {{market}} AND is_complete = TRUE AND n_hl_base >= {{min_base}}\nORDER BY trade_date", "params": [{"name": "market", "label": "市場（JP＝日本株・US＝米国株）", "type": "string", "default": "JP"}, {"name": "min_base", "label": "判定できる銘柄数の下限（直前の履歴が120営業日以上ある銘柄数）", "type": "int", "default": 100, "min": 1, "max": 100000}], "chart": {"type": "line", "x": "trade_date", "y": ["n_new_high", "n_new_low"], "series": null}, "note": "新高値＝終値が直前252営業日の終値の最高値を上回った銘柄。株価の履歴が約1年しか無いため、取得開始から約120営業日までは判定できる銘柄が少ない（min_base で除く）。"}, {"id": "mkt_breadth_above_ma", "domain": "market", "title": "移動平均線より上の銘柄の比率", "question": "50日・200日移動平均線より上にいる銘柄はどれくらいか（相場の強さ）", "mart": "m_market_breadth", "sql": "SELECT trade_date, ROUND(pct_above_ma50 * 100, 1) AS above_ma50_pct, ROUND(pct_above_ma200 * 100, 1) AS above_ma200_pct,\n       n_ma200\nFROM m_market_breadth\nWHERE market = {{market}} AND is_complete = TRUE AND pct_above_ma50 IS NOT NULL\nORDER BY trade_date", "params": [{"name": "market", "label": "市場（JP＝日本株・US＝米国株）", "type": "string", "default": "JP"}], "chart": {"type": "line", "x": "trade_date", "y": ["above_ma50_pct", "above_ma200_pct"], "series": null}, "note": "移動平均は当日を含む終値の単純平均。200日は取得開始から約200営業日後（2026年7月ごろ）から出るので、それまでは50日だけ。n_ma200 が母数。"}, {"id": "mkt_index_compare_jp_us", "domain": "market", "title": "日米の株価指数（等加重）の推移", "question": "全上場の等加重で見ると日本株と米国株はどちらが強いか", "mart": "m_market_breadth", "sql": "SELECT trade_date, market, ROUND(idx_ew, 2) AS idx_ew, n_stocks\nFROM m_market_breadth\nWHERE is_complete = TRUE\nORDER BY trade_date, market", "params": [], "chart": {"type": "line", "x": "trade_date", "y": "idx_ew", "series": "market"}, "note": "全上場の日次騰落率の単純平均を掛け合わせた指数（取得期間の頭の前営業日＝100）。通貨換算はしない（日本株は円、米国株はドルのまま）。小型株の寄与が大きく、日経平均・S&P500 とは一致しない。"}, {"id": "mkt_momentum_monthly", "domain": "market", "title": "月次モメンタム上位銘柄", "question": "直近の完了月で、3か月・6か月の騰落が大きい銘柄はどこか（売買代金の下限付き）", "mart": "m_price_monthly", "sql": "SELECT ticker, name, industry, ROUND(return_1m * 100, 1) AS return_1m_pct, ROUND(return_3m * 100, 1) AS return_3m_pct,\n       ROUND(return_6m * 100, 1) AS return_6m_pct, ROUND(turnover / 1000000.0, 0) AS turnover_m\nFROM m_price_monthly\nWHERE market = {{market}} AND is_partial = FALSE AND return_3m IS NOT NULL\n  AND month = (SELECT MAX(month) FROM m_price_monthly WHERE market = {{market}} AND is_partial = FALSE)\n  AND turnover >= {{min_turnover_m}} * 1000000\nORDER BY return_3m DESC\nLIMIT {{limit}}", "params": [{"name": "market", "label": "市場（JP＝日本株・US＝米国株）", "type": "string", "default": "JP"}, {"name": "min_turnover_m", "label": "月間売買代金の下限（百万・現地通貨。日本株は百万円、米国株は百万ドル）", "type": "number", "default": 500, "min": 0, "max": 100000000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "ticker", "y": "return_3m_pct", "series": null}, "note": "月が終わった最新の月の月末終値で比べる（当月途中は含めない）。名前・業種は日本株のみ（米国株の name は stock_snapshot にある約400銘柄だけ）。月間売買代金の下限を下げるほど値動きの荒い小型株が混ざる。"}, {"id": "mkt_volume_surge", "domain": "market", "title": "出来高（売買代金）が急増した銘柄", "question": "直前3か月の平均に比べて、直近の完了月の売買代金が急に膨らんだ銘柄はどこか", "mart": "m_price_monthly", "sql": "SELECT ticker, name, industry, ROUND(turnover_ratio_3m, 1) AS turnover_ratio_3m, ROUND(turnover / 1000000.0, 0) AS turnover_m,\n       ROUND(return_1m * 100, 1) AS return_1m_pct\nFROM m_price_monthly\nWHERE market = {{market}} AND is_partial = FALSE AND turnover_ratio_3m IS NOT NULL\n  AND month = (SELECT MAX(month) FROM m_price_monthly WHERE market = {{market}} AND is_partial = FALSE)\n  AND turnover >= {{min_turnover_m}} * 1000000 AND turnover_ratio_3m >= {{min_ratio}}\nORDER BY turnover_ratio_3m DESC\nLIMIT {{limit}}", "params": [{"name": "market", "label": "市場（JP＝日本株・US＝米国株）", "type": "string", "default": "JP"}, {"name": "min_turnover_m", "label": "月間売買代金の下限（百万・現地通貨。日本株は百万円、米国株は百万ドル）", "type": "number", "default": 300, "min": 0, "max": 100000000}, {"name": "min_ratio", "label": "急増倍率の下限（直前3か月平均の何倍か）", "type": "number", "default": 3, "min": 1, "max": 1000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "ticker", "y": "turnover_ratio_3m", "series": null}, "note": "月次の売買代金（終値×出来高の合計）での比較で、日次の出来高急増ではない。売買代金は株価の上昇でも増えるので、return_1m_pct と並べて見る。直前3か月がそろう銘柄だけ。"}, {"id": "mkt_drawdown", "domain": "market", "title": "52週高値から大きく下がっている銘柄", "question": "52週高値から大きく下がっている日本株はどこか（時価総額・売買代金の下限付き）", "mart": "m_screener", "sql": "SELECT sec_code4, name, industry, current_price, high_52w, ROUND((current_price / high_52w - 1) * 100, 1) AS drawdown_pct,\n       ROUND(return_3m * 100, 1) AS return_3m_pct, market_cap_b\nFROM m_screener\nWHERE current_price > 0 AND high_52w > 0 AND price_break_date IS NULL\n  AND market_cap_b >= {{min_mcap_oku}}\n  AND avg_turnover_20d >= {{min_turnover_oku}} * 100000000\nORDER BY drawdown_pct\nLIMIT {{limit}}", "params": [{"name": "min_mcap_oku", "label": "時価総額の下限（億円）", "type": "number", "default": 300, "min": 0, "max": 1000000}, {"name": "min_turnover_oku", "label": "直近20日の平均売買代金の下限（億円）", "type": "number", "default": 0.3, "min": 0, "max": 100000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "name", "y": "drawdown_pct", "series": null}, "note": "ドローダウン＝現在の終値÷直近252営業日の終値の最高値－1（終値ベースで日中高値ではない）。株式分割の調整漏れの疑いがある銘柄（price_break_date あり）は除く。履歴が120営業日未満の銘柄は52週高値が空なので出ない。"}, {"id": "mkt_new_high_streak", "domain": "market", "title": "高値更新が続く銘柄（月次）", "question": "直近3か月続けて月高値が過去の最高値を更新している銘柄はどこか", "mart": "m_price_monthly", "sql": "WITH h AS (\n  SELECT ticker, name, industry, month, close, month_high, return_3m, turnover, is_partial,\n         CASE WHEN COUNT(month_high) OVER (PARTITION BY ticker ORDER BY month ROWS BETWEEN 11 PRECEDING AND 1 PRECEDING) >= 3\n                   AND month_high > MAX(month_high) OVER (PARTITION BY ticker ORDER BY month ROWS BETWEEN 11 PRECEDING AND 1 PRECEDING)\n              THEN 1 ELSE 0 END AS is_new_high\n  FROM m_price_monthly\n  WHERE market = {{market}}\n),\ns AS (\n  SELECT *, SUM(is_new_high) OVER (PARTITION BY ticker ORDER BY month ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) AS hits_3m,\n         COUNT(*) OVER (PARTITION BY ticker ORDER BY month ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) AS months_n\n  FROM h\n)\nSELECT ticker, name, industry, month, hits_3m, ROUND(close, 2) AS close, ROUND(return_3m * 100, 1) AS return_3m_pct,\n       ROUND(turnover / 1000000.0, 0) AS turnover_m\nFROM s\nWHERE is_partial = FALSE AND months_n = 3 AND hits_3m >= {{min_hits}}\n  AND month = (SELECT MAX(month) FROM m_price_monthly WHERE market = {{market}} AND is_partial = FALSE)\n  AND turnover >= {{min_turnover_m}} * 1000000\nORDER BY hits_3m DESC, return_3m DESC\nLIMIT {{limit}}", "params": [{"name": "market", "label": "市場（JP＝日本株・US＝米国株）", "type": "string", "default": "JP"}, {"name": "min_hits", "label": "直近3か月で高値を更新した月数の下限（3＝3か月連続）", "type": "int", "default": 3, "min": 1, "max": 3}, {"name": "min_turnover_m", "label": "月間売買代金の下限（百万・現地通貨。日本株は百万円、米国株は百万ドル）", "type": "number", "default": 300, "min": 0, "max": 100000000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "ticker", "y": "return_3m_pct", "series": null}, "note": "月高値（日足の高値）が、それ以前の最大11か月分の月高値の最大を上回った月を「更新」とする（比べる月が3か月以上ある銘柄だけ）。日次の52週高値ではなく月単位の近似。履歴が約1年なので長期の高値は判定できない。直近の完了月で判定する。"}, {"id": "mkt_lowvol_high_dividend", "domain": "market", "title": "値動きの小さい高配当株", "question": "配当利回りが高く、月中の値動きの幅が小さい日本株はどこか", "mart": "m_screener", "sql": "WITH v AS (\n  SELECT ticker, COUNT(*) AS n_months, AVG(range_pct) AS avg_range, AVG(ABS(return_1m)) AS avg_abs_return\n  FROM m_price_monthly\n  WHERE market = 'JP' AND is_partial = FALSE AND range_pct IS NOT NULL AND return_1m IS NOT NULL\n  GROUP BY ticker\n  HAVING COUNT(*) >= {{min_months}}\n)\nSELECT s.sec_code4, s.name, s.industry, ROUND(s.dividend_yield * 100, 2) AS dividend_yield_pct, ROUND(v.avg_range * 100, 1) AS avg_month_range_pct,\n       ROUND(v.avg_abs_return * 100, 1) AS avg_abs_return_pct, v.n_months, ROUND(s.pbr, 2) AS pbr, s.market_cap_b\nFROM m_screener AS s\nJOIN v ON v.ticker = s.ticker\nWHERE s.dividend_yield >= {{min_yield_pct}} / 100 AND s.market_cap_b >= {{min_mcap_oku}}\nORDER BY v.avg_range\nLIMIT {{limit}}", "params": [{"name": "min_yield_pct", "label": "配当利回りの下限（%）", "type": "number", "default": 3, "min": 0, "max": 20}, {"name": "min_mcap_oku", "label": "時価総額の下限（億円）", "type": "number", "default": 300, "min": 0, "max": 1000000}, {"name": "min_months", "label": "値動きを測る月数の下限", "type": "int", "default": 6, "min": 1, "max": 14}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "scatter", "x": "avg_month_range_pct", "y": "dividend_yield_pct", "series": null}, "note": "値動きの小ささ＝完了月の「月高値÷月安値－1」の平均（avg_month_range_pct。標準偏差ではなく幅で代用）。配当利回りが高い銘柄ほど株価が急落中のこともあるので、dividend_yield_pct が15%超の異常値は m_screener 側で空になっている。分割調整漏れの疑いがある銘柄は月次側で履歴が短くなり除かれやすい。"}, {"id": "mkt_us_momentum", "domain": "market", "title": "米国株の騰落率上位（業種なし）", "question": "直近の完了月で6か月の騰落が大きい米国株はどこか（セクター分類なし・売買代金の下限付き）", "mart": "m_price_monthly", "sql": "SELECT ticker, name, ROUND(close, 2) AS close_usd, ROUND(return_1m * 100, 1) AS return_1m_pct, ROUND(return_3m * 100, 1) AS return_3m_pct,\n       ROUND(return_6m * 100, 1) AS return_6m_pct, ROUND(turnover / 1000000.0, 0) AS turnover_m_usd\nFROM m_price_monthly\nWHERE market = 'US' AND is_partial = FALSE AND return_6m IS NOT NULL\n  AND month = (SELECT MAX(month) FROM m_price_monthly WHERE market = 'US' AND is_partial = FALSE)\n  AND turnover >= {{min_turnover_m}} * 1000000 AND close >= {{min_price}}\nORDER BY return_6m DESC\nLIMIT {{limit}}", "params": [{"name": "min_turnover_m", "label": "月間売買代金の下限（百万ドル）", "type": "number", "default": 100, "min": 0, "max": 100000000}, {"name": "min_price", "label": "月末終値の下限（ドル。ペニー株を除く）", "type": "number", "default": 5, "min": 0, "max": 100000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "ticker", "y": "return_6m_pct", "series": null}, "note": "セクターは株価だけからは分からないため持たない。name は stock_snapshot にある約400銘柄だけで、他は空。通貨は米ドル。月末終値は分割調整済み・配当未調整。"}, {"id": "mkt_us_market_breadth_snapshot", "domain": "market", "title": "日米の市場の広がり（最新日）", "question": "いま日本株と米国株で、上がった銘柄・下がった銘柄・新高値・移動平均より上はどれくらいか", "mart": "m_market_breadth", "sql": "SELECT market, trade_date, n_stocks, n_up, n_down, ROUND(ad_ratio_25d, 1) AS ad_ratio_25d, n_new_high, n_new_low,\n       ROUND(pct_above_ma50 * 100, 1) AS above_ma50_pct, ROUND(pct_above_ma200 * 100, 1) AS above_ma200_pct\nFROM m_market_breadth\nWHERE is_complete = TRUE\n  AND trade_date = (SELECT MAX(b.trade_date) FROM m_market_breadth AS b WHERE b.market = m_market_breadth.market AND b.is_complete = TRUE)\nORDER BY market", "params": [], "chart": {"type": "table", "x": "market", "y": "n_up", "series": null}, "note": "市場ごとに、株価の取り込みが完了している最新の営業日の値（日本株と米国株で日付が違うことがある）。"}, {"id": "snap_ticker_history", "domain": "market", "title": "銘柄レポートの推移（日次）", "question": "この銘柄はスクリーナーで毎日どう評価されてきたか（過去の銘柄レポートの代わり）", "mart": "m_stock_snapshot", "sql": "SELECT snapshot_date, name, ROUND(composite_score, 1) AS composite_score, ROUND(technical_score, 1) AS technical_score,\n       ROUND(rsi14, 1) AS rsi14, current_price, ROUND(per, 1) AS per, ROUND(pbr, 2) AS pbr, ROUND(roe * 100, 1) AS roe_pct,\n       ROUND(week52_position_pct, 0) AS week52_position_pct, signal_text\nFROM m_stock_snapshot\nWHERE ticker = {{ticker}}\nORDER BY snapshot_date", "params": [{"name": "ticker", "label": "ティッカー（例 1418.T / AAPL）", "type": "string", "default": "1418.T"}], "chart": {"type": "line", "x": "snapshot_date", "y": ["composite_score", "technical_score", "rsi14"], "series": null}, "note": "銘柄レポート（md）の正本。md は最新だけ（detail_latest）になったので、過去の日の中身はここで見る。"}, {"id": "snap_rsi_forward", "domain": "market", "title": "RSI帯ごとのその後のリターン", "question": "スクリーナーを通った日の RSI の高さで、その後5日・20日の値動きはどう違うか", "mart": "m_stock_snapshot", "sql": "SELECT CASE WHEN rsi14 < 30 THEN '1 30未満' WHEN rsi14 < 50 THEN '2 30〜50' WHEN rsi14 < 70 THEN '3 50〜70' ELSE '4 70以上' END AS rsi_band,\n       COUNT(*) AS n, ROUND(AVG(fwd_return_5d) * 100, 2) AS avg_fwd_5d_pct, ROUND(AVG(fwd_return_20d) * 100, 2) AS avg_fwd_20d_pct,\n       ROUND(SUM(CASE WHEN fwd_return_20d > 0 THEN 1 ELSE 0 END) * 100.0 / NULLIF(SUM(CASE WHEN fwd_return_20d IS NOT NULL THEN 1 ELSE 0 END), 0), 0) AS win_rate_20d_pct\nFROM m_stock_snapshot\nWHERE market = {{market}} AND rsi14 IS NOT NULL AND fwd_return_5d IS NOT NULL\nGROUP BY rsi_band\nORDER BY rsi_band", "params": [{"name": "market", "label": "市場（JP / US）", "type": "string", "default": "JP"}], "chart": {"type": "bar", "x": "rsi_band", "y": ["avg_fwd_5d_pct", "avg_fwd_20d_pct"], "series": null}, "note": "同じ銘柄が何日も通過すると何度も数える（日ごとの記録のため）。リターンは終値ベース・配当なし。蓄積が短いうちは件数が少ない。"}, {"id": "snap_score_forward", "domain": "market", "title": "総合スコア帯ごとのその後のリターン", "question": "総合スコアが高い日に通過した銘柄ほど、その後よく上がっているか（スコアの事後検証）", "mart": "m_stock_snapshot", "sql": "SELECT CASE WHEN composite_score < 50 THEN '1 50未満' WHEN composite_score < 60 THEN '2 50〜60' WHEN composite_score < 70 THEN '3 60〜70' ELSE '4 70以上' END AS score_band,\n       COUNT(*) AS n, ROUND(AVG(fwd_return_5d) * 100, 2) AS avg_fwd_5d_pct, ROUND(AVG(fwd_return_20d) * 100, 2) AS avg_fwd_20d_pct\nFROM m_stock_snapshot\nWHERE market = {{market}} AND composite_score IS NOT NULL AND fwd_return_5d IS NOT NULL\nGROUP BY score_band\nORDER BY score_band", "params": [{"name": "market", "label": "市場（JP / US）", "type": "string", "default": "JP"}], "chart": {"type": "bar", "x": "score_band", "y": ["avg_fwd_5d_pct", "avg_fwd_20d_pct"], "series": null}, "note": "スコアの付け方が途中で変わった日をまたぐと比較がぶれる。"}, {"id": "snap_persistent_top", "domain": "market", "title": "上位に居座っている銘柄", "question": "直近N日のうち、総合スコアが高いまま何日も通過し続けている銘柄はどれか", "mart": "m_stock_snapshot", "sql": "SELECT ticker, MAX(name) AS name, COUNT(*) AS days_in_top, ROUND(AVG(composite_score), 1) AS avg_score,\n       MIN(snapshot_date) AS first_date, MAX(snapshot_date) AS last_date\nFROM m_stock_snapshot\nWHERE market = {{market}} AND composite_score >= {{min_score}}\n  AND snapshot_date >= (SELECT MAX(snapshot_date) FROM m_stock_snapshot) - {{days}}\nGROUP BY ticker\nHAVING COUNT(*) >= {{min_days}}\nORDER BY days_in_top DESC, avg_score DESC\nLIMIT 50", "params": [{"name": "market", "label": "市場（JP / US）", "type": "string", "default": "JP"}, {"name": "min_score", "label": "総合スコアの下限", "type": "number", "default": 70, "min": 0, "max": 100}, {"name": "days", "label": "遡る日数", "type": "int", "default": 60, "min": 7, "max": 365}, {"name": "min_days", "label": "通過日数の下限", "type": "int", "default": 10, "min": 1, "max": 365}], "chart": {"type": "bar", "x": "ticker", "y": "days_in_top", "series": null}, "note": "日付の引き算は DATE − 整数（両エンジンで日数を引く）。"}, {"id": "snap_new_entries", "domain": "market", "title": "最新日に初めて通過した銘柄", "question": "最新の日に、これまで一度も通っていなかった銘柄はどれか", "mart": "m_stock_snapshot", "sql": "SELECT s.ticker, s.name, s.sector_name, ROUND(s.composite_score, 1) AS composite_score, ROUND(s.rsi14, 1) AS rsi14, s.signal_text\nFROM m_stock_snapshot AS s\nWHERE s.market = {{market}} AND s.snapshot_date = (SELECT MAX(snapshot_date) FROM m_stock_snapshot)\n  AND NOT EXISTS (SELECT 1 FROM m_stock_snapshot AS o WHERE o.ticker = s.ticker AND o.snapshot_date < s.snapshot_date)\nORDER BY s.composite_score DESC", "params": [{"name": "market", "label": "市場（JP / US）", "type": "string", "default": "JP"}], "chart": {"type": "bar", "x": "ticker", "y": "composite_score", "series": null}, "note": "記録の始まり（2026-09-09）より前の通過は数えない。"}, {"id": "re_land_rise_top", "domain": "realestate", "title": "地価上昇率の高い市区町村", "question": "地価が最も上がっている市区町村はどこか", "mart": "m_re_area", "sql": "SELECT prefecture_name, municipality_name, land_price_yoy_change,\n       avg_land_price_commercial, avg_land_price_residential\nFROM m_re_area\nWHERE land_price_yoy_change IS NOT NULL\nORDER BY land_price_yoy_change DESC\nLIMIT {{top_n}}", "params": [{"name": "top_n", "label": "表示する市区町村数", "type": "int", "default": 20, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "municipality_name", "y": ["land_price_yoy_change"], "series": null}, "note": "前年比は％（5＝+5%）。地価は円/m2。"}, {"id": "re_land_fall_top", "domain": "realestate", "title": "地価下落率の大きい市区町村", "question": "地価が最も下がっている市区町村はどこか", "mart": "m_re_area", "sql": "SELECT prefecture_name, municipality_name, land_price_yoy_change,\n       avg_land_price_commercial, avg_land_price_residential\nFROM m_re_area\nWHERE land_price_yoy_change IS NOT NULL\nORDER BY land_price_yoy_change\nLIMIT {{top_n}}", "params": [{"name": "top_n", "label": "表示する市区町村数", "type": "int", "default": 20, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "municipality_name", "y": ["land_price_yoy_change"], "series": null}, "note": "前年比は％。地価が空の市区町村（取引が少ない）は含まれない。"}, {"id": "re_flood_high_price_high", "domain": "realestate", "title": "洪水リスクが高く地価も高い地域", "question": "地価が高いのに洪水リスクが高い地域はどこか", "mart": "m_re_area", "sql": "SELECT prefecture_name, municipality_name, flood_risk_area_pct, avg_land_price_commercial,\n       avg_land_price_residential, land_price_yoy_change\nFROM m_re_area\nWHERE flood_risk_area_pct >= {{min_flood}}\n  AND avg_land_price_commercial >= {{min_price}}\nORDER BY avg_land_price_commercial DESC\nLIMIT {{top_n}}", "params": [{"name": "min_flood", "label": "洪水リスク地域率の下限（0〜1）", "type": "number", "default": 0.3, "min": 0, "max": 1}, {"name": "min_price", "label": "商業地の平均地価の下限（円/m2）", "type": "int", "default": 100000, "min": 0, "max": 100000000}, {"name": "top_n", "label": "表示する市区町村数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "scatter", "x": "avg_land_price_commercial", "y": ["flood_risk_area_pct"], "series": null}, "note": "洪水リスク地域率は市区町村の面積に占める浸水想定区域の割合。0.3＝30%。"}, {"id": "re_pref_overview", "domain": "realestate", "title": "都道府県別の地価と洪水リスク", "question": "都道府県ごとの地価水準と上昇率・洪水リスクはどう違うか", "mart": "m_re_area", "sql": "SELECT prefecture_name, COUNT(*) AS municipalities,\n       ROUND(AVG(avg_land_price_commercial), 0) AS avg_commercial,\n       ROUND(AVG(avg_land_price_residential), 0) AS avg_residential,\n       ROUND(AVG(land_price_yoy_change), 2) AS avg_yoy_change,\n       ROUND(AVG(flood_risk_area_pct), 3) AS avg_flood\nFROM m_re_area\nGROUP BY prefecture_name\nORDER BY avg_commercial DESC", "params": [], "chart": {"type": "bar", "x": "prefecture_name", "y": ["avg_commercial"], "series": null}, "note": "市区町村の単純平均（面積や取引量で重み付けしない）。"}, {"id": "re_company_holdings", "domain": "realestate", "title": "企業の保有不動産（市区町村別）", "question": "この会社はどこにどれだけ土地を持ち、含み益の目安はいくらか", "mart": "m_re_holdings", "sql": "SELECT prefecture, municipality_name, facility_count, land_area_m2, book_value_land_m_yen,\n       land_value_est_m_yen, unrealized_gain_est_m_yen\nFROM m_re_holdings\nWHERE sec_code4 = {{sec_code4}}\n  AND fiscal_year = (SELECT MAX(fiscal_year) FROM m_re_holdings WHERE sec_code4 = {{sec_code4}})\nORDER BY book_value_land_m_yen DESC\nLIMIT {{top_n}}", "params": [{"name": "sec_code4", "label": "証券コード（4桁）", "type": "string", "default": "8267"}, {"name": "top_n", "label": "表示する市区町村数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "municipality_name", "y": ["book_value_land_m_yen", "land_value_est_m_yen"], "series": null}, "note": "簿価・時価の目安は百万円。時価の目安は面積×参照地価（工業地→商業地→住宅地の順）で、施設の実勢価格ではない。簿価の20倍を超える施設は紐づけ違いの疑いで除外（est_excluded_count）。"}, {"id": "re_company_land_trend", "domain": "realestate", "title": "会社の土地簿価と時価目安の推移", "question": "この会社の保有土地の簿価と時価の目安は年度でどう変わったか", "mart": "m_re_holdings_pref", "sql": "SELECT fiscal_year, name, SUM(book_value_land_m_yen) AS book_value_land_m_yen,\n       SUM(land_value_est_m_yen) AS land_value_est_m_yen,\n       SUM(unrealized_gain_est_m_yen) AS unrealized_gain_est_m_yen\nFROM m_re_holdings_pref\nWHERE sec_code4 = {{sec_code4}}\nGROUP BY fiscal_year, name\nORDER BY fiscal_year", "params": [{"name": "sec_code4", "label": "証券コード（4桁）", "type": "string", "default": "8267"}], "chart": {"type": "line", "x": "fiscal_year", "y": ["book_value_land_m_yen", "land_value_est_m_yen"], "series": null}, "note": "年度ごとに開示される施設の範囲が変わるため、増減は保有の変化と開示の変化の両方を含む。"}, {"id": "re_unrealized_gain_ranking", "domain": "realestate", "title": "土地の含み益の目安が大きい会社", "question": "保有土地の時価の目安が簿価を大きく上回る会社はどこか", "mart": "m_re_holdings_pref", "sql": "SELECT name, sec_code4, SUM(book_value_land_m_yen) AS book_value_land_m_yen,\n       SUM(land_value_est_m_yen) AS land_value_est_m_yen,\n       SUM(unrealized_gain_est_m_yen) AS unrealized_gain_est_m_yen\nFROM m_re_holdings_pref\nWHERE fiscal_year = {{fiscal_year}}\n  AND name IS NOT NULL\nGROUP BY name, sec_code4\nORDER BY unrealized_gain_est_m_yen DESC\nLIMIT {{top_n}}", "params": [{"name": "fiscal_year", "label": "年度（決算期末の年）", "type": "int", "default": 2025, "min": 2015, "max": 2035}, {"name": "top_n", "label": "表示する会社数", "type": "int", "default": 20, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "name", "y": ["unrealized_gain_est_m_yen"], "series": null}, "note": "概算。簿価の20倍を超える施設は紐づけ違いの疑いで除いてあるが、敷地面積が複数施設・複数社で重複計上される場合や参照地価が実態と離れる場合は残るため、極端な値は個別に確認する。"}, {"id": "re_depopulation_holders", "domain": "realestate", "title": "人口減少地域に不動産が多い会社", "question": "2050年までに人口が大きく減る地域に施設を多く持つ会社はどこか", "mart": "m_re_holdings", "sql": "SELECT name, sec_code4, SUM(facility_count) AS facilities, COUNT(*) AS municipalities,\n       SUM(book_value_land_m_yen) AS book_value_land_m_yen\nFROM m_re_holdings\nWHERE fiscal_year = {{fiscal_year}}\n  AND population_change_pct <= {{max_change}}\n  AND name IS NOT NULL\nGROUP BY name, sec_code4\nORDER BY facilities DESC\nLIMIT {{top_n}}", "params": [{"name": "fiscal_year", "label": "年度（決算期末の年）", "type": "int", "default": 2025, "min": 2015, "max": 2035}, {"name": "max_change", "label": "人口増減の上限（％。-30＝30%以上減る地域）", "type": "number", "default": -30, "min": -100, "max": 100}, {"name": "top_n", "label": "表示する会社数", "type": "int", "default": 20, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "name", "y": ["facilities"], "series": null}, "note": "人口増減は市区町村の現在から2050年までの推計（％）。施設数は開示された施設の数。"}, {"id": "re_pref_holdings", "domain": "realestate", "title": "都道府県別の保有不動産", "question": "どの都道府県に企業の土地が集中しているか", "mart": "m_re_holdings_pref", "sql": "SELECT prefecture, COUNT(*) AS company_years, SUM(facility_count) AS facilities,\n       SUM(book_value_land_m_yen) AS book_value_land_m_yen,\n       SUM(land_value_est_m_yen) AS land_value_est_m_yen,\n       SUM(unrealized_gain_est_m_yen) AS unrealized_gain_est_m_yen\nFROM m_re_holdings_pref\nWHERE fiscal_year = {{fiscal_year}}\nGROUP BY prefecture\nORDER BY book_value_land_m_yen DESC", "params": [{"name": "fiscal_year", "label": "年度（決算期末の年）", "type": "int", "default": 2025, "min": 2015, "max": 2035}], "chart": {"type": "bar", "x": "prefecture", "y": ["book_value_land_m_yen", "land_value_est_m_yen"], "series": null}, "note": "company_years ＝ その都道府県に開示のある会社の数（1社1行）。金額は百万円。"}, {"id": "re_company_prefectures", "domain": "realestate", "title": "ある会社の都道府県別保有", "question": "この会社の土地はどの都道府県に偏っているか", "mart": "m_re_holdings_pref", "sql": "SELECT prefecture, facility_count, land_area_m2, book_value_land_m_yen, land_value_est_m_yen,\n       unrealized_gain_est_m_yen, population_change_pct, flood_risk_area_pct\nFROM m_re_holdings_pref\nWHERE sec_code4 = {{sec_code4}}\n  AND fiscal_year = (SELECT MAX(fiscal_year) FROM m_re_holdings_pref WHERE sec_code4 = {{sec_code4}})\nORDER BY book_value_land_m_yen DESC", "params": [{"name": "sec_code4", "label": "証券コード（4桁）", "type": "string", "default": "8267"}], "chart": {"type": "bar", "x": "prefecture", "y": ["book_value_land_m_yen", "land_value_est_m_yen"], "series": null}, "note": "人口増減・洪水リスクは市区町村値の単純平均。最新の開示年度で表示する。"}, {"id": "re_flood_exposed_holders", "domain": "realestate", "title": "洪水リスクが高い地域に土地を持つ会社", "question": "浸水想定区域の広い地域に多くの土地簿価を持つ会社はどこか", "mart": "m_re_holdings", "sql": "SELECT name, sec_code4, COUNT(*) AS municipalities, SUM(facility_count) AS facilities,\n       SUM(book_value_land_m_yen) AS book_value_land_m_yen\nFROM m_re_holdings\nWHERE fiscal_year = {{fiscal_year}}\n  AND flood_risk_area_pct >= {{min_flood}}\n  AND name IS NOT NULL\nGROUP BY name, sec_code4\nORDER BY book_value_land_m_yen DESC\nLIMIT {{top_n}}", "params": [{"name": "fiscal_year", "label": "年度（決算期末の年）", "type": "int", "default": 2025, "min": 2015, "max": 2035}, {"name": "min_flood", "label": "洪水リスク地域率の下限（0〜1）", "type": "number", "default": 0.5, "min": 0, "max": 1}, {"name": "top_n", "label": "表示する会社数", "type": "int", "default": 20, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "name", "y": ["book_value_land_m_yen"], "series": null}, "note": "地域率は市区町村全体の値で、施設そのものが浸水想定区域にあるとは限らない。"}, {"id": "arxiv_latest_ideas", "domain": "research", "title": "最近の投資アイデア候補の論文", "question": "直近N日に取得した論文のうち、点数が高いものは何か（日本語タイトルつき）", "mart": "m_arxiv_papers", "sql": "SELECT fetched_date, investment_score, COALESCE(title_ja, title) AS title_ja_or_en, title, keywords, primary_category, url\nFROM m_arxiv_papers\nWHERE fetched_date >= (SELECT MAX(fetched_date) FROM m_arxiv_papers) - {{days}} AND investment_score >= {{min_score}}\nORDER BY investment_score DESC, fetched_date DESC\nLIMIT {{limit}}", "params": [{"name": "days", "label": "遡る日数", "type": "int", "default": 30, "min": 0, "max": 3650}, {"name": "min_score", "label": "点数の下限", "type": "int", "default": 3, "min": 0, "max": 100}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "table", "x": "title_ja_or_en", "y": "investment_score", "series": null}, "note": "title_ja は DeepL 無料枠の訳（無いときは英語）。url から arXiv の本文へ。"}, {"id": "arxiv_search", "domain": "research", "title": "論文をキーワードで探す", "question": "題名か要旨にある言葉を含む論文はどれか", "mart": "m_arxiv_papers", "sql": "SELECT fetched_date, investment_score, COALESCE(title_ja, title) AS title_ja_or_en, keywords, primary_category, url\nFROM m_arxiv_papers\nWHERE title LIKE {{pattern}} OR summary LIKE {{pattern}} OR title_ja LIKE {{pattern}}\nORDER BY fetched_date DESC, investment_score DESC\nLIMIT {{limit}}", "params": [{"name": "pattern", "label": "探す言葉（% で前後を囲む・英語は大文字小文字を区別）", "type": "string", "default": "%volatility%"}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "table", "x": "title_ja_or_en", "y": "investment_score", "series": null}, "note": "英語の題名・要旨と日本語タイトルの両方を探す。過去の md から取り込んだ回（2026-10-11 より前）は要旨が候補の論文にしか無い。"}, {"id": "arxiv_weekly_counts", "domain": "research", "title": "取得回ごとの論文数と候補数", "question": "毎回何本の論文が入り、そのうち投資アイデア候補は何本か", "mart": "m_arxiv_papers", "sql": "SELECT fetched_date, COUNT(*) AS papers, SUM(CASE WHEN is_idea THEN 1 ELSE 0 END) AS ideas, ROUND(AVG(investment_score), 2) AS avg_score\nFROM m_arxiv_papers\nGROUP BY fetched_date\nORDER BY fetched_date", "params": [], "chart": {"type": "bar", "x": "fetched_date", "y": ["papers", "ideas"], "series": null}, "note": "取得は週1回（arxiv_monitor）。"}, {"id": "arxiv_category_score", "domain": "research", "title": "カテゴリ別の論文数と点数", "question": "どの分野（q-fin.PM・q-fin.TR など）から投資アイデアになりそうな論文が多く出ているか", "mart": "m_arxiv_papers", "sql": "SELECT primary_category, COUNT(*) AS papers, SUM(CASE WHEN is_idea THEN 1 ELSE 0 END) AS ideas, ROUND(AVG(investment_score), 2) AS avg_score\nFROM m_arxiv_papers\nWHERE fetched_date >= (SELECT MAX(fetched_date) FROM m_arxiv_papers) - {{days}}\nGROUP BY primary_category\nORDER BY ideas DESC, papers DESC", "params": [{"name": "days", "label": "遡る日数", "type": "int", "default": 180, "min": 0, "max": 3650}], "chart": {"type": "bar", "x": "primary_category", "y": ["papers", "ideas"], "series": null}, "note": "q-fin.PM＝ポートフォリオ、TR＝売買、ST＝統計、RM＝リスク管理、econ.EM＝計量経済。"}, {"id": "arxiv_keyword_top", "domain": "research", "title": "よく当たるキーワード", "question": "直近N日の論文で、採点キーワードのどれが多く出ているか", "mart": "m_arxiv_keywords", "sql": "SELECT keyword, COUNT(*) AS papers, SUM(CASE WHEN is_idea THEN 1 ELSE 0 END) AS ideas, ROUND(AVG(investment_score), 2) AS avg_score\nFROM m_arxiv_keywords\nWHERE fetched_date >= (SELECT MAX(fetched_date) FROM m_arxiv_keywords) - {{days}}\nGROUP BY keyword\nORDER BY papers DESC\nLIMIT {{limit}}", "params": [{"name": "days", "label": "遡る日数", "type": "int", "default": 90, "min": 0, "max": 3650}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "keyword", "y": "papers", "series": null}, "note": "キーワードは config.py の ARXIV_KEYWORDS。"}, {"id": "arxiv_keyword_trend", "domain": "research", "title": "キーワードの月ごとの件数", "question": "あるキーワードを含む論文は月ごとに増えているか", "mart": "m_arxiv_keywords", "sql": "SELECT fetched_month, keyword, COUNT(*) AS papers\nFROM m_arxiv_keywords\nWHERE keyword LIKE {{pattern}}\nGROUP BY fetched_month, keyword\nORDER BY fetched_month, papers DESC", "params": [{"name": "pattern", "label": "キーワード（% で前後を囲む）", "type": "string", "default": "%risk%"}], "chart": {"type": "line", "x": "fetched_month", "y": "papers", "series": "keyword"}, "note": ""}, {"id": "arxiv_paper_detail", "domain": "research", "title": "論文1本の中身", "question": "この論文（arXiv ID）の要旨・著者・点数の内訳は", "mart": "m_arxiv_papers", "sql": "SELECT paper_id, fetched_date, published_date, investment_score, title, title_ja, authors, categories, keywords, summary, url\nFROM m_arxiv_papers\nWHERE paper_id = {{paper_id}}", "params": [{"name": "paper_id", "label": "arXiv ID（例 2610.03369）", "type": "string", "default": "2610.03369"}], "chart": {"type": "table", "x": "title", "y": "investment_score", "series": null}, "note": ""}, {"id": "scr_value_dividend", "domain": "screener", "title": "割安高配当", "question": "PBRが低く配当利回りが高い会社はどこか（株価のある会社だけ）", "mart": "m_screener", "sql": "SELECT sec_code4, name, industry, current_price,\n       ROUND(pbr, 2) AS pbr, ROUND(per, 1) AS per, ROUND(dividend_yield * 100, 2) AS dividend_yield_pct,\n       ROUND(payout_ratio * 100, 0) AS payout_ratio_pct, market_cap_b\nFROM m_screener\nWHERE pbr > 0 AND pbr < {{max_pbr}}\n  AND dividend_yield > {{min_yield_pct}} / 100\n  AND market_cap_b >= {{min_mcap_oku}}\n  AND (payout_ratio IS NULL OR payout_ratio <= {{max_payout_pct}} / 100)\nORDER BY dividend_yield DESC\nLIMIT {{limit}}", "params": [{"name": "max_pbr", "label": "PBR の上限（倍）", "type": "number", "default": 1, "min": 0.1, "max": 10}, {"name": "min_yield_pct", "label": "配当利回りの下限（%）", "type": "number", "default": 3, "min": 0, "max": 20}, {"name": "min_mcap_oku", "label": "時価総額の下限（億円）", "type": "number", "default": 100, "min": 0, "max": 1000000}, {"name": "max_payout_pct", "label": "配当性向の上限（%・不明は除かない）", "type": "number", "default": 100, "min": 0, "max": 1000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "name", "y": "dividend_yield_pct", "series": null}, "note": "株価のある会社（price_source が price_daily。全上場が対象）だけが対象。PER が意味を持たない会社（valuation_flag）は per が空。配当性向が高すぎる会社は減配リスクがあるので上限で外せる。市場全体ではない点に注意。"}, {"id": "scr_high_roe_low_per", "domain": "screener", "title": "高ROE×低PER", "question": "ROEが高いのにPERが低い（収益力の割に安い）会社はどこか", "mart": "m_screener", "sql": "SELECT sec_code4, name, industry, current_price,\n       ROUND(roe * 100, 1) AS roe_pct, ROUND(per, 1) AS per, ROUND(pbr, 2) AS pbr,\n       ROUND(operating_margin * 100, 1) AS operating_margin_pct, market_cap_b\nFROM m_screener\nWHERE roe >= {{min_roe_pct}} / 100 AND roe <= 1\n  AND per > 0 AND per <= {{max_per}}\n  AND market_cap_b >= {{min_mcap_oku}}\nORDER BY roe DESC\nLIMIT {{limit}}", "params": [{"name": "min_roe_pct", "label": "ROE の下限（%）", "type": "number", "default": 12, "min": 0, "max": 100}, {"name": "max_per", "label": "PER の上限（倍）", "type": "number", "default": 12, "min": 1, "max": 100}, {"name": "min_mcap_oku", "label": "時価総額の下限（億円）", "type": "number", "default": 100, "min": 0, "max": 1000000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "scatter", "x": "per", "y": "roe_pct", "series": null}, "note": "ROE は最新の通期（財務表）、PER は 最新終値÷EPS。ROE が100%を超える外れ値は除く。株価のある全上場が対象。"}, {"id": "scr_growth_small_cap", "domain": "screener", "title": "増収増益の小型株", "question": "売上も営業利益も純利益も前年を上回っている小型株はどこか", "mart": "m_screener", "sql": "SELECT sec_code4, name, industry, market_cap_b,\n       ROUND(sales_growth_1y * 100, 1) AS sales_growth_pct, ROUND(op_income_growth_1y * 100, 1) AS op_income_growth_pct,\n       ROUND(net_income_growth_1y * 100, 1) AS net_income_growth_pct,\n       ROUND(per, 1) AS per, ROUND(operating_margin * 100, 1) AS operating_margin_pct\nFROM m_screener\nWHERE sales_growth_1y > 0 AND op_income_growth_1y > 0 AND net_income_growth_1y > 0\n  AND market_cap_b >= {{min_mcap_oku}} AND market_cap_b <= {{max_mcap_oku}}\nORDER BY op_income_growth_1y DESC\nLIMIT {{limit}}", "params": [{"name": "min_mcap_oku", "label": "時価総額の下限（億円）", "type": "number", "default": 50, "min": 0, "max": 1000000}, {"name": "max_mcap_oku", "label": "時価総額の上限（億円）", "type": "number", "default": 1000, "min": 1, "max": 10000000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "name", "y": "op_income_growth_pct", "series": null}, "note": "前年値が黒字の会社だけが成長率の対象（赤字からの回復は除く）。前年の年度が財務表に無い会社も除く。株価のある全上場が対象。"}, {"id": "scr_net_cash_value", "domain": "screener", "title": "ネットキャッシュが厚い割安株", "question": "時価総額に対して現金が有利子負債を大きく上回る（ネットキャッシュ比率が高い）割安株はどこか", "mart": "m_screener", "sql": "SELECT sec_code4, name, industry, market_cap_b,\n       ROUND(net_cash_to_mcap * 100, 1) AS net_cash_to_mcap_pct, ROUND(pbr, 2) AS pbr, ROUND(per, 1) AS per,\n       ROUND(equity_ratio * 100, 1) AS equity_ratio_pct, interest_bearing_debt_basis\nFROM m_screener\nWHERE net_cash_to_mcap >= {{min_ratio_pct}} / 100\n  AND pbr > 0 AND pbr <= {{max_pbr}}\n  AND market_cap_b >= {{min_mcap_oku}}\nORDER BY net_cash_to_mcap DESC\nLIMIT {{limit}}", "params": [{"name": "min_ratio_pct", "label": "ネットキャッシュ÷時価総額の下限（%）", "type": "number", "default": 30, "min": 0, "max": 1000}, {"name": "max_pbr", "label": "PBR の上限（倍）", "type": "number", "default": 1.5, "min": 0.1, "max": 10}, {"name": "min_mcap_oku", "label": "時価総額の下限（億円）", "type": "number", "default": 50, "min": 0, "max": 1000000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "name", "y": "net_cash_to_mcap_pct", "series": null}, "note": "ネットキャッシュ＝現金及び現金同等物−有利子負債（円）。有利子負債は報告値、無ければ借入金・社債・CPの合計（interest_bearing_debt_basis が estimated・リース負債は含まない概算）。銀行・保険など金融業は預金等が有利子負債に入らず現金が過大になるので、業種で除いて読む。株価のある全上場が対象。"}, {"id": "scr_high_growth_cagr", "domain": "screener", "title": "高成長（売上3年CAGR上位）", "question": "売上高の3年平均成長率（CAGR）が高い会社はどこか", "mart": "m_screener", "sql": "SELECT sec_code4, name, industry, fiscal_year,\n       ROUND(sales_cagr_3y * 100, 1) AS sales_cagr_3y_pct, ROUND(sales_growth_1y * 100, 1) AS sales_growth_pct,\n       ROUND(operating_margin * 100, 1) AS operating_margin_pct, net_sales\nFROM m_screener\nWHERE sales_cagr_3y IS NOT NULL\n  AND net_sales >= {{min_sales_oku}} * 100000000.0\n  AND operating_margin >= {{min_opm_pct}} / 100\nORDER BY sales_cagr_3y DESC\nLIMIT {{limit}}", "params": [{"name": "min_sales_oku", "label": "売上高の下限（億円）", "type": "number", "default": 100, "min": 0, "max": 10000000}, {"name": "min_opm_pct", "label": "営業利益率の下限（%）", "type": "number", "default": 5, "min": -100, "max": 100}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "name", "y": "sales_cagr_3y_pct", "series": null}, "note": "売上の最新年度と、ちょうど3年前の年度の値から計算。M&Aによる増収も含む。株価は不要で、財務のある全上場が対象。"}, {"id": "scr_rnd_intensive", "domain": "screener", "title": "研究開発型", "question": "売上に対する研究開発費の比率が高い会社はどこか", "mart": "m_screener", "sql": "SELECT sec_code4, name, industry, ROUND(rnd_ratio * 100, 1) AS rnd_ratio_pct,\n       ROUND(operating_margin * 100, 1) AS operating_margin_pct, ROUND(gross_margin * 100, 1) AS gross_margin_pct,\n       net_sales, employees\nFROM m_screener\nWHERE rnd_ratio >= {{min_rnd_pct}} / 100 AND rnd_ratio <= 1\n  AND net_sales >= {{min_sales_oku}} * 100000000.0\nORDER BY rnd_ratio DESC\nLIMIT {{limit}}", "params": [{"name": "min_rnd_pct", "label": "研究開発費率の下限（%）", "type": "number", "default": 8, "min": 0, "max": 100}, {"name": "min_sales_oku", "label": "売上高の下限（億円）", "type": "number", "default": 100, "min": 0, "max": 10000000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "name", "y": "rnd_ratio_pct", "series": null}, "note": "研究開発費を開示している会社（約2,000社）だけが対象。開示が無い会社は『研究開発をしていない』のではなく空欄。全上場が対象で株価は不要。"}, {"id": "scr_near_52w_high", "domain": "screener", "title": "52週高値圏の好業績", "question": "52週高値圏にあって、利益率とROEも高い会社はどこか", "mart": "m_screener", "sql": "SELECT sec_code4, name, industry, current_price, ROUND(week52_position_pct, 0) AS week52_position_pct,\n       ROUND(rsi14, 0) AS rsi14, ROUND(return_3m * 100, 1) AS return_3m_pct, ROUND(operating_margin * 100, 1) AS operating_margin_pct, ROUND(roe * 100, 1) AS roe_pct,\n       ROUND(sales_growth_1y * 100, 1) AS sales_growth_pct, price_date\nFROM m_screener\nWHERE week52_position_pct >= {{min_position}}\n  AND operating_margin >= {{min_opm_pct}} / 100\n  AND roe >= {{min_roe_pct}} / 100\nORDER BY week52_position_pct DESC, roe DESC\nLIMIT {{limit}}", "params": [{"name": "min_position", "label": "52週レンジ内の位置の下限（0〜100・100が高値）", "type": "number", "default": 90, "min": 0, "max": 100}, {"name": "min_opm_pct", "label": "営業利益率の下限（%）", "type": "number", "default": 8, "min": -100, "max": 100}, {"name": "min_roe_pct", "label": "ROE の下限（%）", "type": "number", "default": 10, "min": -100, "max": 100}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "scatter", "x": "week52_position_pct", "y": "roe_pct", "series": null}, "note": "52週位置は終値ベースの直近252営業日（履歴120営業日未満は空）で全上場が対象。RSI は snapshot の技術指標が入っている会社だけ値があり、無い会社は空欄で表に出る。分割の調整漏れが疑われる銘柄（price_break_date あり）は break 以降の終値だけで計算している。"}, {"id": "scr_composite_top", "domain": "screener", "title": "総合スコア上位", "question": "総合スコア（composite_score）の高い会社はどこか（割安・質のスコア付き）", "mart": "m_screener", "sql": "SELECT sec_code4, name, industry, ROUND(composite_score, 1) AS composite_score,\n       ROUND(value_score, 1) AS value_score, ROUND(quality_score, 1) AS quality_score,\n       ROUND(per, 1) AS per, ROUND(pbr, 2) AS pbr, ROUND(dividend_yield * 100, 2) AS dividend_yield_pct, market_cap_b\nFROM m_screener\nWHERE composite_score >= {{min_score}}\n  AND market_cap_b >= {{min_mcap_oku}}\nORDER BY composite_score DESC\nLIMIT {{limit}}", "params": [{"name": "min_score", "label": "総合スコアの下限（0〜100）", "type": "number", "default": 60, "min": 0, "max": 100}, {"name": "min_mcap_oku", "label": "時価総額の下限（億円）", "type": "number", "default": 100, "min": 0, "max": 1000000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "name", "y": "composite_score", "series": null}, "note": "スコアはスナップショットを作る日次処理の算出値で、対象はスコアのある約440社。スコア自体の作り方は SPEC_core.md を参照。株価・PER・PBR は株価系（最新終値ベース）。"}, {"id": "scr_momentum_3m", "domain": "screener", "title": "3か月騰落率の上位", "question": "直近3か月で株価が大きく上がった会社はどこか（流動性と時価総額の下限付き）", "mart": "m_screener", "sql": "SELECT sec_code4, name, industry, current_price,\n       ROUND(return_1m * 100, 1) AS return_1m_pct, ROUND(return_3m * 100, 1) AS return_3m_pct, ROUND(return_1y * 100, 1) AS return_1y_pct,\n       ROUND(week52_position_pct, 0) AS week52_position_pct, market_cap_b\nFROM m_screener\nWHERE return_3m IS NOT NULL\n  AND market_cap_b >= {{min_mcap_oku}}\n  AND avg_turnover_20d >= {{min_turnover_oku}} * 100000000.0\nORDER BY return_3m DESC\nLIMIT {{limit}}", "params": [{"name": "min_mcap_oku", "label": "時価総額の下限（億円）", "type": "number", "default": 100, "min": 0, "max": 1000000}, {"name": "min_turnover_oku", "label": "20日平均売買代金の下限（億円）", "type": "number", "default": 1, "min": 0, "max": 100000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "name", "y": "return_3m_pct", "series": null}, "note": "騰落率は終値ベースで63営業日前との比。終値は分割調整済み・配当未調整。株価履歴が約400日分なので return_1y は足りない会社で空。分割の調整漏れ（price_break_date あり）の銘柄は break 以降だけで計算するため騰落率が空になりやすい。"}, {"id": "scr_liquid_cheap", "domain": "screener", "title": "売買代金が大きい割安株", "question": "売買代金が十分あって、PERもPBRも低い会社はどこか", "mart": "m_screener", "sql": "SELECT sec_code4, name, industry, current_price, ROUND(per, 1) AS per, ROUND(pbr, 2) AS pbr,\n       ROUND(avg_turnover_20d / 100000000.0, 1) AS turnover_oku, ROUND(return_3m * 100, 1) AS return_3m_pct, market_cap_b\nFROM m_screener\nWHERE per > 0 AND per <= {{max_per}}\n  AND pbr > 0 AND pbr <= {{max_pbr}}\n  AND avg_turnover_20d >= {{min_turnover_oku}} * 100000000.0\nORDER BY avg_turnover_20d DESC\nLIMIT {{limit}}", "params": [{"name": "max_per", "label": "PER の上限（倍）", "type": "number", "default": 15, "min": 1, "max": 100}, {"name": "max_pbr", "label": "PBR の上限（倍）", "type": "number", "default": 1.2, "min": 0.1, "max": 10}, {"name": "min_turnover_oku", "label": "20日平均売買代金の下限（億円）", "type": "number", "default": 5, "min": 0, "max": 100000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "scatter", "x": "per", "y": "turnover_oku", "series": null}, "note": "平均売買代金は直近20営業日の 終値×出来高 の平均（15営業日分未満は空）。出来高は取引所合計に近い値だが、代金は終値で概算したもの。"}, {"id": "scr_roic_cheap", "domain": "screener", "title": "高ROIC×EV/EBITDA割安", "question": "資本効率（ROIC）が高いのに、企業価値がEBITDAの何倍かで見て安い会社はどこか", "mart": "m_screener", "sql": "SELECT sec_code4, name, industry, market_cap_b,\n       ROUND(roic * 100, 1) AS roic_pct, roic_tax_basis, ROUND(ev_ebitda, 1) AS ev_ebitda,\n       ROUND(operating_margin * 100, 1) AS operating_margin_pct, ROUND(per, 1) AS per, ROUND(pbr, 2) AS pbr\nFROM m_screener\nWHERE roic >= {{min_roic_pct}} / 100 AND ev_ebitda > 0 AND ev_ebitda <= {{max_ev_ebitda}}\n  AND market_cap_b >= {{min_mcap_oku}}\nORDER BY roic / ev_ebitda DESC\nLIMIT {{limit}}", "params": [{"name": "min_roic_pct", "label": "ROIC の下限（%）", "type": "number", "default": 10, "min": -100, "max": 200}, {"name": "max_ev_ebitda", "label": "EV/EBITDA の上限（倍）", "type": "number", "default": 8, "min": 0.5, "max": 100}, {"name": "min_mcap_oku", "label": "時価総額の下限（億円）", "type": "number", "default": 100, "min": 0, "max": 1000000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "scatter", "x": "ev_ebitda", "y": "roic_pct", "series": null}, "note": "ROIC＝営業利益×(1−税率)÷(有利子負債＋純資産)。税率は報告値（5〜50%）が無ければ30.6%（roic_tax_basis='assumed'）。EV＝時価総額＋有利子負債−現金。金融業はEVの意味が薄いので注意。並びは ROIC÷EV/EBITDA の大きい順。"}, {"id": "scr_land_gain_value", "domain": "screener", "title": "土地含み益に対して株価が安い", "question": "土地の含み益（目安）が時価総額に比べて大きい会社はどこか", "mart": "m_screener", "sql": "SELECT sec_code4, name, industry, market_cap_b,\n       ROUND(re_unrealized_gain / 1e8, 0) AS land_gain_oku, ROUND(re_gain_to_mcap * 100, 0) AS gain_to_mcap_pct,\n       ROUND(pbr, 2) AS pbr, ROUND(adj_pbr, 2) AS adj_pbr, ROUND(asset_value_ratio, 2) AS asset_value_ratio,\n       re_facility_count, re_fiscal_year\nFROM m_screener\nWHERE re_gain_to_mcap >= {{min_gain_pct}} / 100 AND re_gain_flag IS NULL\n  AND market_cap_b >= {{min_mcap_oku}}\nORDER BY re_gain_to_mcap DESC\nLIMIT {{limit}}", "params": [{"name": "min_gain_pct", "label": "含み益÷時価総額の下限（%）", "type": "number", "default": 30, "min": 0, "max": 1000}, {"name": "min_mcap_oku", "label": "時価総額の下限（億円）", "type": "number", "default": 100, "min": 0, "max": 1000000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "name", "y": "gain_to_mcap_pct", "series": null}, "note": "含み益は有報の主要設備の土地簿価と、所在地の地価から作った時価目安の差（目安。個別確認が必要）。修正PBR＝時価総額÷(純資産＋含み益×(1−30.6%))。資産バリュー倍率＝(ネットキャッシュ＋税引後含み益)÷時価総額（1超は時価総額より資産の裏付けが大きい）。含み益が時価総額の3倍超は単位違い等の疑いで除外（re_gain_flag）。"}, {"id": "scr_asset_value", "domain": "screener", "title": "資産バリュー（ネットキャッシュ＋含み益）", "question": "ネットキャッシュと税引後の土地含み益の合計が時価総額を上回る会社はどこか", "mart": "m_screener", "sql": "SELECT sec_code4, name, industry, market_cap_b,\n       ROUND(asset_value_ratio, 2) AS asset_value_ratio, ROUND(net_cash / 1e8, 0) AS net_cash_oku,\n       ROUND(re_gain_after_tax / 1e8, 0) AS land_gain_after_tax_oku, ROUND(adj_pbr, 2) AS adj_pbr, ROUND(per, 1) AS per\nFROM m_screener\nWHERE asset_value_ratio >= {{min_ratio}} AND market_cap_b >= {{min_mcap_oku}}\nORDER BY asset_value_ratio DESC\nLIMIT {{limit}}", "params": [{"name": "min_ratio", "label": "資産バリュー倍率の下限（倍）", "type": "number", "default": 1, "min": 0, "max": 50}, {"name": "min_mcap_oku", "label": "時価総額の下限（億円）", "type": "number", "default": 100, "min": 0, "max": 1000000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "name", "y": "asset_value_ratio", "series": null}, "note": "土地含み益のある会社（主要設備の土地簿価が有報にある会社）だけが対象。含み益は目安。"}, {"id": "scr_fcf_payout", "domain": "screener", "title": "FCF利回り×総還元利回り", "question": "フリーCF利回りが高く、配当と自社株買いで株主に多く返している会社はどこか", "mart": "m_screener", "sql": "SELECT sec_code4, name, industry, market_cap_b,\n       ROUND(fcf_yield * 100, 1) AS fcf_yield_pct, ROUND(total_payout_yield * 100, 1) AS total_payout_yield_pct,\n       ROUND(dividend_yield * 100, 2) AS dividend_yield_pct, ROUND(buyback_yield * 100, 2) AS buyback_yield_pct,\n       ROUND(doe * 100, 1) AS doe_pct, ROUND(per, 1) AS per\nFROM m_screener\nWHERE fcf_yield >= {{min_fcf_yield_pct}} / 100 AND total_payout_yield >= {{min_payout_pct}} / 100\n  AND market_cap_b >= {{min_mcap_oku}}\nORDER BY total_payout_yield DESC\nLIMIT {{limit}}", "params": [{"name": "min_fcf_yield_pct", "label": "FCF利回りの下限（%）", "type": "number", "default": 6, "min": -100, "max": 100}, {"name": "min_payout_pct", "label": "総還元利回りの下限（%）", "type": "number", "default": 4, "min": 0, "max": 100}, {"name": "min_mcap_oku", "label": "時価総額の下限（億円）", "type": "number", "default": 100, "min": 0, "max": 1000000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "scatter", "x": "fcf_yield_pct", "y": "total_payout_yield_pct", "series": null}, "note": "FCF＝営業CF−設備投資。総還元＝配当支払額＋自社株買い推定（自己株式簿価の増加＋消却額。下限寄り）。DOE＝配当支払額÷純資産。"}, {"id": "scr_quality_fscore", "domain": "screener", "title": "財務の質（Fスコア・安全性）", "question": "ピオトロスキーFスコアが高く、利払い余力と流動性が十分で、利益の質も良い会社はどこか", "mart": "m_screener", "sql": "SELECT sec_code4, name, industry, market_cap_b,\n       f_score, f_score_items, ROUND(interest_coverage, 1) AS interest_coverage, ROUND(current_ratio, 2) AS current_ratio,\n       ROUND(accrual_ratio * 100, 1) AS accrual_pct, ROUND(goodwill_to_equity * 100, 0) AS goodwill_to_equity_pct,\n       ROUND(pbr, 2) AS pbr, ROUND(per, 1) AS per\nFROM m_screener\nWHERE f_score >= {{min_f_score}}\n  AND (interest_coverage IS NULL OR interest_coverage >= {{min_icr}})\n  AND current_ratio >= {{min_current_ratio}}\n  AND accrual_ratio <= 0\n  AND market_cap_b >= {{min_mcap_oku}}\nORDER BY f_score DESC, pbr ASC\nLIMIT {{limit}}", "params": [{"name": "min_f_score", "label": "Fスコアの下限（0〜9）", "type": "int", "default": 7, "min": 0, "max": 9}, {"name": "min_icr", "label": "インタレストカバレッジの下限（倍・利払い無しは除かない）", "type": "number", "default": 10, "min": 0, "max": 1000}, {"name": "min_current_ratio", "label": "流動比率の下限（倍）", "type": "number", "default": 1.5, "min": 0, "max": 50}, {"name": "min_mcap_oku", "label": "時価総額の下限（億円）", "type": "number", "default": 100, "min": 0, "max": 1000000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "name", "y": "f_score", "series": null}, "note": "Fスコアは9項目（黒字・営業CF黒字・ROA改善・営業CF＞純利益・負債比率低下・流動比率改善・増資なし・粗利率改善・総資産回転率改善）。前年が取れる項目が7つ以上の会社だけ（f_score_items）。アクルーアル＝(純利益−営業CF)÷総資産（0以下は利益が現金で裏付けられている）。"}, {"id": "scr_garp_peg", "domain": "screener", "title": "成長に対して割安（PEG）", "question": "純利益の3年成長率に比べてPERが低い会社はどこか", "mart": "m_screener", "sql": "SELECT sec_code4, name, industry, market_cap_b,\n       ROUND(peg, 2) AS peg, ROUND(per, 1) AS per, ROUND(net_income_cagr_3y * 100, 1) AS ni_cagr_3y_pct,\n       ROUND(op_income_cagr_3y * 100, 1) AS op_cagr_3y_pct, consec_up_years, ROUND(roic * 100, 1) AS roic_pct\nFROM m_screener\nWHERE peg > 0 AND peg <= {{max_peg}} AND net_income_cagr_3y >= {{min_cagr_pct}} / 100\n  AND market_cap_b >= {{min_mcap_oku}}\nORDER BY peg ASC\nLIMIT {{limit}}", "params": [{"name": "max_peg", "label": "PEG の上限（倍）", "type": "number", "default": 0.8, "min": 0.05, "max": 10}, {"name": "min_cagr_pct", "label": "純利益3年成長率の下限（%）", "type": "number", "default": 10, "min": -50, "max": 500}, {"name": "min_mcap_oku", "label": "時価総額の下限（億円）", "type": "number", "default": 100, "min": 0, "max": 1000000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "scatter", "x": "ni_cagr_3y_pct", "y": "per", "series": null}, "note": "PEG＝PER÷純利益3年CAGR（%）。3年前と今がともに黒字の会社だけ。1未満が成長に対して割安の目安。"}, {"id": "scr_consec_growth", "domain": "screener", "title": "増収増益が続く会社", "question": "増収増益が何期続いているか。長く続いていて資本効率も高い会社はどこか", "mart": "m_screener", "sql": "SELECT sec_code4, name, industry, market_cap_b,\n       consec_up_years, ROUND(sales_cagr_3y * 100, 1) AS sales_cagr_3y_pct, ROUND(op_income_cagr_3y * 100, 1) AS op_cagr_3y_pct,\n       ROUND(roic * 100, 1) AS roic_pct, ROUND(per, 1) AS per, ROUND(ev_ebitda, 1) AS ev_ebitda\nFROM m_screener\nWHERE consec_up_years >= {{min_years}} AND (roic IS NULL OR roic >= {{min_roic_pct}} / 100)\n  AND market_cap_b >= {{min_mcap_oku}}\nORDER BY consec_up_years DESC, op_income_cagr_3y DESC\nLIMIT {{limit}}", "params": [{"name": "min_years", "label": "増収増益の連続期数の下限", "type": "int", "default": 3, "min": 1, "max": 20}, {"name": "min_roic_pct", "label": "ROIC の下限（%・不明は除かない）", "type": "number", "default": 8, "min": -100, "max": 200}, {"name": "min_mcap_oku", "label": "時価総額の下限（億円）", "type": "number", "default": 100, "min": 0, "max": 1000000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "name", "y": "consec_up_years", "series": null}, "note": "売上と営業利益がともに前年を上回った期が何期続いているか（決算期の欠けがあるとそこで途切れる）。"}, {"id": "scr_multi_factor", "domain": "screener", "title": "多面スコア（割安×質×還元）", "question": "割安さ・資本効率・財務の質・株主還元をまとめて満たす会社はどこか", "mart": "m_screener", "sql": "SELECT sec_code4, name, industry, market_cap_b,\n       (CASE WHEN ev_ebitda > 0 AND ev_ebitda <= {{max_ev_ebitda}} THEN 1 ELSE 0 END\n      + CASE WHEN pbr > 0 AND pbr <= {{max_pbr}} THEN 1 ELSE 0 END\n      + CASE WHEN roic >= {{min_roic_pct}} / 100 THEN 1 ELSE 0 END\n      + CASE WHEN f_score >= 6 THEN 1 ELSE 0 END\n      + CASE WHEN fcf_yield >= 0.05 THEN 1 ELSE 0 END\n      + CASE WHEN total_payout_yield >= 0.04 THEN 1 ELSE 0 END\n      + CASE WHEN asset_value_ratio >= 0.5 OR net_cash_to_mcap >= 0.3 THEN 1 ELSE 0 END) AS hits,\n       ROUND(ev_ebitda, 1) AS ev_ebitda, ROUND(pbr, 2) AS pbr, ROUND(roic * 100, 1) AS roic_pct, f_score,\n       ROUND(fcf_yield * 100, 1) AS fcf_yield_pct, ROUND(total_payout_yield * 100, 1) AS total_payout_yield_pct,\n       ROUND(asset_value_ratio, 2) AS asset_value_ratio\nFROM m_screener\nWHERE market_cap_b >= {{min_mcap_oku}}\nORDER BY hits DESC, ev_ebitda ASC\nLIMIT {{limit}}", "params": [{"name": "max_ev_ebitda", "label": "EV/EBITDA が何倍以下で1点", "type": "number", "default": 7, "min": 0.5, "max": 100}, {"name": "max_pbr", "label": "PBR が何倍以下で1点", "type": "number", "default": 1, "min": 0.1, "max": 20}, {"name": "min_roic_pct", "label": "ROIC が何%以上で1点", "type": "number", "default": 10, "min": -100, "max": 200}, {"name": "min_mcap_oku", "label": "時価総額の下限（億円）", "type": "number", "default": 100, "min": 0, "max": 1000000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "name", "y": "hits", "series": null}, "note": "7項目（EV/EBITDA・PBR・ROIC・Fスコア6以上・FCF利回り5%以上・総還元4%以上・資産の裏付け）のうち満たす数（hits）の多い順。値が無い項目は0点。"}, {"id": "scru_value_fcf", "domain": "screener_us", "title": "FCF利回りが高い大型株", "question": "時価総額に対してフリーキャッシュフローの比率が高い米国株はどこか", "mart": "m_screener_us", "sql": "SELECT ticker, name, current_price_usd, ROUND(fcf_yield * 100, 2) AS fcf_yield_pct, ROUND(per, 1) AS per, ROUND(ps_ratio, 2) AS ps_ratio,\n       ROUND(operating_margin * 100, 1) AS operating_margin_pct, market_cap_bn_usd\nFROM m_screener_us\nWHERE fcf_yield >= {{min_fcf_yield_pct}} / 100\n  AND market_cap_bn_usd >= {{min_mcap_bn}}\nORDER BY fcf_yield DESC\nLIMIT {{limit}}", "params": [{"name": "min_fcf_yield_pct", "label": "FCF利回りの下限（%）", "type": "number", "default": 5, "min": 0, "max": 100}, {"name": "min_mcap_bn", "label": "時価総額の下限（十億ドル）", "type": "number", "default": 10, "min": 0, "max": 100000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "ticker", "y": "fcf_yield_pct", "series": null}, "note": "通貨は米ドル（列名の _usd）。時価総額は終値×発行済株式数（SEC の表紙値。出どころは shares_source）。FCF＝営業CF－設備投資で、直近4四半期が揃えばそれ、無ければ最新通期。valuation_flag が付いた銘柄（株式分割の疑い）は空。"}, {"id": "scru_growth", "domain": "screener_us", "title": "増収増益", "question": "売上も営業利益も純利益も前年を上回っている米国株はどこか", "mart": "m_screener_us", "sql": "SELECT ticker, name, current_price_usd, ROUND(sales_growth_1y * 100, 1) AS sales_growth_pct, ROUND(op_income_growth_1y * 100, 1) AS op_income_growth_pct,\n       ROUND(net_income_growth_1y * 100, 1) AS net_income_growth_pct, ROUND(per, 1) AS per, market_cap_bn_usd\nFROM m_screener_us\nWHERE sales_growth_1y > 0 AND op_income_growth_1y > 0 AND net_income_growth_1y > 0\n  AND market_cap_bn_usd >= {{min_mcap_bn}}\nORDER BY op_income_growth_1y DESC\nLIMIT {{limit}}", "params": [{"name": "min_mcap_bn", "label": "時価総額の下限（十億ドル）", "type": "number", "default": 5, "min": 0, "max": 100000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "ticker", "y": "op_income_growth_pct", "series": null}, "note": "通貨は米ドル（列名の _usd）。成長率は最新通期と1年前の通期の比。前年が黒字の会社だけ対象（赤字からの回復は除く）。売上の項目名は年度ごとに吸収しているが、売上を開示しない会社（信託など）は sales_growth が空なので出ない。"}, {"id": "scru_momentum", "domain": "screener_us", "title": "3か月騰落率の上位", "question": "直近3か月で株価が大きく上がった米国株はどこか（流動性の下限付き）", "mart": "m_screener_us", "sql": "SELECT ticker, name, current_price_usd, ROUND(return_1m * 100, 1) AS return_1m_pct, ROUND(return_3m * 100, 1) AS return_3m_pct,\n       ROUND(return_1y * 100, 1) AS return_1y_pct, ROUND(week52_position_pct, 0) AS week52_position_pct, market_cap_bn_usd\nFROM m_screener_us\nWHERE return_3m IS NOT NULL\n  AND avg_turnover_20d_usd >= {{min_turnover_musd}} * 1000000.0\nORDER BY return_3m DESC\nLIMIT {{limit}}", "params": [{"name": "min_turnover_musd", "label": "20日平均売買代金の下限（百万ドル）", "type": "number", "default": 20, "min": 0, "max": 1000000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "ticker", "y": "return_3m_pct", "series": null}, "note": "通貨は米ドル（列名の _usd）。騰落率は終値ベースで63営業日前との比（分割調整済み・配当未調整）。株価のある全銘柄が対象で、財務が無い銘柄（ETF など）も含む。株価の履歴が約400日分のため return_1y は足りない銘柄で空。"}, {"id": "scru_near_52w_high", "domain": "screener_us", "title": "52週高値圏", "question": "52週高値圏にあって利益率も高い米国株はどこか", "mart": "m_screener_us", "sql": "SELECT ticker, name, current_price_usd, ROUND(week52_position_pct, 0) AS week52_position_pct, ROUND(return_3m * 100, 1) AS return_3m_pct,\n       ROUND(operating_margin * 100, 1) AS operating_margin_pct, ROUND(sales_growth_1y * 100, 1) AS sales_growth_pct, market_cap_bn_usd\nFROM m_screener_us\nWHERE week52_position_pct >= {{min_position}}\n  AND operating_margin >= {{min_opm_pct}} / 100\n  AND avg_turnover_20d_usd >= {{min_turnover_musd}} * 1000000.0\nORDER BY week52_position_pct DESC, operating_margin DESC\nLIMIT {{limit}}", "params": [{"name": "min_position", "label": "52週レンジ内の位置の下限（0〜100・100が高値）", "type": "number", "default": 90, "min": 0, "max": 100}, {"name": "min_opm_pct", "label": "営業利益率の下限（%）", "type": "number", "default": 15, "min": -100, "max": 100}, {"name": "min_turnover_musd", "label": "20日平均売買代金の下限（百万ドル）", "type": "number", "default": 20, "min": 0, "max": 1000000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "scatter", "x": "week52_position_pct", "y": "operating_margin_pct", "series": null}, "note": "通貨は米ドル（列名の _usd）。52週位置は終値ベースの直近252営業日（履歴120営業日未満は空）。営業利益率は財務のある銘柄だけ。"}, {"id": "scru_profitable_cheap", "domain": "screener_us", "title": "黒字で割安（低PER×高利益率）", "question": "利益率が高いのにPERが低い米国株はどこか", "mart": "m_screener_us", "sql": "SELECT ticker, name, current_price_usd, ROUND(per, 1) AS per, ROUND(ps_ratio, 2) AS ps_ratio, ROUND(net_margin * 100, 1) AS net_margin_pct,\n       ROUND(operating_margin * 100, 1) AS operating_margin_pct, market_cap_bn_usd\nFROM m_screener_us\nWHERE per > 0 AND per <= {{max_per}}\n  AND net_margin >= {{min_net_margin_pct}} / 100\n  AND market_cap_bn_usd >= {{min_mcap_bn}}\nORDER BY per ASC\nLIMIT {{limit}}", "params": [{"name": "max_per", "label": "PER の上限（倍）", "type": "number", "default": 15, "min": 1, "max": 200}, {"name": "min_net_margin_pct", "label": "純利益率の下限（%）", "type": "number", "default": 10, "min": -100, "max": 100}, {"name": "min_mcap_bn", "label": "時価総額の下限（十億ドル）", "type": "number", "default": 5, "min": 0, "max": 100000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "scatter", "x": "per", "y": "net_margin_pct", "series": null}, "note": "通貨は米ドル（列名の _usd）。PER は 最新終値÷直近4四半期の希薄化EPS（無ければ最新通期）。EPS が株価と同じ分割基準でない銘柄（valuation_flag）は空。"}, {"id": "scru_buyback", "domain": "screener_us", "title": "自社株買い利回りが高い", "question": "時価総額に対して自社株買いの額が大きい米国株はどこか", "mart": "m_screener_us", "sql": "SELECT ticker, name, current_price_usd, ROUND(buyback_yield * 100, 2) AS buyback_yield_pct, ROUND(fcf_yield * 100, 2) AS fcf_yield_pct,\n       ROUND(per, 1) AS per, ROUND(return_1y * 100, 1) AS return_1y_pct, market_cap_bn_usd\nFROM m_screener_us\nWHERE buyback_yield >= {{min_buyback_pct}} / 100\n  AND market_cap_bn_usd >= {{min_mcap_bn}}\nORDER BY buyback_yield DESC\nLIMIT {{limit}}", "params": [{"name": "min_buyback_pct", "label": "自社株買い利回りの下限（%）", "type": "number", "default": 3, "min": 0, "max": 100}, {"name": "min_mcap_bn", "label": "時価総額の下限（十億ドル）", "type": "number", "default": 10, "min": 0, "max": 100000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "ticker", "y": "buyback_yield_pct", "series": null}, "note": "通貨は米ドル（列名の _usd）。自社株買いは最新通期の取得額（SEC XBRL）。時価総額は終値×発行済株式数。"}, {"id": "scru_composite_top", "domain": "screener_us", "title": "総合スコア上位", "question": "総合スコア（composite_score）の高い米国株はどこか", "mart": "m_screener_us", "sql": "SELECT ticker, name, ROUND(composite_score, 1) AS composite_score, ROUND(value_score, 1) AS value_score, ROUND(quality_score, 1) AS quality_score,\n       current_price_usd, ROUND(pbr, 2) AS pbr, ROUND(roe * 100, 1) AS roe_pct, ROUND(rsi14, 0) AS rsi14\nFROM m_screener_us\nWHERE composite_score >= {{min_score}}\nORDER BY composite_score DESC\nLIMIT {{limit}}", "params": [{"name": "min_score", "label": "総合スコアの下限（0〜100）", "type": "number", "default": 60, "min": 0, "max": 100}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "ticker", "y": "composite_score", "series": null}, "note": "通貨は米ドル（列名の _usd）。スコア・RSI は日次スナップショット（stock_snapshot の market='US'）にある約400銘柄だけ。PBR・ROE は SEC の貸借から全銘柄分を計算（PBR＝時価総額÷最新の株主資本、ROE＝直近4四半期の純利益÷最新の株主資本）。スコアの作り方は SPEC_core.md を参照。"}, {"id": "scru_roic_cheap", "domain": "screener_us", "title": "高ROIC×EV/EBITDA割安", "question": "資本効率（ROIC）が高いのに、EV/EBITDA で見て安い米国株はどこか", "mart": "m_screener_us", "sql": "SELECT ticker, name, industry, market_cap_bn_usd,\n       ROUND(roic * 100, 1) AS roic_pct, roic_tax_basis, ROUND(ev_ebitda, 1) AS ev_ebitda,\n       ROUND(operating_margin * 100, 1) AS operating_margin_pct, ROUND(per, 1) AS per\nFROM m_screener_us\nWHERE roic >= {{min_roic_pct}} / 100 AND ev_ebitda > 0 AND ev_ebitda <= {{max_ev_ebitda}}\n  AND market_cap_bn_usd >= {{min_mcap_bn}}\nORDER BY roic / ev_ebitda DESC\nLIMIT {{limit}}", "params": [{"name": "min_roic_pct", "label": "ROIC の下限（%）", "type": "number", "default": 15, "min": -100, "max": 500}, {"name": "max_ev_ebitda", "label": "EV/EBITDA の上限（倍）", "type": "number", "default": 12, "min": 0.5, "max": 200}, {"name": "min_mcap_bn", "label": "時価総額の下限（十億ドル）", "type": "number", "default": 2, "min": 0, "max": 100000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "scatter", "x": "ev_ebitda", "y": "roic_pct", "series": null}, "note": "ROIC＝営業利益×(1−税率)÷(有利子負債＋株主資本)（通期）。税率は報告値（5〜50%）が無ければ25%。減価償却などは取得側の取り直しが済むまで空の銘柄がある。"}, {"id": "scru_quality_fscore", "domain": "screener_us", "title": "財務の質（Fスコア）", "question": "ピオトロスキーFスコアが高く、利払い余力と流動性が十分な米国株はどこか", "mart": "m_screener_us", "sql": "SELECT ticker, name, industry, market_cap_bn_usd,\n       f_score, f_score_items, ROUND(interest_coverage, 1) AS interest_coverage, ROUND(current_ratio, 2) AS current_ratio,\n       ROUND(accrual_ratio *
