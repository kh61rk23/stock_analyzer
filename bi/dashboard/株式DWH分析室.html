 100, 1) AS accrual_pct, ROUND(per, 1) AS per, ROUND(pbr, 2) AS pbr\nFROM m_screener_us\nWHERE f_score >= {{min_f_score}} AND current_ratio >= {{min_current_ratio}}\n  AND (interest_coverage IS NULL OR interest_coverage >= {{min_icr}})\n  AND market_cap_bn_usd >= {{min_mcap_bn}}\nORDER BY f_score DESC, per ASC\nLIMIT {{limit}}", "params": [{"name": "min_f_score", "label": "Fスコアの下限（0〜9）", "type": "int", "default": 7, "min": 0, "max": 9}, {"name": "min_current_ratio", "label": "流動比率の下限（倍）", "type": "number", "default": 1.2, "min": 0, "max": 50}, {"name": "min_icr", "label": "インタレストカバレッジの下限（倍・利払い無しは除かない）", "type": "number", "default": 8, "min": 0, "max": 1000}, {"name": "min_mcap_bn", "label": "時価総額の下限（十億ドル）", "type": "number", "default": 2, "min": 0, "max": 100000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "ticker", "y": "f_score", "series": null}, "note": "Fスコアは9項目（前年の通期が取れる項目が7つ以上のときだけ）。"}, {"id": "scru_garp_peg", "domain": "screener_us", "title": "成長に対して割安（PEG）", "question": "EPSの3年成長率に比べてPERが低い米国株はどこか", "mart": "m_screener_us", "sql": "SELECT ticker, name, industry, market_cap_bn_usd,\n       ROUND(peg, 2) AS peg, ROUND(per, 1) AS per, ROUND(eps_cagr_3y * 100, 1) AS eps_cagr_3y_pct,\n       ROUND(sales_cagr_3y * 100, 1) AS sales_cagr_3y_pct, ROUND(roic * 100, 1) AS roic_pct\nFROM m_screener_us\nWHERE peg > 0 AND peg <= {{max_peg}} AND eps_cagr_3y >= {{min_cagr_pct}} / 100\n  AND market_cap_bn_usd >= {{min_mcap_bn}}\nORDER BY peg ASC\nLIMIT {{limit}}", "params": [{"name": "max_peg", "label": "PEG の上限（倍）", "type": "number", "default": 1, "min": 0.05, "max": 10}, {"name": "min_cagr_pct", "label": "EPS 3年成長率の下限（%）", "type": "number", "default": 10, "min": -50, "max": 500}, {"name": "min_mcap_bn", "label": "時価総額の下限（十億ドル）", "type": "number", "default": 2, "min": 0, "max": 100000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "scatter", "x": "eps_cagr_3y_pct", "y": "per", "series": null}, "note": "PEG＝PER÷EPS3年CAGR（%）。3年前と今がともに黒字の銘柄だけ。"}, {"id": "scru_shareholder_yield", "domain": "screener_us", "title": "総還元利回り（配当＋自社株買い）", "question": "配当と自社株買いの合計が時価総額に対して大きい米国株はどこか", "mart": "m_screener_us", "sql": "SELECT ticker, name, industry, market_cap_bn_usd,\n       ROUND(total_payout_yield * 100, 1) AS total_payout_yield_pct, ROUND(dividend_yield * 100, 2) AS dividend_yield_pct,\n       ROUND(buyback_yield * 100, 2) AS buyback_yield_pct, ROUND(fcf_yield * 100, 1) AS fcf_yield_pct, ROUND(per, 1) AS per\nFROM m_screener_us\nWHERE total_payout_yield >= {{min_payout_pct}} / 100 AND fcf_yield > 0\n  AND market_cap_bn_usd >= {{min_mcap_bn}}\nORDER BY total_payout_yield DESC\nLIMIT {{limit}}", "params": [{"name": "min_payout_pct", "label": "総還元利回りの下限（%）", "type": "number", "default": 5, "min": 0, "max": 100}, {"name": "min_mcap_bn", "label": "時価総額の下限（十億ドル）", "type": "number", "default": 2, "min": 0, "max": 100000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "ticker", "y": "total_payout_yield_pct", "series": null}, "note": "通期の配当支払総額＋自社株買い÷時価総額。FCF が赤字の銘柄は除く（借入での還元を避ける）。"}, {"id": "scru_multi_factor", "domain": "screener_us", "title": "多面スコア（割安×質×還元）", "question": "割安さ・資本効率・財務の質・株主還元をまとめて満たす米国株はどこか", "mart": "m_screener_us", "sql": "SELECT ticker, name, industry, market_cap_bn_usd,\n       (CASE WHEN ev_ebitda > 0 AND ev_ebitda <= {{max_ev_ebitda}} THEN 1 ELSE 0 END\n      + CASE WHEN per > 0 AND per <= {{max_per}} THEN 1 ELSE 0 END\n      + CASE WHEN roic >= {{min_roic_pct}} / 100 THEN 1 ELSE 0 END\n      + CASE WHEN f_score >= 6 THEN 1 ELSE 0 END\n      + CASE WHEN fcf_yield >= 0.05 THEN 1 ELSE 0 END\n      + CASE WHEN total_payout_yield >= 0.04 THEN 1 ELSE 0 END\n      + CASE WHEN sales_cagr_3y >= 0.05 THEN 1 ELSE 0 END) AS hits,\n       ROUND(ev_ebitda, 1) AS ev_ebitda, ROUND(per, 1) AS per, ROUND(roic * 100, 1) AS roic_pct, f_score,\n       ROUND(fcf_yield * 100, 1) AS fcf_yield_pct, ROUND(total_payout_yield * 100, 1) AS total_payout_yield_pct\nFROM m_screener_us\nWHERE market_cap_bn_usd >= {{min_mcap_bn}}\nORDER BY hits DESC, ev_ebitda ASC\nLIMIT {{limit}}", "params": [{"name": "max_ev_ebitda", "label": "EV/EBITDA が何倍以下で1点", "type": "number", "default": 10, "min": 0.5, "max": 200}, {"name": "max_per", "label": "PER が何倍以下で1点", "type": "number", "default": 15, "min": 1, "max": 500}, {"name": "min_roic_pct", "label": "ROIC が何%以上で1点", "type": "number", "default": 15, "min": -100, "max": 500}, {"name": "min_mcap_bn", "label": "時価総額の下限（十億ドル）", "type": "number", "default": 2, "min": 0, "max": 100000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "ticker", "y": "hits", "series": null}, "note": "7項目（EV/EBITDA・PER・ROIC・Fスコア6以上・FCF利回り5%以上・総還元4%以上・売上3年CAGR5%以上）のうち満たす数の多い順。値が無い項目は0点。"}, {"id": "tax_node_company_count", "domain": "taxonomy", "title": "技術分類ごとの企業数", "question": "どの技術分類に紐づく会社が多いか", "mart": "m_tax_node", "sql": "SELECT node_name_ja, path_name, company_count, company_count_rollup\nFROM m_tax_node\nWHERE node_level = {{level}}\nORDER BY company_count_rollup DESC, node_id\nLIMIT {{top_n}}", "params": [{"name": "level", "label": "階層（1=領域 2=分野 3=細分 4=最細）", "type": "int", "default": 2, "min": 1, "max": 4}, {"name": "top_n", "label": "表示するノード数", "type": "int", "default": 20, "min": 1, "max": 100}], "chart": {"type": "bar", "x": "node_name_ja", "y": ["company_count_rollup"], "series": null}, "note": "company_count_rollup は自ノード以下に紐づく会社の重複なしの数、company_count は自ノードに直接紐づく数。上場会社のみで、業種単位の行（sector:）と company_id='nan' は数えない。"}, {"id": "tax_domain_distribution", "domain": "taxonomy", "title": "領域別の企業数の分布", "question": "最上位（領域）ごとに会社がどう分布しているか", "mart": "m_tax_node", "sql": "SELECT node_name_ja, child_count, company_count, company_count_rollup\nFROM m_tax_node\nWHERE node_level = 1\nORDER BY company_count_rollup DESC, node_id", "params": [], "chart": {"type": "bar", "x": "node_name_ja", "y": ["company_count_rollup"], "series": null}, "note": "領域（node_level=1）25件。1社が複数の領域に入りうるため、領域の企業数を足し合わせても会社数にはならない。"}, {"id": "tax_tree_children", "domain": "taxonomy", "title": "技術分類ツリーの子ノード", "question": "この分類の下にどんな細分があり、会社は何社か", "mart": "m_tax_node", "sql": "SELECT node_id, node_name_ja, node_level, child_count, company_count, company_count_rollup, path_name\nFROM m_tax_node\nWHERE parent_id = {{parent_id}}\nORDER BY company_count_rollup DESC, node_id", "params": [{"name": "parent_id", "label": "親ノードID（例 semiconductor・ai_software）", "type": "string", "default": "semiconductor"}], "chart": {"type": "bar", "x": "node_name_ja", "y": ["company_count_rollup"], "series": null}, "note": "親ノードIDは英小文字・_ の識別子（m_tax_node.node_id）。領域のIDは tax_domain_distribution の結果で確認できる。"}, {"id": "tax_companies_by_node", "domain": "taxonomy", "title": "ある技術分類を持つ会社一覧（財務つき）", "question": "この技術分類に紐づく会社と、最新年度の売上・営業利益率・研究開発費率は", "mart": "m_company_tax", "sql": "SELECT company_id AS sec_code4, name, industry, relevance_score, revenue_share_est, fiscal_year, net_sales, ROUND(operating_margin * 100, 1) AS operating_margin_pct, ROUND(rnd_ratio * 100, 2) AS rnd_ratio_pct\nFROM m_company_tax\nWHERE entity_type = 'company' AND node_id = {{node_id}}\nORDER BY relevance_score DESC, net_sales DESC, company_id\nLIMIT {{top_n}}", "params": [{"name": "node_id", "label": "技術分類ノードID（例 ai_software・semiconductor_equipment）", "type": "string", "default": "ai_software"}, {"name": "top_n", "label": "表示する会社数", "type": "int", "default": 50, "min": 1, "max": 300}], "chart": {"type": "table", "x": "name", "y": ["net_sales"], "series": null}, "note": "財務は各社の売上が入っている最新年度1年分（fiscal_year）。営業利益率・研究開発費率は売上比。研究開発費を開示しない会社は空。relevance_score・revenue_share_est は推定値（revenue_share_est は会社単位で、同じ会社の全ノードに同じ値が入る）。"}, {"id": "tax_companies_by_domain", "domain": "taxonomy", "title": "ある領域に属する会社一覧（財務つき）", "question": "この領域（例 半導体）に関わる会社を、関連度の高い順に財務つきで", "mart": "m_company_tax", "sql": "SELECT company_id AS sec_code4, name, industry, COUNT(*) AS node_count, MAX(relevance_score) AS max_relevance, MAX(fiscal_year) AS fiscal_year, MAX(net_sales) AS net_sales, ROUND(MAX(operating_margin) * 100, 1) AS operating_margin_pct, ROUND(MAX(rnd_ratio) * 100, 2) AS rnd_ratio_pct\nFROM m_company_tax\nWHERE entity_type = 'company' AND domain_id = {{domain_id}}\nGROUP BY company_id, name, industry\nORDER BY max_relevance DESC, net_sales DESC, company_id\nLIMIT {{top_n}}", "params": [{"name": "domain_id", "label": "領域ノードID（例 semiconductor・ai_software・robotics_automation）", "type": "string", "default": "semiconductor"}, {"name": "top_n", "label": "表示する会社数", "type": "int", "default": 50, "min": 1, "max": 300}], "chart": {"type": "table", "x": "name", "y": ["net_sales"], "series": null}, "note": "領域＝階層1のノード。会社ごとに1行へ集約（node_count はその領域内で紐づくノード数）。財務は会社単位の値なので MAX は同じ値を取り出すだけ。"}, {"id": "tax_company_nodes", "domain": "taxonomy", "title": "ある会社の技術分類", "question": "この会社はどの技術分類に紐づいているか", "mart": "m_company_tax", "sql": "SELECT name, path_name, node_level, relevance_score, confidence, revenue_share_est, confidence_type, verified_flag\nFROM m_company_tax\nWHERE company_id = {{sec_code4}}\nORDER BY relevance_score DESC, node_id", "params": [{"name": "sec_code4", "label": "証券コード（4桁）", "type": "string", "default": "6869"}], "chart": {"type": "bar", "x": "path_name", "y": ["relevance_score"], "series": null}, "note": "会社の識別子は証券コード4桁（英字入りも可）。verified_flag が false の行は自動導出（人手で確認していない）。上場会社でない場合や分類が無い場合は0行。"}, {"id": "tax_rnd_by_node", "domain": "taxonomy", "title": "研究開発費率が高い技術分野", "question": "どの技術分野の会社が売上に対する研究開発費の比率が高いか", "mart": "m_company_tax", "sql": "SELECT node_name_ja, path_name, COUNT(DISTINCT company_id) AS companies, ROUND(AVG(rnd_ratio) * 100, 2) AS avg_rnd_ratio_pct\nFROM m_company_tax\nWHERE entity_type = 'company' AND node_level = {{level}} AND rnd_ratio BETWEEN 0 AND 1\nGROUP BY node_name_ja, path_name\nHAVING COUNT(DISTINCT company_id) >= {{min_companies}}\nORDER BY avg_rnd_ratio_pct DESC, node_name_ja\nLIMIT {{top_n}}", "params": [{"name": "level", "label": "階層（1=領域 2=分野 3=細分 4=最細）", "type": "int", "default": 2, "min": 1, "max": 4}, {"name": "min_companies", "label": "最低社数（研究開発費を開示する会社）", "type": "int", "default": 3, "min": 1, "max": 50}, {"name": "top_n", "label": "表示するノード数", "type": "int", "default": 20, "min": 1, "max": 100}], "chart": {"type": "bar", "x": "node_name_ja", "y": ["avg_rnd_ratio_pct"], "series": null}, "note": "各社の最新年度の研究開発費÷売上の単純平均（売上加重ではない）。研究開発費を開示していない会社は含まれず、companies はその開示社数。比率が0〜100%の範囲外は除外。"}, {"id": "tax_margin_by_node", "domain": "taxonomy", "title": "技術分野別の平均営業利益率", "question": "どの技術分野の会社が稼ぐ力（営業利益率）が高いか", "mart": "m_company_tax", "sql": "SELECT node_name_ja, path_name, COUNT(DISTINCT company_id) AS companies, ROUND(AVG(operating_margin) * 100, 1) AS avg_operating_margin_pct\nFROM m_company_tax\nWHERE entity_type = 'company' AND node_level = {{level}} AND operating_margin BETWEEN -1 AND 1\nGROUP BY node_name_ja, path_name\nHAVING COUNT(DISTINCT company_id) >= {{min_companies}}\nORDER BY avg_operating_margin_pct DESC, node_name_ja\nLIMIT {{top_n}}", "params": [{"name": "level", "label": "階層（1=領域 2=分野 3=細分 4=最細）", "type": "int", "default": 2, "min": 1, "max": 4}, {"name": "min_companies", "label": "最低社数", "type": "int", "default": 3, "min": 1, "max": 50}, {"name": "top_n", "label": "表示するノード数", "type": "int", "default": 20, "min": 1, "max": 100}], "chart": {"type": "bar", "x": "node_name_ja", "y": ["avg_operating_margin_pct"], "series": null}, "note": "各社の最新年度の営業利益÷売上の単純平均。営業利益率が -100%〜+100% の範囲外は外れ値として除外。金融など売上の定義が異なる業種も含まれる。"}, {"id": "tax_multi_domain_companies", "domain": "taxonomy", "title": "複数の技術領域を横断する会社", "question": "いくつもの技術領域にまたがる会社はどこか", "mart": "m_company_tax", "sql": "SELECT company_id AS sec_code4, name, industry, COUNT(DISTINCT domain_id) AS domains, COUNT(*) AS nodes, MAX(fiscal_year) AS fiscal_year, MAX(net_sales) AS net_sales\nFROM m_company_tax\nWHERE entity_type = 'company'\nGROUP BY company_id, name, industry\nHAVING COUNT(DISTINCT domain_id) >= {{min_domains}}\nORDER BY domains DESC, nodes DESC, company_id\nLIMIT {{top_n}}", "params": [{"name": "min_domains", "label": "最低の領域数", "type": "int", "default": 2, "min": 1, "max": 10}, {"name": "top_n", "label": "表示する会社数", "type": "int", "default": 50, "min": 1, "max": 300}], "chart": {"type": "bar", "x": "name", "y": ["domains"], "series": null}, "note": "領域＝階層1のノード。分類は自動導出が中心で、領域数が多い＝事業が広いとは限らない（同じ事業を複数領域に割り振った可能性がある）。"}, {"id": "tax_industry_domain_cross", "domain": "taxonomy", "title": "業種×技術領域のクロス", "question": "どの業種の会社がどの技術領域に多く紐づくか", "mart": "m_company_tax", "sql": "SELECT industry, domain_name_ja, COUNT(DISTINCT company_id) AS companies\nFROM m_company_tax\nWHERE entity_type = 'company' AND industry IS NOT NULL AND domain_name_ja IS NOT NULL\nGROUP BY industry, domain_name_ja\nORDER BY companies DESC, industry, domain_name_ja\nLIMIT {{top_n}}", "params": [{"name": "top_n", "label": "表示する組み合わせ数", "type": "int", "default": 40, "min": 1, "max": 300}], "chart": {"type": "bar", "x": "domain_name_ja", "y": ["companies"], "series": "industry"}, "note": "industry は EDINET の業種区分（edinet.company.industry）。1社が複数領域に入るため、領域ごとの社数を足しても会社数にはならない。"}, {"id": "theme_company_stats", "domain": "theme", "title": "テーマごとの銘柄数と平均営業利益率", "question": "どのテーマに銘柄が多く、稼ぐ力（営業利益率）はどうか", "mart": "m_theme", "sql": "SELECT theme_name, sector_name_ja, COUNT(DISTINCT ticker) AS companies, ROUND(AVG(CASE WHEN operating_margin BETWEEN -1 AND 1 THEN operating_margin END) * 100, 1) AS avg_operating_margin_pct\nFROM m_theme\nGROUP BY theme_name, sector_name_ja\nHAVING COUNT(DISTINCT ticker) >= {{min_companies}}\nORDER BY avg_operating_margin_pct DESC, theme_name\nLIMIT {{top_n}}", "params": [{"name": "min_companies", "label": "最低銘柄数", "type": "int", "default": 2, "min": 1, "max": 10}, {"name": "top_n", "label": "表示する件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "theme_name", "y": ["avg_operating_margin_pct"], "series": null}, "note": "営業利益率は各社の最新年度の営業利益÷売上の単純平均（営業利益率が±100%を超える会社は平均から除く）。銘柄は m_theme に実在する代表銘柄のみ。テーマは業種ごとに定義され、銘柄は業種の代表銘柄（2〜3社）に業種のテーマ全部が付く。同じ業種のテーマは同じ銘柄の集合になるので、テーマ間の差は業種の差とほぼ同じ。"}, {"id": "theme_companies", "domain": "theme", "title": "あるテーマの銘柄一覧（財務つき）", "question": "このテーマの銘柄と、最新年度の売上・営業利益・利益率・売上成長は", "mart": "m_theme", "sql": "SELECT sec_code4, name, industry, fiscal_year, net_sales, operating_income, ROUND(operating_margin * 100, 1) AS operating_margin_pct, ROUND(sales_growth * 100, 1) AS sales_growth_pct\nFROM m_theme\nWHERE theme_name = {{theme_name}}\nORDER BY net_sales DESC, sec_code4\nLIMIT {{top_n}}", "params": [{"name": "theme_name", "label": "テーマ名（例 AI半導体・後発薬・電池材料）", "type": "string", "default": "AI半導体"}, {"name": "top_n", "label": "表示する件数", "type": "int", "default": 50, "min": 1, "max": 200}], "chart": {"type": "table", "x": "name", "y": ["net_sales"], "series": null}, "note": "財務は各社の売上が入っている最新年度1年分。売上成長は前年が実在するときだけ（無ければ空）。テーマ名は theme_company_stats の結果で確認できる。"}, {"id": "theme_company_themes", "domain": "theme", "title": "ある会社が属するテーマ", "question": "この会社はどのテーマに入っているか", "mart": "m_theme", "sql": "SELECT theme_name, sector_name_ja, supply_chain_position, name, relevance\nFROM m_theme\nWHERE sec_code4 = {{sec_code4}}\nORDER BY theme_name", "params": [{"name": "sec_code4", "label": "証券コード（4桁）", "type": "string", "default": "6501"}], "chart": {"type": "table", "x": "theme_name", "y": ["relevance"], "series": null}, "note": "テーマが付くのは業種ごとの代表銘柄（約86社）だけ。上場会社でもここに無い会社は0行。relevance は元表の値（現在はほぼ1.0）。supply_chain_position は業種の位置づけ（upstream・midstream・downstream）。"}, {"id": "theme_signal_recent", "domain": "theme", "title": "シグナルが多いテーマ（直近N日）", "question": "直近のシグナル（スクリーナー通過・ドリフト）が多いテーマは", "mart": "m_theme_signal", "sql": "SELECT theme_name, sector_name_ja, SUM(signal_count) AS signals, SUM(CASE WHEN direction = 'bullish' THEN signal_count ELSE 0 END) AS bullish, SUM(CASE WHEN direction = 'bearish' THEN signal_count ELSE 0 END) AS bearish\nFROM m_theme_signal\nWHERE days_before_latest < {{days}}\nGROUP BY theme_name, sector_name_ja\nORDER BY signals DESC, theme_name\nLIMIT {{top_n}}", "params": [{"name": "days", "label": "直近の日数（表内の最新シグナル日から数える）", "type": "int", "default": 30, "min": 1, "max": 365}, {"name": "top_n", "label": "表示する件数", "type": "int", "default": 20, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "theme_name", "y": ["bullish", "bearish"], "series": null}, "note": "シグナルは ontology.signal_event を業種コードでテーマに結びつけたもの。業種内のテーマは同じ件数になる。『直近』は今日ではなく表内の最新シグナル日からの日数。event_id の重複は除いて数える。"}, {"id": "theme_sales_growth", "domain": "theme", "title": "テーマ別の売上成長", "question": "どのテーマの銘柄の売上が伸びているか", "mart": "m_theme", "sql": "SELECT theme_name, sector_name_ja, COUNT(DISTINCT ticker) AS companies, ROUND(AVG(sales_growth) * 100, 1) AS avg_sales_growth_pct\nFROM m_theme\nWHERE sales_growth BETWEEN -0.9 AND 3\nGROUP BY theme_name, sector_name_ja\nHAVING COUNT(DISTINCT ticker) >= {{min_companies}}\nORDER BY avg_sales_growth_pct DESC, theme_name\nLIMIT {{top_n}}", "params": [{"name": "min_companies", "label": "最低銘柄数（前年と比べられる銘柄）", "type": "int", "default": 2, "min": 1, "max": 10}, {"name": "top_n", "label": "表示する件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "theme_name", "y": ["avg_sales_growth_pct"], "series": null}, "note": "最新年度の売上÷前年の売上−1 の単純平均。前年が無い会社と、成長率が−90%〜+300%の外にある会社は除く。companies はその条件を満たす銘柄数。テーマは業種ごとに定義され、銘柄は業種の代表銘柄（2〜3社）に業種のテーマ全部が付く。同じ業種のテーマは同じ銘柄の集合になるので、テーマ間の差は業種の差とほぼ同じ。"}, {"id": "theme_industry_cross", "domain": "theme", "title": "業種×テーマのクロス", "question": "どの業種の会社がどのテーマに入っているか", "mart": "m_theme", "sql": "SELECT industry, theme_name, COUNT(DISTINCT ticker) AS companies\nFROM m_theme\nWHERE industry IS NOT NULL\nGROUP BY industry, theme_name\nORDER BY companies DESC, industry, theme_name\nLIMIT {{top_n}}", "params": [{"name": "top_n", "label": "表示する件数", "type": "int", "default": 60, "min": 1, "max": 300}], "chart": {"type": "bar", "x": "theme_name", "y": ["companies"], "series": "industry"}, "note": "industry は edinet.company の業種名、theme の業種（sector_name_ja）とは別の分類。表記の揺れで同じ業種が分かれることがある。上場会社として見つからない銘柄は業種が空で除く。"}, {"id": "theme_sector_overview", "domain": "theme", "title": "業種ごとのテーマ数と銘柄数", "question": "どの業種にテーマが多く、実在銘柄がどれだけ紐づくか", "mart": "m_theme_def", "sql": "SELECT sector_name_ja, market, COUNT(*) AS themes, SUM(company_count) AS company_links\nFROM m_theme_def\nWHERE market = {{market}}\nGROUP BY sector_name_ja, market\nORDER BY themes DESC, company_links DESC, sector_name_ja", "params": [{"name": "market", "label": "市場（JP または US）", "type": "string", "default": "JP"}], "chart": {"type": "bar", "x": "sector_name_ja", "y": ["themes", "company_links"], "series": null}, "note": "company_links はテーマごとの実在銘柄数の合計（同じ銘柄が複数テーマに入るため会社数ではない）。米国（US）のテーマは定義だけで実在銘柄が無く 0。"}, {"id": "theme_sector_themes", "domain": "theme", "title": "ある業種のテーマ一覧", "question": "この業種にはどんなテーマが定義されているか", "mart": "m_theme_def", "sql": "SELECT theme_name, sector_name_ja, supply_chain_position, theme_order, company_count\nFROM m_theme_def\nWHERE sector_code = {{sector_code}} AND market = {{market}}\nORDER BY theme_order", "params": [{"name": "sector_code", "label": "業種コード（日本は東証33業種 1001〜1033・米国は 10〜60）", "type": "string", "default": "1016"}, {"name": "market", "label": "市場（JP または US）", "type": "string", "default": "JP"}], "chart": {"type": "table", "x": "theme_name", "y": ["company_count"], "series": null}, "note": "業種コードは theme_sector_overview の結果の業種名から引ける（電気機器=1016・医薬品=1008・機械=1015）。theme_order は元表の並び。"}, {"id": "theme_signal_trend", "domain": "theme", "title": "あるテーマのシグナル件数の推移", "question": "このテーマのシグナルは日ごとにどう出ているか", "mart": "m_theme_signal", "sql": "SELECT fired_at, direction, SUM(signal_count) AS signals\nFROM m_theme_signal\nWHERE theme_name = {{theme_name}}\nGROUP BY fired_at, direction\nORDER BY fired_at, direction", "params": [{"name": "theme_name", "label": "テーマ名（例 AI半導体）", "type": "string", "default": "AI半導体"}], "chart": {"type": "line", "x": "fired_at", "y": ["signals"], "series": "direction"}, "note": "シグナルが出た日だけ点が付く（出ない日は欠ける）。業種単位のシグナルを含み、同じ業種の他テーマと同じ推移になる。"}, {"id": "theme_margin_vs_growth", "domain": "theme", "title": "テーマの収益性と成長性", "question": "利益率が高く売上も伸びているテーマはどれか", "mart": "m_theme", "sql": "SELECT theme_name, COUNT(DISTINCT ticker) AS companies, ROUND(AVG(sales_growth) * 100, 1) AS avg_sales_growth_pct, ROUND(AVG(operating_margin) * 100, 1) AS avg_operating_margin_pct\nFROM m_theme\nWHERE sales_growth BETWEEN -0.9 AND 3 AND operating_margin BETWEEN -1 AND 1\nGROUP BY theme_name\nHAVING COUNT(DISTINCT ticker) >= {{min_companies}}\nORDER BY avg_operating_margin_pct DESC, theme_name\nLIMIT {{top_n}}", "params": [{"name": "min_companies", "label": "最低銘柄数", "type": "int", "default": 2, "min": 1, "max": 10}, {"name": "top_n", "label": "表示する件数", "type": "int", "default": 150, "min": 1, "max": 200}], "chart": {"type": "scatter", "x": "avg_sales_growth_pct", "y": ["avg_operating_margin_pct"], "series": null}, "note": "x=売上成長・y=営業利益率（いずれも各社最新年度の単純平均）。成長率が−90%〜+300%、営業利益率が±100%の外の会社は除く。テーマは業種ごとに定義され、銘柄は業種の代表銘柄（2〜3社）に業種のテーマ全部が付く。同じ業種のテーマは同じ銘柄の集合になるので、テーマ間の差は業種の差とほぼ同じ。"}, {"id": "us_company_5y", "domain": "us", "title": "米国企業の5年推移", "question": "この米国企業の売上・営業利益・純利益・FCF は直近5年でどう動いたか", "mart": "m_us_fin_annual", "sql": "SELECT fiscal_year, fiscal_year_end, name,\n       ROUND(revenue_usd / 1e6, 0) AS revenue_musd, ROUND(operating_income_usd / 1e6, 0) AS operating_income_musd,\n       ROUND(net_income_usd / 1e6, 0) AS net_income_musd, ROUND(fcf_usd / 1e6, 0) AS fcf_musd,\n       ROUND(operating_margin * 100, 1) AS operating_margin_pct, ROUND(sales_growth_1y * 100, 1) AS sales_growth_pct\nFROM m_us_fin_annual\nWHERE ticker = {{ticker}}\nORDER BY fiscal_year_end", "params": [{"name": "ticker", "label": "ティッカー", "type": "string", "default": "AAPL"}], "chart": {"type": "line", "x": "fiscal_year", "y": ["revenue_musd", "operating_income_musd", "net_income_musd", "fcf_musd"], "series": null}, "note": "金額は百万ドル。年度は期末日の年。"}, {"id": "us_industry_margin", "domain": "us", "title": "業種別の営業利益率（米国）", "question": "米国の業種（SIC）ごとに営業利益率はどれくらいか", "mart": "m_us_fin_annual", "sql": "SELECT COALESCE(industry, '(不明)') AS industry_name, COUNT(*) AS companies,\n       ROUND(AVG(operating_margin) * 100, 1) AS avg_operating_margin_pct,\n       ROUND(SUM(operating_income_usd) / NULLIF(SUM(revenue_usd), 0) * 100, 1) AS weighted_margin_pct\nFROM m_us_fin_annual\nWHERE fiscal_year = {{fiscal_year}} AND revenue_usd > 0 AND operating_margin BETWEEN -1 AND 1\nGROUP BY industry_name\nHAVING COUNT(*) >= {{min_companies}}\nORDER BY weighted_margin_pct DESC\nLIMIT {{limit}}", "params": [{"name": "fiscal_year", "label": "年度（期末の年）", "type": "int", "default": 2025, "min": 2015, "max": 2030}, {"name": "min_companies", "label": "業種の最少社数", "type": "int", "default": 5, "min": 1, "max": 500}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "industry_name", "y": "weighted_margin_pct", "series": null}, "note": "weighted は業種の営業利益合計÷売上合計（大企業の影響が大きい）。avg は会社ごとの単純平均。"}, {"id": "us_industry_growth", "domain": "us", "title": "業種別の売上成長率（米国）", "question": "米国のどの業種が売上を伸ばしているか", "mart": "m_us_fin_annual", "sql": "SELECT COALESCE(industry, '(不明)') AS industry_name, COUNT(*) AS companies,\n       ROUND(AVG(sales_growth_1y) * 100, 1) AS avg_sales_growth_pct,\n       ROUND(SUM(CASE WHEN sales_growth_1y > 0 THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 0) AS growing_share_pct\nFROM m_us_fin_annual\nWHERE fiscal_year = {{fiscal_year}} AND sales_growth_1y BETWEEN -0.9 AND 3\nGROUP BY industry_name\nHAVING COUNT(*) >= {{min_companies}}\nORDER BY avg_sales_growth_pct DESC\nLIMIT {{limit}}", "params": [{"name": "fiscal_year", "label": "年度（期末の年）", "type": "int", "default": 2025, "min": 2015, "max": 2030}, {"name": "min_companies", "label": "業種の最少社数", "type": "int", "default": 5, "min": 1, "max": 500}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "industry_name", "y": "avg_sales_growth_pct", "series": null}, "note": "前年比は前の通期が330〜400日前にある会社だけ。−90%〜+300%の外は外れ値として除く。"}, {"id": "us_revenue_rank", "domain": "us", "title": "売上高ランキング（米国）", "question": "米国で売上が大きい会社はどこか", "mart": "m_us_fin_annual", "sql": "SELECT ticker, name, industry, ROUND(revenue_usd / 1e9, 1) AS revenue_busd, ROUND(operating_margin * 100, 1) AS operating_margin_pct,\n       ROUND(sales_growth_1y * 100, 1) AS sales_growth_pct\nFROM m_us_fin_annual\nWHERE fiscal_year = {{fiscal_year}} AND revenue_usd > 0\nORDER BY revenue_usd DESC\nLIMIT {{limit}}", "params": [{"name": "fiscal_year", "label": "年度（期末の年）", "type": "int", "default": 2025, "min": 2015, "max": 2030}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "ticker", "y": "revenue_busd", "series": null}, "note": "売上は十億ドル。"}, {"id": "us_fcf_margin_rank", "domain": "us", "title": "FCFマージンの高い会社（米国）", "question": "売上に対してフリーCFを多く生む米国企業はどこか", "mart": "m_us_fin_annual", "sql": "SELECT ticker, name, industry, ROUND(revenue_usd / 1e9, 1) AS revenue_busd, ROUND(fcf_margin * 100, 1) AS fcf_margin_pct,\n       ROUND(operating_margin * 100, 1) AS operating_margin_pct\nFROM m_us_fin_annual\nWHERE fiscal_year = {{fiscal_year}} AND revenue_usd >= {{min_revenue_busd}} * 1e9 AND fcf_margin BETWEEN -1 AND 1\nORDER BY fcf_margin DESC\nLIMIT {{limit}}", "params": [{"name": "fiscal_year", "label": "年度（期末の年）", "type": "int", "default": 2025, "min": 2015, "max": 2030}, {"name": "min_revenue_busd", "label": "売上の下限（十億ドル）", "type": "number", "default": 1, "min": 0, "max": 1000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "ticker", "y": "fcf_margin_pct", "series": null}, "note": "FCF＝営業CF−設備投資。"}, {"id": "us_shareholder_return_rank", "domain": "us", "title": "株主還元額ランキング（米国）", "question": "配当と自社株買いで株主に多く返している米国企業はどこか", "mart": "m_us_fin_annual", "sql": "SELECT ticker, name, ROUND((COALESCE(dividends_paid_usd, 0) + COALESCE(buyback_usd, 0)) / 1e9, 1) AS total_return_busd,\n       ROUND(COALESCE(dividends_paid_usd, 0) / 1e9, 1) AS dividends_busd, ROUND(COALESCE(buyback_usd, 0) / 1e9, 1) AS buyback_busd,\n       ROUND((COALESCE(dividends_paid_usd, 0) + COALESCE(buyback_usd, 0)) / NULLIF(fcf_usd, 0) * 100, 0) AS payout_of_fcf_pct\nFROM m_us_fin_annual\nWHERE fiscal_year = {{fiscal_year}} AND (dividends_paid_usd IS NOT NULL OR buyback_usd IS NOT NULL)\nORDER BY total_return_busd DESC\nLIMIT {{limit}}", "params": [{"name": "fiscal_year", "label": "年度（期末の年）", "type": "int", "default": 2025, "min": 2015, "max": 2030}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "ticker", "y": ["dividends_busd", "buyback_busd"], "series": null}, "note": "payout_of_fcf は還元額÷FCF（100%超は FCF 以上を返している）。"}, {"id": "us_roe_distribution", "domain": "us", "title": "ROEの分布（米国）", "question": "米国企業のROEはどう分布しているか", "mart": "m_us_fin_annual", "sql": "SELECT CASE WHEN roe < 0 THEN '1 赤字' WHEN roe < 0.05 THEN '2 0〜5%' WHEN roe < 0.10 THEN '3 5〜10%' WHEN roe < 0.15 THEN '4 10〜15%' WHEN roe < 0.25 THEN '5 15〜25%' ELSE '6 25%以上' END AS roe_band,\n       COUNT(*) AS companies\nFROM m_us_fin_annual\nWHERE fiscal_year = {{fiscal_year}} AND roe IS NOT NULL\nGROUP BY roe_band\nORDER BY roe_band", "params": [{"name": "fiscal_year", "label": "年度（期末の年）", "type": "int", "default": 2025, "min": 2015, "max": 2030}], "chart": {"type": "bar", "x": "roe_band", "y": "companies", "series": null}, "note": "ROE＝純利益÷株主資本（株主資本が正の会社だけ）。"}, {"id": "us_seg_company", "domain": "us", "title": "米国企業のセグメント別売上の推移", "question": "この米国企業の売上は、事業・製品・地域ごとにどう動いたか", "mart": "m_us_segments", "sql": "SELECT fiscal_year, segment_name, ROUND(revenue_usd / 1e6, 0) AS revenue_musd, ROUND(operating_income_usd / 1e6, 0) AS operating_income_musd,\n       ROUND(revenue_share * 100, 1) AS revenue_share_pct, ROUND(revenue_growth_1y * 100, 1) AS revenue_growth_pct\nFROM m_us_segments\nWHERE ticker = {{ticker}} AND axis_ja = {{axis_ja}}\nORDER BY fiscal_year, revenue_usd DESC", "params": [{"name": "ticker", "label": "ティッカー", "type": "string", "default": "AAPL"}, {"name": "axis_ja", "label": "軸（事業／製品・サービス／地域）", "type": "string", "default": "製品・サービス"}], "chart": {"type": "bar", "x": "fiscal_year", "y": "revenue_musd", "series": "segment_name"}, "note": "SEC の決算データ（Financial Statement Data Sets）。会社が開示した軸だけ。比率は全社売上に対する割合。製品・サービスの軸には「Product」「Service」のような合計の行と内訳の行が並ぶ会社があり、足すと100%を超えることがある。"}, {"id": "us_seg_latest_mix", "domain": "us", "title": "最新期のセグメント構成（米国）", "question": "この米国企業の最新期の売上は、どのセグメントにどれだけ依存しているか", "mart": "m_us_segments", "sql": "SELECT axis_ja, segment_name, ROUND(revenue_usd / 1e6, 0) AS revenue_musd, ROUND(revenue_share * 100, 1) AS revenue_share_pct,\n       ROUND(operating_margin * 100, 1) AS operating_margin_pct, ROUND(revenue_growth_1y * 100, 1) AS revenue_growth_pct\nFROM m_us_segments\nWHERE ticker = {{ticker}} AND is_latest\nORDER BY axis_ja, revenue_usd DESC", "params": [{"name": "ticker", "label": "ティッカー", "type": "string", "default": "AAPL"}], "chart": {"type": "bar", "x": "segment_name", "y": "revenue_share_pct", "series": "axis_ja"}, "note": "営業利益をセグメント別に開示するのは主に事業セグメント。"}, {"id": "us_seg_fastest", "domain": "us", "title": "伸びているセグメント（米国）", "question": "売上の大きいセグメントのうち、前年比で最も伸びているのはどれか", "mart": "m_us_segments", "sql": "SELECT ticker, name, axis_ja, segment_name, fiscal_year, ROUND(revenue_usd / 1e6, 0) AS revenue_musd,\n       ROUND(revenue_growth_1y * 100, 1) AS revenue_growth_pct, ROUND(revenue_share * 100, 1) AS revenue_share_pct\nFROM m_us_segments\nWHERE is_latest AND revenue_usd >= {{min_revenue_musd}} * 1e6 AND revenue_growth_1y IS NOT NULL AND revenue_growth_1y <= 10\nORDER BY revenue_growth_1y DESC\nLIMIT {{limit}}", "params": [{"name": "min_revenue_musd", "label": "セグメント売上の下限（百万ドル）", "type": "number", "default": 1000, "min": 0, "max": 1000000}, {"name": "li function martsUsed(sql){ return Object.keys(BI.marts).filter(m => new RegExp("\\b"+m+"\\b").test(sql)); }
function wrapSql(sql){
  const used = martsUsed(sql);
  if(!used.length) throw new Error("マート名（"+Object.keys(BI.marts).join("・")+"）を FROM に書いてください");
  let body = sql.trim().replace(/;\s*$/,"");
  if(!/^(select|with)\b/i.test(body) || /;/.test(body)) throw new Error("SELECT または WITH で始まる1文だけ実行できます");
  // 実体化済みのマートは小さな表（bi データセット）を直接読む。未実体化のものだけ元の表から組み立てる（読む量が大きい）
  const tables = used.filter(m => BI.marts[m].table), ctes = used.filter(m => !BI.marts[m].table);
  tables.forEach(m => { body = body.replace(new RegExp("\\b"+m+"\\b","g"), "`"+BI.marts[m].table+"`"); });
  // 外側で SELECT * FROM (...) に包むと ORDER BY の順が保証されないため、本文はそのまま使い LIMIT が無ければ足す
  if(!/\blimit\s+\d+(\s+offset\s+\d+)?\s*$/i.test(body)) body += "\nLIMIT 1000";
  if(!ctes.length) return body;
  const defs = ctes.map(m => m + " AS (\n" + BI.marts[m].sql.trim().replace(/;\s*$/,"") + "\n)").join(",\n");
  return /^with\b/i.test(body) ? "WITH " + defs + ",\n" + body.replace(/^with\s+/i, "") : "WITH " + defs + "\n" + body;
}
function bindParams(sql, params, values){
  return sql.replace(/\{\{(\w+)\}\}/g, (_, name) => {
    const p = (params||[]).find(x => x.name === name);
    if(!p) throw new Error("未定義のパラメータ: "+name);
    const v = values[name] ?? p.default ?? "";
    if(p.type === "number" || p.type === "int"){
      const n = Number(v); if(String(v).trim()==="" || !Number.isFinite(n)) throw new Error((p.label||p.name)+" は数値で入れてください");
      if(p.type === "int" && !Number.isInteger(n)) throw new Error((p.label||p.name)+" は整数で入れてください");
      if(p.min != null && n < p.min || p.max != null && n > p.max) throw new Error(`${p.label||p.name} は ${p.min ?? "−∞"}〜${p.max ?? "∞"} の範囲で入れてください`);
      return String(n);
    }
    // BigQuery（GoogleSQL）の文字列はバックスラッシュでエスケープする（'' の二重化は受け付けない）
    return "'" + String(v).replace(/\\/g,"\\\\").replace(/'/g,"\\'") + "'";
  });
}

async function runBQ(sql){

  const r = await mcp.callTool(SERVER, TOOL, {projectId: BI.project, query: sql, timeoutMs: 60000}, {cache:{staleTime:300000, gcTime:3600000}});
  const p = r.payload || {};
  if(typeof p === "string") throw {code:"tool_error", message:p};
  if(p.jobComplete === false) throw {code:"tool_error", message:"60秒以内に終わりませんでした。条件を絞ってください。"};
  const fields = (p.schema && p.schema.fields) || [];
  const num = fields.map(f => /INT|FLOAT|NUMERIC|DOUBLE/.test(f.type));
  const rows = (p.rows||[]).map(r => r.f.map((c,i) => c.v === null ? null : num[i] ? Number(c.v) : c.v));
  return {columns: fields.map(f => f.name), num, rows, billed: Number(p.totalBytesBilled||0), cached: !!(r.cache)};
}

  $("fMart").onchange = e => { FREE = {mart:e.target.value, dims:[], measures:[], filters:[], chart:FREE.chart}; buildFree(); };
  $("fChart").onchange = e => { FREE.chart = e.target.value; runFree(); };
  $("p-free").querySelectorAll("[data-dim]").forEach(s => s.onchange = () => { FREE.dims[+s.dataset.dim] = s.value; runFree(); });
  $("p-free").querySelectorAll("[data-magg]").forEach(s => s.onchange = () => { FREE.measures[+s.dataset.magg].agg = s.value; runFree(); });
  $("p-free").querySelectorAll("[data-mcol]").forEach(s => s.onchange = () => { FREE.measures[+s.dataset.mcol].col = s.value; runFree(); });
  $("p-free").querySelectorAll("[data-deldim]").forEach(b => b.onclick = () => { FREE.dims.splice(+b.dataset.deldim,1); buildFree(); runFree(); });
  $("p-free").querySelectorAll("[data-delmeas]").forEach(b => b.onclick = () => { FREE.measures.splice(+b.dataset.delmeas,1); buildFree(); runFree(); });
  $("p-free").querySelectorAll("[data-delf]").forEach(b => b.onclick = () => { FREE.filters.splice(+b.dataset.delf,1); buildFree(); runFree(); });
  $("fAddDim").onclick = () => { const c = dimCols.find(c=>!FREE.dims.includes(c.name)); if(c){ FREE.dims.push(c.name); buildFree(); } };
  $("fAddMeas").onclick = () => { if(numCols[0]){ FREE.measures.push({col:numCols[0].name, agg:"AVG"}); buildFree(); } };
  $("fGo").onclick = runFree;
}
function qid(n){ if(!/^[A-Za-z_][A-Za-z0-9_]*$/.test(n)) throw new Error("列名が不正です: "+n); return n; }
function lit(v){ return typeof v === "number" ? String(v) : "'" + String(v).replace(/\\/g,"\\\\").replace(/'/g,"\\'") + "'"; }
function freeSql(){
  const cols = martCols(FREE.mart).map(c=>c.name);
  const ok = n => { if(!cols.includes(n)) throw new Error("このマートに無い列です: "+n); return qid(n); };
  const dims = FREE.dims.map(ok);
  const meas = FREE.measures.map(m => m.col==="*" ? `COUNT(*) AS cnt` : `${m.agg}(${ok(m.col)}) AS ${m.agg.toLowerCase()}_${m.col}`);
  if(!meas.length) throw new Error("指標を1つ以上選んでください");
  const where = FREE.filters.map(f => f.value === null ? `${ok(f.col)} IS NULL` : `${ok(f.col)} = ${lit(f.value)}`);
  return `SELECT ${[...dims, ...meas].join(", ")}\nFROM ${FREE.mart}` + (where.length?`\nWHERE ${where.join(" AND ")}`:"")
    + (dims.length ? `\nGROUP BY ${dims.join(", ")}\nORDER BY ` + (dims.length===1 && /year/.test(dims[0]) ? dims[0] : `${dims.length+1} DESC`) : "")
    + `\nLIMIT 500`;
}
async function runFree(){
  let sql;
  try{ sql = wrapSql(freeSql()); }catch(e){ $("result").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
  $("result").innerHTML = `<div class="msg">BigQuery で集計中…</div>`;
  try{
    const res = await runBQ(sql);
    const spec = {type: FREE.chart, x: FREE.dims[0], y: res.columns.filter((c,i)=>res.num[i] && !FREE.dims.includes(c)).slice(0, FREE.chart==="scatter"?2:3), series: FREE.dims[1]};
    render(res, spec, (row, r) => {   // 連動選択：クリックした行の軸の値で絞り込む
      FREE.dims.forEach(d => { const v = row[r.columns.indexOf(d)]; if(!FREE.filters.some(f=>f.col===d&&f.value===v)) FREE.filters.push({col:d, value:v}); });
      if(FREE.dims.length) FREE.dims = FREE.dims.length > 1 ? FREE.dims.slice(1) : FREE.dims;
      buildFree(); runFree();
    });
    showSql(sql, $("result")); logRun("自由分析", FREE.mart+"："+FREE.dims.join("×"), freeSql());
  }catch(e){ $("result").innerHTML = `<div class="msg err">${esc(errText(e))}</div>`; showSql(sql, $("result")); }
}

/* ── スロット（名前付き保存）と履歴：自分だけが読める data/users/<id>/ に保存する ── */
let db = null, me = null, SLOTS = [], HIST = [];
function ucol(name){ return db && me ? db.collection(`data/users/${me}/${name}`) : null; }
async function loadSlots(){
  const s = ucol("slots"), h = ucol("history"); if(!s) return;
  try{ SLOTS = (await s.orderBy("order").get()).docs.map(d => ({id:d.id, ...d.data()})); }catch(e){ SLOTS = []; }
  try{ HIST = (await h.orderBy("at","desc").limit(50).get()).docs.map(d => ({id:d.id, ...d.data()})); }catch(e){ HIST = []; }
}
let LASTLOG = "";
async function logRun(kind, title, sql){
  const h = ucol("history"); if(!h || !sql) return;
  const key = kind + "\u0000" + sql; if(key === LASTLOG) return; LASTLOG = key;   // 同じ実行の連打は1件に
  try{ await h.add({kind, title: String(title||"").slice(0,80), sql: String(sql).slice(0,20000), at: new Date().toISOString()}); }catch(e){}
}
async function saveSlot(name, sql){
  const s = ucol("slots"), msg = $("slotMsg");
  if(!s){ msg.textContent = "このページでは保存できません（Claude の画面で開くと使えます）"; return; }
  name = String(name||"").trim(); if(!name){ msg.textContent = "スロット名を入れてください"; return; }
  if(!String(sql||"").trim()){ msg.textContent = "保存する SQL がありません"; return; }
  const order = SLOTS.length ? Math.max(...SLOTS.map(x=>x.order||0)) + 1 : 1;
  try{ await s.add({name: name.slice(0,60), sql: String(sql).slice(0,20000), order, at: new Date().toISOString()}); msg.textContent = "保存しました"; await loadSlots(); }
  catch(e){ msg.textContent = "保存できませんでした（" + (e && e.code || "error") + "）"; }
}
async function renderSlots(){
  const el = $("p-slot");
  if(!db || !me){ el.innerHTML = `<div class="msg warn">スロットは Claude の画面で開いたときに使えます（自分だけが見える場所に保存します）。</div>`; return; }
  el.innerHTML = `<div class="msg">読み込み中…</div>`; await loadSlots();
  const row = (x, kind) => `<tr><td>${esc(kind==="slot"? x.name : x.title)}</td><td class="note">${esc(kind==="slot"? "" : x.kind)}</td><td class="note">${esc((x.at||"").slice(0,16).replace("T"," "))}</td>
    <td><button class="ghost" data-run="${kind}:${esc(x.id)}">実行</button> <button class="ghost" data-load="${kind}:${esc(x.id)}">SQL欄へ</button>
    ${kind==="slot"? `<button class="ghost" data-up="${esc(x.id)}" aria-label="上へ">↑</button> <button class="ghost" data-del="${esc(x.id)}">削除</button>` : `<button class="ghost" data-keep="${esc(x.id)}">スロットに保存</button>`}</td></tr>`;
  el.innerHTML = `<p class="q">スロット</p><p class="note">よく使う SQL に名前を付けて保存したもの。SQL タブの「SQLをスロットに保存」か、下の履歴から保存できます。</p>
    <div class="tablebox"><table><tbody>${SLOTS.map(x=>row(x,"slot")).join("") || `<tr><td class="note">まだありません</td></tr>`}</tbody></table></div>
    <p class="q" style="margin-top:16px">最近の実行（50件）</p>
    <div class="tablebox"><table><tbody>${HIST.map(x=>row(x,"hist")).join("") || `<tr><td class="note">まだありません</td></tr>`}</tbody></table></div>`;
  const find = k => { const [kind,id] = k.split(":"); return (kind==="slot"? SLOTS : HIST).find(x=>x.id===id); };
  el.querySelectorAll("[data-run]").forEach(b => b.onclick = () => { const x = find(b.dataset.run); if(x){ $("sqlText").value = x.sql; tab("sql"); $("sqlGo").click(); } });
  el.querySelectorAll("[data-load]").forEach(b => b.onclick = () => { const x = find(b.dataset.load); if(x){ $("sqlText").value = x.sql; tab("sql"); } });
  el.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { try{ await ucol("slots").doc(b.dataset.del).delete(); }catch(e){} renderSlots(); });
  el.querySelectorAll("[data-keep]").forEach(b => b.onclick = async () => { const x = HIST.find(h=>h.id===b.dataset.keep); if(x){ await saveSlot(x.title || x.kind, x.sql); renderSlots(); } });
  el.querySelectorAll("[data-up]").forEach(b => b.onclick = async () => {
    const i = SLOTS.findIndex(x=>x.id===b.dataset.up); if(i<=0) return;
    const a = SLOTS[i], p = SLOTS[i-1];
    try{ await ucol("slots").doc(a.id).update({order: p.order}); await ucol("slots").doc(p.id).update({order: a.order}); }catch(e){}
    renderSlots();
  });
}

let BLD = {mart:"", cols:[], aggs:{}, conds:[], order:"", dir:"DESC", limit:100};
function buildBuilder(){
  const marts = Object.keys(BI.marts); if(!BLD.mart) BLD.mart = marts.includes("m_screener") ? "m_screener" : marts[0];
  const cols = martCols(BLD.mart);
  const lab = c => esc(c.label ? `${c.label}（${c.name}）` : c.name);
  $("bld").innerHTML = `
    <div class="row"><label class="f">マート<select id="bMart">${marts.map(m=>`<option ${m===BLD.mart?"selected":""}>${esc(m)}</option>`).join("")}</select></label>
      <label class="f">件数<input id="bLimit" value="${BLD.limit}" inputmode="numeric" style="width:6em"></label>
      <label class="f">並べ替え<select id="bOrder"><option value="">（なし）</option>${cols.map(c=>`<option value="${esc(c.name)}" ${c.name===BLD.order?"selected":""}>${lab(c)}</option>`).join("")}</select></label>
      <label class="f">向き<select id="bDir"><option ${BLD.dir==="DESC"?"selected":""}>DESC</option><option ${BLD.dir==="ASC"?"selected":""}>ASC</option></select></label></div>
    <p class="note" style="margin:8px 0 4px">列（押すと選択。数値の列は集計も選べる。集計を付けると他の列でまとめる）</p>
    <div class="chips">${cols.map(c=>`<button class="ghost" data-col="${esc(c.name)}" aria-pressed="${BLD.cols.includes(c.name)}" style="${BLD.cols.includes(c.name)?"background:var(--accent-soft)":""}">${lab(c)}</button>`).join("")}</div>
    <div class="mlist">${BLD.cols.filter(n=>isNum(cols.find(c=>c.name===n)||{})).map(n=>`<div class="mrow"><span class="note">${esc(n)} の集計</span><select data-agg="${esc(n)}">${["","SUM","AVG","MIN","MAX","COUNT"].map(a=>`<option ${a===(BLD.aggs[n]||"")?"selected":""} value="${a}">${a||"そのまま"}</option>`).join("")}</select></div>`).join("")}</div>
    <p class="note" style="margin:8px 0 4px">条件</p>
    <div class="mlist">${BLD.conds.map((k,i)=>`<div class="mrow"><select data-ccol="${i}">${cols.map(c=>`<option value="${esc(c.name)}" ${c.name===k.col?"selected":""}>${lab(c)}</option>`).join("")}</select>
      <select data-cop="${i}">${["=","<>",">=","<=",">","<","LIKE","IS NULL","IS NOT NULL"].map(o=>`<option ${o===k.op?"selected":""}>${o}</option>`).join("")}</select>
      <input data-cval="${i}" value="${esc(k.val??"")}" placeholder="値"><button class="ghost" data-cdel="${i}" aria-label="条件を外す">×</button></div>`).join("")}</div>
    <div class="row" style="margin-top:6px"><button class="ghost" id="bAddCond">＋ 条件</button><button class="go" id="bMake">SQL を組み立てる</button></div>`;
  const re = () => buildBuilder();
  $("bMart").onchange = e => { BLD = {mart:e.target.value, cols:[], aggs:{}, conds:[], order:"", dir:"DESC", limit:BLD.limit}; re(); };
  $("bLimit").onchange = e => BLD.limit = e.target.value; $("bOrder").onchange = e => BLD.order = e.target.value; $("bDir").onchange = e => BLD.dir = e.target.value;
  $("bld").querySelectorAll("[data-col]").forEach(b => b.onclick = () => { const n=b.dataset.col; BLD.cols = BLD.cols.includes(n) ? BLD.cols.filter(x=>x!==n) : [...BLD.cols, n]; re(); });
  $("bld").querySelectorAll("[data-agg]").forEach(s => s.onchange = () => { BLD.aggs[s.dataset.agg] = s.value; });
  $("bld").querySelectorAll("[data-ccol]").forEach(s => s.onchange = () => BLD.conds[+s.dataset.ccol].col = s.value);
  $("bld").querySelectorAll("[data-cop]").forEach(s => s.onchange = () => BLD.conds[+s.dataset.cop].op = s.value);
  $("bld").querySelectorAll("[data-cval]").forEach(s => s.oninput = () => BLD.conds[+s.dataset.cval].val = s.value);
  $("bld").querySelectorAll("[data-cdel]").forEach(b => b.onclick = () => { BLD.conds.splice(+b.dataset.cdel,1); re(); });
  $("bAddCond").onclick = () => { BLD.conds.push({col: cols[0] && cols[0].name, op: ">=", val: ""}); re(); };
  $("bMake").onclick = () => { try{ $("sqlText").value = builderSql(); }catch(e){ $("slotMsg").textContent = e.message; } };
}
function builderSql(){
  const cols = martCols(BLD.mart), names = cols.map(c=>c.name);
  const ok = n => { if(!names.includes(n)) throw new Error("列がありません: "+n); return qid(n); };
  if(!BLD.cols.length) throw new Error("列を1つ以上選んでください");
  const agg = BLD.cols.filter(n => BLD.aggs[n]), plain = BLD.cols.filter(n => !BLD.aggs[n]);
  const sel = [...plain.map(ok), ...agg.map(n => `${BLD.aggs[n]}(${ok(n)}) AS ${BLD.aggs[n].toLowerCase()}_${n}`)];
  const num = n => isNum(cols.find(c=>c.name===n)||{});
  const where = BLD.conds.filter(k=>k.col).map(k => /NULL/.test(k.op) ? `${ok(k.col)} ${k.op}` :
    `${ok(k.col)} ${k.op} ${num(k.col) && k.op!=="LIKE" ? (Number.isFinite(Number(k.val)) && String(k.val).trim()!=="" ? Number(k.val) : (()=>{throw new Error(k.col+" は数値で入れてください")})()) : lit(k.op==="LIKE" && !/%/.test(k.val) ? "%"+k.val+"%" : k.val)}`);
  const lim = Math.min(1000, Math.max(1, parseInt(BLD.limit,10) || 100));
  let q = `SELECT ${sel.join(", ")}\nFROM ${BLD.mart}`;
  if(where.length) q += `\nWHERE ${where.join("\n  AND ")}`;
  if(agg.length && plain.length) q += `\nGROUP BY ${plain.map(ok).join(", ")}`;
  if(BLD.order) q += `\nORDER BY ${agg.includes(BLD.order) ? BLD.aggs[BLD.order].toLowerCase()+"_"+BLD.order : ok(BLD.order)} ${BLD.dir}`;
  return q + `\nLIMIT ${lim}`;
}

  "成長の質": ["sec_code4","name","sales_cagr_3y","op_income_cagr_3y","net_income_cagr_3y","consec_up_years","roic","peg"],
};
const SCR_PRESETS = {
  "割安高配当": [["pbr","<=",1],["dividend_yield",">=",0.03]],
  "高ROE×低PER": [["roe",">=",0.15],["per","<=",15],["per",">",0]],
  "増収増益": [["sales_growth_1y",">=",0.05],["op_income_growth_1y",">=",0.05]],
  "ネットキャッシュ": [["net_cash",">",0],["pbr","<=",1.2]],
  "高成長": [["sales_cagr_3y",">=",0.15]],
  "高配当": [["dividend_yield",">=",0.04]],
  "3か月モメンタム": [["return_3m",">=",0.2]],
  "売買代金が大きい割安株": [["avg_turnover_20d",">=",1e9],["pbr","<=",1]],
  "高ROIC×EV/EBITDA割安": [["roic",">=",0.1],["ev_ebitda",">",0],["ev_ebitda","<=",8]],
  "土地含み益に対して割安": [["re_gain_to_mcap",">=",0.3]],
  "資産バリュー1倍超": [["asset_value_ratio",">=",1]],
  "Fスコア7以上×安全": [["f_score",">=",7],["current_ratio",">=",1.5],["accrual_ratio","<=",0]],
  "FCF×総還元": [["fcf_yield",">=",0.06],["total_payout_yield",">=",0.04]],
  "成長に割安（PEG）": [["peg",">",0],["peg","<=",0.8],["net_income_cagr_3y",">=",0.1]],
  "増収増益が3期以上": [["consec_up_years",">=",3],["roic",">=",0.08]],
};
let SCR = {filters:[], set:"概要", sort:"market_cap", dir:"DESC", page:0, industries:[]};
function scrCols(){ return martCols(scrMart()); }
function buildScreener(){
  const el = $("p-scr");
  if(!BI.marts[scrMart()]){ el.innerHTML = `<div class="msg warn">スクリーナー用の表（m_screener）はまだ書き出されていません。次の書き出しのあとに再公開します。</div>`; return; }
  const cols = scrCols(), names = cols.map(c=>c.name), lab = n => { const c = cols.find(x=>x.name===n); return esc(c && c.label || n); };
  const numCols = cols.filter(isNum);
  el.innerHTML = `
    <div class="row"><p class="q" style="margin:0">企業スクリーナー</p>
      <label class="f">市場<select id="scrMkt"><option value="jp" ${SCR_MKT==="jp"?"selected":""}>日本株</option><option value="us" ${SCR_MKT==="us"?"selected":""}>米国株（USD）</option></select></label></div>
    <p class="note">${SCR_MKT==="us" ? "NYSE・Nasdaq の普通株（SEC の財務×最新の終値）。金額は USD。EV/EBITDA・Fスコアは取り直しが済んだ銘柄から入る。" : "全上場企業（最新の決算期×最新の終値）。"}比率は % で入れてください（例 ROE 15 → 15%）。52週位置は 0〜100。</p>
    <div class="chips">${Object.keys(scrPresets()).map(k=>`<button class="ghost" data-pre="${esc(k)}">${esc(k)}</button>`).join("")}<button class="ghost" id="scrClear">条件をすべて外す</button></div>
    <div class="chips" id="scrChips">${SCR.filters.map((f,i)=>`<span class="chip">${lab(f[0])} ${esc(f[1])} ${esc(fmtIn(f[0],f[2]))}<button data-fdel="${i}" aria-label="条件を外す">×</button></span>`).join("") || `<span class="note" style="margin:0">条件なし（全社）</span>`}</div>
    <div class="row">
      <label class="f">列<select id="scrCol">${numCols.map(c=>`<option value="${esc(c.name)}">${lab(c.name)}</option>`).join("")}</select></label>
      <label class="f">比較<select id="scrOp"><option>&gt;=</option><option>&lt;=</option><option>&gt;</option><option>&lt;</option></select></label>
      <label class="f">値<input id="scrVal" inputmode="decimal" style="width:7em" placeholder="例 10"></label>
      <button class="ghost" id="scrAdd">＋ 条件</button>
      ${names.includes("industry") ? `<label class="f">業種（含む）<input id="scrInd" placeholder="例 情報・通信" value="${esc(SCR.industries.join(","))}"></label>` : ""}
    </div>
    <div class="row" style="margin-top:8px">
      <label class="f">列セット<select id="scrSet">${Object.keys(scrSets()).map(k=>`<option ${k===SCR.set?"selected":""}>${esc(k)}</option>`).join("")}</select></label>
      <label class="f">並べ替え<select id="scrSort">${numCols.map(c=>`<option value="${esc(c.name)}" ${c.name===SCR.sort?"selected":""}>${lab(c.name)}</option>`).join("")}</select></label>
      <label class="f">向き<select id="scrDir"><option ${SCR.dir==="DESC"?"selected":""} value="DESC">大きい順</option><option ${SCR.dir==="ASC"?"selected":""} value="ASC">小さい順</option></select></label>
      <button class="go" id="scrGo">検索</button>
      <label class="f">保存名<input id="scrName" placeholder="例：自分の割安株"></label><button class="ghost" id="scrSave">条件をスロットに保存</button><span class="note" id="scrMsg"></span>
    </div>`;
  $("scrMkt").onchange = e => { SCR_MKT = e.target.value; SCR = {filters:[], set:"概要", sort: SCR_MKT==="us" ? "market_cap_bn_usd" : "market_cap", dir:"DESC", page:0, industries:[]}; buildScreener(); runScreener(); };
  el.querySelectorAll("[data-pre]").forEach(b => b.onclick = () => { SCR.filters = scrPresets()[b.dataset.pre].filter(f=>names.includes(f[0])).map(f=>f.slice()); SCR.page = 0; buildScreener(); runScreener(); });
  el.querySelectorAll("[data-fdel]").forEach(b => b.onclick = () => { SCR.filters.splice(+b.dataset.fdel,1); SCR.page=0; buildScreener(); runScreener(); });
  $("scrClear").onclick = () => { SCR.filters = []; SCR.industries = []; SCR.page = 0; buildScreener(); runScreener(); };
  $("scrAdd").onclick = () => { const c=$("scrCol").value, raw=$("scrVal").value.trim(); const n = Number(raw);
    if(raw==="" || !Number.isFinite(n)){ $("scrMsg").textContent = "値は数値で入れてください"; return; }
    SCR.filters.push([c, $("scrOp").value, isRatio(c) ? n/100 : n]); SCR.page=0; buildScreener(); runScreener(); };
  if($("scrInd")) $("scrInd").onchange = e => { SCR.industries = e.target.value.split(/[,、]/).map(x=>x.trim()).filter(Boolean); SCR.page=0; runScreener(); };
  $("scrSet").onchange = e => { SCR.set = e.target.value; runScreener(); };
  $("scrSort").onchange = e => { SCR.sort = e.target.value; SCR.page=0; runScreener(); };
  $("scrDir").onchange = e => { SCR.dir = e.target.value; SCR.page=0; runScreener(); };
  $("scrGo").onclick = () => { SCR.page=0; runScreener(); };
  $("scrSave").onclick = async () => { try{ const q = screenerSql(); $("slotMsg").textContent=""; await saveSlot($("scrName").value, q); $("scrMsg").textContent = $("slotMsg").textContent || "保存しました"; }catch(e){ $("scrMsg").textContent = e.message; } };
}
function isRatio(n){ return /margin|ratio|roe|roa|roic|yield|growth|cagr|return_|payout|to_mcap|to_equity|^doe$|^tax_rate$|_chg_1y$/.test(n) && !/de_ratio|current_ratio|asset_value_ratio/.test(n); }
function fmtIn(n, v){ return isRatio(n) ? (v*100).toFixed(1).replace(/\.0$/,"")+"%" : Number(v).toLocaleString("ja-JP"); }
function screenerSql(){
  const names = scrCols().map(c=>c.name);
  const ok = n => { if(!names.includes(n)) throw new Error("列がありません: "+n); return qid(n); };
  const sets = scrSets(), show = [...new Set([...(sets[SCR.set]||sets["概要"]), ...SCR.filters.map(f=>f[0]), ...(names.includes("valuation_flag")?["valuation_flag"]:[])])].filter(n=>names.includes(n));
  const where = SCR.filters.map(f => { if(![">=","<=",">","<"].includes(f[1]) || !Number.isFinite(Number(f[2]))) throw new Error("条件が不正です"); return `${ok(f[0])} ${f[1]} ${Number(f[2])}`; });
  if(SCR.industries.length && names.includes("industry")) where.push("(" + SCR.industries.map(x => `industry LIKE ${lit("%"+x+"%")}`).join(" OR ") + ")");
  return `SELECT ${show.map(ok).join(", ")}, COUNT(*) OVER() AS total_hits\nFROM ${scrMart()}` + (where.length ? `\nWHERE ${where.join("\n  AND ")}` : "")
    + `\nORDER BY ${ok(SCR.sort)} ${SCR.dir === "ASC" ? "ASC" : "DESC"} NULLS LAST\nLIMIT 100 OFFSET ${SCR.page*100}`;
}
async function runScreener(){
  let q, sql; try{ q = screenerSql(); sql = wrapSql(q); }catch(e){ $("result").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
  $("result").innerHTML = `<div class="msg">BigQuery で検索中…</div>`;
  try{
    const res = await runBQ(sql);
    const ti = res.columns.indexOf("total_hits"), total = res.rows.length ? res.rows[0][ti] : 0;
    res.columns.splice(ti,1); res.num.splice(ti,1); res.rows.forEach(r=>r.splice(ti,1));
    const labs = scrCols(); res.columns = res.columns.map(n => (labs.find(c=>c.name===n)||{}).label || n);
    render(res, {type:"table"}, row => { const code = row[0]; const t = BI.templates.find(x=>x.id==="fin_company_10y"); if(SCR_MKT==="us"){ return; } if(t && code){ tab("tpl"); openTpl(t.id); const inp = $("pp-sec_code4"); if(inp){ inp.value = code; runTpl(); } } });
    const pages = Math.max(1, Math.ceil(total/100));
    $("result").insertAdjacentHTML("afterbegin", `<div class="row" style="margin:6px 0"><b>${Number(total).toLocaleString()} 社</b><span class="note">${SCR_MKT==="us" ? "" : "行をクリックで「会社の10年推移」"}</span>
      <button class="ghost" id="scrPrev" ${SCR.page<=0?"disabled":""}>前の100社</button><span class="note">${SCR.page+1} / ${pages}</span><button class="ghost" id="scrNext" ${SCR.page+1>=pages?"disabled":""}>次の100社</button></div>`);
    $("scrPrev").onclick = () => { SCR.page--; runScreener(); }; $("scrNext").onclick = () => { SCR.page++; runScreener(); };
    showSql(sql, $("result")); logRun("スクリーナー", SCR.filters.map(f=>f[0]+f[1]+f[2]).join(" ") || "全社", q);
  }catch(e){ $("result").innerHTML = `<div class="msg err">${esc(errText(e))}</div>`; showSql(sql, $("result")); }
}

/* ── タブと起動 ─────────────────────────────────── */
function tab(name){
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab===name));
  ["tpl","free","ask","scr","sql","slot"].forEach(n => $("p-"+n).hidden = n !== name);
  if(name==="slot") renderSlots(); if(name==="scr") buildScreener(); if(name==="sql") buildBuilder();
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { tab(b.dataset.tab); if(b.dataset.tab==="free"){ buildFree(); } });
$("askGo").onclick = ask; $("askStop").onclick = () => askCtl && askCtl.abort();
$("sqlGo").onclick = async () => {
  let sql; try{ sql = wrapSql($("sqlText").value); }catch(e){ $("result").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
  $("result").innerHTML = `<div class="msg">BigQuery で集計中…</div>`;
  try{ const res = await runBQ(sql); render(res, {type:"table"}); showSql(sql, $("result")); logRun("SQL", $("sqlText").value.trim().split("\n")[0].slice(0,60), $("sqlText").value); }
  catch(e){ $("result").innerHTML = `<div class="msg err">${esc(errText(e))}</div>`; showSql(sql, $("result")); }
};
$("slotSave").onclick = () => saveSlot($("slotName").value, $("sqlText").value);
$("sqlText").value = "SELECT industry, COUNT(*) AS n_companies, AVG(operating_margin) AS avg_op_margin\nFROM m_fin_annual\nWHERE fiscal_year = 2025\nGROUP BY industry\nORDER BY n_companies DESC";
buildShelf();
$("p-tpl").innerHTML = `<p class="q">左の棚からテンプレを選んでください</p><p class="note">テンプレ ${BI.templates.length} 本・マート ${Object.keys(BI.marts).length} 本（${esc(BI.built_at)} 時点の定義）。結果のクリックで「自由分析」に入ると、その値で絞り込んだまま深掘りできます。</p>`;
(async () => {
  try{ mcp = window.claude ? await window.claude.use("mcp") : null; }catch(e){ mcp = null; }
  try{ sample = window.claude ? await window.claude.use("sample") : null; }catch(e){ sample = null; }
  try{ db = window.claude ? await window.claude.use("db") : null; const u = window.claude ? await window.claude.use("user") : null; me = u ? await u.id() : null; }catch(e){ db = null; me = null; }
  const st = $("status");
  if(!mcp){ st.textContent = "BigQuery 未接続（Claude の画面で開くと使えます）"; st.className = "status bad"; return; }
  st.textContent = "BigQuery 接続可"; st.className = "status ok";
  if(BI.templates[0]) openTpl(BI.templates[0].id);
})();
</script>
