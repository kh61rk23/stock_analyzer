    ROUND((employee_count * 1.0 / prev_count - 1) * 100, 1) AS change_pct\nFROM w\nWHERE fiscal_year = {{fiscal_year}} AND prev_year = fiscal_year - 1 AND prev_count >= {{min_employees}}\nORDER BY change_count DESC\nLIMIT {{limit}}", "params": [{"name": "fiscal_year", "label": "決算年（期末の年）", "type": "int", "default": 2025, "min": 2016, "max": 2030}, {"name": "min_employees", "label": "前年の従業員数の下限", "type": "int", "default": 500, "min": 1, "max": 1000000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 500}], "chart": {"type": "bar", "x": "name", "y": "change_count", "series": null}, "note": "連結従業員数。M&Aや連結範囲の変更でも大きく動く。減少上位は並びを昇順にして見る。"}, {"id": "fin_industry_roe_trend", "domain": "finance", "title": "業種のROE推移", "question": "この業種のROEの平均は年ごとにどう動いたか", "mart": "m_fin_annual", "sql": "SELECT fiscal_year,\n       ROUND(AVG(roe) * 100, 2) AS avg_roe_pct,\n       COUNT(*) AS companies\nFROM m_fin_annual\nWHERE industry = {{industry}} AND roe BETWEEN -1 AND 1\nGROUP BY fiscal_year\nHAVING COUNT(*) >= {{min_companies}}\nORDER BY fiscal_year", "params": [{"name": "industry", "label": "業種名", "type": "string", "default": "電気機器"}, {"name": "min_companies", "label": "最低社数", "type": "int", "default": 5, "min": 1, "max": 1000}], "chart": {"type": "line", "x": "fiscal_year", "y": "avg_roe_pct", "series": null}, "note": "業種名は東証33業種に近い表記（m_company.industry と同じ値）。ROEが±100%を超える外れ値は除く。"}, {"id": "fin_net_cash_rich", "domain": "finance", "title": "ネットキャッシュが厚い会社", "question": "現預金から有利子負債を引いた手元資金が総資産に比べて厚い会社は", "mart": "m_fin_annual", "sql": "SELECT sec_code4, name, industry, cash_and_equiv, interest_bearing_debt, total_assets,\n       ROUND((cash_and_equiv - COALESCE(interest_bearing_debt, 0)) / NULLIF(total_assets, 0) * 100, 1) AS net_cash_to_assets_pct\nFROM m_fin_annual\nWHERE fiscal_year = {{fiscal_year}} AND cash_and_equiv > 0 AND total_assets >= {{min_assets}}\nORDER BY net_cash_to_assets_pct DESC\nLIMIT {{limit}}", "params": [{"name": "fiscal_year", "label": "決算年（期末の年）", "type": "int", "default": 2025, "min": 2016, "max": 2030}, {"name": "min_assets", "label": "総資産の下限（円）", "type": "number", "default": 10000000000, "min": 0}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 500}], "chart": {"type": "bar", "x": "name", "y": "net_cash_to_assets_pct", "series": null}, "note": "有利子負債が未開示の会社は負債0として扱う（過大に出る可能性）。銀行・証券は対象外にしたい場合は業種で絞る。"}, {"id": "fin_female_manager_by_industry", "domain": "finance", "title": "業種別の女性管理職比率", "question": "女性管理職の比率が高い業種は", "mart": "m_fin_annual", "sql": "WITH d AS (\n  SELECT COALESCE(industry, '(不明)') AS industry_name, female_manager_ratio\n  FROM m_fin_annual\n  WHERE fiscal_year = {{fiscal_year}} AND female_manager_ratio BETWEEN 0 AND 1\n)\nSELECT industry_name, ROUND(AVG(female_manager_ratio) * 100, 1) AS avg_female_manager_pct, COUNT(*) AS companies\nFROM d\nGROUP BY industry_name\nHAVING COUNT(*) >= {{min_companies}}\nORDER BY avg_female_manager_pct DESC", "params": [{"name": "fiscal_year", "label": "決算年（期末の年）", "type": "int", "default": 2025, "min": 2016, "max": 2030}, {"name": "min_companies", "label": "最低社数", "type": "int", "default": 5, "min": 1, "max": 1000}], "chart": {"type": "bar", "x": "industry_name", "y": "avg_female_manager_pct", "series": null}, "note": "開示が義務化された2023年3月期以降が中心。それ以前は母数が少ない。"}, {"id": "fin_sales_ranking", "domain": "finance", "title": "売上高ランキング", "question": "売上が大きい会社の一覧（営業利益率つき）", "mart": "m_fin_annual", "sql": "SELECT sec_code4, name, industry, net_sales, operating_income,\n       ROUND(operating_margin * 100, 2) AS operating_margin_pct\nFROM m_fin_annual\nWHERE fiscal_year = {{fiscal_year}} AND net_sales IS NOT NULL\nORDER BY net_sales DESC\nLIMIT {{limit}}", "params": [{"name": "fiscal_year", "label": "決算年（期末の年）", "type": "int", "default": 2025, "min": 2016, "max": 2030}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 500}], "chart": {"type": "table", "x": "name", "y": ["net_sales", "operating_income", "operating_margin_pct"], "series": null}, "note": "単位は円。"}, {"id": "geo_country_risk_trend", "domain": "geo", "title": "国別リスクの推移", "question": "この国の総合リスクとGDELT不安定度は最近どう動いたか", "mart": "m_country_risk", "sql": "SELECT risk_date, country_name_ja, composite_risk_score, gdelt_instability\nFROM m_country_risk\nWHERE country_code = {{country_code}}\nORDER BY risk_date", "params": [{"name": "country_code", "label": "国コード（ISO3）", "type": "string", "default": "CHN"}], "chart": {"type": "line", "x": "risk_date", "y": ["composite_risk_score", "gdelt_instability"], "series": null}, "note": "国コードは ISO3（JPN・USA・CHN・RUS など）。総合リスクは大きいほど高リスク。日次データは2026-06-29以降。"}, {"id": "geo_risk_surge", "domain": "geo", "title": "リスクが急上昇した国", "question": "直近でリスクが大きく上がった国はどこか", "mart": "m_country_risk", "sql": "WITH ranked AS (\n  SELECT country_code, country_name_ja, region, composite_risk_score,\n         ROW_NUMBER() OVER (PARTITION BY country_code ORDER BY risk_date DESC) AS rn\n  FROM m_country_risk\n  WHERE composite_risk_score IS NOT NULL\n),\ncur AS (SELECT * FROM ranked WHERE rn = 1),\nprev AS (SELECT * FROM ranked WHERE rn = {{lookback}} + 1)\nSELECT cur.country_code, cur.country_name_ja, cur.region,\n       prev.composite_risk_score AS score_before,\n       cur.composite_risk_score AS score_now,\n       cur.composite_risk_score - prev.composite_risk_score AS change\nFROM cur\nJOIN prev ON prev.country_code = cur.country_code\nORDER BY change DESC\nLIMIT {{top_n}}", "params": [{"name": "lookback", "label": "何回前の観測と比べるか", "type": "int", "default": 14, "min": 1, "max": 60}, {"name": "top_n", "label": "表示する国数", "type": "int", "default": 15, "min": 1, "max": 59}], "chart": {"type": "bar", "x": "country_name_ja", "y": ["change"], "series": null}, "note": "「何回前」は日数ではなく観測行の数（日次に欠けがある国では実際の日数が少し長くなる）。マイナスは低下。"}, {"id": "geo_region_risk_now", "domain": "geo", "title": "地域別リスク平均（最新）", "question": "どの地域が今いちばんリスクが高いか", "mart": "m_country_risk", "sql": "SELECT region, ROUND(AVG(composite_risk_score), 2) AS avg_risk, COUNT(*) AS countries\nFROM m_country_risk\nWHERE risk_date = (SELECT MAX(risk_date) FROM m_country_risk)\nGROUP BY region\nORDER BY avg_risk DESC", "params": [], "chart": {"type": "bar", "x": "region", "y": ["avg_risk"], "series": null}, "note": "最新日の単純平均。国数が少ない地域（欧州・ロシア など）は1国の動きに左右される。"}, {"id": "geo_region_risk_trend", "domain": "geo", "title": "地域別リスク平均の推移", "question": "地域ごとのリスクは時間とともにどう動いたか", "mart": "m_country_risk", "sql": "SELECT risk_date, region, ROUND(AVG(composite_risk_score), 2) AS avg_risk\nFROM m_country_risk\nGROUP BY risk_date, region\nORDER BY risk_date, region", "params": [], "chart": {"type": "line", "x": "risk_date", "y": ["avg_risk"], "series": "region"}, "note": "地域内の国の単純平均。"}, {"id": "geo_high_risk_ranking", "domain": "geo", "title": "高リスク国ランキング（最新）", "question": "いま総合リスクが高い国はどこか", "mart": "m_country_risk", "sql": "SELECT country_name_ja, region, composite_risk_score, gdelt_instability,\n       foreign_ministry_level, state_dept_level, sanction_flag\nFROM m_country_risk\nWHERE risk_date = (SELECT MAX(risk_date) FROM m_country_risk)\nORDER BY composite_risk_score DESC\nLIMIT {{top_n}}", "params": [{"name": "top_n", "label": "表示する国数", "type": "int", "default": 15, "min": 1, "max": 59}], "chart": {"type": "bar", "x": "country_name_ja", "y": ["composite_risk_score"], "series": null}, "note": "外務省・国務省レベルは渡航情報の危険度（大きいほど危険）。"}, {"id": "geo_company_by_country", "domain": "geo", "title": "ある国に依存する会社", "question": "この国に権益・売上・調達で関わっている会社はどこか", "mart": "m_company_country", "sql": "SELECT COALESCE(name, ticker) AS company, ticker, exposure_type, exposure_strength,\n       revenue_share_est, latest_risk_score\nFROM m_company_country\nWHERE country_code = {{country_code}}\nORDER BY exposure_strength DESC, company", "params": [{"name": "country_code", "label": "国コード（ISO3）", "type": "string", "default": "AUS"}], "chart": {"type": "bar", "x": "company", "y": ["exposure_strength"], "series": null}, "note": "依存度は0〜1の目安（自動推定を含む）。取り込み済みの会社だけが対象で、全上場会社ではない。"}, {"id": "geo_company_countries", "domain": "geo", "title": "ある会社の依存国", "question": "この会社はどの国にどれだけ依存しているか", "mart": "m_company_country", "sql": "SELECT country_name_ja, region, exposure_type, exposure_strength, latest_risk_score, risk_weighted_score, sanction_flag\nFROM m_company_country\nWHERE sec_code4 = {{sec_code4}}\nORDER BY exposure_strength DESC, country_name_ja", "params": [{"name": "sec_code4", "label": "証券コード（4桁）", "type": "string", "default": "8058"}], "chart": {"type": "bar", "x": "country_name_ja", "y": ["exposure_strength", "risk_weighted_score"], "series": null}, "note": "日本株のみ（米国株の ticker は証券コードを持たない）。risk_weighted_score ＝ 依存度 × 最新の国リスク。"}, {"id": "geo_high_risk_dependence", "domain": "geo", "title": "高リスク国への依存が大きい会社", "question": "リスクの高い国に依存している会社はどこか", "mart": "m_company_country", "sql": "WITH d AS (\n  SELECT COALESCE(name, ticker) AS company, ticker, exposure_strength, risk_weighted_score\n  FROM m_company_country\n  WHERE latest_risk_score >= {{min_risk}}\n)\nSELECT company, ticker, COUNT(*) AS countries, SUM(exposure_strength) AS exposure_total,\n       ROUND(SUM(risk_weighted_score), 2) AS weighted_risk\nFROM d\nGROUP BY company, ticker\nORDER BY weighted_risk DESC\nLIMIT {{top_n}}", "params": [{"name": "min_risk", "label": "高リスクとみなす総合リスクの下限", "type": "number", "default": 30, "min": 0, "max": 100}, {"name": "top_n", "label": "表示する会社数", "type": "int", "default": 15, "min": 1, "max": 100}], "chart": {"type": "bar", "x": "company", "y": ["weighted_risk"], "series": null}, "note": "依存度を足し合わせた値は、権益が多い会社ほど大きくなる（会社間の優劣ではなく関与の広さの目安）。"}, {"id": "geo_sanction_exposure", "domain": "geo", "title": "制裁対象国への関与", "question": "制裁対象とされる国に関わっている会社はどこか", "mart": "m_company_country", "sql": "SELECT COALESCE(name, ticker) AS company, ticker, country_name_ja, exposure_type, exposure_strength,\n       latest_risk_score, review_flag\nFROM m_company_country\nWHERE sanction_flag = TRUE\nORDER BY exposure_strength DESC, company", "params": [], "chart": {"type": "bar", "x": "company", "y": ["exposure_strength"], "series": null}, "note": "制裁対象の判定は country_profile の sanction_flag（イラン・ミャンマー・ロシア・ベネズエラ）。review_flag が真のものは人の確認待ちの自動推定。"}, {"id": "geo_democracy_vs_risk", "domain": "geo", "title": "民主主義指数と総合リスク", "question": "民主主義の度合いと国リスクに関係はあるか", "mart": "m_country_profile", "sql": "SELECT p.country_name_ja, p.region, p.democracy_index, r.composite_risk_score\nFROM m_country_profile AS p\nJOIN m_country_risk AS r ON r.country_code = p.country_code\nWHERE r.risk_date = (SELECT MAX(risk_date) FROM m_country_risk)\n  AND p.democracy_index IS NOT NULL\nORDER BY p.democracy_index", "params": [], "chart": {"type": "scatter", "x": "democracy_index", "y": ["composite_risk_score"], "series": null}, "note": "最新日のリスクと静的な民主主義指数の散布図。相関は因果を意味しない。"}, {"id": "geo_exposure_type_mix", "domain": "geo", "title": "権益の種類別の件数", "question": "どんな種類の関与（資源権益・生産拠点・販売網など）が多いか", "mart": "m_company_country", "sql": "SELECT exposure_type, COUNT(*) AS pairs, ROUND(AVG(exposure_strength), 3) AS avg_strength\nFROM m_company_country\nGROUP BY exposure_type\nORDER BY pairs DESC", "params": [], "chart": {"type": "bar", "x": "exposure_type", "y": ["pairs"], "series": null}, "note": "会社×国の組の数。種類が複数ある組は最も強い種類で数える。"}, {"id": "re_land_rise_top", "domain": "realestate", "title": "地価上昇率の高い市区町村", "question": "地価が最も上がっている市区町村はどこか", "mart": "m_re_area", "sql": "SELECT prefecture_name, municipality_name, land_price_yoy_change,\n       avg_land_price_commercial, avg_land_price_residential\nFROM m_re_area\nWHERE land_price_yoy_change IS NOT NULL\nORDER BY land_price_yoy_change DESC\nLIMIT {{top_n}}", "params": [{"name": "top_n", "label": "表示する市区町村数", "type": "int", "default": 20, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "municipality_name", "y": ["land_price_yoy_change"], "series": null}, "note": "前年比は％（5＝+5%）。地価は円/m2。"}, {"id": "re_land_fall_top", "domain": "realestate", "title": "地価下落率の大きい市区町村", "question": "地価が最も下がっている市区町村はどこか", "mart": "m_re_area", "sql": "SELECT prefecture_name, municipality_name, land_price_yoy_change,\n       avg_land_price_commercial, avg_land_price_residential\nFROM m_re_area\nWHERE land_price_yoy_change IS NOT NULL\nORDER BY land_price_yoy_change\nLIMIT {{top_n}}", "params": [{"name": "top_n", "label": "表示する市区町村数", "type": "int", "default": 20, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "municipality_name", "y": ["land_price_yoy_change"], "series": null}, "note": "前年比は％。地価が空の市区町村（取引が少ない）は含まれない。"}, {"id": "re_flood_high_price_high", "domain": "realestate", "title": "洪水リスクが高く地価も高い地域", "question": "地価が高いのに洪水リスクが高い地域はどこか", "mart": "m_re_area", "sql": "SELECT prefecture_name, municipality_name, flood_risk_area_pct, avg_land_price_commercial,\n       avg_land_price_residential, land_price_yoy_change\nFROM m_re_area\nWHERE flood_risk_area_pct >= {{min_flood}}\n  AND avg_land_price_commercial >= {{min_price}}\nORDER BY avg_land_price_commercial DESC\nLIMIT {{top_n}}", "params": [{"name": "min_flood", "label": "洪水リスク地域率の下限（0〜1）", "type": "number", "default": 0.3, "min": 0, "max": 1}, {"name": "min_price", "label": "商業地の平均地価の下限（円/m2）", "type": "int", "default": 100000, "min": 0, "max": 100000000}, {"name": "top_n", "label": "表示する市区町村数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "scatter", "x": "avg_land_price_commercial", "y": ["flood_risk_area_pct"], "series": null}, "note": "洪水リスク地域率は市区町村の面積に占める浸水想定区域の割合。0.3＝30%。"}, {"id": "re_pref_overview", "domain": "realestate", "title": "都道府県別の地価と洪水リスク", "question": "都道府県ごとの地価水準と上昇率・洪水リスクはどう違うか", "mart": "m_re_area", "sql": "SELECT prefecture_name, COUNT(*) AS municipalities,\n       ROUND(AVG(avg_land_price_commercial), 0) AS avg_commercial,\n       ROUND(AVG(avg_land_price_residential), 0) AS avg_residential,\n       ROUND(AVG(land_price_yoy_change), 2) AS avg_yoy_change,\n       ROUND(AVG(flood_risk_area_pct), 3) AS avg_flood\nFROM m_re_area\nGROUP BY prefecture_name\nORDER BY avg_commercial DESC", "params": [], "chart": {"type": "bar", "x": "prefecture_name", "y": ["avg_commercial"], "series": null}, "note": "市区町村の単純平均（面積や取引量で重み付けしない）。"}, {"id": "re_company_holdings", "domain": "realestate", "title": "企業の保有不動産（市区町村別）", "question": "この会社はどこにどれだけ土地を持ち、含み益の目安はいくらか", "mart": "m_re_holdings", "sql": "SELECT prefecture, municipality_name, facility_count, land_area_m2, book_value_land_m_yen,\n       land_value_est_m_yen, unrealized_gain_est_m_yen\nFROM m_re_holdings\nWHERE sec_code4 = {{sec_code4}}\n  AND fiscal_year = (SELECT MAX(fiscal_year) FROM m_re_holdings WHERE sec_code4 = {{sec_code4}})\nORDER BY book_value_land_m_yen DESC\nLIMIT {{top_n}}", "params": [{"name": "sec_code4", "label": "証券コード（4桁）", "type": "string", "default": "8267"}, {"name": "top_n", "label": "表示する市区町村数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "municipality_name", "y": ["book_value_land_m_yen", "land_value_est_m_yen"], "series": null}, "note": "簿価・時価の目安は百万円。時価の目安は面積×参照地価（工業地→商業地→住宅地の順）で、施設の実勢価格ではない。簿価の20倍を超える施設は紐づけ違いの疑いで除外（est_excluded_count）。"}, {"id": "re_company_land_trend", "domain": "realestate", "title": "会社の土地簿価と時価目安の推移", "question": "この会社の保有土地の簿価と時価の目安は年度でどう変わったか", "mart": "m_re_holdings_pref", "sql": "SELECT fiscal_year, name, SUM(book_value_land_m_yen) AS book_value_land_m_yen,\n       SUM(land_value_est_m_yen) AS land_value_est_m_yen,\n       SUM(unrealized_gain_est_m_yen) AS unrealized_gain_est_m_yen\nFROM m_re_holdings_pref\nWHERE sec_code4 = {{sec_code4}}\nGROUP BY fiscal_year, name\nORDER BY fiscal_year", "params": [{"name": "sec_code4", "label": "証券コード（4桁）", "type": "string", "default": "8267"}], "chart": {"type": "line", "x": "fiscal_year", "y": ["book_value_land_m_yen", "land_value_est_m_yen"], "series": null}, "note": "年度ごとに開示される施設の範囲が変わるため、増減は保有の変化と開示の変化の両方を含む。"}, {"id": "re_unrealized_gain_ranking", "domain": "realestate", "title": "土地の含み益の目安が大きい会社", "question": "保有土地の時価の目安が簿価を大きく上回る会社はどこか", "mart": "m_re_holdings_pref", "sql": "SELECT name, sec_code4, SUM(book_value_land_m_yen) AS book_value_land_m_yen,\n       SUM(land_value_est_m_yen) AS land_value_est_m_yen,\n       SUM(unrealized_gain_est_m_yen) AS unrealized_gain_est_m_yen\nFROM m_re_holdings_pref\nWHERE fiscal_year = {{fiscal_year}}\n  AND name IS NOT NULL\nGROUP BY name, sec_code4\nORDER BY unrealized_gain_est_m_yen DESC\nLIMIT {{top_n}}", "params": [{"name": "fiscal_year", "label": "年度（決算期末の年）", "type": "int", "default": 2025, "min": 2015, "max": 2035}, {"name": "top_n", "label": "表示する会社数", "type": "int", "default": 20, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "name", "y": ["unrealized_gain_est_m_yen"], "series": null}, "note": "概算。簿価の20倍を超える施設は紐づけ違いの疑いで除いてあるが、敷地面積が複数施設・複数社で重複計上される場合や参照地価が実態と離れる場合は残るため、極端な値は個別に確認する。"}, {"id": "re_depopulation_holders", "domain": "realestate", "title": "人口減少地域に不動産が多い会社", "question": "2050年までに人口が大きく減る地域に施設を多く持つ会社はどこか", "mart": "m_re_holdings", "sql": "SELECT name, sec_code4, SUM(facility_count) AS facilities, COUNT(*) AS municipalities,\n       SUM(book_value_land_m_yen) AS book_value_land_m_yen\nFROM m_re_holdings\nWHERE fiscal_year = {{fiscal_year}}\n  AND population_change_pct <= {{max_change}}\n  AND name IS NOT NULL\nGROUP BY name, sec_code4\nORDER BY facilities DESC\nLIMIT {{top_n}}", "params": [{"name": "fiscal_year", "label": "年度（決算期末の年）", "type": "int", "default": 2025, "min": 2015, "max": 2035}, {"name": "max_change", "label": "人口増減の上限（％。-30＝30%以上減る地域）", "type": "number", "default": -30, "min": -100, "max": 100}, {"name": "top_n", "label": "表示する会社数", "type": "int", "default": 20, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "name", "y": ["facilities"], "series": null}, "note": "人口増減は市区町村の現在から2050年までの推計（％）。施設数は開示された施設の数。"}, {"id": "re_pref_holdings", "domain": "realestate", "title": "都道府県別の保有不動産", "question": "どの都道府県に企業の土地が集中しているか", "mart": "m_re_holdings_pref", "sql": "SELECT prefecture, COUNT(*) AS company_years, SUM(facility_count) AS facilities,\n       SUM(book_value_land_m_yen) AS book_value_land_m_yen,\n       SUM(land_value_est_m_yen) AS land_value_est_m_yen,\n       SUM(unrealized_gain_est_m_yen) AS unrealized_gain_est_m_yen\nFROM m_re_holdings_pref\nWHERE fiscal_year = {{fiscal_year}}\nGROUP BY prefecture\nORDER BY book_value_land_m_yen DESC", "params": [{"name": "fiscal_year", "label": "年度（決算期末の年）", "type": "int", "default": 2025, "min": 2015, "max": 2035}], "chart": {"type": "bar", "x": "prefecture", "y": ["book_value_land_m_yen", "land_value_est_m_yen"], "series": null}, "note": "company_years ＝ その都道府県に開示のある会社の数（1社1行）。金額は百万円。"}, {"id": "re_company_prefectures", "domain": "realestate", "title": "ある会社の都道府県別保有", "question": "この会社の土地はどの都道府県に偏っているか", "mart": "m_re_holdings_pref", "sql": "SELECT prefecture, facility_count, land_area_m2, book_value_land_m_yen, land_value_est_m_yen,\n       unrealized_gain_est_m_yen, population_change_pct, flood_risk_area_pct\nFROM m_re_holdings_pref\nWHERE sec_code4 = {{sec_code4}}\n  AND fiscal_year = (SELECT MAX(fiscal_year) FROM m_re_holdings_pref WHERE sec_code4 = {{sec_code4}})\nORDER BY book_value_land_m_yen DESC", "params": [{"name": "sec_code4", "label": "証券コード（4桁）", "type": "string", "default": "8267"}], "chart": {"type": "bar", "x": "prefecture", "y": ["book_value_land_m_yen", "land_value_est_m_yen"], "series": null}, "note": "人口増減・洪水リスクは市区町村値の単純平均。最新の開示年度で表示する。"}, {"id": "re_flood_exposed_holders", "domain": "realestate", "title": "洪水リスクが高い地域に土地を持つ会社", "question": "浸水想定区域の広い地域に多くの土地簿価を持つ会社はどこか", "mart": "m_re_holdings", "sql": "SELECT name, sec_code4, COUNT(*) AS municipalities, SUM(facility_count) AS facilities,\n       SUM(book_value_land_m_yen) AS book_value_land_m_yen\nFROM m_re_holdings\nWHERE fiscal_year = {{fiscal_year}}\n  AND flood_risk_area_pct >= {{min_flood}}\n  AND name IS NOT NULL\nGROUP BY name, sec_code4\nORDER BY book_value_land_m_yen DESC\nLIMIT {{top_n}}", "params": [{"name": "fiscal_year", "label": "年度（決算期末の年）", "type": "int", "default": 2025, "min": 2015, "max": 2035}, {"name": "min_flood", "label": "洪水リスク地域率の下限（0〜1）", "type": "number", "default": 0.5, "min": 0, "max": 1}, {"name": "top_n", "label": "表示する会社数", "type": "int", "default": 20, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "name", "y": ["book_value_land_m_yen"], "series": null}, "note": "地域率は市区町村全体の値で、施設そのものが浸水想定区域にあるとは限らない。"}, {"id": "scr_value_dividend", "domain": "screener", "title": "割安高配当", "question": "PBRが低く配当利回りが高い会社はどこか（株価のある会社だけ）", "mart": "m_screener", "sql": "SELECT sec_code4, name, industry, current_price,\n       ROUND(pbr, 2) AS pbr, ROUND(per, 1) AS per, ROUND(dividend_yield * 100, 2) AS dividend_yield_pct,\n       ROUND(payout_ratio * 100, 0) AS payout_ratio_pct, market_cap_b\nFROM m_screener\nWHERE pbr > 0 AND pbr < {{max_pbr}}\n  AND dividend_yield > {{min_yield_pct}} / 100\n  AND market_cap_b >= {{min_mcap_oku}}\n  AND (payout_ratio IS NULL OR payout_ratio <= {{max_payout_pct}} / 100)\nORDER BY dividend_yield DESC\nLIMIT {{limit}}", "params": [{"name": "max_pbr", "label": "PBR の上限（倍）", "type": "number", "default": 1, "min": 0.1, "max": 10}, {"name": "min_yield_pct", "label": "配当利回りの下限（%）", "type": "number", "default": 3, "min": 0, "max": 20}, {"name": "min_mcap_oku", "label": "時価総額の下限（億円）", "type": "number", "default": 100, "min": 0, "max": 1000000}, {"name": "max_payout_pct", "label": "配当性向の上限（%・不明は除かない）", "type": "number", "default": 100, "min": 0, "max": 1000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "name", "y": "dividend_yield_pct", "series": null}, "note": "株価・時価総額のある会社（約700社。price_source が snapshot か price_daily）だけが対象。配当性向が高すぎる会社は減配リスクがあるので上限で外せる。市場全体ではない点に注意。"}, {"id": "scr_high_roe_low_per", "domain": "screener", "title": "高ROE×低PER", "question": "ROEが高いのにPERが低い（収益力の割に安い）会社はどこか", "mart": "m_screener", "sql": "SELECT sec_code4, name, industry, current_price,\n       ROUND(roe * 100, 1) AS roe_pct, ROUND(per, 1) AS per, ROUND(pbr, 2) AS pbr,\n       ROUND(operating_margin * 100, 1) AS operating_margin_pct, market_cap_b\nFROM m_screener\nWHERE roe >= {{min_roe_pct}} / 100 AND roe <= 1\n  AND per > 0 AND per <= {{max_per}}\n  AND market_cap_b >= {{min_mcap_oku}}\nORDER BY roe DESC\nLIMIT {{limit}}", "params": [{"name": "min_roe_pct", "label": "ROE の下限（%）", "type": "number", "default": 12, "min": 0, "max": 100}, {"name": "max_per", "label": "PER の上限（倍）", "type": "number", "default": 12, "min": 1, "max": 100}, {"name": "min_mcap_oku", "label": "時価総額の下限（億円）", "type": "number", "default": 100, "min": 0, "max": 1000000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "scatter", "x": "per", "y": "roe_pct", "series": null}, "note": "ROE は最新の通期（財務表）、PER は株価系（snapshot または 株価÷EPS）。ROE が100%を超える外れ値は除く。株価のある約700社が対象。"}, {"id": "scr_growth_small_cap", "domain": "screener", "title": "増収増益の小型株", "question": "売上も営業利益も純利益も前年を上回っている小型株はどこか", "mart": "m_screener", "sql": "SELECT sec_code4, name, industry, market_cap_b,\n       ROUND(sales_growth_1y * 100, 1) AS sales_growth_pct, ROUND(op_income_growth_1y * 100, 1) AS op_income_growth_pct,\n       ROUND(net_income_growth_1y * 100, 1) AS net_income_growth_pct,\n       ROUND(per, 1) AS per, ROUND(operating_margin * 100, 1) AS operating_margin_pct\nFROM m_screener\nWHERE sales_growth_1y > 0 AND op_income_growth_1y > 0 AND net_income_growth_1y > 0\n  AND market_cap_b >= {{min_mcap_oku}} AND market_cap_b <= {{max_mcap_oku}}\nORDER BY op_income_growth_1y DESC\nLIMIT {{limit}}", "params": [{"name": "min_mcap_oku", "label": "時価総額の下限（億円）", "type": "number", "default": 50, "min": 0, "max": 1000000}, {"name": "max_mcap_oku", "label": "時価総額の上限（億円）", "type": "number", "default": 1000, "min": 1, "max": 10000000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "name", "y": "op_income_growth_pct", "series": null}, "note": "前年値が黒字の会社だけが成長率の対象（赤字からの回復は除く）。前年の年度が財務表に無い会社も除く。株価のある約700社が対象。"}, {"id": "scr_net_cash_value", "domain": "screener", "title": "ネットキャッシュが厚い割安株", "question": "時価総額に対して現金が有利子負債を大きく上回る（ネットキャッシュ比率が高い）割安株はどこか", "mart": "m_screener", "sql": "SELECT sec_code4, name, industry, market_cap_b,\n       ROUND(net_cash_to_mcap * 100, 1) AS net_cash_to_mcap_pct, ROUND(pbr, 2) AS pbr, ROUND(per, 1) AS per,\n       ROUND(equity_ratio * 100, 1) AS equity_ratio_pct, interest_bearing_debt_basis\nFROM m_screener\nWHERE net_cash_to_mcap >= {{min_ratio_pct}} / 100\n  AND pbr > 0 AND pbr <= {{max_pbr}}\n  AND market_cap_b >= {{min_mcap_oku}}\nORDER BY net_cash_to_mcap DESC\nLIMIT {{limit}}", "params": [{"name": "min_ratio_pct", "label": "ネットキャッシュ÷時価総額の下限（%）", "type": "number", "default": 30, "min": 0, "max": 1000}, {"name": "max_pbr", "label": "PBR の上限（倍）", "type": "number", "default": 1.5, "min": 0.1, "max": 10}, {"name": "min_mcap_oku", "label": "時価総額の下限（億円）", "type": "number", "default": 50, "min": 0, "max": 1000000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "name", "y": "net_cash_to_mcap_pct", "series": null}, "note": "ネットキャッシュ＝現金及び現金同等物−有利子負債（円）。有利子負債は報告値、無ければ借入金・社債・CPの合計（interest_bearing_debt_basis が estimated・リース負債は含まない概算）。銀行・保険など金融業は預金等が有利子負債に入らず現金が過大になるので、業種で除いて読む。株価のある約700社が対象。"}, {"id": "scr_high_growth_cagr", "domain": "screener", "title": "高成長（売上3年CAGR上位）", "question": "売上高の3年平均成長率（CAGR）が高い会社はどこか", "mart": "m_screener", "sql": "SELECT sec_code4, name, industry, fiscal_year,\n       ROUND(sales_cagr_3y * 100, 1) AS sales_cagr_3y_pct, ROUND(sales_growth_1y * 100, 1) AS sales_growth_pct,\n       ROUND(operating_margin * 100, 1) AS operating_margin_pct, net_sales\nFROM m_screener\nWHERE sales_cagr_3y IS NOT NULL\n  AND net_sales >= {{min_sales_oku}} * 100000000.0\n  AND operating_margin >= {{min_opm_pct}} / 100\nORDER BY sales_cagr_3y DESC\nLIMIT {{limit}}", "params": [{"name": "min_sales_oku", "label": "売上高の下限（億円）", "type": "number", "default": 100, "min": 0, "max": 10000000}, {"name": "min_opm_pct", "label": "営業利益率の下限（%）", "type": "number", "default": 5, "min": -100, "max": 100}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "name", "y": "sales_cagr_3y_pct", "series": null}, "note": "売上の最新年度と、ちょうど3年前の年度の値から計算。M&Aによる増収も含む。株価は不要なので全上場約3,800社が対象。"}, {"id": "scr_rnd_intensive", "domain": "screener", "title": "研究開発型", "question": "売上に対する研究開発費の比率が高い会社はどこか", "mart": "m_screener", "sql": "SELECT sec_code4, name, industry, ROUND(rnd_ratio * 100, 1) AS rnd_ratio_pct,\n       ROUND(operating_margin * 100, 1) AS operating_margin_pct, ROUND(gross_margin * 100, 1) AS gross_margin_pct,\n       net_sales, employees\nFROM m_screener\nWHERE rnd_ratio >= {{min_rnd_pct}} / 100 AND rnd_ratio <= 1\n  AND net_sales >= {{min_sales_oku}} * 100000000.0\nORDER BY rnd_ratio DESC\nLIMIT {{limit}}", "params": [{"name": "min_rnd_pct", "label": "研究開発費率の下限（%）", "type": "number", "default": 8, "min": 0, "max": 100}, {"name": "min_sales_oku", "label": "売上高の下限（億円）", "type": "number", "default": 100, "min": 0, "max": 10000000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "name", "y": "rnd_ratio_pct", "series": null}, "note": "研究開発費を開示している会社（約2,000社）だけが対象。開示が無い会社は『研究開発をしていない』のではなく空欄。全上場が対象で株価は不要。"}, {"id": "scr_near_52w_high", "domain": "screener", "title": "52週高値圏の好業績", "question": "52週高値圏にあって、利益率とROEも高い会社はどこか", "mart": "m_screener", "sql": "SELECT sec_code4, name, industry, current_price, ROUND(week52_position_pct, 0) AS week52_position_pct,\n       ROUND(rsi14, 0) AS rsi14, ROUND(operating_margin * 100, 1) AS operating_margin_pct, ROUND(roe * 100, 1) AS roe_pct,\n       ROUND(sales_growth_1y * 100, 1) AS sales_growth_pct, technical_date\nFROM m_screener\nWHERE week52_position_pct >= {{min_position}}\n  AND operating_margin >= {{min_opm_pct}} / 100\n  AND roe >= {{min_roe_pct}} / 100\nORDER BY week52_position_pct DESC, roe DESC\nLIMIT {{limit}}", "params": [{"name": "min_position", "label": "52週レンジ内の位置の下限（0〜100・100が高値）", "type": "number", "default": 90, "min": 0, "max": 100}, {"name": "min_opm_pct", "label": "営業利益率の下限（%）", "type": "number", "default": 8, "min": -100, "max": 100}, {"name": "min_roe_pct", "label": "ROE の下限（%）", "type": "number", "default": 10, "min": -100, "max": 100}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "scatter", "x": "week52_position_pct", "y": "roe_pct", "series": null}, "note": "52週位置・RSI は snapshot の技術指標が入っている会社（約100社）だけが対象。技術指標は日によって空の日があるため、会社ごとの値のある最新日（technical_date）を使う。"}, {"id": "scr_composite_top", "domain": "screener", "title": "総合スコア上位", "question": "総合スコア（composite_score）の高い会社はどこか（割安・質のスコア付き）", "mart": "m_screener", "sql": "SELECT sec_code4, name, industry, ROUND(composite_score, 1) AS composite_score,\n       ROUND(value_score, 1) AS value_score, ROUND(quality_score, 1) AS quality_score,\n       ROUND(per, 1) AS per, ROUND(pbr, 2) AS pbr, ROUND(dividend_yield * 100, 2) AS dividend_yield_pct, market_cap_b\nFROM m_screener\nWHERE composite_score >= {{min_score}}\n  AND market_cap_b >= {{min_mcap_oku}}\nORDER BY composite_score DESC\nLIMIT {{limit}}", "params": [{"name": "min_score", "label": "総合スコアの下限（0〜100）", "type": "number", "default": 60, "min": 0, "max": 100}, {"name": "min_mcap_oku", "label": "時価総額の下限（億円）", "type": "number", "default": 100, "min": 0, "max": 1000000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 200}], "chart": {"type": "bar", "x": "name", "y": "composite_score", "series": null}, "note": "スコアはスナップショットを作る日次処理の算出値で、対象は約440社。スコア自体の作り方は SPEC_core.md を参照。"}, {"id": "tax_node_company_count", "domain": "taxonomy", "title": "技術分類ごとの企業数", "question": "どの技術分類に紐づく会社が多いか", "mart": "m_tax_node", "sql": "SELECT node_name_ja, path_name, company_count, company_count_rollup\nFROM m_tax_node\nWHERE node_level = {{level}}\nORDER BY company_count_rollup DESC, node_id\nLIMIT {{top_n}}", "params": [{"name": "level", "label": "階層（1=領域 2=分野 3=細分 4=最細）", "type": "int", "default": 2, "min": 1, "max": 4}, {"name": "top_n", "label": "表示するノード数", "type": "int", "default": 20, "min": 1, "max": 100}], "chart": {"type": "bar", "x": "node_name_ja", "y": ["company_count_rollup"], "series": null}, "note": "company_count_rollup は自ノード以下に紐づく会社の重複なしの数、company_count は自ノードに直接紐づく数。上場会社のみで、業種単位の行（sector:）と company_id='nan' は数えない。"}, {"id": "tax_domain_distribution", "domain": "taxonomy", "title": "領域別の企業数の分布", "question": "最上位（領域）ごとに会社がどう分布しているか", "mart": "m_tax_node", "sql": "SELECT node_name_ja, child_count, company_count, company_count_rollup\nFROM m_tax_node\nWHERE node_level = 1\nORDER BY company_count_rollup DESC, node_id", "params": [], "chart": {"type": "bar", "x": "node_name_ja", "y": ["company_count_rollup"], "series": null}, "note": "領域（node_level=1）25件。1社が複数の領域に入りうるため、領域の企業数を足し合わせても会社数にはならない。"}, {"id": "tax_tree_children", "domain": "taxonomy", "title": "技術分類ツリーの子ノード", "question": "この分類の下にどんな細分があり、会社は何社か", "mart": "m_tax_node", "sql": "SELECT node_id, node_name_ja, node_level, child_count, company_count, company_count_rollup, path_name\nFROM m_tax_node\nWHERE parent_id = {{parent_id}}\nORDER BY company_count_rollup DESC, node_id", "params": [{"name": "parent_id", "label": "親ノードID（例 semiconductor・ai_software）", "type": "string", "default": "semiconductor"}], "chart": {"type": "bar", "x": "node_name_ja", "y": ["company_count_rollup"], "series": null}, "note": "親ノードIDは英小文字・_ の識別子（m_tax_node.node_id）。領域のIDは tax_domain_distribution の結果で確認できる。"}, {"id": "tax_companies_by_node", "domain": "taxonomy", "title": "ある技術分類を持つ会社一覧（財務つき）", "question": "この技術分類に紐づく会社と、最新年度の売上・営業利益率・研究開発費率は", "mart": "m_company_tax", "sql": "SELECT company_id AS sec_code4, name, industry, relevance_score, revenue_share_est, fiscal_year, net_sales, ROUND(operating_margin * 100, 1) AS operating_margin_pct, ROUND(rnd_ratio * 100, 2) AS rnd_ratio_pct\nFROM m_company_tax\nWHERE entity_type = 'company' AND node_id = {{node_id}}\nORDER BY relevance_score DESC, net_sales DESC, company_id\nLIMIT {{top_n}}", "params": [{"name": "node_id", "label": "技術分類ノードID（例 ai_software・semiconductor_equipment）", "type": "string", "default": "ai_software"}, {"name": "top_n", "label": "表示する会社数", "type": "int", "default": 50, "min": 1, "max": 300}], "chart": {"type": "table", "x": "name", "y": ["net_sales"], "series": null}, "note": "財務は各社の売上が入っている最新年度1年分（fiscal_year）。営業利益率・研究開発費率は売上比。研究開発費を開示しない会社は空。relevance_score・revenue_share_est は推定値（revenue_share_est は会社単位で、同じ会社の全ノードに同じ値が入る）。"}, {"id": "tax_companies_by_domain", "domain": "taxonomy", "title": "ある領域に属する会社一覧（財務つき）", "question": "この領域（例 半導体）に関わる会社を、関連度の高い順に財務つきで", "mart": "m_company_tax", "sql": "SELECT company_id AS sec_code4, name, industry, COUNT(*) AS node_count, MAX(relevance_score) AS max_relevance, MAX(fiscal_year) AS fiscal_year, MAX(net_sales) AS net_sales, ROUND(MAX(operating_margin) * 100, 1) AS operating_margin_pct, ROUND(MAX(rnd_ratio) * 100, 2) AS rnd_ratio_pct\nFROM m_company_tax\nWHERE entity_type = 'company' AND domain_id = {{domain_id}}\nGROUP BY company_id, name, industry\nORDER BY max_relevance DESC, net_sales DESC, company_id\nLIMIT {{top_n}}", "params": [{"name": "domain_id", "label": "領域ノードID（例 semiconductor・ai_software・robotics_automation）", "type": "string", "default": "semiconductor"}, {"name": "top_n", "label": "表示する会社数", "type": "int", "default": 50, "min": 1, "max": 300}], "chart": {"type": "table", "x": "name", "y": ["net_sales"], "series": null}, "note": "領域＝階層1のノード。会社ごとに1行へ集約（node_count はその領域内で紐づくノード数）。財務は会社単位の値なので MAX は同じ値を取り出すだけ。"}, {"id": "tax_company_nodes", "domain": "taxonomy", "title": "ある会社の技術分類", "question": "この会社はどの技術分類に紐づいているか", "mart": "m_company_tax", "sql": "SELECT name, path_name, node_level, relevance_score, confidence, revenue_share_est, confidence_type, verified_flag\nFROM m_company_tax\nWHERE company_id = {{sec_code4}}\nORDER BY relevance_score DESC, node_id", "params": [{"name": "sec_code4", "label": "証券コード（4桁）", "type": "string", "default": "6869"}], "chart": {"type": "bar", "x": "path_name", "y": ["relevance_score"], "series": null}, "note": "会社の識別子は証券コード4桁（英字入りも可）。verified_flag が false の行は自動導出（人手で確認していない）。上場会社でない場合や分類が無い場合は0行。"}, {"id": "tax_rnd_by_node", "domain": "taxonomy", "title": "研究開発費率が高い技術分野", "question": "どの技術分野の会社が売上に対する研究開発費の比率が高いか", "mart": "m_company_tax", "sql": "SELECT node_name_ja, path_name, COUNT(DISTINCT company_id) AS companies, ROUND(AVG(rnd_ratio) * 100, 2) AS avg_rnd_ratio_pct\nFROM m_company_tax\nWHERE entity_type = 'company' AND node_level = {{level}} AND rnd_ratio BETWEEN 0 AND 1\nGROUP BY node_name_ja, path_name\nHAVING COUNT(DISTINCT company_id) >= {{min_companies}}\nORDER BY avg_rnd_ratio_pct DESC, node_name_ja\nLIMIT {{top_n}}", "params": [{"name": "level", "label": "階層（1=領域 2=分野 3=細分 4=最細）", "type": "int", "default": 2, "min": 1, "max": 4}, {"name": "min_companies", "label": "最低社数（研究開発費を開示する会社）", "type": "int", "default": 3, "min": 1, "max": 50}, {"name": "top_n", "label": "表示するノード数", "type": "int", "default": 20, "min": 1, "max": 100}], "chart": {"type": "bar", "x": "node_name_ja", "y": ["avg_rnd_ratio_pct"], "series": null}, "note": "各社の最新年度の研究開発費÷売上の単純平均（売上加重ではない）。研究開発費を開示していない会社は含まれず、companies はその開示社数。比率が0〜100%の範囲外は除外。"}, {"id": "tax_margin_by_node", "domain": "taxonomy", "title": "技術分野別の平均営業利益率", "question": "どの技術分野の会社が稼ぐ力（営業利益率）が高いか", "mart": "m_company_tax", "sql": "SELECT node_name_ja, path_name, COUNT(DISTINCT company_id) AS companies, ROUND(AVG(operating_margin) * 100, 1) AS avg_operating_margin_pct\nFROM m_company_tax\nWHERE entity_type = 'company' AND node_level = {{level}} AND operating_margin BETWEEN -1 AND 1\nGROUP BY node_name_ja, path_name\nHAVING COUNT(DISTINCT company_id) >= {{min_companies}}\nORDER BY avg_operating_margin_pct DESC, node_name_ja\nLIMIT {{top_n}}", "params": [{"name": "level", "label": "階層（1=領域 2=分野 3=細分 4=最細）", "type": "int", "default": 2, "min": 1, "max": 4}, {"name": "min_companies", "label": "最低社数", "type": "int", "default": 3, "min": 1, "max": 50}, {"name": "top_n", "label": "表示するノード数", "type": "int", "default": 20, "min": 1, "max": 100}], "chart": {"type": "bar", "x": "node_name_ja", "y": ["avg_operating_margin_pct"], "series": null}, "note": "各社の最新年度の営業利益÷売上の単純平均。営業利益率が -100%〜+100% の範囲外は外れ値として除外。金融など売上の定義が異なる業種も含まれる。"}, {"id": "tax_multi_domain_companies", "domain": "taxonomy", "title": "複数の技術領域を横断する会社", "question": "いくつもの技術領域にまたがる会社はどこか", "mart": "m_company_tax", "sql": "SELECT company_id AS sec_code4, name, industry, COUNT(DISTINCT domain_id) AS domains, COUNT(*) AS nodes, MAX(fiscal_year) AS fiscal_year, MAX(net_sales) AS net_sales\nFROM m_company_tax\nWHERE entity_type = 'company'\nGROUP BY company_id, name, industry\nHAVING COUNT(DISTINCT domain_id) >= {{min_domains}}\nORDER BY domains DESC, nodes DESC, company_id\nLIMIT {{top_n}}", "params": [{"name": "min_domains", "label": "最低の領域数", "type": "int", "default": 2, "min": 1, "max": 10}, {"name": "top_n", "label": "表示する会社数", "type": "int", "default": 50, "min": 1, "max": 300}], "chart": {"type": "bar", "x": "name", "y": ["domains"], "series": null}, "note": "領域＝階層1のノード。分類は自動導出が中心で、領域数が多い＝事業が広いとは限らない（同じ事業を複数領域に割り振った可能性がある）。"}, {"id": "tax_industry_domain_cross", "domain": "taxonomy", "title": "業種×技術領域のクロス", "question": "どの業種の会社がどの技術領域に多く紐づくか", "mart": "m_company_tax", "sql": "SELECT industry, domain_name_ja, COUNT(DISTINCT company_id) AS companies\nFROM m_company_tax\nWHERE entity_type = 'company' AND industry IS NOT NULL AND domain_name_ja IS NOT NULL\nGROUP BY industry, domain_name_ja\nORDER BY companies DESC, industry, domain_name_ja\nLIMIT {{top_n}}", "params": [{"name": "top_n", "label": "表示する組み合わせ数", "type": "int", "default": 40, "min": 1, "max": 300}], "chart": {"type": "bar", "x": "domain_name_ja", "y": ["companies"], "series": "industry"}, "note": "industry は EDINET の業種区分（edinet.company.industry）。1社が複数領域 /* ── 自由分析（連動選択） ──────────────────────── */
function martCols(m){ return (BI.marts[m] && BI.marts[m].columns) || []; }
function isNum(c){ return /int|float|numeric|double|decimal/i.test(c.type||""); }
function buildFree(){
  const marts = Object.keys(BI.marts);
  if(!FREE.mart) FREE.mart = marts.includes("m_fin_annual") ? "m_fin_annual" : marts[0];
  const cols = martCols(FREE.mart);
  const dimCols = cols.filter(c => !isNum(c) || /year|code/.test(c.name));
  const numCols = cols.filter(c => isNum(c));
  if(!FREE.dims.length && dimCols.find(c=>c.name==="industry")) FREE.dims = ["industry"];
  if(!FREE.measures.length && numCols.length) FREE.measures = [{col:(numCols.find(c=>c.name==="net_sales")||numCols[0]).name, agg:"SUM"}, {col:"*", agg:"COUNT"}];
  const opt = (arr, sel) => arr.map(c=>`<option value="${esc(c.name)}" ${c.name===sel?"selected":""}>${esc(c.label||c.name)}</option>`).join("");
  $("p-free").innerHTML = `
    <div class="cols">
      <label class="f">マート<select id="fMart">${marts.map(m=>`<option ${m===FREE.mart?"selected":""}>${esc(m)}</option>`).join("")}</select></label>
      <label class="f">グラフ<select id="fChart">${[["bar","棒"],["line","折れ線"],["scatter","散布図"],["table","表"]].map(([v,l])=>`<option value="${v}" ${v===FREE.chart?"selected":""}>${l}</option>`).join("")}</select></label>
    </div>
    <div class="cols" style="margin-top:8px">
      <div><div class="note" style="margin:0">軸（GROUP BY）</div><div class="mlist" id="fDims">${FREE.dims.map((d,i)=>`<div class="mrow"><select data-dim="${i}">${opt(dimCols,d)}</select><button class="ghost" data-deldim="${i}" aria-label="軸を外す">×</button></div>`).join("")}</div>
        <button class="ghost" id="fAddDim" style="margin-top:6px">＋ 軸</button></div>
      <div><div class="note" style="margin:0">指標</div><div class="mlist" id="fMeas">${FREE.measures.map((m,i)=>`<div class="mrow"><select data-magg="${i}">${["SUM","AVG","MIN","MAX","COUNT"].map(a=>`<option ${a===m.agg?"selected":""}>${a}</option>`).join("")}</select><select data-mcol="${i}"><option value="*" ${m.col==="*"?"selected":""}>件数(*)</option>${opt(numCols,m.col)}</select><button class="ghost" data-delmeas="${i}" aria-label="指標を外す">×</button></div>`).join("")}</div>
        <button class="ghost" id="fAddMeas" style="margin-top:6px">＋ 指標</button></div>
    </div>
    <div class="chips" id="fChips">${FREE.filters.map((f,i)=>`<span class="chip">${esc(f.col)} = ${esc(f.value)}<button data-delf="${i}" aria-label="絞り込みを外す">×</button></span>`).join("") || `<span class="note" style="margin:0">グラフの棒や表の行をクリックすると、その値で絞り込みます</span>`}</div>
    <div class="row"><button class="go" id="fGo">集計</button></div>`;
  $("fMart").onchange = e => { FREE = {mart:e.target.value, dims:[], measures:[], filters:[], chart:FREE.chart}; buildFree(); };
  $("fChart").onchange = e => { FREE.chart = e.target.value; runFree(); };
  $("p-free").querySelectorAll("[data-dim]").forEach(s => s.onchange = () => { FREE.dims[+s.dataset.dim] = s.value; runFree(); });
  $("p-free").querySelectorAll("[data-magg]").forEach(s => s.onchange = () => { FREE.measures[+s.dataset.magg].agg = s.value; runFree(); });
  $("p-free").querySelectorAll("[data-mcol]").forEach(s => s.onchange = () => { FREE.measures[+s.dataset.mcol].col = s.value; runFree(); });
  $("p-free").querySelectorAll("[data-deldim]").forEach(b => b.onclick = () => { FREE.dims.splice(+b.dataset.deldim,1); buildFree(); runFree(); });
  $("p-free").querySelectorAll("[data-delmeas]").forEach(b => b.onclick = () => { FREE.measures.splice(+b.dataset.delmeas,1); buildFree(); runFree(); });
  $("p-free").querySelectorAll("[data-delf]").forEach(b => b.onclick = () => { FREE.filters.splice(+b.dataset.delf,1); buildFree(); runFree(); });
  $("fAddDim").onclick = () => { const c = dimCols.find(c=>!FREE.dims.includes(c.name)); if(c){ FREE.dims.push(c.name); buildFree(); } };
  $("fAddMeas").onclick = () => { if(numCols[0]){ FREE.measures.push({col:numCols[0].name, agg:"AVG"}); buildFree(); } };
  $("fGo").onclick = runFree;
}
function qid(n){ if(!/^[A-Za-z_][A-Za-z0-9_]*$/.test(n)) throw new Error("列名が不正です: "+n); return n; }
function lit(v){ return typeof v === "number" ? String(v) : "'" + String(v).replace(/\\/g,"\\\\").replace(/'/g,"\\'") + "'"; }
function freeSql(){
  const cols = martCols(FREE.mart).map(c=>c.name);
  const ok = n => { if(!cols.includes(n)) throw new Error("このマートに無い列です: "+n); return qid(n); };
  const dims = FREE.dims.map(ok);
  const meas = FREE.measures.map(m => m.col==="*" ? `COUNT(*) AS cnt` : `${m.agg}(${ok(m.col)}) AS ${m.agg.toLowerCase()}_${m.col}`);
  if(!meas.length) throw new Error("指標を1つ以上選んでください");
  const where = FREE.filters.map(f => f.value === null ? `${ok(f.col)} IS NULL` : `${ok(f.col)} = ${lit(f.value)}`);
  return `SELECT ${[...dims, ...meas].join(", ")}\nFROM ${FREE.mart}` + (where.length?`\nWHERE ${where.join(" AND ")}`:"")
    + (dims.length ? `\nGROUP BY ${dims.join(", ")}\nORDER BY ` + (dims.length===1 && /year/.test(dims[0]) ? dims[0] : `${dims.length+1} DESC`) : "")
    + `\nLIMIT 500`;
}
async function runFree(){
  let sql;
  try{ sql = wrapSql(freeSql()); }catch(e){ $("result").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
  $("result").innerHTML = `<div class="msg">BigQuery で集計中…</div>`;
  try{
    const res = await runBQ(sql);
    const spec = {type: FREE.chart, x: FREE.dims[0], y: res.columns.filter((c,i)=>res.num[i] && !FREE.dims.includes(c)).slice(0, FREE.chart==="scatter"?2:3), series: FREE.dims[1]};
    render(res, spec, (row, r) => {   // 連動選択：クリックした行の軸の値で絞り込む
      FREE.dims.forEach(d => { const v = row[r.columns.indexOf(d)]; if(!FREE.filters.some(f=>f.col===d&&f.value===v)) FREE.filters.push({col:d, value:v}); });
      if(FREE.dims.length) FREE.dims = FREE.dims.length > 1 ? FREE.dims.slice(1) : FREE.dims;
      buildFree(); runFree();
    });
    showSql(sql, $("result")); logRun("自由分析", FREE.mart+"："+FREE.dims.join("×"), freeSql());
  }catch(e){ $("result").innerHTML = `<div class="msg err">${esc(errText(e))}</div>`; showSql(sql, $("result")); }
}

/* ── スロット（名前付き保存）と履歴：自分だけが読める data/users/<id>/ に保存する ── */
let db = null, me = null, SLOTS = [], HIST = [];
function ucol(name){ return db && me ? db.collection(`data/users/${me}/${name}`) : null; }
async function loadSlots(){
  const s = ucol("slots"), h = ucol("history"); if(!s) return;
  try{ SLOTS = (await s.orderBy("order").get()).docs.map(d => ({id:d.id, ...d.data()})); }catch(e){ SLOTS = []; }
  try{ HIST = (await h.orderBy("at","desc").limit(50).get()).docs.map(d => ({id:d.id, ...d.data()})); }catch(e){ HIST = []; }
}
let LASTLOG = "";
async function logRun(kind, title, sql){
  const h = ucol("history"); if(!h || !sql) return;
  const key = kind + "\u0000" + sql; if(key === LASTLOG) return; LASTLOG = key;   // 同じ実行の連打は1件に
  try{ await h.add({kind, title: String(title||"").slice(0,80), sql: String(sql).slice(0,20000), at: new Date().toISOString()}); }catch(e){}
}
async function saveSlot(name, sql){
  const s = ucol("slots"), msg = $("slotMsg");
  if(!s){ msg.textContent = "このページでは保存できません（Claude の画面で開くと使えます）"; return; }
  name = String(name||"").trim(); if(!name){ msg.textContent = "スロット名を入れてください"; return; }
  if(!String(sql||"").trim()){ msg.textContent = "保存する SQL がありません"; return; }
  const order = SLOTS.length ? Math.max(...SLOTS.map(x=>x.order||0)) + 1 : 1;
  try{ await s.add({name: name.slice(0,60), sql: String(sql).slice(0,20000), order, at: new Date().toISOString()}); msg.textContent = "保存しました"; await loadSlots(); }
  catch(e){ msg.textContent = "保存できませんでした（" + (e && e.code || "error") + "）"; }
}
async function renderSlots(){
  const el = $("p-slot");
  if(!db || !me){ el.innerHTML = `<div class="msg warn">スロットは Claude の画面で開いたときに使えます（自分だけが見える場所に保存します）。</div>`; return; }
  el.innerHTML = `<div class="msg">読み込み中…</div>`; await loadSlots();
  const row = (x, kind) => `<tr><td>${esc(kind==="slot"? x.name : x.title)}</td><td class="note">${esc(kind==="slot"? "" : x.kind)}</td><td class="note">${esc((x.at||"").slice(0,16).replace("T"," "))}</td>
    <td><button class="ghost" data-run="${kind}:${esc(x.id)}">実行</button> <button class="ghost" data-load="${kind}:${esc(x.id)}">SQL欄へ</button>
    ${kind==="slot"? `<button class="ghost" data-up="${esc(x.id)}" aria-label="上へ">↑</button> <button class="ghost" data-del="${esc(x.id)}">削除</button>` : `<button class="ghost" data-keep="${esc(x.id)}">スロットに保存</button>`}</td></tr>`;
  el.innerHTML = `<p class="q">スロット</p><p class="note">よく使う SQL に名前を付けて保存したもの。SQL タブの「SQLをスロットに保存」か、下の履歴から保存できます。</p>
    <div class="tablebox"><table><tbody>${SLOTS.map(x=>row(x,"slot")).join("") || `<tr><td class="note">まだありません</td></tr>`}</tbody></table></div>
    <p class="q" style="margin-top:16px">最近の実行（50件）</p>
    <div class="tablebox"><table><tbody>${HIST.map(x=>row(x,"hist")).join("") || `<tr><td class="note">まだありません</td></tr>`}</tbody></table></div>`;
  const find = k => { const [kind,id] = k.split(":"); return (kind==="slot"? SLOTS : HIST).find(x=>x.id===id); };
  el.querySelectorAll("[data-run]").forEach(b => b.onclick = () => { const x = find(b.dataset.run); if(x){ $("sqlText").value = x.sql; tab("sql"); $("sqlGo").click(); } });
  el.querySelectorAll("[data-load]").forEach(b => b.onclick = () => { const x = find(b.dataset.load); if(x){ $("sqlText").value = x.sql; tab("sql"); } });
  el.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { try{ await ucol("slots").doc(b.dataset.del).delete(); }catch(e){} renderSlots(); });
  el.querySelectorAll("[data-keep]").forEach(b => b.onclick = async () => { const x = HIST.find(h=>h.id===b.dataset.keep); if(x){ await saveSlot(x.title || x.kind, x.sql); renderSlots(); } });
  el.querySelectorAll("[data-up]").forEach(b => b.onclick = async () => {
    const i = SLOTS.findIndex(x=>x.id===b.dataset.up); if(i<=0) return;
    const a = SLOTS[i], p = SLOTS[i-1];
    try{ await ucol("slots").doc(a.id).update({order: p.order}); await ucol("slots").doc(p.id).update({order: a.order}); }catch(e){}
    renderSlots();
  });
}

/* ── ボタンで SQL を組み立てる ─────────────────── */
let BLD = {mart:"", cols:[], aggs:{}, conds:[], order:"", dir:"DESC", limit:100};
function buildBuilder(){
  const marts = Object.keys(BI.marts); if(!BLD.mart) BLD.mart = marts.includes("m_screener") ? "m_screener" : marts[0];
  const cols = martCols(BLD.mart);
  const lab = c => esc(c.label ? `${c.label}（${c.name}）` : c.name);
  $("bld").innerHTML = `
    <div class="row"><label class="f">マート<select id="bMart">${marts.map(m=>`<option ${m===BLD.mart?"selected":""}>${esc(m)}</option>`).join("")}</select></label>
      <label class="f">件数<input id="bLimit" value="${BLD.limit}" inputmode="numeric" style="width:6em"></label>
      <label class="f">並べ替え<select id="bOrder"><option value="">（なし）</option>${cols.map(c=>`<option value="${esc(c.name)}" ${c.name===BLD.order?"selected":""}>${lab(c)}</option>`).join("")}</select></label>
      <label class="f">向き<select id="bDir"><option ${BLD.dir==="DESC"?"selected":""}>DESC</option><option ${BLD.dir==="ASC"?"selected":""}>ASC</option></select></label></div>
    <p class="note" style="margin:8px 0 4px">列（押すと選択。数値の列は集計も選べる。集計を付けると他の列でまとめる）</p>
    <div class="chips">${cols.map(c=>`<button class="ghost" data-col="${esc(c.name)}" aria-pressed="${BLD.cols.includes(c.name)}" style="${BLD.cols.includes(c.name)?"background:var(--accent-soft)":""}">${lab(c)}</button>`).join("")}</div>
    <div class="mlist">${BLD.cols.filter(n=>isNum(cols.find(c=>c.name===n)||{})).map(n=>`<div class="mrow"><span class="note">${esc(n)} の集計</span><select data-agg="${esc(n)}">${["","SUM","AVG","MIN","MAX","COUNT"].map(a=>`<option ${a===(BLD.aggs[n]||"")?"selected":""} value="${a}">${a||"そのまま"}</option>`).join("")}</select></div>`).join("")}</div>
    <p class="note" style="margin:8px 0 4px">条件</p>
    <div class="mlist">${BLD.conds.map((k,i)=>`<div class="mrow"><select data-ccol="${i}">${cols.map(c=>`<option value="${esc(c.name)}" ${c.name===k.col?"selected":""}>${lab(c)}</option>`).join("")}</select>
      <select data-cop="${i}">${["=","<>",">=","<=",">","<","LIKE","IS NULL","IS NOT NULL"].map(o=>`<option ${o===k.op?"selected":""}>${o}</option>`).join("")}</select>
      <input data-cval="${i}" value="${esc(k.val??"")}" placeholder="値"><button class="ghost" data-cdel="${i}" aria-label="条件を外す">×</button></div>`).join("")}</div>
    <div class="row" style="margin-top:6px"><button class="ghost" id="bAddCond">＋ 条件</button><button class="go" id="bMake">SQL を組み立てる</button></div>`;
  const re = () => buildBuilder();
  $("bMart").onchange = e => { BLD = {mart:e.target.value, cols:[], aggs:{}, conds:[], order:"", dir:"DESC", limit:BLD.limit}; re(); };
  $("bLimit").onchange = e => BLD.limit = e.target.value; $("bOrder").onchange = e => BLD.order = e.target.value; $("bDir").onchange = e => BLD.dir = e.target.value;
  $("bld").querySelectorAll("[data-col]").forEach(b => b.onclick = () => { const n=b.dataset.col; BLD.cols = BLD.cols.includes(n) ? BLD.cols.filter(x=>x!==n) : [...BLD.cols, n]; re(); });
  $("bld").querySelectorAll("[data-agg]").forEach(s => s.onchange = () => { BLD.aggs[s.dataset.agg] = s.value; });
  $("bld").querySelectorAll("[data-ccol]").forEach(s => s.onchange = () => BLD.conds[+s.dataset.ccol].col = s.value);
  $("bld").querySelectorAll("[data-cop]").forEach(s => s.onchange = () => BLD.conds[+s.dataset.cop].op = s.value);
  $("bld").querySelectorAll("[data-cval]").forEach(s => s.oninput = () => BLD.conds[+s.dataset.cval].val = s.value);
  $("bld").querySelectorAll("[data-cdel]").forEach(b => b.onclick = () => { BLD.conds.splice(+b.dataset.cdel,1); re(); });
  $("bAddCond").onclick = () => { BLD.conds.push({col: cols[0] && cols[0].name, op: ">=", val: ""}); re(); };
  $("bMake").onclick = () => { try{ $("sqlText").value = builderSql(); }catch(e){ $("slotMsg").textContent = e.message; } };
}
function builderSql(){
  const cols = martCols(BLD.mart), names = cols.map(c=>c.name);
  const ok = n => { if(!names.includes(n)) throw new Error("列がありません: "+n); return qid(n); };
  if(!BLD.cols.length) throw new Error("列を1つ以上選んでください");
  const agg = BLD.cols.filter(n => BLD.aggs[n]), plain = BLD.cols.filter(n => !BLD.aggs[n]);
  const sel = [...plain.map(ok), ...agg.map(n => `${BLD.aggs[n]}(${ok(n)}) AS ${BLD.aggs[n].toLowerCase()}_${n}`)];
  const num = n => isNum(cols.find(c=>c.name===n)||{});
  const where = BLD.conds.filter(k=>k.col).map(k => /NULL/.test(k.op) ? `${ok(k.col)} ${k.op}` :
    `${ok(k.col)} ${k.op} ${num(k.col) && k.op!=="LIKE" ? (Number.isFinite(Number(k.val)) && String(k.val).trim()!=="" ? Number(k.val) : (()=>{throw new Error(k.col+" は数値で入れてください")})()) : lit(k.op==="LIKE" && !/%/.test(k.val) ? "%"+k.val+"%" : k.val)}`);
  const lim = Math.min(1000, Math.max(1, parseInt(BLD.limit,10) || 100));
  let q = `SELECT ${sel.join(", ")}\nFROM ${BLD.mart}`;
  if(where.length) q += `\nWHERE ${where.join("\n  AND ")}`;
  if(agg.length && plain.length) q += `\nGROUP BY ${plain.map(ok).join(", ")}`;
  if(BLD.order) q += `\nORDER BY ${agg.includes(BLD.order) ? BLD.aggs[BLD.order].toLowerCase()+"_"+BLD.order : ok(BLD.order)} ${BLD.dir}`;
  return q + `\nLIMIT ${lim}`;
}

  "割安高配当": [["pbr","<=",1],["dividend_yield",">=",0.03]],
  "高ROE×低PER": [["roe",">=",0.15],["per","<=",15],["per",">",0]],
  "増収増益": [["sales_growth_1y",">=",0.05],["op_income_growth_1y",">=",0.05]],
  "ネットキャッシュ": [["net_cash",">",0],["pbr","<=",1.2]],
  "高成長": [["sales_cagr_3y",">=",0.15]],
  "高配当": [["dividend_yield",">=",0.04]],
};
let SCR = {filters:[], set:"概要", sort:"market_cap", dir:"DESC", page:0, industries:[]};
function scrCols(){ return martCols("m_screener"); }
function buildScreener(){
  const el = $("p-scr");
  if(!BI.marts.m_screener){ el.innerHTML = `<div class="msg warn">スクリーナー用の表（m_screener）はまだ書き出されていません。次の書き出しのあとに再公開します。</div>`; return; }
  const cols = scrCols(), names = cols.map(c=>c.name), lab = n => { const c = cols.find(x=>x.name===n); return esc(c && c.label || n); };
  const numCols = cols.filter(isNum);
  el.innerHTML = `
    <p class="q">企業スクリーナー</p><p class="note">全上場企業（最新の決算期×最新の株価）を条件で絞り込みます。比率は % で入れてください（例 ROE 15 → 15%）。</p>
    <div class="chips">${Object.keys(SCR_PRESETS).map(k=>`<button class="ghost" data-pre="${esc(k)}">${esc(k)}</button>`).join("")}<button class="ghost" id="scrClear">条件をすべて外す</button></div>
    <div class="chips" id="scrChips">${SCR.filters.map((f,i)=>`<span class="chip">${lab(f[0])} ${esc(f[1])} ${esc(fmtIn(f[0],f[2]))}<button data-fdel="${i}" aria-label="条件を外す">×</button></span>`).join("") || `<span class="note" style="margin:0">条件なし（全社）</span>`}</div>
    <div class="row">
      <label class="f">列<select id="scrCol">${numCols.map(c=>`<option value="${esc(c.name)}">${lab(c.name)}</option>`).join("")}</select></label>
      <label class="f">比較<select id="scrOp"><option>&gt;=</option><option>&lt;=</option><option>&gt;</option><option>&lt;</option></select></label>
      <label class="f">値<input id="scrVal" inputmode="decimal" style="width:7em" placeholder="例 10"></label>
      <button class="ghost" id="scrAdd">＋ 条件</button>
      ${names.includes("industry") ? `<label class="f">業種（含む）<input id="scrInd" placeholder="例 情報・通信" value="${esc(SCR.industries.join(","))}"></label>` : ""}
    </div>
    <div class="row" style="margin-top:8px">
      <label class="f">列セット<select id="scrSet">${Object.keys(SCR_SETS).map(k=>`<option ${k===SCR.set?"selected":""}>${esc(k)}</option>`).join("")}</select></label>
      <label class="f">並べ替え<select id="scrSort">${numCols.map(c=>`<option value="${esc(c.name)}" ${c.name===SCR.sort?"selected":""}>${lab(c.name)}</option>`).join("")}</select></label>
      <label class="f">向き<select id="scrDir"><option ${SCR.dir==="DESC"?"selected":""} value="DESC">大きい順</option><option ${SCR.dir==="ASC"?"selected":""} value="ASC">小さい順</option></select></label>
      <button class="go" id="scrGo">検索</button>
      <label class="f">保存名<input id="scrName" placeholder="例：自分の割安株"></label><button class="ghost" id="scrSave">条件をスロットに保存</button><span class="note" id="scrMsg"></span>
    </div>`;
  el.querySelectorAll("[data-pre]").forEach(b => b.onclick = () => { SCR.filters = SCR_PRESETS[b.dataset.pre].filter(f=>names.includes(f[0])).map(f=>f.slice()); SCR.page = 0; buildScreener(); runScreener(); });
  el.querySelectorAll("[data-fdel]").forEach(b => b.onclick = () => { SCR.filters.splice(+b.dataset.fdel,1); SCR.page=0; buildScreener(); runScreener(); });
  $("scrClear").onclick = () => { SCR.filters = []; SCR.industries = []; SCR.page = 0; buildScreener(); runScreener(); };
  $("scrAdd").onclick = () => { const c=$("scrCol").value, raw=$("scrVal").value.trim(); const n = Number(raw);
    if(raw==="" || !Number.isFinite(n)){ $("scrMsg").textContent = "値は数値で入れてください"; return; }
    SCR.filters.push([c, $("scrOp").value, isRatio(c) ? n/100 : n]); SCR.page=0; buildScreener(); runScreener(); };
  if($("scrInd")) $("scrInd").onchange = e => { SCR.industries = e.target.value.split(/[,、]/).map(x=>x.trim()).filter(Boolean); SCR.page=0; runScreener(); };
  $("scrSet").onchange = e => { SCR.set = e.target.value; runScreener(); };
  $("scrSort").onchange = e => { SCR.sort = e.target.value; SCR.page=0; runScreener(); };
  $("scrDir").onchange = e => { SCR.dir = e.target.value; SCR.page=0; runScreener(); };
  $("scrGo").onclick = () => { SCR.page=0; runScreener(); };
  $("scrSave").onclick = async () => { try{ const q = screenerSql(); $("slotMsg").textContent=""; await saveSlot($("scrName").value, q); $("scrMsg").textContent = $("slotMsg").textContent || "保存しました"; }catch(e){ $("scrMsg").textContent = e.message; } };
}
function isRatio(n){ return /margin|ratio|roe|roa|yield|growth|cagr|return_|payout|to_mcap/.test(n) && !/de_ratio/.test(n); }
function fmtIn(n, v){ return isRatio(n) ? (v*100).toFixed(1).replace(/\.0$/,"")+"%" : Number(v).toLocaleString("ja-JP"); }
function screenerSql(){
  const names = scrCols().map(c=>c.name);
  const ok = n => { if(!names.includes(n)) throw new Error("列がありません: "+n); return qid(n); };
  const show = [...new Set([...(SCR_SETS[SCR.set]||SCR_SETS["概要"]), ...SCR.filters.map(f=>f[0])])].filter(n=>names.includes(n));
  const where = SCR.filters.map(f => { if(![">=","<=",">","<"].includes(f[1]) || !Number.isFinite(Number(f[2]))) throw new Error("条件が不正です"); return `${ok(f[0])} ${f[1]} ${Number(f[2])}`; });
  if(SCR.industries.length && names.includes("industry")) where.push("(" + SCR.industries.map(x => `industry LIKE ${lit("%"+x+"%")}`).join(" OR ") + ")");
  return `SELECT ${show.map(ok).join(", ")}, COUNT(*) OVER() AS total_hits\nFROM m_screener` + (where.length ? `\nWHERE ${where.join("\n  AND ")}` : "")
    + `\nORDER BY ${ok(SCR.sort)} ${SCR.dir === "ASC" ? "ASC" : "DESC"} NULLS LAST\nLIMIT 100 OFFSET ${SCR.page*100}`;
}
async function runScreener(){
  let q, sql; try{ q = screenerSql(); sql = wrapSql(q); }catch(e){ $("result").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
  $("result").innerHTML = `<div class="msg">BigQuery で検索中…</div>`;
  try{
    const res = await runBQ(sql);
    const ti = res.columns.indexOf("total_hits"), total = res.rows.length ? res.rows[0][ti] : 0;
    res.columns.splice(ti,1); res.num.splice(ti,1); res.rows.forEach(r=>r.splice(ti,1));
    const labs = scrCols(); res.columns = res.columns.map(n => (labs.find(c=>c.name===n)||{}).label || n);
    render(res, {type:"table"}, row => { const code = row[0]; const t = BI.templates.find(x=>x.id==="fin_company_10y"); if(t && code){ tab("tpl"); openTpl(t.id); const inp = $("pp-sec_code4"); if(inp){ inp.value = code; runTpl(); } } });
    const pages = Math.max(1, Math.ceil(total/100));
    $("result").insertAdjacentHTML("afterbegin", `<div class="row" style="margin:6px 0"><b>${Number(total).toLocaleString()} 社</b><span class="note">行をクリックで「会社の10年推移」</span>
      <button class="ghost" id="scrPrev" ${SCR.page<=0?"disabled":""}>前の100社</button><span class="note">${SCR.page+1} / ${pages}</span><button class="ghost" id="scrNext" ${SCR.page+1>=pages?"disabled":""}>次の100社</button></div>`);
    $("scrPrev").onclick = () => { SCR.page--; runScreener(); }; $("scrNext").onclick = () => { SCR.page++; runScreener(); };
    showSql(sql, $("result")); logRun("スクリーナー", SCR.filters.map(f=>f[0]+f[1]+f[2]).join(" ") || "全社", q);
  }catch(e){ $("result").innerHTML = `<div class="msg err">${esc(errText(e))}</div>`; showSql(sql, $("result")); }
}

/* ── タブと起動 ─────────────────────────────────── */
function tab(name){
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab===name));
  ["tpl","free","ask","scr","sql","slot"].forEach(n => $("p-"+n).hidden = n !== name);
  if(name==="slot") renderSlots(); if(name==="scr") buildScreener(); if(name==="sql") buildBuilder();
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { tab(b.dataset.tab); if(b.dataset.tab==="free"){ buildFree(); } });
$("askGo").onclick = ask; $("askStop").onclick = () => askCtl && askCtl.abort();
$("sqlGo").onclick = async () => {
  let sql; try{ sql = wrapSql($("sqlText").value); }catch(e){ $("result").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
  $("result").innerHTML = `<div class="msg">BigQuery で集計中…</div>`;
  try{ const res = await runBQ(sql); render(res, {type:"table"}); showSql(sql, $("result")); logRun("SQL", $("sqlText").value.trim().split("\n")[0].slice(0,60), $("sqlText").value); }
  catch(e){ $("result").innerHTML = `<div class="msg err">${esc(errText(e))}</div>`; showSql(sql, $("result")); }
};
$("slotSave").onclick = () => saveSlot($("slotName").value, $("sqlText").value);
$("sqlText").value = "SELECT industry, COUNT(*) AS n_companies, AVG(operating_margin) AS avg_op_margin\nFROM m_fin_annual\nWHERE fiscal_year = 2025\nGROUP BY industry\nORDER BY n_companies DESC";
buildShelf();
$("p-tpl").innerHTML = `<p class="q">左の棚からテンプレを選んでください</p><p class="note">テンプレ ${BI.templates.length} 本・マート ${Object.keys(BI.marts).length} 本（${esc(BI.built_at)} 時点の定義）。結果のクリックで「自由分析」に入ると、その値で絞り込んだまま深掘りできます。</p>`;
(async () => {
  try{ mcp = window.claude ? await window.claude.use("mcp") : null; }catch(e){ mcp = null; }
  try{ sample = window.claude ? await window.claude.use("sample") : null; }catch(e){ sample = null; }
  try{ db = window.claude ? await window.claude.use("db") : null; const u = window.claude ? await window.claude.use("user") : null; me = u ? await u.id() : null; }catch(e){ db = null; me = null; }
  const st = $("status");
  if(!mcp){ st.textContent = "BigQuery 未接続（Claude の画面で開くと使えます）"; st.className = "status bad"; return; }
  st.textContent = "BigQuery 接続可"; st.className = "status ok";
  if(BI.templates[0]) openTpl(BI.templates[0].id);
})();
</script>
