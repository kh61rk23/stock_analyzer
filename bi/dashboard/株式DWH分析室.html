 {"name": "industry", "type": "string", "label": "業種"}, {"name": "accounting_standard", "type": "string", "label": "会計基準"}, {"name": "fiscal_year", "type": "int64", "label": "年度"}, {"name": "fiscal_year_end", "type": "date", "label": "決算期末"}, {"name": "net_sales", "type": "double", "label": "売上高"}, {"name": "operating_income", "type": "double", "label": "営業利益"}, {"name": "ordinary_income", "type": "double", "label": "経常利益"}, {"name": "net_income", "type": "double", "label": "純利益"}, {"name": "total_assets", "type": "double", "label": "総資産"}, {"name": "equity", "type": "double", "label": "自己資本"}, {"name": "employees", "type": "double", "label": "従業員数"}, {"name": "avg_annual_salary", "type": "double", "label": "平均年収"}, {"name": "operating_margin", "type": "double", "label": "営業利益率"}, {"name": "net_margin", "type": "double", "label": "純利益率"}, {"name": "gross_margin", "type": "double", "label": "粗利率"}, {"name": "roe", "type": "double", "label": "ROE"}, {"name": "roa", "type": "double", "label": "ROA"}, {"name": "rnd_ratio", "type": "double", "label": "研究開発費率"}, {"name": "equity_ratio", "type": "double", "label": "自己資本比率"}, {"name": "interest_bearing_debt", "type": "double", "label": "有利子負債"}, {"name": "interest_bearing_debt_basis", "type": "string", "label": "有利子負債の算出方法"}, {"name": "cash_and_equiv", "type": "double", "label": "現金同等物"}, {"name": "net_cash", "type": "double", "label": "ネットキャッシュ"}, {"name": "de_ratio", "type": "double", "label": "D/Eレシオ"}, {"name": "sales_growth_1y", "type": "double", "label": "売上成長率(1年)"}, {"name": "op_income_growth_1y", "type": "double", "label": "営業利益成長率(1年)"}, {"name": "net_income_growth_1y", "type": "double", "label": "純利益成長率(1年)"}, {"name": "sales_cagr_3y", "type": "double", "label": "売上CAGR(3年)"}, {"name": "eps", "type": "double", "label": "EPS"}, {"name": "bps", "type": "double", "label": "BPS"}, {"name": "dividend_per_share", "type": "double", "label": "1株配当"}, {"name": "payout_ratio", "type": "double", "label": "配当性向"}, {"name": "shares_issued", "type": "double", "label": "発行済株式数"}, {"name": "shares_out", "type": "double", "label": "株数"}, {"name": "price_source", "type": "string", "label": "株価の出所"}, {"name": "current_price", "type": "double", "label": "株価"}, {"name": "price_date", "type": "date", "label": "株価の日付"}, {"name": "snapshot_date", "type": "date", "label": "スナップショット日"}, {"name": "market_cap_b", "type": "double", "label": "時価総額(億円)"}, {"name": "market_cap", "type": "double", "label": "時価総額"}, {"name": "per", "type": "double", "label": "PER"}, {"name": "pbr", "type": "double", "label": "PBR"}, {"name": "dividend_yield", "type": "double", "label": "配当利回り"}, {"name": "valuation_flag", "type": "string", "label": "注意フラグ"}, {"name": "net_cash_to_mcap", "type": "double", "label": "ネットキャッシュ÷時価総額"}, {"name": "return_1m", "type": "double", "label": "騰落率1か月"}, {"name": "return_3m", "type": "double", "label": "騰落率3か月"}, {"name": "return_1y", "type": "double", "label": "騰落率1年"}, {"name": "high_52w", "type": "double", "label": "52週高値"}, {"name": "low_52w", "type": "double", "label": "52週安値"}, {"name": "week52_position_pct", "type": "double", "label": "52週レンジ内の位置"}, {"name": "avg_turnover_20d", "type": "double", "label": "平均売買代金20日"}, {"name": "price_days", "type": "int64", "label": "株価の日数"}, {"name": "price_break_date", "type": "date", "label": "分割の疑い日"}, {"name": "composite_score", "type": "double", "label": "総合スコア"}, {"name": "value_score", "type": "double", "label": "割安スコア"}, {"name": "quality_score", "type": "double", "label": "質スコア"}, {"name": "rsi14", "type": "double", "label": "RSI(14)"}, {"name": "above_ma200", "type": "bool", "label": "200日線より上"}, {"name": "technical_date", "type": "date", "label": "テクニカルの日付"}, {"name": "nopat", "type": "double", "label": "NOPAT"}, {"name": "invested_capital", "type": "double", "label": "投下資本"}, {"name": "tax_rate", "type": "double", "label": "税率"}, {"name": "roic_tax_basis", "type": "string", "label": "ROICの税率の出所"}, {"name": "roic", "type": "double", "label": "ROIC"}, {"name": "ocf_margin", "type": "double", "label": "営業CF率"}, {"name": "fcf_margin", "type": "double", "label": "FCFマージン"}, {"name": "gross_margin_chg_1y", "type": "double", "label": "粗利率の前年差"}, {"name": "operating_cf", "type": "double", "label": "営業CF"}, {"name": "fcf", "type": "double", "label": "フリーCF"}, {"name": "ebitda", "type": "double", "label": "EBITDA"}, {"name": "ev", "type": "double", "label": "EV（企業価値）"}, {"name": "ev_ebitda", "type": "double", "label": "EV/EBITDA"}, {"name": "ev_sales", "type": "double", "label": "EV/売上"}, {"name": "psr", "type": "double", "label": "PSR"}, {"name": "peg", "type": "double", "label": "PEG"}, {"name": "fcf_yield", "type": "double", "label": "FCF利回り"}, {"name": "earnings_yield", "type": "double", "label": "益回り"}, {"name": "re_fiscal_year", "type": "int64", "label": "不動産の年度"}, {"name": "re_facility_count", "type": "int64", "label": "主要設備数"}, {"name": "re_est_excluded_count", "type": "int64", "label": "目安を除いた施設数"}, {"name": "re_land_value_est", "type": "double", "label": "土地の時価目安"}, {"name": "re_unrealized_gain", "type": "double", "label": "土地含み益(目安)"}, {"name": "re_gain_flag", "type": "string", "label": "含み益の注記"}, {"name": "re_gain_to_mcap", "type": "double", "label": "含み益÷時価総額"}, {"name": "re_land_value_to_mcap", "type": "double", "label": "土地時価÷時価総額"}, {"name": "re_gain_after_tax", "type": "double", "label": "税引後含み益"}, {"name": "adj_equity", "type": "double", "label": "修正純資産"}, {"name": "adj_pbr", "type": "double", "label": "修正PBR"}, {"name": "asset_value_ratio", "type": "double", "label": "資産バリュー倍率"}, {"name": "interest_coverage", "type": "double", "label": "インタレストカバレッジ"}, {"name": "current_ratio", "type": "double", "label": "流動比率"}, {"name": "goodwill_to_equity", "type": "double", "label": "のれん÷純資産"}, {"name": "accrual_ratio", "type": "double", "label": "アクルーアル"}, {"name": "f_score", "type": "int64", "label": "Fスコア"}, {"name": "f_score_items", "type": "int64", "label": "Fスコア算出項目数"}, {"name": "buyback_est", "type": "double", "label": "自社株買い(推定)"}, {"name": "buyback_yield", "type": "double", "label": "自社株買い利回り"}, {"name": "total_payout_yield", "type": "double", "label": "総還元利回り"}, {"name": "doe", "type": "double", "label": "DOE"}, {"name": "op_income_cagr_3y", "type": "double", "label": "営業益CAGR(3年)"}, {"name": "net_income_cagr_3y", "type": "double", "label": "純益CAGR(3年)"}, {"name": "consec_up_years", "type": "int64", "label": "増収増益の連続期数"}], "table": "stock-analyzer-edinet.bi.m_screener"}, "m_screener_us": {"sql": "-- m_screener_us: 1銘柄1行（キー ticker）。米国株のスクリーナー用の表。通貨はすべて USD（列名の _usd は米ドル。円ではない）。\n-- 日本版 m_screener と同じ考え方の列体系。財務は SEC の無料 API（companyfacts・submissions）から取った\n-- us.company_profile（社名・業種・発行済株式数・最新の貸借・直近4四半期合計）と us.financials_annual（通期の損益・貸借・CF）を使う。\n-- どちらも location=US のため asia の bi.src_us_company_profile / bi.src_us_financials_annual に写したもの（bi_export.py が list_rows→load で更新。クエリ課金なし）を読む。\n-- 通期（revenue_usd など）: 10-K の通期のうち最新（決算期末が2年より新しいもの）。1年前は 330〜400日前の通期。会社ごとの XBRL タグの揺れは取得側で年度ごとに吸収済み。\n-- 直近4四半期合計（ttm_*）: 通期 + 当期累計 - 前年同期累計。10-Q が通期より後に無ければ通期と同じ。\n-- 貸借（total_assets_usd・equity_usd など）: 10-K / 10-Q の最新の期末（balance_date）。有利子負債は短期＋長期。\n-- 時価総額: 終値 × 発行済株式数（SEC の表紙値 dei:EntityCommonStockSharesOutstanding。無い会社は貸借日の株数、それも無ければ加重平均株数。出どころは shares_source）。\n-- PER: 終値 ÷ 直近4四半期の希薄化EPS（無ければ通期）。PBR: 時価総額 ÷ 最新の株主資本。ROE: 直近4四半期の純利益 ÷ 最新の株主資本。株主資本が0以下なら PBR・ROE は空。\n-- 配当利回り: 通期の配当支払総額 ÷ 時価総額。FCF＝営業CF－設備投資（直近4四半期が揃えばそれ、無ければ通期）。\n-- 株価系・騰落率・52週高安・平均売買代金は analytics.price_daily_latest の直近約400日から全銘柄（約5,800）について作る。\n--   終値は分割調整済み・配当未調整。日々の前日比が 0.6倍未満／1.7倍超の日（分割の調整漏れ・異常値）があれば、その日以降の終値だけを使う\n--   （price_break_date）。株数の基準日より後にその日があるときは時価総額が食い違うため、時価総額・PBR・PS・利回りを空にする。\n--   EPS の期末より後にその日があるときは PER を空にする。どちらかに該当すれば valuation_flag='split_suspect'。\n-- 騰落率は営業日ベース（return_1m＝21営業日前・return_3m＝63営業日前・return_1y＝252営業日前、足りなければ360日前以前で最も新しい終値、それも無ければ NULL）。\n-- 52週高値・安値は終値ベースで直近252営業日、履歴が120営業日未満なら NULL。最新日が全体の最新日から14日以内の株価だけ使う。\n-- スコア・RSI は analytics.stock_snapshot の market='US' の会社別最新行（14日以内）から（スナップショットは約400銘柄のみ）。\n-- 多面的な指標（通期ベース。式は日本版 m_screener とそろえる。正本は SPEC_bi_marts §11）:\n--   roic＝営業利益×(1−税率)÷(有利子負債＋株主資本)（通期の期末。税率は 法人税等÷税引前利益 が5〜50%ならその値、無ければ25%＝連邦21%＋州の近似）、\n--   ev＝時価総額＋有利子負債−現金（最新の貸借）、ev_ebitda（EBITDA＝営業利益＋減価償却費）、ev_sales、peg（PER÷EPS3年CAGR%）、earnings_yield、\n--   interest_coverage・current_ratio・accrual_ratio・gross_margin、total_payout_yield（配当＋自社株買い。支払額の符号が会社で逆のことがあるので絶対値。時価総額の100%超は時価総額側の誤りとみて空）、3年CAGR（売上・営業利益・EPS）、\n--   f_score（ピオトロスキー9項目。前年の通期が取れる項目が7つ以上のときだけ）。\n--   減価償却・税・利払い・流動資産負債・粗利・希薄化株数は取得側で後から足した列のため、取り直しが済むまで空の会社がある。\nWITH ann AS (\n  SELECT ticker, cik, period_end, revenue, operating_income, net_income, eps_diluted, buyback, dividends_paid,\n         IF(operating_cf IS NOT NULL AND capex IS NOT NULL, operating_cf - ABS(capex), NULL) AS fcf,\n         operating_cf, total_assets, equity, cash, debt_short, debt_long, gross_profit, depreciation, income_tax, pretax_income,\n         interest_expense, shares_diluted, assets_current, liabilities_current,\n         IF(debt_short IS NOT NULL OR debt_long IS NOT NULL, COALESCE(debt_short, 0) + COALESCE(debt_long, 0), NULL) AS debt\n  FROM `stock-analyzer-edinet.bi.src_us_financials_annual`\n  WHERE revenue IS NOT NULL OR operating_income IS NOT NULL OR net_income IS NOT NULL\n),\nfy_cur AS (\n  SELECT * FROM ann\n  WHERE period_end >= DATE_SUB(CURRENT_DATE('America/New_York'), INTERVAL 2 YEAR)\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY ticker ORDER BY period_end DESC) = 1\n),\nfund AS (\n  SELECT c.ticker, c.cik, c.period_end AS fiscal_year_end, c.revenue, c.operating_income, c.net_income, c.eps_diluted AS eps,\n         c.fcf, c.buyback, c.dividends_paid,\n         IF(p.revenue > 0 AND c.revenue > 0, c.revenue / p.revenue - 1, NULL) AS sales_growth_1y,\n         IF(p.operating_income > 0, c.operating_income / p.operating_income - 1, NULL) AS op_income_growth_1y,\n         IF(p.net_income > 0, c.net_income / p.net_income - 1, NULL) AS net_income_growth_1y,\n         IF(p.eps_diluted > 0, c.eps_diluted / p.eps_diluted - 1, NULL) AS eps_growth_1y,\n         c.operating_cf, c.depreciation, c.interest_expense, c.gross_profit,\n         c.operating_income + c.depreciation AS ebitda,\n         IF(c.pretax_income > 0 AND c.income_tax / c.pretax_income BETWEEN 0.05 AND 0.5, c.income_tax / c.pretax_income, NULL) AS tax_rate_reported,\n         IF(c.debt IS NOT NULL AND c.equity IS NOT NULL AND c.debt + c.equity > 0, c.debt + c.equity, NULL) AS invested_capital,\n         c.assets_current / NULLIF(c.liabilities_current, 0) AS current_ratio,\n         (c.net_income - c.operating_cf) / NULLIF(c.total_assets, 0) AS accrual_ratio,\n         IF(p3.revenue > 0 AND c.revenue > 0, POWER(c.revenue / p3.revenue, 1.0 / 3) - 1, NULL) AS sales_cagr_3y,\n         IF(p3.operating_income > 0 AND c.operating_income > 0, POWER(c.operating_income / p3.operating_income, 1.0 / 3) - 1, NULL) AS op_income_cagr_3y,\n         IF(p3.eps_diluted > 0 AND c.eps_diluted > 0, POWER(c.eps_diluted / p3.eps_diluted, 1.0 / 3) - 1, NULL) AS eps_cagr_3y,\n         CAST(c.net_income / NULLIF(c.total_assets, 0) > 0 AS INT64) AS f1,\n         CAST(c.operating_cf > 0 AS INT64) AS f2,\n         CAST(c.net_income / NULLIF(c.total_assets, 0) > p.net_income / NULLIF(p.total_assets, 0) AS INT64) AS f3,\n         CAST(c.operating_cf > c.net_income AS INT64) AS f4,\n         CAST(c.debt_long / NULLIF(c.total_assets, 0) <= p.debt_long / NULLIF(p.total_assets, 0) AS INT64) AS f5,\n         CAST(c.assets_current / NULLIF(c.liabilities_current, 0) > p.assets_current / NULLIF(p.liabilities_current, 0) AS INT64) AS f6,\n         CAST(c.shares_diluted / NULLIF(p.shares_diluted, 0) <= 1.01 AS INT64) AS f7,\n         CAST(c.gross_profit / NULLIF(c.revenue, 0) > p.gross_profit / NULLIF(p.revenue, 0) AS INT64) AS f8,\n         CAST(c.revenue / NULLIF(c.total_assets, 0) > p.revenue / NULLIF(p.total_assets, 0) AS INT64) AS f9\n  FROM fy_cur AS c\n  LEFT JOIN ann AS p ON p.ticker = c.ticker AND DATE_DIFF(c.period_end, p.period_end, DAY) BETWEEN 330 AND 400\n  LEFT JOIN ann AS p3 ON p3.ticker = c.ticker AND DATE_DIFF(c.period_end, p3.period_end, DAY) BETWEEN 1060 AND 1130\n),\nprof AS (\n  SELECT ticker, cik, name, exchange, sic, sic_description, shares_outstanding, shares_as_of, shares_source,\n         IF(bs_period_end >= DATE_SUB(CURRENT_DATE('America/New_York'), INTERVAL 2 YEAR), bs_period_end, NULL) AS balance_date,\n         bs_total_assets, bs_total_liabilities, bs_equity, bs_cash, bs_debt_short, bs_debt_long,\n         IF(ttm_period_end >= DATE_SUB(CURRENT_DATE('America/New_York'), INTERVAL 2 YEAR), ttm_period_end, NULL) AS ttm_end,\n         ttm_revenue, ttm_operating_income, ttm_net_income, ttm_eps_diluted, ttm_operating_cf, ttm_capex\n  FROM `stock-analyzer-edinet.bi.src_us_company_profile`\n),\nsnap AS (\n  SELECT * FROM (\n    SELECT ticker, snapshot_date, ingested_at, name, composite_score, value_score, quality_score,\n           MAX(snapshot_date) OVER () AS max_d\n    FROM `stock-analyzer-edinet.analytics.stock_snapshot`\n    WHERE market = 'US'\n  )\n  WHERE snapshot_date >= DATE_SUB(max_d, INTERVAL 14 DAY)\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY ticker ORDER BY snapshot_date DESC, ingested_at DESC) = 1\n),\ntech AS (\n  SELECT * FROM (\n    SELECT ticker, snapshot_date, rsi14, above_ma200, MAX(snapshot_date) OVER () AS max_d\n    FROM `stock-analyzer-edinet.analytics.stock_snapshot`\n    WHERE market = 'US' AND rsi14 IS NOT NULL\n  )\n  WHERE snapshot_date >= DATE_SUB(max_d, INTERVAL 14 DAY)\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY ticker ORDER BY snapshot_date DESC) = 1\n),\npx_raw AS (\n  SELECT ticker, trade_date, close, volume,\n         LAG(close) OVER (PARTITION BY ticker ORDER BY trade_date) AS prev_close\n  FROM `stock-analyzer-edinet.analytics.price_daily_latest`\n  WHERE trade_date >= DATE_SUB(CURRENT_DATE('America/New_York'), INTERVAL 400 DAY)\n    AND ticker NOT LIKE '%.T' AND close > 0 AND close < 10000000\n),\npx_brk AS (\n  SELECT *,\n         MAX(IF(prev_close > 0 AND (close / prev_close < 0.6 OR close / prev_close > 1.7), trade_date, NULL)) OVER (PARTITION BY ticker) AS break_date\n  FROM px_raw\n),\npx_rows AS (\n  SELECT ticker, trade_date, close, volume, break_date,\n         ROW_NUMBER() OVER (PARTITION BY ticker ORDER BY trade_date DESC) AS rn,\n         MAX(trade_date) OVER (PARTITION BY ticker) AS tm,\n         MAX(trade_date) OVER () AS max_d\n  FROM px_brk\n  WHERE break_date IS NULL OR trade_date >= break_date\n),\npx AS (\n  SELECT ticker,\n    MAX(IF(rn = 1, trade_date, NULL)) AS price_date,\n    MAX(IF(rn = 1, close, NULL)) AS close,\n    MAX(IF(rn = 22, close, NULL)) AS c_1m,\n    MAX(IF(rn = 64, close, NULL)) AS c_3m,\n    COALESCE(MAX(IF(rn = 253, close, NULL)),\n             ARRAY_AGG(IF(trade_date <= DATE_SUB(tm, INTERVAL 360 DAY), close, NULL) IGNORE NULLS ORDER BY trade_date DESC LIMIT 1)[SAFE_OFFSET(0)]) AS c_1y,\n    COUNT(*) AS price_days,\n    MAX(break_date) AS break_date,\n    MAX(IF(rn <= 252, close, NULL)) AS hi_52w,\n    MIN(IF(rn <= 252, close, NULL)) AS lo_52w,\n    IF(COUNTIF(rn <= 20) >= 15, AVG(IF(rn <= 20, close * volume, NULL)), NULL) AS turnover_20d\n  FROM px_rows\n  WHERE tm >= DATE_SUB(max_d, INTERVAL 14 DAY)\n  GROUP BY ticker\n),\ntickers AS (\n  SELECT ticker FROM px\n  UNION DISTINCT\n  SELECT ticker FROM fund\n  UNION DISTINCT\n  SELECT ticker FROM prof\n),\nj AS (\n  SELECT\n    t.ticker AS ticker,\n    COALESCE(p.name, s.name) AS name,\n    p.exchange AS exchange,\n    p.sic AS sic,\n    p.sic_description AS industry,\n    COALESCE(f.cik, p.cik) AS cik,\n    (f.ticker IS NOT NULL OR p.balance_date IS NOT NULL OR p.ttm_end IS NOT NULL) AS has_fundamentals,\n    f.fiscal_year_end AS fiscal_year_end,\n    f.revenue AS revenue_usd,\n    f.operating_income AS operating_income_usd,\n    f.net_income AS net_income_usd,\n    f.fcf AS fcf_usd,\n    f.buyback AS buyback_usd,\n    f.dividends_paid AS dividends_paid_usd,\n    f.eps AS eps_usd,\n    f.operating_income / NULLIF(f.revenue, 0) AS operating_margin,\n    f.net_income / NULLIF(f.revenue, 0) AS net_margin,\n    f.fcf / NULLIF(f.revenue, 0) AS fcf_margin,\n    f.sales_growth_1y AS sales_growth_1y,\n    f.op_income_growth_1y AS op_income_growth_1y,\n    f.net_income_growth_1y AS net_income_growth_1y,\n    f.eps_growth_1y AS eps_growth_1y,\n    p.ttm_end AS ttm_period_end,\n    IF(p.ttm_end IS NOT NULL, p.ttm_revenue, NULL) AS ttm_revenue_usd,\n    IF(p.ttm_end IS NOT NULL, p.ttm_operating_income, NULL) AS ttm_operating_income_usd,\n    IF(p.ttm_end IS NOT NULL, p.ttm_net_income, NULL) AS ttm_net_income_usd,\n    IF(p.ttm_end IS NOT NULL, p.ttm_eps_diluted, NULL) AS ttm_eps_usd,\n    p.balance_date AS balance_date,\n    IF(p.balance_date IS NOT NULL, p.bs_total_assets, NULL) AS total_assets_usd,\n    IF(p.balance_date IS NOT NULL, p.bs_total_liabilities, NULL) AS total_liabilities_usd,\n    IF(p.balance_date IS NOT NULL, p.bs_equity, NULL) AS equity_usd,\n    IF(p.balance_date IS NOT NULL, p.bs_cash, NULL) AS cash_usd,\n    IF(p.balance_date IS NOT NULL AND (p.bs_debt_short IS NOT NULL OR p.bs_debt_long IS NOT NULL),\n       COALESCE(p.bs_debt_short, 0) + COALESCE(p.bs_debt_long, 0), NULL) AS interest_bearing_debt_usd,\n    IF(p.shares_outstanding > 0, p.shares_outstanding, NULL) AS shares_outstanding,\n    IF(p.shares_outstanding > 0, p.shares_as_of, NULL) AS shares_as_of,\n    IF(p.shares_outstanding > 0, p.shares_source, NULL) AS shares_source,\n    IF(x.ticker IS NOT NULL, 'price_daily', NULL) AS price_source,\n    x.close AS current_price_usd,\n    x.price_date AS price_date,\n    s.snapshot_date AS snapshot_date,\n    x.break_date AS price_break_date,\n    x.close * IF(p.shares_outstanding > 0, p.shares_outstanding, NULL) AS mcap,\n    COALESCE(IF(p.ttm_end IS NOT NULL, p.ttm_operating_cf - ABS(p.ttm_capex), NULL), f.fcf) AS fcf_basis,\n    COALESCE(IF(p.ttm_end IS NOT NULL, p.ttm_eps_diluted, NULL), f.eps) AS eps_basis,\n    COALESCE(IF(p.ttm_end IS NOT NULL, p.ttm_revenue, NULL), f.revenue) AS revenue_basis,\n    COALESCE(IF(p.ttm_end IS NOT NULL, p.ttm_net_income, NULL), f.net_income) AS net_income_basis,\n    COALESCE(p.ttm_end, f.fiscal_year_end) AS eps_basis_date,\n    x.close / x.c_1m - 1 AS return_1m,\n    x.close / x.c_3m - 1 AS return_3m,\n    x.close / x.c_1y - 1 AS return_1y,\n    IF(x.price_days >= 120, x.hi_52w, NULL) AS high_52w_usd,\n    IF(x.price_days >= 120, x.lo_52w, NULL) AS low_52w_usd,\n    IF(x.price_days >= 120 AND x.hi_52w > x.lo_52w, (x.close - x.lo_52w) / (x.hi_52w - x.lo_52w) * 100, NULL) AS week52_position_pct,\n    x.turnover_20d AS avg_turnover_20d_usd,\n    x.price_days AS price_days,\n    s.composite_score AS composite_score,\n    s.value_score AS value_score,\n    s.quality_score AS quality_score,\n    h.rsi14 AS rsi14,\n    h.above_ma200 AS above_ma200,\n    h.snapshot_date AS technical_date,\n    f.ebitda AS ebitda,\n    f.operating_cf AS operating_cf,\n    f.interest_expense AS interest_expense,\n    f.gross_profit / NULLIF(f.revenue, 0) AS gross_margin,\n    COALESCE(f.tax_rate_reported, 0.25) AS tax_rate,\n    IF(f.tax_rate_reported IS NOT NULL, 'reported', 'assumed') AS roic_tax_basis,\n    f.invested_capital AS invested_capital,\n    f.current_ratio AS current_ratio,\n    f.accrual_ratio AS accrual_ratio,\n    f.sales_cagr_3y AS sales_cagr_3y,\n    f.op_income_cagr_3y AS op_income_cagr_3y,\n    f.eps_cagr_3y AS eps_cagr_3y,\n    IF(f.f1 IS NULL, 0, 1) + IF(f.f2 IS NULL, 0, 1) + IF(f.f3 IS NULL, 0, 1) + IF(f.f4 IS NULL, 0, 1) + IF(f.f5 IS NULL, 0, 1) + IF(f.f6 IS NULL, 0, 1) + IF(f.f7 IS NULL, 0, 1) + IF(f.f8 IS NULL, 0, 1) + IF(f.f9 IS NULL, 0, 1) AS f_items,\n    COALESCE(f.f1, 0) + COALESCE(f.f2, 0) + COALESCE(f.f3, 0) + COALESCE(f.f4, 0) + COALESCE(f.f5, 0) + COALESCE(f.f6, 0) + COALESCE(f.f7, 0) + COALESCE(f.f8, 0) + COALESCE(f.f9, 0) AS f_sum\n  FROM tickers AS t\n  LEFT JOIN fund AS f ON f.ticker = t.ticker\n  LEFT JOIN prof AS p ON p.ticker = t.ticker\n  LEFT JOIN px AS x ON x.ticker = t.ticker\n  LEFT JOIN snap AS s ON s.ticker = t.ticker\n  LEFT JOIN tech AS h ON h.ticker = t.ticker\n),\nv AS (\n  SELECT *,\n    (price_break_date IS NOT NULL AND shares_as_of IS NOT NULL AND price_break_date > shares_as_of) AS mcap_suspect,\n    (price_break_date IS NOT NULL AND eps_basis_date IS NOT NULL AND price_break_date > eps_basis_date) AS eps_suspect\n  FROM j\n),\nm AS (\n  SELECT *,\n    IF(mcap_suspect, NULL, mcap) AS mcap_ok,\n    IF(mcap_suspect OR eps_suspect, 'split_suspect', NULL) AS valuation_flag,\n    IF(mcap_suspect OR mcap IS NULL OR cash_usd IS NULL OR interest_bearing_debt_usd IS NULL, NULL, mcap + interest_bearing_debt_usd - cash_usd) AS ev\n  FROM v\n),\nw AS (\n  SELECT *,\n    IF(NOT eps_suspect AND eps_basis > 0, current_price_usd / eps_basis, NULL) AS per_ok\n  FROM m\n)\nSELECT\n  ticker,\n  name,\n  exchange,\n  sic,\n  industry,\n  cik,\n  has_fundamentals,\n  fiscal_year_end,\n  revenue_usd,\n  operating_income_usd,\n  net_income_usd,\n  fcf_usd,\n  buyback_usd,\n  dividends_paid_usd,\n  eps_usd,\n  operating_margin,\n  net_margin,\n  fcf_margin,\n  sales_growth_1y,\n  op_income_growth_1y,\n  net_income_growth_1y,\n  eps_growth_1y,\n  ttm_period_end,\n  ttm_revenue_usd,\n  ttm_operating_income_usd,\n  ttm_net_income_usd,\n  ttm_eps_usd,\n  balance_date,\n  total_assets_usd,\n  total_liabilities_usd,\n  equity_usd,\n  cash_usd,\n  interest_bearing_debt_usd,\n  equity_usd / NULLIF(total_assets_usd, 0) AS equity_ratio,\n  shares_outstanding,\n  shares_as_of,\n  shares_source,\n  price_source,\n  current_price_usd,\n  price_date,\n  snapshot_date,\n  mcap_ok AS market_cap_usd,\n  mcap_ok / 1e9 AS market_cap_bn_usd,\n  IF(NOT eps_suspect AND eps_basis > 0, current_price_usd / eps_basis, NULL) AS per,\n  IF(mcap_ok > 0 AND revenue_basis > 0, mcap_ok / revenue_basis, NULL) AS ps_ratio,\n  IF(mcap_ok > 0, fcf_basis / mcap_ok, NULL) AS fcf_yield,\n  IF(mcap_ok > 0, buyback_usd / mcap_ok, NULL) AS buyback_yield,\n  valuation_flag,\n  IF(mcap_ok > 0 AND equity_usd > 0, mcap_ok / equity_usd, NULL) AS pbr,\n  IF(equity_usd > 0, net_income_basis / equity_usd, NULL) AS roe,\n  IF(mcap_ok > 0, dividends_paid_usd / mcap_ok, NULL) AS dividend_yield,\n  return_1m,\n  return_3m,\n  return_1y,\n  high_52w_usd,\n  low_52w_usd,\n  week52_position_pct,\n  avg_turnover_20d_usd,\n  price_days,\n  price_break_date,\n  composite_score,\n  value_score,\n  quality_score,\n  rsi14,\n  above_ma200,\n  technical_date,\n  ebitda AS ebitda_usd,\n  ev AS ev_usd,\n  IF(ev > 0 AND ebitda > 0, ev / ebitda, NULL) AS ev_ebitda,\n  IF(ev > 0 AND revenue_basis > 0, ev / revenue_basis, NULL) AS ev_sales,\n  tax_rate,\n  roic_tax_basis,\n  invested_capital AS invested_capital_usd,\n  operating_income_usd * (1 - tax_rate) / invested_capital AS roic,\n  gross_margin,\n  IF(interest_expense > 0, operating_income_usd / interest_expense, NULL) AS interest_coverage,\n  current_ratio,\n  accrual_ratio,\n  IF(mcap_ok > 0 AND (dividends_paid_usd IS NOT NULL OR buyback_usd IS NOT NULL) AND (ABS(COALESCE(dividends_paid_usd, 0)) + ABS(COALESCE(buyback_usd, 0))) / mcap_ok <= 1, (ABS(COALESCE(dividends_paid_usd, 0)) + ABS(COALESCE(buyback_usd, 0))) / mcap_ok, NULL) AS total_payout_yield,\n  IF(per_ok IS NOT NULL AND current_price_usd > 0, 1 / per_ok, NULL) AS earnings_yield,\n  IF(per_ok > 0 AND eps_cagr_3y > 0, per_ok / (eps_cagr_3y * 100), NULL) AS peg,\n  sales_cagr_3y,\n  op_income_cagr_3y,\n  eps_cagr_3y,\n  IF(f_items >= 7, f_sum, NULL) AS f_score,\n  f_items AS f_score_items\nFROM w\n", "desc": "米国株スクリーナー。1銘柄1行（NYSE・Nasdaq）。金額はUSD。SEC の財務×株価、ROIC・EV/EBITDA・Fスコア・総還元など多面指標つき", "columns": [{"name": "ticker", "type": "string", "label": "ティッカー"}, {"name": "name", "type": "string", "label": "社名"}, {"name": "exchange", "type": "string", "label": ""}, {"name": "sic", "type": "string", "label": ""}, {"name": "industry", "type": "string", "label": "業種"}, {"name": "cik", "type": "int64", "label": "CIK"}, {"name": "has_fundamentals", "type" e": "string", "label": "株価の出所"}, {"name": "current_price_usd", "type": "double", "label": "株価(USD)"}, {"name": "price_date", "type": "date", "label": "株価の日付"}, {"name": "snapshot_date", "type": "date", "label": "スナップショット日"}, {"name": "market_cap_usd", "type": "double", "label": "時価総額(USD)"}, {"name": "market_cap_bn_usd", "type": "double", "label": "時価総額(十億USD)"}, {"name": "per", "type": "double", "label": "PER"}, {"name": "ps_ratio", "type": "double", "label": "PSR"}, {"name": "fcf_yield", "type": "double", "label": "FCF利回り"}, {"name": "buyback_yield", "type": "double", "label": "自社株買い利回り"}, {"name": "valuation_flag", "type": "string", "label": "注意フラグ"}, {"name": "pbr", "type": "double", "label": "PBR"}, {"name": "roe", "type": "double", "label": "ROE"}, {"name": "dividend_yield", "type": "double", "label": "配当利回り"}, {"name": "return_1m", "type": "double", "label": "騰落率1か月"}, {"name": "return_3m", "type": "double", "label": "騰落率3か月"}, {"name": "return_1y", "type": "double", "label": "騰落率1年"}, {"name": "high_52w_usd", "type": "double", "label": "52週高値(USD)"}, {"name": "low_52w_usd", "type": "double", "label": "52週安値(USD)"}, {"name": "week52_position_pct", "type": "double", "label": "52週レンジ内の位置"}, {"name": "avg_turnover_20d_usd", "type": "double", "label": "平均売買代金20日(USD)"}, {"name": "price_days", "type": "int64", "label": "株価の日数"}, {"name": "price_break_date", "type": "date", "label": "分割の疑い日"}, {"name": "composite_score", "type": "double", "label": "総合スコア"}, {"name": "value_score", "type": "double", "label": "割安スコア"}, {"name": "quality_score", "type": "double", "label": "質スコア"}, {"name": "rsi14", "type": "double", "label": "RSI(14)"}, {"name": "above_ma200", "type": "bool", "label": "200日線より上"}, {"name": "technical_date", "type": "date", "label": "テクニカルの日付"}, {"name": "ebitda_usd", "type": "double", "label": "EBITDA(USD)"}, {"name": "ev_usd", "type": "double", "label": "EV(USD)"}, {"name": "ev_ebitda", "type": "double", "label": "EV/EBITDA"}, {"name": "ev_sales", "type": "double", "label": "EV/売上"}, {"name": "tax_rate", "type": "double", "label": "税率"}, {"name": "roic_tax_basis", "type": "string", "label": "ROICの税率の出所"}, {"name": "invested_capital_usd", "type": "double", "label": "投下資本(USD)"}, {"name": "roic", "type": "double", "label": "ROIC"}, {"name": "gross_margin", "type": "double", "label": "粗利率"}, {"name": "interest_coverage", "type": "double", "label": "インタレストカバレッジ"}, {"name": "current_ratio", "type": "double", "label": "流動比率"}, {"name": "accrual_ratio", "type": "double", "label": "アクルーアル"}, {"name": "total_payout_yield", "type": "double", "label": "総還元利回り"}, {"name": "earnings_yield", "type": "double", "label": "益回り"}, {"name": "peg", "type": "double", "label": "PEG"}, {"name": "sales_cagr_3y", "type": "double", "label": "売上CAGR(3年)"}, {"name": "op_income_cagr_3y", "type": "double", "label": "営業益CAGR(3年)"}, {"name": "eps_cagr_3y", "type": "double", "label": "EPS CAGR(3年)"}, {"name": "f_score", "type": "int64", "label": "Fスコア"}, {"name": "f_score_items", "type": "int64", "label": "Fスコア算出項目数"}], "table": "stock-analyzer-edinet.bi.m_screener_us"}, "m_sector_perf": {"sql": "-- m_sector_perf: 業種×営業日（キー industry, trade_date）。日本株の業種ごとの日次騰落率・指数・上昇銘柄比率。約33業種×約240営業日＝約8千行（業種×日でも軽いので週にしない）。\n-- 元は analytics.price_daily_latest の直近約400日（.T のみ）と bi.m_screener（業種 industry と時価総額 market_cap。bi_export が前回実体化した表を読む。小さい）。\n-- 業種は EDINET の業種名（m_screener.industry）。株価が取れ、業種のある上場会社だけ。\n-- 株価の取り込みが途中の日（日本株全体で前日比が付いた銘柄数が直近21営業日の最大の9割未満）は除く（業種の銘柄が欠けて偏るため）。\n-- 日々の前日比が 0.6倍未満／1.7倍超の日（分割の調整漏れ・異常値）があれば、その日以降の価格だけ使う（m_screener と同じ規則）。\n-- ret_ew＝業種内の銘柄の日次騰落率の単純平均（等加重）、ret_cw＝時価総額で加重した平均。重みは最新の時価総額（日々の時価総額の履歴は持たないため固定の近似。時価総額が無い銘柄は ret_cw から外す）。\n-- idx_ew／idx_cw＝日次騰落率を掛け合わせた指数（取得期間の頭の前営業日＝100）。リバランス日次の近似で、実際の業種指数（TOPIX-17 等）とは一致しない。\n-- ret_1m_*／ret_3m_*＝21／63営業日前の指数との比、ret_ytd_*＝前年最終営業日の指数との比（前年の履歴が無ければ NULL）。\n-- up_ratio＝前日比が上がった銘柄 ÷（上がった＋下がった）。変わらずは除く。turnover＝業種内の 終値×出来高 の合計（円）。\nWITH scr AS (\n  SELECT ticker, ANY_VALUE(industry) AS industry, MAX(market_cap) AS market_cap\n  FROM `stock-analyzer-edinet.bi.m_screener`\n  WHERE ticker IS NOT NULL AND industry IS NOT NULL\n  GROUP BY ticker\n),\npx_raw AS (\n  SELECT ticker, trade_date, close, volume,\n         LAG(close) OVER (PARTITION BY ticker ORDER BY trade_date) AS prev_close\n  FROM `stock-analyzer-edinet.analytics.price_daily_latest`\n  WHERE trade_date >= DATE_SUB(CURRENT_DATE('Asia/Tokyo'), INTERVAL 400 DAY)\n    AND ticker LIKE '%.T' AND close > 0 AND close < 10000000\n),\npx_brk AS (\n  SELECT *,\n         MAX(IF(prev_close > 0 AND (close / prev_close < 0.6 OR close / prev_close > 1.7), trade_date, NULL)) OVER (PARTITION BY ticker) AS break_date\n  FROM px_raw\n),\ncal AS (\n  SELECT trade_date FROM (\n    SELECT trade_date, COUNT(*) AS n,\n           MAX(COUNT(*)) OVER (ORDER BY trade_date ROWS BETWEEN 20 PRECEDING AND CURRENT ROW) AS n_ref\n    FROM px_brk WHERE prev_close > 0 GROUP BY trade_date\n  ) WHERE n >= 0.9 * n_ref\n),\nr AS (\n  SELECT s.industry, p.trade_date, p.close / p.prev_close - 1 AS ret, p.close * p.volume AS turnover, s.market_cap\n  FROM px_brk AS p JOIN scr AS s ON s.ticker = p.ticker\n  WHERE (p.break_date IS NULL OR p.trade_date >= p.break_date) AND p.prev_close > 0\n    AND p.trade_date IN (SELECT trade_date FROM cal)\n),\nd AS (\n  SELECT industry, trade_date,\n    COUNT(*) AS n_stocks,\n    COUNTIF(ret > 0) AS n_up,\n    COUNTIF(ret < 0) AS n_down,\n    AVG(ret) AS ret_ew,\n    SUM(IF(market_cap > 0, ret * market_cap, NULL)) / NULLIF(SUM(IF(market_cap > 0, market_cap, NULL)), 0) AS ret_cw,\n    SUM(turnover) AS turnover\n  FROM r\n  GROUP BY industry, trade_date\n),\ni AS (\n  SELECT *,\n    100 * EXP(SUM(LN(1 + ret_ew)) OVER (PARTITION BY industry ORDER BY trade_date)) AS idx_ew,\n    100 * EXP(SUM(LN(1 + COALESCE(ret_cw, ret_ew))) OVER (PARTITION BY industry ORDER BY trade_date)) AS idx_cw\n  FROM d\n),\nye AS (\n  SELECT industry, EXTRACT(YEAR FROM trade_date) + 1 AS yr,\n         ARRAY_AGG(idx_ew ORDER BY trade_date DESC LIMIT 1)[OFFSET(0)] AS base_ew,\n         ARRAY_AGG(idx_cw ORDER BY trade_date DESC LIMIT 1)[OFFSET(0)] AS base_cw\n  FROM i\n  GROUP BY industry, yr\n),\nl AS (\n  SELECT *,\n    LAG(idx_ew, 21) OVER (PARTITION BY industry ORDER BY trade_date) AS ew_21,\n    LAG(idx_ew, 63) OVER (PARTITION BY industry ORDER BY trade_date) AS ew_63,\n    LAG(idx_cw, 21) OVER (PARTITION BY industry ORDER BY trade_date) AS cw_21,\n    LAG(idx_cw, 63) OVER (PARTITION BY industry ORDER BY trade_date) AS cw_63\n  FROM i\n)\nSELECT\n  l.industry AS industry,\n  l.trade_date AS trade_date,\n  l.n_stocks AS n_stocks,\n  l.n_up AS n_up,\n  l.n_down AS n_down,\n  ROUND(l.n_up / NULLIF(l.n_up + l.n_down, 0), 4) AS up_ratio,\n  ROUND(l.ret_ew, 5) AS ret_ew,\n  ROUND(l.ret_cw, 5) AS ret_cw,\n  ROUND(l.idx_ew, 4) AS idx_ew,\n  ROUND(l.idx_cw, 4) AS idx_cw,\n  ROUND(l.idx_ew / l.ew_21 - 1, 5) AS ret_1m_ew,\n  ROUND(l.idx_ew / l.ew_63 - 1, 5) AS ret_3m_ew,\n  ROUND(l.idx_ew / ye.base_ew - 1, 5) AS ret_ytd_ew,\n  ROUND(l.idx_cw / l.cw_21 - 1, 5) AS ret_1m_cw,\n  ROUND(l.idx_cw / l.cw_63 - 1, 5) AS ret_3m_cw,\n  ROUND(l.idx_cw / ye.base_cw - 1, 5) AS ret_ytd_cw,\n  ROUND(l.turnover, 0) AS turnover\nFROM l\nLEFT JOIN ye ON ye.industry = l.industry AND ye.yr = EXTRACT(YEAR FROM l.trade_date)\n", "desc": "", "columns": [{"name": "industry", "type": "string", "label": "業種"}, {"name": "trade_date", "type": "date", "label": ""}, {"name": "n_stocks", "type": "int64", "label": ""}, {"name": "n_up", "type": "int64", "label": ""}, {"name": "n_down", "type": "int64", "label": ""}, {"name": "up_ratio", "type": "double", "label": ""}, {"name": "ret_ew", "type": "double", "label": ""}, {"name": "ret_cw", "type": "double", "label": ""}, {"name": "idx_ew", "type": "double", "label": ""}, {"name": "idx_cw", "type": "double", "label": ""}, {"name": "ret_1m_ew", "type": "double", "label": ""}, {"name": "ret_3m_ew", "type": "double", "label": ""}, {"name": "ret_ytd_ew", "type": "double", "label": ""}, {"name": "ret_1m_cw", "type": "double", "label": ""}, {"name": "ret_3m_cw", "type": "double", "label": ""}, {"name": "ret_ytd_cw", "type": "double", "label": ""}, {"name": "turnover", "type": "double", "label": ""}], "table": "stock-analyzer-edinet.bi.m_sector_perf"}, "m_sector_scores": {"sql": "-- m_sector_scores: 業種スコアの日次推移。1日×市場×業種1行（キー report_date, market, sector_code）。\n-- 元は analytics.sector_scores_daily（report_store.py が毎日の md/csv から追記。日本＝sectors/{code}_{date}.md の見出し、米国＝us_sector_scores_{date}.csv）。\n-- 同じ日の作り直しは fetched_at が新しい行。score_chg_1d・score_chg_5d はその業種の1つ前・5つ前の記録日との差（記録日ベース）。\n-- 日本の ret_* は空（md に無い）。米国の ret_* は ETF の騰落率（%）。\nWITH r AS (\n  SELECT * FROM `stock-analyzer-edinet.analytics.sector_scores_daily`\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY report_date, market, sector_code ORDER BY fetched_at DESC) = 1\n)\nSELECT\n  report_date,\n  market,\n  sector_code,\n  sector_name,\n  score,\n  risk_level,\n  ret_1m,\n  ret_3m,\n  ret_12m,\n  signals,\n  score - LAG(score) OVER (PARTITION BY market, sector_code ORDER BY report_date) AS score_chg_1d,\n  score - LAG(score, 5) OVER (PARTITION BY market, sector_code ORDER BY report_date) AS score_chg_5d,\n  RANK() OVER (PARTITION BY report_date, market ORDER BY score DESC) AS score_rank\nFROM r\n", "desc": "業種スコアの日次推移（日本33業種＋米国11セクター・2026-07〜）。前日差・5日差・順位つき", "columns": [], "table": ""}, "m_stock_snapshot": {"sql": "-- m_stock_snapshot: スクリーナー通過銘柄の日次スナップショット（銘柄レポート md の正本）。1日1銘柄1行（キー snapshot_date, ticker）。\n-- 元は analytics.stock_snapshot（stock_snapshot_writer が毎日 INSERT。2026-09-09 から）。同じ日・銘柄の重複は ingested_at が新しい行。\n-- 単位は比率＝小数（0.22＝22%）、debt_equity＝倍にそろえる。2026-10-11 より前の行は書き込み側で単位が混ざっていたので、ここで直す:\n--   dividend_yield … 2026-10-01 より前の日本株で 0.3 超は 1/10000、それ以外で 0.3 超は 1/100（％表記の行）\n--   roe … 日本株で 1.5 超は 1/100（yfinance 由来の％表記）。fcf_margin・debt_equity・roic … yfinance 由来のみなので 1/100\n--   equity_ratio … yfinance からの計算が 100% 超になる誤りがあったため、旧行は空。新しい行も 0〜1 の外は空\n-- 事後リターン: analytics.price_daily_latest の終値で、記録日以降の最初の営業日（7日以内）を起点に 5・20 営業日後の騰落率。\n--   まだその日が来ていない行は空。終値は分割調整済み（配当は含まない）。\nWITH s AS (\n  SELECT * FROM `stock-analyzer-edinet.analytics.stock_snapshot`\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY snapshot_date, ticker ORDER BY ingested_at DESC) = 1\n),\nn AS (\n  SELECT *,\n    snapshot_date < DATE '2026-10-11' AS legacy\n  FROM s\n),\np AS (\n  SELECT ticker, trade_date, close, ROW_NUMBER() OVER (PARTITION BY ticker ORDER BY trade_date) AS rn\n  FROM `stock-analyzer-edinet.analytics.price_daily_latest`\n  WHERE trade_date >= DATE '2026-09-01' AND close > 0\n),\na AS (\n  SELECT n.ticker, n.snapshot_date, MIN(p.rn) AS rn0\n  FROM n JOIN p ON p.ticker = n.ticker AND p.trade_date BETWEEN n.snapshot_date AND DATE_ADD(n.snapshot_date, INTERVAL 7 DAY)\n  GROUP BY n.ticker, n.snapshot_date\n)\nSELECT\n  n.snapshot_date AS snapshot_date,\n  n.ticker AS ticker,\n  n.market AS market,\n  n.name AS name,\n  n.sector_code AS sector_code,\n  n.sector_name AS sector_name,\n  n.composite_score AS composite_score,\n  n.sector_score AS sector_score,\n  n.value_score AS value_score,\n  n.quality_score AS quality_score,\n  n.technical_score AS technical_score,\n  n.discovery_score AS discovery_score,\n  n.per AS per,\n  n.pbr AS pbr,\n  IF(n.legacy AND n.market = 'JP' AND n.roe > 1.5, n.roe / 100, n.roe) AS roe,\n  IF(n.legacy, n.roic / 100, n.roic) AS roic,\n  IF(n.legacy, n.fcf_margin / 100, n.fcf_margin) AS fcf_margin,\n  IF(n.legacy, n.debt_equity / 100, n.debt_equity) AS debt_equity,\n  IF(n.legacy OR n.equity_ratio > 1 OR n.equity_ratio < 0, NULL, n.equity_ratio) AS equity_ratio,\n  CASE WHEN n.legacy AND n.snapshot_date < DATE '2026-10-01' AND n.market = 'JP' AND n.dividend_yield > 0.3 THEN n.dividend_yield / 10000 WHEN n.legacy AND n.dividend_yield > 0.3 THEN n.dividend_yield / 100 ELSE n.dividend_yield END AS dividend_yield,\n  n.market_cap_b AS market_cap_b,\n  n.current_price AS current_price,\n  n.rsi14 AS rsi14,\n  n.macd_crossup AS macd_crossup,\n  n.above_ma200 AS above_ma200,\n  n.above_vwap AS above_vwap,\n  n.week52_position_pct AS week52_position_pct,\n  n.accrual_tier AS accrual_tier,\n  n.size_tier AS size_tier,\n  n.strategy_label AS strategy_label,\n  n.analyst_reco AS analyst_reco,\n  n.signal_text AS signal_text,\n  p0.trade_date AS base_trade_date,\n  p0.close AS base_close,\n  p5.close / p0.close - 1 AS fwd_return_5d,\n  p20.close / p0.close - 1 AS fwd_return_20d\nFROM n\nLEFT JOIN a ON a.ticker = n.ticker AND a.snapshot_date = n.snapshot_date\nLEFT JOIN p AS p0 ON p0.ticker = n.ticker AND p0.rn = a.rn0\nLEFT JOIN p AS p5 ON p5.ticker = n.ticker AND p5.rn = a.rn0 + 5\nLEFT JOIN p AS p20 ON p20.ticker = n.ticker AND p20.rn = a.rn0 + 20\n", "desc": "スクリーナー通過銘柄の日次記録（銘柄レポート md の正本・2026-09-09〜）。1日1銘柄1行。スコア・財務・テクニカル・シグナル文と5/20営業日後のリターン", "columns": [{"name": "snapshot_date", "type": "date", "label": "スナップショット日"}, {"name": "ticker", "type": "string", "label": "ティッカー"}, {"name": "market", "type": "string", "label": "市場"}, {"name": "name", "type": "string", "label": "社名"}, {"name": "sector_code", "type": "string", "label": "業種コード"}, {"name": "sector_name", "type": "string", "label": "業種"}, {"name": "composite_score", "type": "double", "label": "総合スコア"}, {"name": "sector_score", "type": "double", "label": ""}, {"name": "value_score", "type": "double", "label": "割安スコア"}, {"name": "quality_score", "type": "double", "label": "質スコア"}, {"name": "technical_score", "type": "double", "label": "テクニカルスコア"}, {"name": "discovery_score", "type": "double", "label": ""}, {"name": "per", "type": "double", "label": "PER"}, {"name": "pbr", "type": "double", "label": "PBR"}, {"name": "roe", "type": "double", "label": "ROE"}, {"name": "roic", "type": "double", "label": "ROIC"}, {"name": "fcf_margin", "type": "double", "label": "FCFマージン"}, {"name": "debt_equity", "type": "double", "label": ""}, {"name": "equity_ratio", "type": "double", "label": "自己資本比率"}, {"name": "dividend_yield", "type": "double", "label": "配当利回り"}, {"name": "market_cap_b", "type": "double", "label": "時価総額(億円)"}, {"name": "current_price", "type": "double", "label": "株価"}, {"name": "rsi14", "type": "double", "label": "RSI(14)"}, {"name": "macd_crossup", "type": "bool", "label": ""}, {"name": "above_ma200", "type": "bool", "label": "200日線より上"}, {"name": "above_vwap", "type": "bool", "label": ""}, {"name": "week52_position_pct", "type": "double", "label": "52週レンジ内の位置"}, {"name": "accrual_tier", "type": "string", "label": ""}, {"name": "size_tier", "type": "string", "label": ""}, {"name": "strategy_label", "type": "string", "label": ""}, {"name": "analyst_reco", "type": "string", "label": ""}, {"name": "signal_text", "type": "string", "label": "シグナル"}, {"name": "base_trade_date", "type": "date", "label": ""}, {"name": "base_close", "type": "double", "label": "起点の終値"}, {"name": "fwd_return_5d", "type": "double", "label": "5営業日後リターン"}, {"name": "fwd_return_20d", "type": "double", "label": "20営業日後リターン"}], "table": "stock-analyzer-edinet.bi.m_stock_snapshot"}, "m_tax_node": {"sql": "-- m_tax_node: 技術分類ノード1行（キー node_id）。taxonomy.taxonomy_node は node_id が一意（293ノード・孤児親なし）。\n-- 階層は node_level 1（領域）〜4。親をたどって最上位（領域）と「領域 > … > 自ノード」のパス名を持つ。\n-- company_count は直接このノードに紐づく会社数（上場企業のみ・sector: 始まりの業種単位の行と company_id='nan' は除く）、\n-- company_count_rollup は自ノード以下（子孫）に紐づく会社の重複なしの数。\n-- 親子の鎖は最大4段なので、親を3回自己結合して祖先を引く（再帰クエリは使わない）。\nWITH n AS (\n  SELECT node_id, parent_id, node_name_ja, node_name_en, node_level, node_type, supply_chain_pos\n  FROM `stock-analyzer-edinet.taxonomy.taxonomy_node`\n  WHERE is_active IS NOT FALSE AND effective_to IS NULL\n),\nmp AS (\n  SELECT company_id, node_id\n  FROM `stock-analyzer-edinet.taxonomy.company_taxonomy_map`\n  WHERE company_id <> 'nan' AND NOT STARTS_WITH(company_id, 'sector:') AND (valid_to IS NULL OR valid_to >= CURRENT_DATE())\n  GROUP BY company_id, node_id\n),\nup AS (\n  SELECT mp.company_id, mp.node_id AS leaf_id, mp.node_id AS anc_id FROM mp\n  UNION ALL\n  SELECT mp.company_id, mp.node_id, n1.parent_id FROM mp JOIN n AS n1 ON n1.node_id = mp.node_id WHERE n1.parent_id IS NOT NULL\n  UNION ALL\n  SELECT mp.company_id, mp.node_id, n2.parent_id FROM mp JOIN n AS n1 ON n1.node_id = mp.node_id JOIN n AS n2 ON n2.node_id = n1.parent_id WHERE n2.parent_id IS NOT NULL\n  UNION ALL\n  SELECT mp.company_id, mp.node_id, n3.parent_id FROM mp JOIN n AS n1 ON n1.node_id = mp.node_id JOIN n AS n2 ON n2.node_id = n1.parent_id JOIN n AS n3 ON n3.node_id = n2.parent_id WHERE n3.parent_id IS NOT NULL\n),\ncnt AS (\n  SELECT anc_id AS node_id, COUNT(DISTINCT company_id) AS company_count_rollup\n  FROM up\n  GROUP BY anc_id\n),\ndirect AS (\n  SELECT node_id, COUNT(DISTINCT company_id) AS company_count\n  FROM mp\n  GROUP BY node_id\n),\nkids AS (\n  SELECT parent_id AS node_id, COUNT(*) AS child_count\n  FROM n\n  WHERE parent_id IS NOT NULL\n  GROUP BY parent_id\n)\nSELECT\n  a0.node_id,\n  a0.parent_id,\n  a0.node_name_ja,\n  a0.node_name_en,\n  a0.node_level,\n  a0.node_type,\n  a0.supply_chain_pos,\n  CASE a0.node_level WHEN 1 THEN a0.node_id WHEN 2 THEN a1.node_id WHEN 3 THEN a2.node_id ELSE a3.node_id END AS domain_id,\n  CASE a0.node_level WHEN 1 THEN a0.node_name_ja WHEN 2 THEN a1.node_name_ja WHEN 3 THEN a2.node_name_ja ELSE a3.node_name_ja END AS domain_name_ja,\n  CASE a0.node_level WHEN 1 THEN a0.node_name_ja WHEN 2 THEN CONCAT(a1.node_name_ja, ' > ', a0.node_name_ja) WHEN 3 THEN CONCAT(a2.node_name_ja, ' > ', a1.node_name_ja, ' > ', a0.node_name_ja) ELSE CONCAT(a3.node_name_ja, ' > ', a2.node_name_ja, ' > ', a1.node_name_ja, ' > ', a0.node_name_ja) END AS path_name,\n  COALESCE(k.child_count, 0) AS child_count,\n  COALESCE(d.company_count, 0) AS company_count,\n  COALESCE(c.company_count_rollup, 0) AS company_count_rollup\nFROM n AS a0\nLEFT JOIN n AS a1 ON a1.node_id = a0.parent_id\nLEFT JOIN n AS a2 ON a2.node_id = a1.parent_id\nLEFT JOIN n AS a3 ON a3.node_id = a2.parent_id\nLEFT JOIN kids AS k ON k.node_id = a0.node_id\nLEFT JOIN direct AS d ON d.node_id = a0.node_id\nLEFT JOIN cnt AS c ON c.node_id = a0.node_id\n", "desc": "技術分類ツリー。1ノード1行（階層・領域・紐づく企業数）", "columns": [{"name": "node_id", "type": "string", "label": "技術分類ID"}, {"name": "parent_id", "type": "string", "label": "親ノードID"}, {"name": "node_name_ja", "type": "string", "label": "技術分類名"}, {"name": "node_name_en", "type": "string", "label": "技術分類名（英）"}, {"name": "node_level", "type": "int64", "label": "階層"}, {"name": "node_type", "type": "string", "label": "ノード種別"}, {"name": "supply_chain_pos", "type": "string", "label": "サプライチェーン上の位置"}, {"name": "domain_id", "type": "string", "label": "領域ID"}, {"name": "domain_name_ja", "type": "string", "label": "技術領域"}, {"name": "path_name", "type": "string", "label": "分類パス"}, {"name": "child_count", "type": "int64", "label": "子ノード数"}, {"name": "company_count", "type": "int64", "label": "企業数"}, {"name": "company_count_rollup", "type": "int64", "label": "企業数（下位含む）"}], "table": "stock-analyzer-edinet.bi.m_tax_node"}, "m_theme": {"sql": "-- m_theme: テーマ(subtheme)×銘柄1行（キー theme_name, ticker）。edinet.ticker_subtheme_mapping の実在銘柄だけ。\n-- 元表は同じ ticker×subtheme が取り込みのたびに重複して入る（実測 4 時点）ため、updated_at が最新の1行に絞る。\n-- source='json_sync' の行は ticker が 'SECTOR_<業種コード>' のプレースホルダ（業種単位のテーマ定義）で銘柄ではないので除く\n-- （テーマの定義は m_theme_def）。実在銘柄は source='config_representative'＝業種ごとの代表銘柄（2〜3社）に、\n-- その業種のテーマ全部を付けたもの。会社ごとに選んだテーマではない（同じ業種の代表銘柄は同じテーマ集合を持つ）。\n-- ticker は日本株が '6501.T'。証券コード4桁で edinet.company と結合する（同じ sec_code4 が複数社なら上場中を優先して1社）。\n-- 財務は会社ごとに「売上が入っている最新の fiscal_year」1年分と、その前年（fiscal_year - 1 が実在するときだけ）の売上。\n-- sales_growth は前年比（小数。0.1＝+10%）。前年が無い会社は空。\nWITH mp AS (\n  SELECT\n    ticker,\n    market,\n    subtheme AS theme_name,\n    sector_code,\n    relevance,\n    source,\n    ROW_NUMBER() OVER (PARTITION BY ticker, subtheme, sector_code ORDER BY updated_at DESC) AS rn\n  FROM `stock-analyzer-edinet.edinet.ticker_subtheme_mapping`\n  WHERE NOT STARTS_WITH(ticker, 'SECTOR_')\n),\nco AS (\n  SELECT\n    edinet_code,\n    SUBSTR(sec_code, 1, 4) AS sec_code4,\n    name,\n    industry,\n    ROW_NUMBER() OVER (PARTITION BY SUBSTR(sec_code, 1, 4) ORDER BY IF(is_delisted, 1, 0), edinet_code) AS rn\n  FROM `stock-analyzer-edinet.edinet.company`\n  WHERE sec_code IS NOT NULL\n),\nfin AS (\n  SELECT\n    edinet_code,\n    fiscal_year,\n    net_sales,\n    operating_income,\n    net_income,\n    ROW_NUMBER() OVER (PARTITION BY edinet_code ORDER BY fiscal_year DESC) AS rn\n  FROM `stock-analyzer-edinet.edinet.financials`\n  WHERE net_sales IS NOT NULL\n),\nsm AS (\n  SELECT sector_code, market, name_ja, supply_chain_position\n  FROM `stock-analyzer-edinet.edinet.sub_theme_master`\n)\nSELECT\n  mp.theme_name,\n  mp.market,\n  mp.sector_code,\n  sm.name_ja AS sector_name_ja,\n  sm.supply_chain_position,\n  mp.ticker,\n  REPLACE(mp.ticker, '.T', '') AS sec_code4,\n  co.edinet_code,\n  co.name,\n  co.industry,\n  mp.relevance,\n  mp.source,\n  fin.fiscal_year,\n  fin.net_sales,\n  fin.operating_income,\n  fin.net_income,\n  fin.operating_income / NULLIF(fin.net_sales, 0) AS operating_margin,\n  fin.net_sales / NULLIF(prev.net_sales, 0) - 1 AS sales_growth\nFROM mp\nLEFT JOIN sm ON sm.sector_code = mp.sector_code AND sm.market = mp.market\nLEFT JOIN co ON co.sec_code4 = REPLACE(mp.ticker, '.T', '') AND co.rn = 1 AND mp.market = 'JP'\nLEFT JOIN fin ON fin.edinet_code = co.edinet_code AND fin.rn = 1\nLEFT JOIN `stock-analyzer-edinet.edinet.financials` AS prev ON prev.edinet_code = fin.edinet_code AND prev.fiscal_year = fin.fiscal_year - 1\nWHERE mp.rn = 1\n", "desc": "テーマ×銘柄。業種ごとの代表銘柄にその業種のテーマが付く（同じ業種のテーマは同じ銘柄集合）", "columns": [{"name": "theme_name", "type": "string", "label": ""}, {"name": "market", "type": "string", "label": "市場"}, {"name": "sector_code", "type": "string", "label": "業種コード"}, {"name": "sector_name_ja", "type": "string", "label": ""}, {"name": "supply_chain_position", "type": "string", "label": ""}, {"name": "ticker", "type": "string", "label": "ティッカー"}, {"name": "sec_code4", "type": "string", "label": "証券コード"}, {"name": "edinet_code", "type": "string", "label": "EDINETコード"}, {"name": "name", "type": "string", "label": "社名"}, {"name": "industry", "type": "string", "label": "業種"}, {"name": "relevance", "type": "double", "label": ""}, {"name": "source", "type": "string", "label": ""}, {"name": "fiscal_year", "type": "int64", "label": "年度"}, {"name": "net_sales", "type": "double", "label": "売上高"}, {"name": "operating_income", "type": "double", "label": "営業利益"}, {"name": "net_income", "type": "double", "label": "純利益"}, {"name": "operating_margin", "type": "double", "label": "営業利益率"}, {"name": "sales_growth", "type": "double", "label": ""}], "table": "stock-analyzer-edinet.bi.m_theme"}, "m_theme_def": {"sql": "-- m_theme_def: テーマの定義1行（キー theme_name, sector_code, market）。edinet.sub_theme_master は業種1行に\n-- テーマ名の JSON 配列（subthemes）を持つ（日本33業種＋米国11業種＝44行）ので、配列を1テーマ1行に開く。\n-- company_count は m_theme に実在銘柄として紐づく社数（実在銘柄の無い米国のテーマは 0）。\n-- theme_order は業種内でのテーマの並び（0始まり）。\nWITH th AS (\n  SELECT\n    m.sector_code,\n    m.market,\n    m.name_ja AS sector_name_ja,\n    m.supply_chain_position,\n    theme_name,\n    pos AS theme_order\n  FROM `stock-analyzer-edinet.edinet.sub_theme_master` AS m, UNNEST(JSON_VALUE_ARRAY(m.subthemes)) AS theme_name WITH OFFSET AS pos\n),\ncnt AS (\n  SELECT subtheme AS theme_name, sector_code, market, COUNT(DISTINCT ticker) AS company_count\n  FROM `stock-analyzer-edinet.edinet.ticker_subtheme_mapping`\n  WHERE NOT STARTS_WITH(ticker, 'SECTOR_')\n  GROUP BY subtheme, sector_code, market\n)\nSELECT\n  th.theme_name,\n  th.market,\n  th.sector_code,\n  th.sector_name_ja,\n  th.supply_chain_position,\n  th.theme_order,\n  COALESCE(cnt.company_count, 0) AS company_count\nFROM th\nLEFT JOIN cnt ON cnt.theme_name = th.theme_name AND cnt.sector_code = th.sector_code AND cnt.market = th.market\n", "desc": "テーマ定義。業種サブテーマの一覧（米国を含む）", "columns": [{"name": "theme_name", "type": "string", "label": ""}, {"name": "market", "type": "string", "label": "市場"}, {"name": "sector_code", "type": "string", "label": "業種コード"}, {"name": "sector_name_ja", "type": "string", "label": ""}, {"name": "supply_chain_position", "type": "string", "label": ""}, {"name": "theme_order", "type": "int64", "label": ""}, {"name": "company_count", "type": "int64", "label": "企業数"}], "table": "stock-analyzer-edinet.bi.m_theme_def"}, "m_theme_signal": {"sql": "-- m_theme_signal: テーマ×日×シグナル種別×方向1行（キー theme_name, sector_code, fired_at, signal_category, direction）。\n-- 元は ontology.signal_event（location=US）。asia-northeast1 のテーマ表と1本のクエリで結合できないため、\n-- bi_export.py が list_rows → load job（どちらも無料）で asia の bi.src_signal_event へ写してからここで読む。\n-- 結合は業種コードで行う（signal_event.sector_code ＝ sub_theme_master.sector_code）。テーマは業種ごとに定義され\n-- 銘柄ごとの割当ではないため、同じ業種のテーマは同じシグナル件数になる点に注意。日本の業種だけ（米国のテーマに対応するシグナルは無い）。\n-- signal_event は同じ event_id が再取り込みで重複して入るので event_id の重複を除いて数える。\n-- ticker が空のシグナルは業種単位。ticker_signal_count は銘柄つきの件数、ticker_count はその銘柄数。\n-- days_before_latest は表内の最新シグナル日からの日数（日付関数を使わず「直近N日」を絞れる。更新日に依存しない）。\nWITH th AS (\n  SELECT m.sector_code, m.name_ja AS sector_name_ja, theme_name\n  FROM `stock-analyzer-edinet.edinet.sub_theme_master` AS m, UNNEST(JSON_VALUE_ARRAY(m.subthemes)) AS theme_name\n  WHERE m.market = 'JP'\n),\nsig AS (\n  SELECT\n    sector_code,\n    fired_at,\n    signal_category,\n    direction,\n    COUNT(DISTINCT event_id) AS signal_count,\n    COUNT(DISTINCT IF(ticker IS NOT NULL, event_id, NULL)) AS ticker_signal_count,\n    COUNT(DISTINCT ticker) AS ticker_count,\n    AVG(signal_value) AS avg_signal_value\n  FROM `stock-analyzer-edinet.bi.src_signal_event`\n  WHERE sector_code IS NOT NULL\n  GROUP BY sector_code, fired_at, signal_category, direction\n),\nlatest AS (\n  SELECT MAX(fired_at) AS latest_date\n  FROM `stock-analyzer-edinet.bi.src_signal_event`\n)\nSELECT\n  th.theme_name,\n  th.sector_code,\n  th.sector_name_ja,\n  sig.fired_at,\n  DATE_DIFF(latest.latest_date, sig.fired_at, DAY) AS days_before_latest,\n  sig.signal_category,\n  sig.direction,\n  sig.signal_count,\n  sig.ticker_signal_count,\n  sig.ticker_count,\n  sig.avg_signal_value\nFROM sig\nINNER JOIN th ON th.sector_code = sig.sector_code\nCROSS JOIN latest\n", "desc": "テーマ×日×シグナル種別。days_before_latest で直近N日に絞れる", "columns": [{"name": "theme_name", "type": "string", "label": ""}, {"name": "sector_code", "type": "string", "label": "業種コード"}, {"name": "sector_name_ja", "type": "string", "label": ""}, {"name": "fired_at", "type": "date", "label": ""}, {"name": "days_before_latest", "type": "int64", "label": ""}, {"name": "signal_category", "type": "string", "label": ""}, {"name": "direction", "type": "string", "label": ""}, {"name": "signal_count", "type": "int64", "label": ""}, {"name": "ticker_signal_count", "type": "int64", "label": ""}, {"name": "ticker_count", "type": "int64", "label": ""}, {"name": "avg_signal_value", "type": "double", "label": ""}], "table": "stock-analyzer-edinet.bi.m_theme_signal"}, "m_us_fin_annual": {"sql": "-- m_us_fin_annual: 米国株の通期財務。1銘柄1通期1行（キー ticker, fiscal_year_end）。通貨は USD（列名の _usd）。\n-- 元は bi.src_us_financials_annual（us.financials_annual の写し。SEC companyfacts の 10-K 通期を、会社ごとのタグの揺れを吸収して1列にしたもの）と\n-- bi.src_us_company_profile（社名・取引所・SIC 業種）。どちらも location=US の表を bi_export が list_rows→load で写したもの（クエリ課金なし）。\n-- 直近6年の期末だけ（前年比を出すため5年＋1年）。fiscal_year は期末日の年（例: 2025-09-27 期末の Apple は 2025）。\n-- 設備投資・自社株買い・配当は会社によって符号が逆に入るので絶対値にそろえる。FCF＝営業CF−設備投資。\n-- 前年比は、1つ前の通期の期末が 330〜400日前にあるときだけ（決算期変更の年は空）。\nWITH a AS (\n  SELECT ticker, cik, period_end, revenue, operating_income, net_income, eps_diluted, operating_cf,\n         ABS(capex) AS capex, ABS(buyback) AS buyback, ABS(dividends_paid) AS dividends_paid,\n         total_assets, total_liabilities, equity, cash, gross_profit, depreciation,\n         IF(debt_short IS NOT NULL OR debt_long IS NOT NULL, COALESCE(debt_short, 0) + COALESCE(debt_long, 0), NULL) AS debt\n  FROM `stock-analyzer-edinet.bi.src_us_financials_annual`\n  WHERE period_end >= DATE_SUB(CURRENT_DATE('America/New_York'), INTERVAL 6 YEAR)\n    AND (revenue IS NOT NULL OR operating_income IS NOT NULL OR net_income IS NOT NULL)\n),\nl AS (\n  SELECT *,\n    LAG(period_end) OVER w AS p_end,\n    LAG(revenue) OVER w AS p_revenue,\n    LAG(operating_income) OVER w AS p_op,\n    LAG(net_income) OVER w AS p_ni,\n    LAG(eps_diluted) OVER w AS p_eps\n  FROM a\n  WINDOW w AS (PARTITION BY ticker ORDER BY period_end)\n),\np AS (\n  SELECT ticker, name, exchange, sic, sic_description FROM `stock-analyzer-edinet.bi.src_us_company_profile`\n)\nSELECT\n  l.ticker AS ticker,\n  l.cik AS cik,\n  p.name AS name,\n  p.exchange AS exchange,\n  p.sic AS sic,\n  p.sic_description AS industry,\n  l.period_end AS fiscal_year_end,\n  EXTRACT(YEAR FROM l.period_end) AS fiscal_year,\n  l.revenue AS revenue_usd,\n  l.gross_profit AS gross_profit_usd,\n  l.operating_income AS operating_income_usd,\n  l.net_income AS net_income_usd,\n  l.eps_diluted AS eps_usd,\n  l.operating_cf AS operating_cf_usd,\n  l.capex AS capex_usd,\n  IF(l.operating_cf IS NOT NULL AND l.capex IS NOT NULL, l.operating_cf - l.capex, NULL) AS fcf_usd,\n  l.depreciation AS depreciation_usd,\n  l.buyback AS buyback_usd,\n  l.dividends_paid AS dividends_paid_usd,\n  l.total_assets AS total_assets_usd,\n  l.total_liabilities AS total_liabilities_usd,\n  l.equity AS equity_usd,\n  l.cash AS cash_usd,\n  l.debt AS debt_usd,\n  l.gross_profit / NULLIF(l.revenue, 0) AS gross_margin,\n  l.operating_income / NULLIF(l.revenue, 0) AS operating_margin,\n  l.net_income / NULLIF(l.revenue, 0) AS net_margin,\n  IF(l.operating_cf IS NOT NULL AND l.capex IS NOT NULL, (l.operating_cf - l.capex) / NULLIF(l.revenue, 0), NULL) AS fcf_margin,\n  IF(l.equity > 0, l.net_income / l.equity, NULL) AS roe,\n  l.equity / NULLIF(l.total_assets, 0) AS equity_ratio,\n  IF(DATE_DIFF(l.period_end, l.p_end, DAY) BETWEEN 330 AND 400 AND l.p_revenue > 0, l.revenue / l.p_revenue - 1, NULL) AS sales_growth_1y,\n  IF(DATE_DIFF(l.period_end, l.p_end, DAY) BETWEEN 330 AND 400 AND l.p_op > 0, l.operating_income / l.p_op - 1, NULL) AS op_income_growth_1y,\n  IF(DATE_DIFF(l.period_end, l.p_end, DAY) BETWEEN 330 AND 400 AND l.p_ni > 0, l.net_income / l.p_ni - 1, NULL) AS net_income_growth_1y,\n  IF(DATE_DIFF(l.period_end, l.p_end, DAY) BETWEEN 330 AND 400 AND l.p_eps > 0, l.eps_diluted / l.p_eps - 1, NULL) AS eps_growth_1y\nFROM l\nLEFT JOIN p ON p.ticker = l.ticker\nWHERE l.period_end >= DATE_SUB(CURRENT_DATE('America/New_York'), INTERVAL 5 YEAR)\n", "desc": "米国株の通期財務。1銘柄1通期1行（直近5年・USD）。売上・利益・FCF・還元・貸借と前年比", "columns": [{"name": "ticker", "type": "string", "label": "ティッカー"}, {"name": "cik", "type": "int64", "label": "CIK"}, {"name": "name", "type": "string", "label": "社名"}, {"name": "exchange", "type": "string", "label": ""}, {"name": "sic", "type": "string", "label": ""}, {"name": "industry", "type": "string", "label": "業種"}, {"name": "fiscal_year_end", "type": "date", "label": "決算期末"}, {"name": "fiscal_year", "type": "int64", "label": "年度"}, {"name": "revenue_usd", "type": "double", "label": "売上(USD)"}, {"name": "gross_profit_usd", "type": "double", "label": "売上総利益(USD)"}, {"name": "operating_income_usd", "type": "double", "label": "営業利益(USD)"}, {"name": "net_income_usd", "type": "double", "label": "純利益(USD)"}, {"name": "eps_usd", "type": "double", "label": "EPS(USD)"}, {"name": "operating_cf_usd", "type": "double", "label": "営業CF(USD)"}, {"name": "capex_usd", "type": "double", "label": "設備投資(USD)"}, {"name": "fcf_usd", "type": "double", "label": "フリーCF(USD)"}, {"name": "depreciation_usd", "type": "double", "label": "減価償却(USD)"}, {"name": "buyback_usd", "type": "double", "label": "自社株買い(USD)"}, {"name": "dividends_paid_usd", "type": "double", "label": "配当支払額(USD)"}, {"name": "total_assets_usd", "type": "double", "label": "総資産(USD)"}, {"name": "total_liabilities_usd", "type": "double", "label": "総負債(USD)"}, {"name": "equity_usd", "type": "double", "label": "株主資本(USD)"}, {"name": "cash_usd", "type": "double", "label": "現金(USD)"}, {"name": "debt_usd", "type": "double", "label": "有利子負債(USD)"}, {"name": "gross_margin", "type": "double", "label": "粗利率"}, {"name": "operating_margin", "type": "double", "label": "営業利益率"}, {"name": "net_margin", "type": "double", "label": "純利益率"}, {"name": "fcf_margin", "type": "double", "label": "FCFマージン"}, {"name": "roe", "type": "double", "label": "ROE"}, {"name": "equity_ratio", "type": "double", "label": "自己資本比率"}, {"name": "sales_growth_1y", "type": "double", "label": "売上成長率(1年)"}, {"name": "op_income_growth_1y", "type": "double", "label": "営業利益成長率(1年)"}, {"name": "net_income_growth_1y", "type": "double", "label": "純利益成長率(1年)"}, {"name": "eps_growth_1y", "type": "double", "label": "EPS成長率(1年)"}], "table": "stock-analyzer-edinet.bi.m_us_fin_annual"}, "m_us_segments": {"sql": "-- m_us_segments: 米国株のセグメント別の売上・営業利益。1社×軸×セグメント×通期1行（キー cik, axis, member, fiscal_year_end）。通貨は USD。\n-- 元は bi.src_us_segments（us.segment_financials の写し。SEC Financial Statement Data Sets の num.txt のうち、\n-- 軸1つ（BusinessSegments＝事業・ProductOrService＝製品/サービス・Geographical＝地域）の売上系タグと営業利益。us_segments.py が四半期ごとに追記）。\n-- 通期（qtrs=4）だけを使う。同じ期の同じ値は翌年の 10-K に比較列として再掲されるので、(cik, 軸, セグメント, タグ, 期末) ごとに提出日が新しい行を採る（訂正後の値）。\n-- 売上は会社ごとに使うタグが違うため、RevenueFromContractWithCustomerExcludingAssessedTax → Revenues → その他の順で1つ選ぶ。\n-- 営業利益（OperatingIncomeLoss）をセグメント別に開示するのは主に事業セグメント。製品・地域の軸は売上だけの会社が多い。\n-- ティッカーは CIK ごとに1つ（種類株などで複数あるときは辞書順で最初のもの。tickers_all に全部）。\n-- revenue_share は全社売上（bi.src_us_financials_annual の同じ会社・期末±10日の通期売上）に対する比率。全社売上が無ければ空。\n-- 軸のセグメント合計で割らない理由: 製品・サービスの軸には「Product（製品計）」「Service」のような合計の行と内訳の行が並ぶ会社が多く\n-- （AAPL は Product＝iPhone＋Mac＋iPad＋Wearables）、合計で割ると比率が半分ほどに縮む。合計の行も残すので、足し上げると100%を超えることがある。\nWITH s AS (\n  SELECT cik, axis, member, tag, period_end, val\n  FROM `stock-analyzer-edinet.bi.src_us_segments`\n  WHERE qtrs = 4\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY cik, axis, member, tag, period_end ORDER BY filed DESC) = 1\n),\nrev AS (\n  SELECT cik, axis, member, period_end,\n    ARRAY_AGG(val ORDER BY CASE tag WHEN 'RevenueFromContractWithCustomerExcludingAssessedTax' THEN 1 WHEN 'Revenues' THEN 2 ELSE 3 END LIMIT 1)[OFFSET(0)] AS revenue\n  FROM s WHERE tag != 'OperatingIncomeLoss'\n  GROUP BY cik, axis, member, period_end\n),\noi AS (\n  SELECT cik, axis, member, period_end, val AS operating_income FROM s WHERE tag = 'OperatingIncomeLoss'\n),\nseg AS (\n  SELECT COALESCE(r.cik, o.cik) AS cik, COALESCE(r.axis, o.axis) AS axis, COALESCE(r.member, o.member) AS member,\n         COALESCE(r.period_end, o.period_end) AS period_end, r.revenue, o.operating_income\n  FROM rev AS r\n  FULL OUTER JOIN oi AS o ON o.cik = r.cik AND o.axis = r.axis AND o.member = r.member AND o.period_end = r.period_end\n),\nco AS (\n  SELECT cik, period_end, ANY_VALUE(revenue) AS company_revenue\n  FROM `stock-analyzer-edinet.bi.src_us_financials_annual`\n  WHERE revenue > 0\n  GROUP BY cik, period_end\n),\ntk AS (\n  SELECT cik, MIN(ticker) AS ticker, STRING_AGG(ticker, ',' ORDER BY ticker) AS tickers_all,\n         ANY_VALUE(name) AS name, ANY_VALUE(sic_description) AS industry\n  FROM `stock-analyzer-edinet.bi.src_us_company_profile`\n  WHERE cik IS NOT NULL\n  GROUP BY cik\n),\ncr AS (\n  SELECT seg.cik, seg.period_end, ARRAY_AGG(co.company_revenue ORDER BY ABS(DATE_DIFF(seg.period_end, co.period_end, DAY)) LIMIT 1)[OFFSET(0)] AS company_revenue\n  FROM (SELECT DISTINCT cik, period_end FROM seg) AS seg\n  JOIN co ON co.cik = seg.cik AND ABS(DATE_DIFF(seg.period_end, co.period_end, DAY)) <= 10\n  GROUP BY seg.cik, seg.period_end\n),\nx AS (\n  SELECT seg.*, cr.company_revenue,\n    LAG(period_end) OVER (PARTITION BY cik, axis, member ORDER BY period_end) AS p_end,\n    LAG(revenue) OVER (PARTITION BY cik, axis, member ORDER BY period_end) AS p_revenue,\n    MAX(period_end) OVER (PARTITION BY cik) AS latest_end\n  FROM seg\n  LEFT JOIN cr USING (cik, period_end)\n)\nSELECT\n  t.ticker AS ticker,\n  x.cik AS cik,\n  t.tickers_all AS tickers_all,\n  t.name AS name,\n  t.industry AS industry,\n  x.axis AS axis,\n  CASE x.axis WHEN 'BusinessSegments' THEN '事業' WHEN 'ProductOrService' THEN '製品・サービス' WHEN 'Geographical' THEN '地域' END AS axis_ja,\n  x.member AS member,\n  REGEXP_REPLACE(REGEXP_REPLACE(REGEXP_REPLACE(x.member, r'^.*:', ''), r'(Segment)?Member$', ''), r'([a-z])([A-Z])', r'\\1 \\2') AS segment_name,\n  x.period_end AS fiscal_year_end,\n  EXTRACT(YEAR FROM x.period_end) AS fiscal_year,\n  (x.period_end = x.latest_end) AS is_latest,\n  x.revenue AS revenue_usd,\n  x.operating_income AS operating_income_usd,\n  x.operating_income / NULLIF(x.revenue, 0) AS operating_margin,\n  x.company_revenue AS company_revenue_usd,\n  IF(x.company_revenue > 0 AND x.revenue >= 0, x.revenue / x.company_revenue, NULL) AS revenue_share,\n  IF(DATE_DIFF(x.period_end, x.p_end, DAY) BETWEEN 330 AND 400 AND x.p_revenue > 0, x.revenue / x.p_revenue - 1, NULL) AS revenue_growth_1y\nFROM x\nLEFT JOIN tk AS t ON t.cik = x.cik\n", "desc": "米国株のセグメント別売上・営業利益。1社×軸（事業／製品・サービス／地域）×セグメント×通期1行。構成比は全社売上に対する比率（合計行が混ざることがある）", "columns": [{"name": "ticker", "type": "string", "label": "ティッカー"}, {"name": "cik", "type": "int64", "label": "CIK"}, {"name": "tickers_all", "type": "string", "label": "ティッカー（全種類）"}, {"name": "name", "type": "string", "label": "社名"}, {"name": "industry", "type": "string", "label": "業種"}, {"name": "axis", "type": "string", "label": ""}, {"name": "axis_ja", "type": "string", "label": "軸"}, {"name": "member", "type": "string", "label": "セグメント（原名）"}, {"name": "segment_name", "type": "string", "label": "セグメント"}, {"name": "fiscal_year_end", "type": "date", "label": "決算期末"}, {"name": "fiscal_year", "type": "int64", "label": "年度"}, {"name": "is_latest", "type": "bool", "label": "最新期"}, {"name": "revenue_usd", "type": "double", "label": "売上(USD)"}, {"name": "operating_income_usd", "type": "double", "label": "営業利益(USD)"}, {"name": "operating_margin", "type": "double", "label": "営業利益率"}, {"name": "company_revenue_usd", "type": "double", "label": "全社売上(USD)"}, {"name": "revenue_share", "type": "double", "label": "売上構成比"}, {"name": "revenue_growth_1y", "type": "double", "label": "売上成長率(1年)"}], "table": "stock-analyzer-edinet.bi.m_us_segments"}}, "templates": [{"id": "fin_company_10y", "domain": "finance", "title": "会社の10年推移", "question": "この会社の売上・営業利益・純利益は直近10年でどう動いたか", "mart": "m_fin_annual", "sql": "SELECT fiscal_year, name, net_sales, operating_income, net_income,\n       ROUND(operating_margin * 100, 2) AS operating_margin_pct\nFROM m_fin_annual\nWHERE sec_code4 = {{sec_code4}}\n  AND fiscal_year > (SELECT MAX(fiscal_year) FROM m_fin_annual WHERE sec_code4 = {{sec_code4}} AND net_sales IS NOT NULL) - {{years}}\nORDER BY fiscal_year", "params": [{"name": "sec_code4", "label": "証券コード（4桁）", "type": "string", "default": "7203"}, {"name": "years", "label": "遡る年数", "type": "int", "default": 10, "min": 1, "max": 15}], "chart": {"type": "line", "x": "fiscal_year", "y": ["net_sales", "operating_income", "net_income"], "series": null}, "note": "金額は円。最新期は決算発表前だと空欄になることがある。"}, {"id": "fin_industry_opm", "domain": "finance", "title": "業種別の営業利益率", "question": "どの業種が儲かっているか（営業利益率の業種平均と社数）", "mart": "m_fin_annual", "sql": "WITH d AS (\n  SELECT COALESCE(industry, '(不明)') AS industry_name, operating_margin\n  FROM m_fin_annual\n  WHERE fiscal_year = {{fiscal_year}} AND operating_margin BETWEEN -1 AND 1\n)\nSELECT industry_name, ROUND(AVG(operating_margin) * 100, 2) AS avg_operating_margin_pct, COUNT(*) AS companies\nFROM d\nGROUP BY industry_name\nHAVING COUNT(*) >= {{min_companies}}\nORDER BY avg_operating_margin_pct DESC", "params": [{"name": "fiscal_year", "label": "決算年（期末の年）", "type": "int", "default": 2025, "min": 2016, "max": 2030}, {"name": "min_companies", "label": "最低社数", "type": "int", "default": 5, "min": 1, "max": 1000}], "chart": {"type": "bar", "x": "industry_name", "y": "avg_operating_margin_pct", "series": null}, "note": "単純平均（社の大きさは加味しない）。営業利益率が±100%を超える外れ値は除く。"}, {"id": "fin_rnd_ranking", "domain": "finance", "title": "研究開発費率ランキング", "question": "売上に対する研究開発費の割合が高い会社は", "mart": "m_fin_annual", "sql": "SELECT sec_code4, name, industry, ROUND(rnd_ratio * 100, 2) AS rnd_ratio_pct, rnd_expenses, net_sales\nFROM m_fin_annual\nWHERE fiscal_year = {{fiscal_year}} AND rnd_ratio IS NOT NULL AND rnd_ratio <= 1 AND net_sales >= {{min_sales}}\nORDER BY rnd_ratio DESC\nLIMIT {{limit}}", "params": [{"name": "fiscal_year", "label": "決算年（期末の年）", "type": "int", "default": 2025, "min": 2016, "max": 2030}, {"name": "min_sales", "label": "売上高の下限（円）", "type": "number", "default": 10000000000, "min": 0}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 500}], "chart": {"type": "bar", "x": "name", "y": "rnd_ratio_pct", "series": null}, "note": "売上100億円未満は研究開発費率が極端に出やすいので既定で除外。"}, {"id": "fin_sales_growth_3y", "domain": "finance", "title": "売上3年成長率の上位", "question": "3年前から売上を最も伸ばした会社は", "mart": "m_fin_annual", "sql": "WITH w AS (\n  SELECT edinet_code, sec_code4, name, industry, fiscal_year, net_sales,\n         LAG(net_sales, 3) OVER (PARTITION BY edinet_code ORDER BY fiscal_year) AS sales_3y_ago,\n         LAG(fiscal_year, 3) OVER (PARTITION BY edinet_code ORDER BY fiscal_year) AS year_3y_ago\n  FROM m_fin_annual\n  WHERE net_sales IS NOT NULL\n)\nSELECT sec_code4, name, industry, sales_3y_ago, net_sales,\n       ROUND((net_sales / NULLIF(sales_3y_ago, 0) - 1) * 100, 1) AS growth_3y_pct\nFROM w\nWHERE fiscal_year = {{fiscal_year}} AND year_3y_ago = fiscal_year - 3 AND sales_3y_ago >= {{min_sales}}\nORDER BY growth_3y_pct DESC\nLIMIT {{limit}}", "params": [{"name": "fiscal_year", "label": "決算年（期末の年）", "type": "int", "default": 2025, "min": 2016, "max": 2030}, {"name": "min_sales", "label": "3年前の売上高の下限（円）", "type": "number", "default": 10000000000, "min": 0}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 500}], "chart": {"type": "bar", "x": "name", "y": "growth_3y_pct", "series": null}, "note": "3年前の決算が欠けている会社は対象外（行の並びではなく年で3年前を確認している）。合併・買収による増加も含む。"}, {"id": "fin_up_up_trend", "domain": "finance", "title": "増収増益企業数の年次推移", "question": "売上も営業利益も前年より増えた会社は毎年どれだけあるか", "mart": "m_fin_annual", "sql": "WITH w AS (\n  SELECT edinet_code, fiscal_year, net_sales, operating_income,\n         LAG(net_sales) OVER (PARTITION BY edinet_code ORDER BY fiscal_year) AS prev_sales,\n         LAG(operating_income) OVER (PARTITION BY edinet_code ORDER BY fiscal_year) AS prev_op,\n         LAG(fiscal_year) OVER (PARTITION BY edinet_code ORDER BY fiscal_year) AS prev_year\n  FROM m_fin_annual\n  WHERE net_sales IS NOT NULL AND operating_income IS NOT NULL\n)\nSELECT fiscal_year,\n       COUNT(*) AS companies,\n       SUM(CASE WHEN net_sales > prev_sales AND operating_income > prev_op THEN 1 ELSE 0 END) AS up_up_companies,\n       ROUND(SUM(CASE WHEN net_sales > prev_sales AND operating_income > prev_op THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) AS up_up_pct\nFROM w\nWHERE prev_year = fiscal_year - 1 AND fiscal_year BETWEEN {{from_year}} AND {{to_year}}\nGROUP BY fiscal_year\nORDER BY fiscal_year", "params": [{"name": "from_year", "label": "開始年", "type": "int", "default": 2017, "min": 2016, "max": 2030}, {"name": "to_year", "label": "終了年", "type": "int", "default": 2025, "min": 2016, "max": 2030}], "chart": {"type": "line", "x": "fiscal_year", "y": ["up_up_companies", "up_up_pct"], "series": null}, "note": "前年の決算が両方そろう会社だけが母数。母数は年によって変わるので割合も併記。"}, {"id": "fin_industry_salary", "domain": "finance", "title": "業種別の平均年収", "question": "業種ごとの平均年間給与（万円）", "mart": "m_fin_annual", "sql": "WITH d AS (\n  SELECT COALESCE(industry, '(不明)') AS industry_name, avg_annual_salary\n  FROM m_fin_annual\n  WHERE fiscal_year = {{fiscal_year}} AND avg_annual_salary > 0\n)\nSELECT industry_name, ROUND(AVG(avg_annual_salary) / 10000, 0) AS avg_salary_man_yen, COUNT(*) AS companies\nFROM d\nGROUP BY industry_name\nHAVING COUNT(*) >= {{min_companies}}\nORDER BY avg_salary_man_yen DESC", "params": [{"name": "fiscal_year", "label": "決算年（期末の年）", "type": "int", "default": 2025, "min": 2016, "max": 2030}, {"name": "min_companies", "label": "最低社数", "type": "int", "default": 5, "min": 1, "max": 1000}], "chart": {"type": "bar", "x": "industry_name", "y": "avg_salary_man_yen", "series": null}, "note": "有報の「平均年間給与」（提出会社単体・持株会社は社員が少なく高く出ることがある）。"}, {"id": "fin_sales_per_employee", "domain": "finance", "title": "1人当たり売上ランキング", "question": "従業員1人当たりの売上が大きい会社は", "mart": "m_fin_annual", "sql": "SELECT sec_code4, name, industry, employee_count, net_sales,\n       ROUND(net_sales / NULLIF(employee_count, 0) / 1000000, 1) AS sales_per_employee_m_yen\nFROM m_fin_annual\nWHERE fiscal_year = {{fiscal_year}} AND net_sales > 0 AND employee_count >= {{min_employees}}\nORDER BY sales_per_employee_m_yen DESC\nLIMIT {{limit}}", "params": [{"name": "fiscal_year", "label": "決算年（期末の年）", "type": "int", "default": 2025, "min": 2016, "max": 2030}, {"name": "min_employees", "label": "従業員数の下限", "type": "int", "default": 100, "min": 1, "max": 1000000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 500}], "chart": {"type": "bar", "x": "name", "y": "sales_per_employee_m_yen", "series": null}, "note": "単位は百万円/人。売上は連結、従業員数は連結の人数（employee_count）。商社・持株会社が上位に出やすい。"}, {"id": "fin_fcf_positive_share", "domain": "finance", "title": "フリーCF黒字企業の割合", "question": "フリーキャッシュフローが黒字の会社は毎年どれだけあるか", "mart": "m_fin_annual", "sql": "SELECT fiscal_year,\n       COUNT(*) AS companies,\n       SUM(CASE WHEN free_cf > 0 THEN 1 ELSE 0 END) AS fcf_positive,\n       ROUND(SUM(CASE WHEN free_cf > 0 THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) AS fcf_positive_pct\nFROM m_fin_annual\nWHERE free_cf IS NOT NULL AND fiscal_year BETWEEN {{from_year}} AND {{to_year}}\nGROUP BY fiscal_year\nORDER BY fiscal_year", "params": [{"name": "from_year", "label": "開始年", "type": "int", "default": 2017, "min": 2016, "max": 2030}, {"name": "to_year", "label": "終了年", "type": "int", "default": 2025, "min": 2016, "max": 2030}], "chart": {"type": "line", "x": "fiscal_year", "y": "fcf_positive_pct", "series": null}, "note": "フリーCF＝営業CF＋投資CF（財務データの定義）。"}, {"id": "fin_equity_ratio_dist", "domain": "finance", "title": "自己資本比率の分布", "question": "自己資本比率はどの区間に何社いるか", "mart": "m_fin_annual", "sql": "WITH d AS (\n  SELECT CASE WHEN equity_ratio < 0 THEN 0\n              WHEN equity_ratio < 0.2 THEN 1\n              WHEN equity_ratio < 0.4 THEN 2\n              WHEN equity_ratio < 0.6 THEN 3\n              WHEN equity_ratio < 0.8 THEN 4\n              ELSE 5 END AS bucket_no,\n         CASE WHEN equity_ratio < 0 THEN '債務超過'\n              WHEN equity_ratio < 0.2 THEN '0〜20%'\n              WHEN equity_ratio < 0.4 THEN '20〜40%'\n              WHEN equity_ratio < 0.6 THEN '40〜60%'\n              WHEN equity_ratio < 0.8 THEN '60〜80%'\n              ELSE '80%以上' END AS bucket\n  FROM m_fin_annual\n  WHERE fiscal_year = {{fiscal_year}} AND equity_ratio IS NOT NULL\n)\nSELECT bucket_no, bucket, COUNT(*) AS companies\nFROM d\nGROUP BY bucket_no, bucket\nORDER BY bucket_no", "params": [{"name": "fiscal_year", "label": "決算年（期末の年）", "type": "int", "default": 2025, "min": 2016, "max": 2030}], "chart": {"type": "bar", "x": "bucket", "y": "companies", "series": null}, "note": "自己資本比率＝純資産(equity)÷総資産。銀行・保険は構造上低く出る。"}, {"id": "fin_goodwill_heavy", "domain": "finance", "title": "のれんが純資産に占める割合が大きい会社", "question": "買収で積んだのれんが純資産に比べて重い会社は", "mart": "m_fin_annual", "sql": "SELECT sec_code4, name, industry, goodwill, net_assets,\n       ROUND(goodwill / NULLIF(net_assets, 0) * 100, 1) AS goodwill_to_net_assets_pct\nFROM m_fin_annual\nWHERE fiscal_year = {{fiscal_year}} AND goodwill > 0 AND net_assets > {{min_net_assets}}\nORDER BY goodwill_to_net_assets_pct DESC\nLIMIT {{limit}}", "params": [{"name": "fiscal_year", "label": "決算年（期末の年）", "type": "int", "default": 2025, "min": 2016, "max": 2030}, {"name": "min_net_assets", "label": "純資産の下限（円）", "type": "number", "default": 1000000000, "min": 0}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 500}], "chart": {"type": "bar", "x": "name", "y": "goodwill_to_net_assets_pct", "series": null}, "note": "のれん/純資産が100%超は、のれんが減損されると債務超過に近づく目安。IFRS採用会社はのれんの扱いが違う。"}, {"id": "fin_payout_dist", "domain": "finance", "title": "配当性向の分布", "question": "配当性向はどの区間に何社いるか", "mart": "m_fin_annual", "sql": "WITH d AS (\n  SELECT CASE WHEN payout_ratio <= 0 THEN 0\n              WHEN payout_ratio < 0.2 THEN 1\n              WHEN payout_ratio < 0.4 THEN 2\n              WHEN payout_ratio < 0.6 THEN 3\n              WHEN payout_ratio < 1 THEN 4\n              ELSE 5 END AS bucket_no,\n         CASE WHEN payout_ratio <= 0 THEN '無配・0%'\n              WHEN payout_ratio < 0.2 THEN '0〜20%'\n              WHEN payout_ratio < 0.4 THEN '20〜40%'\n              WHEN payout_ratio < 0.6 THEN '40〜60%'\n              WHEN payout_ratio < 1 THEN '60〜100%'\n              ELSE '100%以上' END AS bucket\n  FROM m_fin_annual\n  WHERE fiscal_year = {{fiscal_year}} AND payout_ratio IS NOT NULL\n)\nSELECT bucket_no, bucket, COUNT(*) AS companies\nFROM d\nGROUP BY bucket_no, bucket\nORDER BY bucket_no", "params": [{"name": "fiscal_year", "label": "決算年（期末の年）", "type": "int", "default": 2025, "min": 2016, "max": 2030}], "chart": {"type": "bar", "x": "bucket", "y": "companies", "series": null}, "note": "配当性向は連結ベースの自前計算値（小数）。赤字で配当を出す会社は100%以上に入る。"}, {"id": "fin_roe_pbr_scatter", "domain": "finance", "title": "ROE × PBR 散布図", "question": "ROEが高い会社ほどPBRも高いか", "mart": "m_fin_annual", "sql": "SELECT sec_code4, name, COALESCE(industry, '(不明)') AS industry_name,\n       ROUND(roe * 100, 2) AS roe_pct, ROUND(pbr, 2) AS pbr\nFROM m_fin_annual\nWHERE fiscal_year = {{fiscal_year}} AND roe BETWEEN -0.5 AND 0.6 AND pbr > 0 AND pbr <= {{max_pbr}}", "params": [{"name": "fiscal_year", "label": "決算年（期末の年）", "type": "int", "default": 2025, "min": 2016, "max": 2030}, {"name": "max_pbr", "label": "PBRの上限（外れ値除去）", "type": "number", "default": 10, "min": 1, "max": 300}], "chart": {"type": "scatter", "x": "roe_pct", "y": "pbr", "series": "industry_name"}, "note": "PBRは有報記載の期末ベース。ROEが-50%〜60%の範囲だけを描く。"}, {"id": "fin_gross_vs_sga", "domain": "finance", "title": "粗利率と販管費率の業種比較", "question": "業種ごとの粗利率と販管費率の違い", "mart": "m_fin_annual", "sql": "WITH d AS (\n  SELECT COALESCE(industry, '(不明)') AS industry_name, gross_margin, sga_ratio\n  FROM m_fin_annual\n  WHERE fiscal_year = {{fiscal_year}} AND gross_margin BETWEEN 0 AND 1 AND sga_ratio BETWEEN 0 AND 1\n)\nSELECT industry_name,\n       ROUND(AVG(gross_margin) * 100, 1) AS avg_gross_margin_pct,\n       ROUND(AVG(sga_ratio) * 100, 1) AS avg_sga_ratio_pct,\n       COUNT(*) AS companies\nFROM d\nGROUP BY industry_name\nHAVING COUNT(*) >= {{min_companies}}\nORDER BY avg_gross_margin_pct DESC", "params": [{"name": "fiscal_year", "label": "決算年（期末の年）", "type": "int", "default": 2025, "min": 2016, "max": 2030}, {"name": "min_companies", "label": "最低社数", "type": "int", "default": 5, "min": 1, "max": 1000}], "chart": {"type": "bar", "x": "industry_name", "y": ["avg_gross_margin_pct", "avg_sga_ratio_pct"], "series": null}, "note": "粗利と販管費の両方を開示している会社だけ。粗利を開示しない業種（銀行・一部サービス）は出ない。"}, {"id": "fin_loss_companies", "domain": "finance", "title": "赤字企業数の推移", "question": "純損失の会社は毎年どれだけあるか", "mart": "m_fin_annual", "sql": "SELECT fiscal_year,\n       COUNT(*) AS companies,\n       SUM(CASE WHEN net_income < 0 THEN 1 ELSE 0 END) AS loss_companies,\n       ROUND(SUM(CASE WHEN net_income < 0 THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) AS loss_pct\nFROM m_fin_annual\nWHERE net_income IS NOT NULL AND fiscal_year BETWEEN {{from_year}} AND {{to_year}}\nGROUP BY fiscal_year\nORDER BY fiscal_year", "params": [{"name": "from_year", "label": "開始年", "type": "int", "default": 2017, "min": 2016, "max": 2030}, {"name": "to_year", "label": "終了年", "type": "int", "default": 2025, "min": 2016, "max": 2030}], "chart": {"type": "line", "x": "fiscal_year", "y": ["loss_companies", "loss_pct"], "series": null}, "note": "純利益＝親会社株主に帰属する当期純利益で判定。"}, {"id": "fin_employee_change", "domain": "finance", "title": "従業員数の増減ランキング", "question": "前年から従業員が最も増えた（減った）会社は", "mart": "m_fin_annual", "sql": "WITH w AS (\n  SELECT edinet_code, sec_code4, name, industry, fiscal_year, employee_count,\n         LAG(employee_count) OVER (PARTITION BY edinet_code ORDER BY fiscal_year) AS prev_count,\n         LAG(fiscal_year) OVER (PARTITION BY edinet_code ORDER BY fiscal_year) AS prev_year\n  FROM m_fin_annual\n  WHERE employee_count > 0\n)\nSELECT sec_code4, name, industry, prev_count, employee_count,\n       employee_count - prev_count AS change_count,\n       ROUND((employee_count * 1.0 / prev_count - 1) * 100, 1) AS change_pct\nFROM w\nWHERE fiscal_year = {{fiscal_year}} AND prev_year = fiscal_year - 1 AND prev_count >= {{min_employees}}\nORDER BY change_count DESC\nLIMIT {{limit}}", "params": [{"name": "fiscal_year", "label": "決算年（期末の年）", "type": "int", "default": 2025, "min": 2016, "max": 2030}, {"name": "min_employees", "label": "前年の従業員数の下限", "type": "int", "default": 500, "min": 1, "max": 1000000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 500}], "chart": {"type": "bar", "x": "name", "y": "change_count", "series": null}, "note": "連結従業員数。M&Aや連結範囲の変更でも大きく動く。減少上位は並びを昇順にして見る。"}, {"id": "fin_industry_roe_trend", "domain": "finance", "title": "業種のROE推移", "question": "この業種のROEの平均は年ごとにどう動いたか", "mart": "m_fin_annual", "sql": "SELECT fiscal_year,\n       ROUND(AVG(roe) * 100, 2) AS avg_roe_pct,\n       COUNT(*) AS companies\nFROM m_fin_annual\nWHERE industry = {{industry}} AND roe BETWEEN -1 AND 1\nGROUP BY fiscal_year\nHAVING COUNT(*) >= {{min_companies}}\nORDER BY fiscal_year", "params": [{"name": "industry", "label": "業種名", "type": "string", "default": "電気機器"}, {"name": "min_companies", "label": "最低社数", "type": "int", "default": 5, "min": 1, "max": 1000}], "chart": {"type": "line", "x": "fiscal_year", "y": "avg_roe_pct", "series": null}, "note": "業種名は東証33業種に近い表記（m_company.industry と同じ値）。ROEが±100%を超える外れ値は除く。"}, {"id": "fin_net_cash_rich", "domain": "finance", "title": "ネットキャッシュが厚い会社", "question": "現預金から有利子負債を引いた手元資金が総資産に比べて厚い会社は", "mart": "m_fin_annual", "sql": "SELECT sec_code4, name, industry, cash_and_equiv, interest_bearing_debt, total_assets,\n       ROUND((cash_and_equiv - COALESCE(interest_bearing_debt, 0)) / NULLIF(total_assets, 0) * 100, 1) AS net_cash_to_assets_pct\nFROM m_fin_annual\nWHERE fiscal_year = {{fiscal_year}} AND cash_and_equiv > 0 AND total_assets >= {{min_assets}}\nORDER BY net_cash_to_assets_pct DESC\nLIMIT {{limit}}", "params": [{"name": "fiscal_year", "label": "決算年（期末の年）", "type": "int", "default": 2025, "min": 2016, "max": 2030}, {"name": "min_assets", "label": "総資産の下限（円）", "type": "number", "default": 10000000000, "min": 0}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 500}], "chart": {"type": "bar", "x": "name", "y": "net_cash_to_assets_pct", "series": null}, "note": "有利子負債が未開示の会社は負債0として扱う（過大に出る可能性）。銀行・証券は対象外にしたい場合は業種で絞る。"}, {"id": "fin_female_manager_by_industry", "domain": "finance", "title": "業種別の女性管理職比率", "question": "女性管理職の比率が高い業種は", "mart": "m_fin_annual", "sql": "WITH d AS (\n  SELECT COALESCE(industry, '(不明)') AS industry_name, female_manager_ratio\n  FROM m_fin_annual\n  WHERE fiscal_year = {{fiscal_year}} AND female_manager_ratio BETWEEN 0 AND 1\n)\nSELECT industry_name, ROUND(AVG(female_manager_ratio) * 100, 1) AS avg_female_manager_pct, COUNT(*) AS companies\nFROM d\nGROUP BY industry_name\nHAVING COUNT(*) >= {{min_companies}}\nORDER BY avg_female_manager_pct DESC", "params": [{"name": "fiscal_year", "label": "決算年（期末の年）", "type": "int", "default": 2025, "min": 2016, "max": 2030}, {"name": "min_companies", "label": "最低社数", "type": "int", "default": 5, "min": 1, "max": 1000}], "chart": {"type": "bar", "x": "industry_name", "y": "avg_female_manager_pct", "series": null}, "note": "開示が義務化された2023年3月期以降が中心。それ以前は母数が少ない。"}, {"id": "fin_sales_ranking", "domain": "finance", "title": "売上高ランキング", "question": "売上が大きい会社の一覧（営業利益率つき）", "mart": "m_fin_annual", "
