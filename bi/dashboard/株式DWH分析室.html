<title>株式DWH 分析室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* layout: 左＝テンプレの棚（有価証券報告書の目次のように領域→問い）、右＝作業台（パラメータ→グラフ→表→SQL）。自由分析と「Claudeに聞く」は作業台のタブ */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --ink:#18221f; --sub:#5b6964; --line:#d9e0dd;
  --accent:#1d6b5a; --accent-soft:#e2efeb; --warn:#a15c07; --bad:#b3261e; --good:#2f7d32;
  --chip:#eef2f0;
  --f-body:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --panel:#18201d; --ink:#e4ebe8; --sub:#93a39d; --line:#2b3632;
  --accent:#5cc2a7; --accent-soft:#1d3029; --warn:#e0a24a; --bad:#f08a80; --good:#7bc77e; --chip:#212b27; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --panel:#18201d; --ink:#e4ebe8; --sub:#93a39d; --line:#2b3632;
  --accent:#5cc2a7; --accent-soft:#1d3029; --warn:#e0a24a; --bad:#f08a80; --good:#7bc77e; --chip:#212b27; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
.wrap{padding-inline:16px;padding-block:16px 40px;max-width:1400px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:14px}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em}
.meta{color:var(--sub);font-size:12px}
.status{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--chip);color:var(--sub)}
.status.ok{color:var(--good)} .status.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.shelf,.bench{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.shelf{padding:12px;max-height:calc(100vh - 120px);overflow:auto;position:sticky;top:env(safe-area-inset-top,0px)}
@media (max-width:860px){.shelf{position:static;max-height:none}}
.shelf h2{font-size:11px;letter-spacing:.12em;color:var(--sub);margin:14px 4px 6px;text-transform:uppercase;font-weight:500}
.shelf h2:first-child{margin-top:4px}
.tpl{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;color:var(--ink);font:inherit;cursor:pointer}
.tpl:hover{background:var(--chip)} .tpl.on{background:var(--accent-soft)}
.tpl b{display:block;font-weight:500;font-size:13.5px}
.tpl span{display:block;font-size:12px;color:var(--sub)}
.bench{padding:14px 16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px -4px 14px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;font:inherit;color:var(--sub);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--sub)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{width:100%;font-family:var(--f-mono);font-size:12.5px;min-height:110px}
button.go{background:var(--accent);color:var(--panel);border:0;border-radius:6px;padding:7px 16px;font:inherit;font-weight:500;cursor:pointer}
button.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font:inherit;color:var(--ink);cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,.tpl:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{font-size:16px;font-weight:500;margin:0 0 2px;text-wrap:balance}
.note{color:var(--sub);font-size:12.5px;margin:2px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--accent-soft);border-radius:99px;padding:2px 4px 2px 10px;font-size:12px}
.chip button{background:none;border:0;color:var(--sub);cursor:pointer;font-size:14px;line-height:1;padding:0 6px}
.chartbox{position:relative;height:340px;margin:12px 0}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:6px;max-height:420px}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);color:var(--sub);font-weight:500}
td.n{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--chip)}
details.sql{margin-top:10px} details.sql pre{font-family:var(--f-mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto;white-space:pre-wrap}
.msg{padding:8px 10px;border-radius:6px;background:var(--chip);font-size:13px;margin:8px 0}
.msg.err{color:var(--bad)} .msg.warn{color:var(--warn)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mlist{display:flex;flex-direction:column;gap:6px}
.mrow{display:flex;gap:6px;flex-wrap:wrap}
.answer{white-space:pre-wrap;font-size:13.5px;margin:8px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
<header>
  <h1>株式DWH 分析室</h1>
  <span class="meta">BigQuery（stock-analyzer-edinet）を開いたその場で集計します。テンプレは board の「分析」タブと共通です。</span>
  <span id="status" class="status">接続を確認中…</span>
</header>
<div class="grid">
  <nav class="shelf" id="shelf" aria-label="テンプレート"></nav>
  <section class="bench">
    <div class="tabs" role="tablist">
      <button role="tab" id="t-tpl" aria-selected="true" data-tab="tpl">テンプレ</button>
      <button role="tab" id="t-free" aria-selected="false" data-tab="free">自由分析</button>
      <button role="tab" id="t-ask" aria-selected="false" data-tab="ask">Claudeに聞く</button>
      <button role="tab" id="t-scr" aria-selected="false" data-tab="scr">スクリーナー</button>
      <button role="tab" id="t-sql" aria-selected="false" data-tab="sql">SQL</button>
      <button role="tab" id="t-slot" aria-selected="false" data-tab="slot">スロット</button>
    </div>
    <div id="p-tpl"></div>
    <div id="p-free" hidden></div>
    <div id="p-ask" hidden>
      <p class="q">日本語で聞くと、Claude が SQL を組んで BigQuery で実行します</p>
      <p class="note">使える表はテンプレと同じマート（下の一覧）。質問は1回ごとにあなたの Claude の利用枠を使います。</p>
      <textarea id="askText" placeholder="例：情報・通信業で、直近3年の売上成長率が高い会社を10社。営業利益率も並べて"></textarea>
      <div class="row" style="margin-top:8px"><button class="go" id="askGo">質問する</button><button class="ghost" id="askStop" hidden>止める</button></div>
      <div id="askOut"></div>
    </div>
    <div id="p-scr" hidden></div>
    <div id="p-slot" hidden></div>
    <div id="p-sql" hidden>
      <p class="note">マート名（例 m_fin_annual）をそのまま FROM に書けます。読み取りのみ・最大1,000行。下のボタンで組み立てることもできます。</p>
      <details class="sql" id="builder" open><summary>ボタンで SQL を組み立てる</summary><div id="bld"></div></details>
      <textarea id="sqlText"></textarea>
      <div class="row" style="margin-top:8px"><button class="go" id="sqlGo">実行</button>
        <label class="f">スロット名<input id="slotName" placeholder="例：高ROE割安"></label><button class="ghost" id="slotSave">SQLをスロットに保存</button><span class="note" id="slotMsg"></span></div>
      <div id="sqlOut"></div>
    </div>
    <div id="result"></div>
  </section>
</div>
</div>

<script>
/* ── 埋め込みデータ（ビルド時に stock_analyzer/bi から差し込む）── */
const BI = {"project": "stock-analyzer-edinet", "marts": {"m_company": {"sql": "-- m_company: 1社1行（キー edinet_code）。edinet.company は edinet_code が一意（4,010社＝4,010キー）なので重複除去は不要。\n-- sec_code は5桁（末尾に検査用の0）。先頭4桁が銘柄コード（英字入り '285A' 含む）。\nSELECT\n  c.edinet_code,\n  SUBSTR(c.sec_code, 1, 4) AS sec_code4,\n  c.name,\n  c.industry,\n  c.accounting_standard,\n  c.listing_status,\n  c.is_delisted\nFROM `stock-analyzer-edinet.edinet.company` AS c\n", "desc": "上場会社マスタ。1社1行", "columns": [{"name": "edinet_code", "type": "string", "label": "EDINETコード"}, {"name": "sec_code4", "type": "string", "label": "証券コード"}, {"name": "name", "type": "string", "label": "社名"}, {"name": "industry", "type": "string", "label": "業種"}, {"name": "accounting_standard", "type": "string", "label": "会計基準"}, {"name": "listing_status", "type": "string", "label": "上場状態"}, {"name": "is_delisted", "type": "bool", "label": "上場廃止"}], "table": "stock-analyzer-edinet.bi.m_company"}, "m_company_country": {"sql": "-- m_company_country: 1社(ticker)×1国につき1行（キー ticker, country_code）。\n-- company_country_exposure には同じ ticker×国×種別が重複して入ることがある（取り込みの再実行）ため、\n-- exposure_strength / revenue_share_est は合算せず MAX を採る（足すと依存度が膨らむ）。\n-- 種別が複数ある国は最も強い行の exposure_type を代表にし、種類数は exposure_type_count に持つ。\n-- 期限切れ（valid_to が過去）の権益は除く。\n-- ticker は日本株が '1605.T'、米国株が 'AAPL'。日本株だけ証券コード4桁で edinet.company と結合する\n-- （edinet_code・社名・業種は米国株では空）。同じ sec_code4 が複数社に付く場合は上場中を優先して1社に絞る。\n-- 国の最新リスクは country_risk_daily の最新日の値。\nWITH e AS (\n  SELECT\n    ticker,\n    market,\n    country_code,\n    exposure_type,\n    exposure_strength,\n    revenue_share_est,\n    review_flag,\n    ROW_NUMBER() OVER (PARTITION BY ticker, country_code ORDER BY exposure_strength DESC, exposure_type) AS rn,\n    MAX(exposure_strength) OVER (PARTITION BY ticker, country_code) AS max_strength,\n    MAX(revenue_share_est) OVER (PARTITION BY ticker, country_code) AS max_revenue_share,\n    COUNT(DISTINCT exposure_type) OVER (PARTITION BY ticker, country_code) AS type_count,\n    MAX(IF(review_flag, 1, 0)) OVER (PARTITION BY ticker, country_code) AS any_review\n  FROM `stock-analyzer-edinet.geopolitics.company_country_exposure`\n  WHERE valid_to IS NULL OR valid_to >= CURRENT_DATE()\n),\nco AS (\n  SELECT\n    edinet_code,\n    SUBSTR(sec_code, 1, 4) AS sec_code4,\n    name,\n    industry,\n    ROW_NUMBER() OVER (PARTITION BY SUBSTR(sec_code, 1, 4) ORDER BY IF(is_delisted, 1, 0), edinet_code) AS rn\n  FROM `stock-analyzer-edinet.edinet.company`\n  WHERE sec_code IS NOT NULL\n),\nlr AS (\n  SELECT\n    country_code,\n    composite_risk_score,\n    gdelt_instability,\n    foreign_ministry_level,\n    state_dept_level,\n    risk_date,\n    ROW_NUMBER() OVER (PARTITION BY country_code ORDER BY risk_date DESC, updated_at DESC) AS rn\n  FROM `stock-analyzer-edinet.geopolitics.country_risk_daily`\n)\nSELECT\n  e.ticker,\n  e.market,\n  IF(REGEXP_CONTAINS(e.ticker, r'^[0-9A-Z]{4}\\.T$'), SUBSTR(e.ticker, 1, 4), NULL) AS sec_code4,\n  co.edinet_code,\n  co.name,\n  co.industry,\n  e.country_code,\n  p.country_name_ja,\n  p.region,\n  p.sanction_flag,\n  e.exposure_type,\n  e.type_count AS exposure_type_count,\n  e.max_strength AS exposure_strength,\n  e.max_revenue_share AS revenue_share_est,\n  e.any_review = 1 AS review_flag,\n  lr.composite_risk_score AS latest_risk_score,\n  lr.gdelt_instability AS latest_gdelt_instability,\n  lr.foreign_ministry_level AS latest_foreign_ministry_level,\n  lr.state_dept_level AS latest_state_dept_level,\n  lr.risk_date AS latest_risk_date,\n  e.max_strength * lr.composite_risk_score AS risk_weighted_score\nFROM e\nLEFT JOIN co\n  ON co.sec_code4 = IF(REGEXP_CONTAINS(e.ticker, r'^[0-9A-Z]{4}\\.T$'), SUBSTR(e.ticker, 1, 4), NULL) AND co.rn = 1\nLEFT JOIN `stock-analyzer-edinet.geopolitics.country_profile` AS p\n  ON p.country_code = e.country_code\nLEFT JOIN lr\n  ON lr.country_code = e.country_code AND lr.rn = 1\nWHERE e.rn = 1\n", "desc": "企業×国の権益・依存。1社1国1行（最新の国リスク付き）", "columns": [{"name": "ticker", "type": "string", "label": "ティッカー"}, {"name": "market", "type": "string", "label": "市場"}, {"name": "sec_code4", "type": "string", "label": "証券コード"}, {"name": "edinet_code", "type": "string", "label": "EDINETコード"}, {"name": "name", "type": "string", "label": "社名"}, {"name": "industry", "type": "string", "label": "業種"}, {"name": "country_code", "type": "string", "label": "国コード"}, {"name": "country_name_ja", "type": "string", "label": "国名"}, {"name": "region", "type": "string", "label": "地域"}, {"name": "sanction_flag", "type": "bool", "label": "制裁対象"}, {"name": "exposure_type", "type": "string", "label": "権益の種類"}, {"name": "exposure_type_count", "type": "int64", "label": "権益の種類数"}, {"name": "exposure_strength", "type": "double", "label": "依存度"}, {"name": "revenue_share_est", "type": "double", "label": "売上比率(推定)"}, {"name": "review_flag", "type": "bool", "label": "要レビュー"}, {"name": "latest_risk_score", "type": "double", "label": "最新の国リスク"}, {"name": "latest_gdelt_instability", "type": "double", "label": ""}, {"name": "latest_foreign_ministry_level", "type": "int64", "label": ""}, {"name": "latest_state_dept_level", "type": "int64", "label": ""}, {"name": "latest_risk_date", "type": "date", "label": "リスク日付"}, {"name": "risk_weighted_score", "type": "double", "label": "依存度×国リスク"}], "table": "stock-analyzer-edinet.bi.m_company_country"}, "m_company_tax": {"sql": "-- m_company_tax: 会社(company_id)×技術分類ノード1行（キー company_id, node_id）。\n-- company_taxonomy_map は週次の map_id（…:日付）で同じ company_id×node_id が重複して入るため、updated_at が最新の1行に絞る。\n-- company_id は上場会社が証券コード4桁（edinet.company の sec_code 先頭4桁）、業種単位の行は 'sector:JP:<業種コード>'\n-- （entity_type='sector'・社名等は空）。company_id='nan' の行（欠損が文字列化したもの）は意味を持たないので除く。\n-- 同じ sec_code4 が複数社に付く場合は上場中を優先して1社に絞る（m_company_country と同じ）。\n-- 財務は会社ごとに「売上が入っている最新の fiscal_year」1年分。研究開発費は financial_items の rnd_expenses。\n-- revenue_share_est は会社単位の推定値で、同じ会社の全ノードに同じ値が入る（足し合わせない）。valid_to が過去の行は除く。\nWITH mp AS (\n  SELECT\n    company_id,\n    node_id,\n    relevance_score,\n    confidence,\n    revenue_share_est,\n    confidence_type,\n    auto_derived,\n    verified_flag,\n    ROW_NUMBER() OVER (PARTITION BY company_id, node_id ORDER BY updated_at DESC, map_id DESC) AS rn\n  FROM `stock-analyzer-edinet.taxonomy.company_taxonomy_map`\n  WHERE company_id <> 'nan' AND (valid_to IS NULL OR valid_to >= CURRENT_DATE())\n),\nco AS (\n  SELECT\n    edinet_code,\n    SUBSTR(sec_code, 1, 4) AS sec_code4,\n    name,\n    industry,\n    ROW_NUMBER() OVER (PARTITION BY SUBSTR(sec_code, 1, 4) ORDER BY IF(is_delisted, 1, 0), edinet_code) AS rn\n  FROM `stock-analyzer-edinet.edinet.company`\n  WHERE sec_code IS NOT NULL\n),\nfin AS (\n  SELECT\n    edinet_code,\n    fiscal_year,\n    net_sales,\n    operating_income,\n    ROW_NUMBER() OVER (PARTITION BY edinet_code ORDER BY fiscal_year DESC) AS rn\n  FROM `stock-analyzer-edinet.edinet.financials`\n  WHERE net_sales IS NOT NULL\n),\nrnd AS (\n  SELECT edinet_code, fiscal_year, MAX(value) AS rnd_expenses\n  FROM `stock-analyzer-edinet.edinet.financial_items`\n  WHERE item = 'rnd_expenses'\n  GROUP BY edinet_code, fiscal_year\n),\nnd AS (\n  SELECT\n    a0.node_id,\n    a0.node_name_ja,\n    a0.node_level,\n    a0.parent_id,\n    CASE a0.node_level WHEN 1 THEN a0.node_id WHEN 2 THEN a1.node_id WHEN 3 THEN a2.node_id ELSE a3.node_id END AS domain_id,\n    CASE a0.node_level WHEN 1 THEN a0.node_name_ja WHEN 2 THEN a1.node_name_ja WHEN 3 THEN a2.node_name_ja ELSE a3.node_name_ja END AS domain_name_ja,\n    CASE a0.node_level WHEN 1 THEN a0.node_name_ja WHEN 2 THEN CONCAT(a1.node_name_ja, ' > ', a0.node_name_ja) WHEN 3 THEN CONCAT(a2.node_name_ja, ' > ', a1.node_name_ja, ' > ', a0.node_name_ja) ELSE CONCAT(a3.node_name_ja, ' > ', a2.node_name_ja, ' > ', a1.node_name_ja, ' > ', a0.node_name_ja) END AS path_name\n  FROM `stock-analyzer-edinet.taxonomy.taxonomy_node` AS a0\n  LEFT JOIN `stock-analyzer-edinet.taxonomy.taxonomy_node` AS a1 ON a1.node_id = a0.parent_id\n  LEFT JOIN `stock-analyzer-edinet.taxonomy.taxonomy_node` AS a2 ON a2.node_id = a1.parent_id\n  LEFT JOIN `stock-analyzer-edinet.taxonomy.taxonomy_node` AS a3 ON a3.node_id = a2.parent_id\n  WHERE a0.is_active IS NOT FALSE AND a0.effective_to IS NULL\n)\nSELECT\n  mp.company_id,\n  IF(STARTS_WITH(mp.company_id, 'sector:'), 'sector', 'company') AS entity_type,\n  co.edinet_code,\n  co.name,\n  co.industry,\n  mp.node_id,\n  nd.node_name_ja,\n  nd.node_level,\n  nd.parent_id,\n  nd.domain_id,\n  nd.domain_name_ja,\n  nd.path_name,\n  mp.relevance_score,\n  mp.confidence,\n  mp.revenue_share_est,\n  mp.confidence_type,\n  mp.auto_derived,\n  mp.verified_flag,\n  fin.fiscal_year,\n  fin.net_sales,\n  fin.operating_income,\n  fin.operating_income / NULLIF(fin.net_sales, 0) AS operating_margin,\n  rnd.rnd_expenses,\n  rnd.rnd_expenses / NULLIF(fin.net_sales, 0) AS rnd_ratio\nFROM mp\nLEFT JOIN co ON co.sec_code4 = mp.company_id AND co.rn = 1\nLEFT JOIN nd ON nd.node_id = mp.node_id\nLEFT JOIN fin ON fin.edinet_code = co.edinet_code AND fin.rn = 1\nLEFT JOIN rnd ON rnd.edinet_code = fin.edinet_code AND rnd.fiscal_year = fin.fiscal_year\nWHERE mp.rn = 1\n", "desc": "企業×技術分類。1社1ノード1行＋直近年度の財務（紐づくのは一部の会社のみ・自動推定）", "columns": [{"name": "company_id", "type": "string", "label": "企業ID"}, {"name": "entity_type", "type": "string", "label": "主体の種別"}, {"name": "edinet_code", "type": "string", "label": "EDINETコード"}, {"name": "name", "type": "string", "label": "社名"}, {"name": "industry", "type": "string", "label": "業種"}, {"name": "node_id", "type": "string", "label": "技術分類ID"}, {"name": "node_name_ja", "type": "string", "label": "技術分類名"}, {"name": "node_level", "type": "int64", "label": "階層"}, {"name": "parent_id", "type": "string", "label": "親ノードID"}, {"name": "domain_id", "type": "string", "label": "領域ID"}, {"name": "domain_name_ja", "type": "string", "label": "技術領域"}, {"name": "path_name", "type": "string", "label": "分類パス"}, {"name": "relevance_score", "type": "double", "label": "関連度"}, {"name": "confidence", "type": "double", "label": "確からしさ"}, {"name": "revenue_share_est", "type": "double", "label": "売上比率(推定)"}, {"name": "confidence_type", "type": "string", "label": "確からしさの種別"}, {"name": "auto_derived", "type": "bool", "label": "自動推定"}, {"name": "verified_flag", "type": "bool", "label": "確認済み"}, {"name": "fiscal_year", "type": "int64", "label": "年度"}, {"name": "net_sales", "type": "double", "label": "売上高"}, {"name": "operating_income", "type": "double", "label": "営業利益"}, {"name": "operating_margin", "type": "double", "label": "営業利益率"}, {"name": "rnd_expenses", "type": "double", "label": "研究開発費"}, {"name": "rnd_ratio", "type": "double", "label": "研究開発費率"}], "table": "stock-analyzer-edinet.bi.m_company_tax"}, "m_country_profile": {"sql": "-- m_country_profile: 1か国1行（キー country_code＝ISO3）。geopolitics.country_profile は 59 か国。\n-- JSON 列は BI の軸にしにくいので文字列化して持つ（軸・集計には使わず、参照用）。\nSELECT\n  p.country_code,\n  p.country_name_ja,\n  p.region,\n  p.democracy_index,\n  p.corruption_index,\n  p.rule_of_law,\n  p.gdp_usd_bn,\n  p.export_concentration,\n  p.is_landlocked,\n  p.sanction_flag,\n  p.trade_dependency_jp,\n  IF(p.top_export_commodities IS NULL, NULL, TO_JSON_STRING(p.top_export_commodities)) AS top_export_commodities,\n  IF(p.sealane_adjacency IS NULL, NULL, TO_JSON_STRING(p.sealane_adjacency)) AS sealane_adjacency,\n  IF(p.military_alliances IS NULL, NULL, TO_JSON_STRING(p.military_alliances)) AS military_alliances\nFROM `stock-analyzer-edinet.geopolitics.country_profile` AS p\n", "desc": "国プロファイル。1か国1行（民主主義・汚職・法の支配・GDP・制裁など）", "columns": [{"name": "country_code", "type": "string", "label": "国コード"}, {"name": "country_name_ja", "type": "string", "label": "国名"}, {"name": "region", "type": "string", "label": "地域"}, {"name": "democracy_index", "type": "double", "label": "民主主義指数"}, {"name": "corruption_index", "type": "double", "label": "汚職認識指数"}, {"name": "rule_of_law", "type": "double", "label": "法の支配"}, {"name": "gdp_usd_bn", "type": "double", "label": "GDP(十億ドル)"}, {"name": "export_concentration", "type": "double", "label": "輸出集中度"}, {"name": "is_landlocked", "type": "bool", "label": "内陸国"}, {"name": "sanction_flag", "type": "bool", "label": "制裁対象"}, {"name": "trade_dependency_jp", "type": "double", "label": "対日貿易依存"}, {"name": "top_export_commodities", "type": "string", "label": ""}, {"name": "sealane_adjacency", "type": "string", "label": ""}, {"name": "military_alliances", "type": "string", "label": ""}], "table": "stock-analyzer-edinet.bi.m_country_profile"}, "m_country_risk": {"sql": "-- m_country_risk: 1国1日1行（キー country_code, risk_date）。country_risk_daily は国×日で一意のはずだが、\n-- 取り込みの再実行で重複しても1行に落とすよう updated_at が新しい方を採る。\n-- composite_risk_score は大きいほど高リスク。foreign_ministry_level / state_dept_level は外務省・米国務省の渡航レベル（1〜4）。\nWITH r AS (\n  SELECT\n    country_code,\n    risk_date,\n    gdelt_instability,\n    foreign_ministry_level,\n    state_dept_level,\n    composite_risk_score,\n    ROW_NUMBER() OVER (PARTITION BY country_code, risk_date ORDER BY updated_at DESC) AS rn\n  FROM `stock-analyzer-edinet.geopolitics.country_risk_daily`\n)\nSELECT\n  r.country_code,\n  r.risk_date,\n  p.country_name_ja,\n  p.region,\n  p.sanction_flag,\n  r.gdelt_instability,\n  r.foreign_ministry_level,\n  r.state_dept_level,\n  r.composite_risk_score\nFROM r\nLEFT JOIN `stock-analyzer-edinet.geopolitics.country_profile` AS p\n  ON p.country_code = r.country_code\nWHERE r.rn = 1\n", "desc": "国別リスクの日次。1国1日1行（総合リスク・GDELT不安定度・渡航レベル）", "columns": [{"name": "country_code", "type": "string", "label": "国コード"}, {"name": "risk_date", "type": "date", "label": "日付"}, {"name": "country_name_ja", "type": "string", "label": "国名"}, {"name": "region", "type": "string", "label": "地域"}, {"name": "sanction_flag", "type": "bool", "label": "制裁対象"}, {"name": "gdelt_instability", "type": "double", "label": "GDELT不安定度"}, {"name": "foreign_ministry_level", "type": "int64", "label": "外務省レベル"}, {"name": "state_dept_level", "type": "int64", "label": "国務省レベル"}, {"name": "composite_risk_score", "type": "double", "label": "総合リスク"}], "table": "stock-analyzer-edinet.bi.m_country_risk"}, "m_fin_annual": {"sql": "-- m_fin_annual: 1社1年度1行（キー edinet_code, fiscal_year。fiscal_year は決算期末の年）。\n-- 基準表は edinet.financials。実測（2026-10）で financial_items の (edinet_code, fiscal_year) 36,654 組は\n-- すべて financials（36,656 組）に含まれ、両表とも同キーの重複は0。items だけにある年度は無いため、\n-- financials を基準に LEFT JOIN で細目を横持ちする。items 側が将来 financials に無い年度を持った場合は、\n-- 主要約列（売上・利益など）が空のままその年度が落ちる点に注意（落とさない方が分析上の欠けに気づける）。\n-- 細目は1表1スキャンで済むよう、対象項目だけに絞って先に横持ちする。\nWITH items AS (\n  SELECT\n    edinet_code,\n    fiscal_year,\n    MAX(IF(item = 'gross_profit', value, NULL)) AS gross_profit,\n    MAX(IF(item = 'sga', value, NULL)) AS sga,\n    MAX(IF(item = 'rnd_expenses', value, NULL)) AS rnd_expenses,\n    MAX(IF(item = 'cost_of_sales', value, NULL)) AS cost_of_sales,\n    MAX(IF(item = 'goodwill', value, NULL)) AS goodwill,\n    MAX(IF(item = 'inventories', value, NULL)) AS inventories,\n    MAX(IF(item = 'trade_receivables', value, NULL)) AS trade_receivables,\n    MAX(IF(item = 'total_liabilities', value, NULL)) AS total_liabilities,\n    MAX(IF(item = 'net_assets', value, NULL)) AS net_assets,\n    MAX(IF(item = 'shareholders_equity', value, NULL)) AS shareholders_equity,\n    MAX(IF(item = 'eps', value, NULL)) AS eps,\n    MAX(IF(item = 'bps', value, NULL)) AS bps,\n    MAX(IF(item = 'dividend_per_share', value, NULL)) AS dividend_per_share,\n    MAX(IF(item = 'payout_ratio', value, NULL)) AS payout_ratio,\n    MAX(IF(item = 'per', value, NULL)) AS per,\n    MAX(IF(item = 'pbr', value, NULL)) AS pbr,\n    MAX(IF(item = 'num_employees', value, NULL)) AS num_employees,\n    MAX(IF(item = 'female_manager_ratio', value, NULL)) AS female_manager_ratio,\n    MAX(IF(item = 'avg_tenure_years', value, NULL)) AS avg_tenure_years,\n    MAX(IF(item = 'cash_dividends_paid', value, NULL)) AS cash_dividends_paid\n  FROM `stock-analyzer-edinet.edinet.financial_items`\n  WHERE item IN (\n    'gross_profit', 'sga', 'rnd_expenses', 'cost_of_sales', 'goodwill', 'inventories',\n    'trade_receivables', 'total_liabilities', 'net_assets', 'shareholders_equity', 'eps', 'bps',\n    'dividend_per_share', 'payout_ratio', 'per', 'pbr', 'num_employees', 'female_manager_ratio',\n    'avg_tenure_years', 'cash_dividends_paid')\n  GROUP BY edinet_code, fiscal_year\n),\nbase AS (\n  SELECT\n    f.edinet_code,\n    f.fiscal_year,\n    f.fiscal_year_end,\n    f.net_sales,\n    f.operating_income,\n    f.ordinary_income,\n    f.net_income,\n    f.total_assets,\n    f.equity,\n    f.interest_bearing_debt,\n    f.cash_and_equiv,\n    f.operating_cf,\n    f.investing_cf,\n    f.free_cf,\n    f.employee_count,\n    f.avg_annual_salary,\n    f.capex,\n    f.depreciation,\n    f.roe,\n    f.roa,\n    f.operating_margin\n  FROM `stock-analyzer-edinet.edinet.financials` AS f\n)\nSELECT\n  b.edinet_code,\n  b.fiscal_year,\n  b.fiscal_year_end,\n  m.name,\n  SUBSTR(m.sec_code, 1, 4) AS sec_code4,\n  m.industry,\n  b.net_sales,\n  b.operating_income,\n  b.ordinary_income,\n  b.net_income,\n  b.total_assets,\n  b.equity,\n  b.interest_bearing_debt,\n  b.cash_and_equiv,\n  b.operating_cf,\n  b.investing_cf,\n  b.free_cf,\n  b.employee_count,\n  b.avg_annual_salary,\n  b.capex,\n  b.depreciation,\n  b.roe,\n  b.roa,\n  b.operating_margin,\n  i.gross_profit,\n  i.sga,\n  i.rnd_expenses,\n  i.cost_of_sales,\n  i.goodwill,\n  i.inventories,\n  i.trade_receivables,\n  i.total_liabilities,\n  i.net_assets,\n  i.shareholders_equity,\n  i.eps,\n  i.bps,\n  i.dividend_per_share,\n  i.payout_ratio,\n  i.per,\n  i.pbr,\n  i.num_employees,\n  i.female_manager_ratio,\n  i.avg_tenure_years,\n  i.cash_dividends_paid,\n  i.gross_profit / NULLIF(b.net_sales, 0) AS gross_margin,\n  i.sga / NULLIF(b.net_sales, 0) AS sga_ratio,\n  i.rnd_expenses / NULLIF(b.net_sales, 0) AS rnd_ratio,\n  b.equity / NULLIF(b.total_assets, 0) AS equity_ratio,\n  b.net_income / NULLIF(b.net_sales, 0) AS net_margin\nFROM base AS b\nLEFT JOIN items AS i\n  ON i.edinet_code = b.edinet_code AND i.fiscal_year = b.fiscal_year\nLEFT JOIN `stock-analyzer-edinet.edinet.company` AS m\n  ON m.edinet_code = b.edinet_code\n", "desc": "年次財務。1社1年度1行（fiscal_year＝決算期末の年）", "columns": [{"name": "edinet_code", "type": "string", "label": "EDINETコード"}, {"name": "fiscal_year", "type": "int64", "label": "年度"}, {"name": "fiscal_year_end", "type": "date", "label": "決算期末"}, {"name": "name", "type": "string", "label": "社名"}, {"name": "sec_code4", "type": "string", "label": "証券コード"}, {"name": "industry", "type": "string", "label": "業種"}, {"name": "net_sales", "type": "double", "label": "売上高"}, {"name": "operating_income", "type": "double", "label": "営業利益"}, {"name": "ordinary_income", "type": "double", "label": "経常利益"}, {"name": "net_income", "type": "double", "label": "純利益"}, {"name": "total_assets", "type": "double", "label": "総資産"}, {"name": "equity", "type": "double", "label": "自己資本"}, {"name": "interest_bearing_debt", "type": "double", "label": "有利子負債"}, {"name": "cash_and_equiv", "type": "double", "label": "現金同等物"}, {"name": "operating_cf", "type": "double", "label": "営業CF"}, {"name": "investing_cf", "type": "double", "label": "投資CF"}, {"name": "free_cf", "type": "double", "label": "フリーCF"}, {"name": "employee_count", "type": "int64", "label": "従業員数"}, {"name": "avg_annual_salary", "type": "double", "label": "平均年収"}, {"name": "capex", "type": "double", "label": "設備投資"}, {"name": "depreciation", "type": "double", "label": "減価償却費"}, {"name": "roe", "type": "double", "label": "ROE"}, {"name": "roa", "type": "double", "label": "ROA"}, {"name": "operating_margin", "type": "double", "label": "営業利益率"}, {"name": "gross_profit", "type": "double", "label": "売上総利益"}, {"name": "sga", "type": "double", "label": "販管費"}, {"name": "rnd_expenses", "type": "double", "label": "研究開発費"}, {"name": "cost_of_sales", "type": "double", "label": "売上原価"}, {"name": "goodwill", "type": "double", "label": "のれん"}, {"name": "inventories", "type": "double", "label": "棚卸資産"}, {"name": "trade_receivables", "type": "double", "label": "売上債権"}, {"name": "total_liabilities", "type": "double", "label": "負債合計"}, {"name": "net_assets", "type": "double", "label": "純資産"}, {"name": "shareholders_equity", "type": "double", "label": "株主資本"}, {"name": "eps", "type": "double", "label": "EPS"}, {"name": "bps", "type": "double", "label": "BPS"}, {"name": "dividend_per_share", "type": "double", "label": "1株配当"}, {"name": "payout_ratio", "type": "double", "label": "配当性向"}, {"name": "per", "type": "double", "label": "PER"}, {"name": "pbr", "type": "double", "label": "PBR"}, {"name": "num_employees", "type": "double", "label": "従業員数（細目）"}, {"name": "female_manager_ratio", "type": "double", "label": "女性管理職比率"}, {"name": "avg_tenure_years", "type": "double", "label": "平均勤続年数"}, {"name": "cash_dividends_paid", "type": "double", "label": "支払配当金"}, {"name": "gross_margin", "type": "double", "label": "粗利率"}, {"name": "sga_ratio", "type": "double", "label": "販管費率"}, {"name": "rnd_ratio", "type": "double", "label": "研究開発費率"}, {"name": "equity_ratio", "type": "double", "label": "自己資本比率"}, {"name": "net_margin", "type": "double", "label": "純利益率"}], "table": "stock-analyzer-edinet.bi.m_fin_annual"}, "m_re_area": {"sql": "-- m_re_area: 1市区町村1行（キー municipality_code＝5桁）。real_estate.area_profile_p1 の実測（2026-10）で\n-- latest_land_price・land_price_yoy・total_transactions は全行 NULL のため持たない（入るようになったら足す）。\n-- 単位：地価は円/m2、land_price_yoy_change は％（5.2＝+5.2%）、flood_risk_area_pct は割合（0.3＝30%）。\n-- 取り込みの再実行で同じ市区町村が重複しても updated_at が新しい1行に絞る。\nWITH a AS (\n  SELECT\n    municipality_code,\n    prefecture_name,\n    municipality_name,\n    median_price,\n    avg_land_price_commercial,\n    avg_land_price_residential,\n    land_price_yoy_change,\n    flood_risk_area_pct,\n    latest_avg_price_condo,\n    hospital_count,\n    ROW_NUMBER() OVER (PARTITION BY municipality_code ORDER BY updated_at DESC) AS rn\n  FROM `stock-analyzer-edinet.real_estate.area_profile_p1`\n)\nSELECT\n  a.municipality_code,\n  a.prefecture_name,\n  a.municipality_name,\n  a.median_price,\n  a.avg_land_price_commercial,\n  a.avg_land_price_residential,\n  a.land_price_yoy_change,\n  a.flood_risk_area_pct,\n  a.latest_avg_price_condo,\n  a.hospital_count\nFROM a\nWHERE a.rn = 1\n", "desc": "市区町村の地価・取引・災害リスク。1市区町村1行", "columns": [{"name": "municipality_code", "type": "string", "label": "市区町村コード"}, {"name": "prefecture_name", "type": "string", "label": "都道府県"}, {"name": "municipality_name", "type": "string", "label": "市区町村"}, {"name": "median_price", "type": "double", "label": "取引価格の中央値"}, {"name": "avg_land_price_commercial", "type": "double", "label": "商業地の平均地価"}, {"name": "avg_land_price_residential", "type": "double", "label": "住宅地の平均地価"}, {"name": "land_price_yoy_change", "type": "double", "label": "地価の前年比(%)"}, {"name": "flood_risk_area_pct", "type": "double", "label": "洪水リスク地域率"}, {"name": "latest_avg_price_condo", "type": "double", "label": "マンション平均価格"}, {"name": "hospital_count", "type": "int64", "label": "病院数"}], "table": "stock-analyzer-edinet.bi.m_re_area"}, "m_re_holdings": {"sql": "-- m_re_holdings: 1社×1市区町村×1年度につき1行（キー edinet_code, fiscal_year, municipality_code）。\n-- 元の corporate_holdings_p1 は施設単位で 14.9 万行あり、parquet が大きくなるため市区町村単位に集約する\n-- （施設名は持たない。同じ市区町村の複数施設は合算し facility_count に数を入れる）。\n-- 単位：簿価は百万円、面積は m2、地価は円/m2、population_change_pct は％（2050年までの増減）、\n--       flood_risk_area_pct・landslide_risk_area_pct は割合（0.3＝30%）。\n-- 時価の目安：土地面積 × 参照地価（工業地→商業地→住宅地の順で最初にある値）。\n--   land_value_est_m_yen は面積と参照地価がある施設の合計、\n--   unrealized_gain_est_m_yen は上に加えて土地簿価がある施設だけの（時価目安 − 簿価）の合計。\n--   本社欄に会社全体の面積が入っている施設（出光興産の本社欄 569万m2 を千代田区の地価で評価すると 22兆円になる等）が実在するため、\n--   土地簿価がある施設で時価の目安が簿価の20倍を超えるものは紐づけ違いの疑いとして時価・含み益から除き、\n--   その施設数を est_excluded_count に持つ（簿価が無い施設は検証できないので除かない）。あくまで概算で、投資判断の根拠にしない。\n-- 市区町村名と地価の上昇率は area_profile_p1 から付ける。\nWITH h AS (\n  SELECT\n    edinet_code,\n    fiscal_year,\n    prefecture,\n    municipality_code,\n    book_value_land_m_yen,\n    book_value_buildings_m_yen,\n    land_area_m2,\n    COALESCE(industrial_land_price_per_m2, commercial_land_price_per_m2, residential_land_price_per_m2) AS ref_price,\n    population_current,\n    population_2050,\n    population_change_pct,\n    flood_risk_area_pct,\n    landslide_risk_area_pct\n  FROM `stock-analyzer-edinet.real_estate.corporate_holdings_p1`\n),\nh1 AS (\n  SELECT\n    h.*,\n    IF(h.land_area_m2 > 0 AND h.ref_price IS NOT NULL, h.land_area_m2 * h.ref_price / 1000000, NULL) AS est_raw\n  FROM h\n),\nh2 AS (\n  SELECT\n    h1.*,\n    IF(COALESCE(h1.book_value_land_m_yen, 0) > 0 AND h1.est_raw > 20 * h1.book_value_land_m_yen, NULL, h1.est_raw) AS est_m_yen,\n    IF(COALESCE(h1.book_value_land_m_yen, 0) > 0 AND h1.est_raw > 20 * h1.book_value_land_m_yen, 1, 0) AS excl\n  FROM h1\n),\nagg AS (\n  SELECT\n    edinet_code,\n    fiscal_year,\n    municipality_code,\n    MAX(prefecture) AS prefecture,\n    COUNT(*) AS facility_count,\n    SUM(land_area_m2) AS land_area_m2,\n    SUM(book_value_land_m_yen) AS book_value_land_m_yen,\n    SUM(book_value_buildings_m_yen) AS book_value_buildings_m_yen,\n    SUM(est_m_yen) AS land_value_est_m_yen,\n    SUM(excl) AS est_excluded_count,\n    SUM(IF(book_value_land_m_yen > 0 AND est_m_yen IS NOT NULL, est_m_yen - book_value_land_m_yen, NULL)) AS unrealized_gain_est_m_yen,\n    AVG(ref_price) AS land_price_ref_per_m2,\n    MAX(population_current) AS population_current,\n    MAX(population_2050) AS population_2050,\n    AVG(population_change_pct) AS population_change_pct,\n    AVG(flood_risk_area_pct) AS flood_risk_area_pct,\n    AVG(landslide_risk_area_pct) AS landslide_risk_area_pct\n  FROM h2\n  GROUP BY edinet_code, fiscal_year, municipality_code\n)\nSELECT\n  g.edinet_code,\n  c.name,\n  SUBSTR(c.sec_code, 1, 4) AS sec_code4,\n  c.industry,\n  g.fiscal_year,\n  g.prefecture,\n  g.municipality_code,\n  a.municipality_name,\n  g.facility_count,\n  g.land_area_m2,\n  g.book_value_land_m_yen,\n  g.book_value_buildings_m_yen,\n  g.land_price_ref_per_m2,\n  g.land_value_est_m_yen,\n  g.est_excluded_count,\n  g.unrealized_gain_est_m_yen,\n  g.population_current,\n  g.population_2050,\n  g.population_change_pct,\n  g.flood_risk_area_pct,\n  g.landslide_risk_area_pct,\n  a.land_price_yoy_change AS area_land_price_yoy_change\nFROM agg AS g\nLEFT JOIN `stock-analyzer-edinet.edinet.company` AS c\n  ON c.edinet_code = g.edinet_code\nLEFT JOIN (\n  SELECT municipality_code, municipality_name, land_price_yoy_change,\n         ROW_NUMBER() OVER (PARTITION BY municipality_code ORDER BY updated_at DESC) AS rn\n  FROM `stock-analyzer-edinet.real_estate.area_profile_p1`\n) AS a\n  ON a.municipality_code = g.municipality_code AND a.rn = 1\n", "desc": "企業の保有不動産。1社×市区町村×年度1行（時価の目安・含み益の目安は概算）", "columns": [{"name": "edinet_code", "type": "string", "label": "EDINETコード"}, {"name": "name", "type": "string", "label": "社名"}, {"name": "sec_code4", "type": "string", "label": "証券コード"}, {"name": "industry", "type": "string", "label": "業種"}, {"name": "fiscal_year", "type": "int64", "label": "年度"}, {"name": "prefecture", "type": "string", "label": "都道府県"}, {"name": "municipality_code", "type": "string", "label": "市区町村コード"}, {"name": "municipality_name", "type": "string", "label": "市区町村"}, {"name": "facility_count", "type": "int64", "label": "施設数"}, {"name": "land_area_m2", "type": "double", "label": "土地面積(m2)"}, {"name": "book_value_land_m_yen", "type": "double", "label": "土地簿価(百万円)"}, {"name": "book_value_buildings_m_yen", "type": "double", "label": "建物簿価(百万円)"}, {"name": "land_price_ref_per_m2", "type": "double", "label": "参照地価(円/m2)"}, {"name": "land_value_est_m_yen", "type": "double", "label": "土地時価の目安(百万円)"}, {"name": "est_excluded_count", "type": "int64", "label": "時価目安から除外した施設数"}, {"name": "unrealized_gain_est_m_yen", "type": "double", "label": "含み益の目安(百万円)"}, {"name": "population_current", "type": "int64", "label": "現在人口"}, {"name": "population_2050", "type": "int64", "label": "2050年人口"}, {"name": "population_change_pct", "type": "double", "label": "人口増減(%)"}, {"name": "flood_risk_area_pct", "type": "double", "label": "洪水リスク地域率"}, {"name": "landslide_risk_area_pct", "type": "double", "label": "土砂災害リスク地域率"}, {"name": "area_land_price_yoy_change", "type": "double", "label": "地域の地価前年比(%)"}], "table": "stock-analyzer-edinet.bi.m_re_holdings"}, "m_re_holdings_pref": {"sql": "-- m_re_holdings_pref: 1社×1都道府県×1年度につき1行（キー edinet_code, fiscal_year, prefecture）。\n-- m_re_holdings をさらに都道府県で畳んだ集約マート（都道府県別・会社別の見通しを軽くするため）。\n-- 単位・時価の目安の定義（簿価20倍超の除外を含む）は m_re_holdings と同じ（百万円・m2・円/m2。概算）。\n-- population_change_pct は施設数で重み付けせず、市区町村値の単純平均（地域の傾向を見る目安）。\nWITH h AS (\n  SELECT\n    edinet_code,\n    fiscal_year,\n    prefecture,\n    municipality_code,\n    book_value_land_m_yen,\n    land_area_m2,\n    COALESCE(industrial_land_price_per_m2, commercial_land_price_per_m2, residential_land_price_per_m2) AS ref_price,\n    population_change_pct,\n    flood_risk_area_pct\n  FROM `stock-analyzer-edinet.real_estate.corporate_holdings_p1`\n),\nh1 AS (\n  SELECT\n    h.*,\n    IF(h.land_area_m2 > 0 AND h.ref_price IS NOT NULL, h.land_area_m2 * h.ref_price / 1000000, NULL) AS est_raw\n  FROM h\n),\nh2 AS (\n  SELECT\n    h1.*,\n    IF(COALESCE(h1.book_value_land_m_yen, 0) > 0 AND h1.est_raw > 20 * h1.book_value_land_m_yen, NULL, h1.est_raw) AS est_m_yen,\n    IF(COALESCE(h1.book_value_land_m_yen, 0) > 0 AND h1.est_raw > 20 * h1.book_value_land_m_yen, 1, 0) AS excl\n  FROM h1\n),\nagg AS (\n  SELECT\n    edinet_code,\n    fiscal_year,\n    prefecture,\n    COUNT(*) AS facility_count,\n    COUNT(DISTINCT municipality_code) AS municipality_count,\n    SUM(land_area_m2) AS land_area_m2,\n    SUM(book_value_land_m_yen) AS book_value_land_m_yen,\n    SUM(est_m_yen) AS land_value_est_m_yen,\n    SUM(excl) AS est_excluded_count,\n    SUM(IF(book_value_land_m_yen > 0 AND est_m_yen IS NOT NULL, est_m_yen - book_value_land_m_yen, NULL)) AS unrealized_gain_est_m_yen,\n    AVG(population_change_pct) AS population_change_pct,\n    AVG(flood_risk_area_pct) AS flood_risk_area_pct\n  FROM h2\n  WHERE prefecture IS NOT NULL\n  GROUP BY edinet_code, fiscal_year, prefecture\n)\nSELECT\n  g.edinet_code,\n  c.name,\n  SUBSTR(c.sec_code, 1, 4) AS sec_code4,\n  c.industry,\n  g.fiscal_year,\n  g.prefecture,\n  g.facility_count,\n  g.municipality_count,\n  g.land_area_m2,\n  g.book_value_land_m_yen,\n  g.land_value_est_m_yen,\n  g.est_excluded_count,\n  g.unrealized_gain_est_m_yen,\n  g.population_change_pct,\n  g.flood_risk_area_pct\nFROM agg AS g\nLEFT JOIN `stock-analyzer-edinet.edinet.company` AS c\n  ON c.edinet_code = g.edinet_code\n", "desc": "企業の保有不動産の都道府県別集約。1社×都道府県×年度1行", "columns": [{"name": "edinet_code", "type": "string", "label": "EDINETコード"}, {"name": "name", "type": "string", "label": "社名"}, {"name": "sec_code4", "type": "string", "label": "証券コード"}, {"name": "industry", "type": "string", "label": "業種"}, {"name": "fiscal_year", "type": "int64", "label": "年度"}, {"name": "prefecture", "type": "string", "label": "都道府県"}, {"name": "facility_count", "type": "int64", "label": "施設数"}, {"name": "municipality_count", "type": "int64", "label": "市区町村数"}, {"name": "land_area_m2", "type": "double", "label": "土地面積(m2)"}, {"name": "book_value_land_m_yen", "type": "double", "label": "土地簿価(百万円)"}, {"name": "land_value_est_m_yen", "type": "double", "label": "土地時価の目安(百万円)"}, {"name": "est_excluded_count", "type": "int64", "label": "時価目安から除外した施設数"}, {"name": "unrealized_gain_est_m_yen", "type": "double", "label": "含み益の目安(百万円)"}, {"name": "population_change_pct", "type": "double", "label": "人口増減(%)"}, {"name": "flood_risk_area_pct", "type": "double", "label": "洪水リスク地域率"}], "table": "stock-analyzer-edinet.bi.m_re_holdings_pref"}, "m_screener": {"sql": "-- m_screener: 1社1行（キー edinet_code）。会社ごとに「売上がある最新年度」の財務と、株価系指標を横に並べたスクリーナー用の表。\n-- 金額は円、比率は小数（0.12＝12%）。market_cap は円。market_cap_b は analytics.stock_snapshot の列名を引き継いだ値で\n-- 単位は「億円（1e8円）」（列名の b は十億ではない。トヨタ 7203 で 344,775＝約34.5兆円）。\n-- 株価系は、analytics.stock_snapshot の会社別最新日があればそれ（price_source='snapshot'）、無ければ analytics.price_daily の\n-- 最新終値×（発行済株式数−自己株式数）で時価総額・PER・PBR・配当利回りを計算する（price_source='price_daily'）。\n-- snapshot は market='JP' の行だけ使う（同じ ticker で market='US' の行があり、market_cap_b の単位と点数が別物のため）。\n-- 有利子負債は financials の値を優先し、無ければ細目の合計（interest_bearing_debt_basis='reported'）、さらに無ければ\n-- 借入金・社債・CPの合計（'estimated'。リース負債は含まない概算）。\n-- RSI・52週位置・200日線は、スナップショットの日によって空の日があるため、会社ごとに「値のある最新日」（technical_date）から取る。\n-- 株価系・テクニカルとも、最新日が全体の最新日から14日以内のものだけ使う（上場廃止・取込停止の古い株価を最新として出さないため）。\n-- 騰落率（return_1m 等）は price_daily の履歴が約1か月しか無いため載せない。\n-- 成長率は「ちょうど1年前／3年前の年度」が財務表にあるときだけ計算し、無ければ NULL（年が欠けた期を跨がない）。\n-- 営業利益・純利益の成長率は前年値が正のときだけ計算する（赤字からの回復を％で表すと意味が逆転するため）。\nWITH items_raw AS (\n  SELECT edinet_code, fiscal_year,\n    MAX(IF(item = 'gross_profit', value, NULL)) AS gross_profit,\n    MAX(IF(item = 'rnd_expenses', value, NULL)) AS rnd_expenses,\n    MAX(IF(item = 'eps', value, NULL)) AS eps,\n    MAX(IF(item = 'bps', value, NULL)) AS bps,\n    MAX(IF(item = 'dividend_per_share', value, NULL)) AS dividend_per_share,\n    MAX(IF(item = 'payout_ratio', value, NULL)) AS payout_ratio,\n    MAX(IF(item = 'num_employees', value, NULL)) AS num_employees,\n    MAX(IF(item = 'shares_issued', value, NULL)) AS shares_issued,\n    MAX(IF(item = 'treasury_end_period_holding_count', value, NULL)) AS treasury_shares,\n    MAX(IF(item = 'ibd_current', value, NULL)) AS ibd_current,\n    MAX(IF(item = 'ibd_noncurrent', value, NULL)) AS ibd_noncurrent,\n    MAX(IF(item = 'ibd_total_unsplit_ifrs', value, NULL)) AS ibd_total,\n    MAX(IF(item = 'short_term_loans', value, NULL)) AS short_term_loans,\n    MAX(IF(item = 'long_term_loans', value, NULL)) AS long_term_loans,\n    MAX(IF(item = 'current_portion_lt_loans', value, NULL)) AS current_portion_lt_loans,\n    MAX(IF(item = 'bonds_payable', value, NULL)) AS bonds_payable,\n    MAX(IF(item = 'current_portion_bonds_payable', value, NULL)) AS current_portion_bonds_payable,\n    MAX(IF(item = 'short_term_bonds_payable', value, NULL)) AS short_term_bonds_payable,\n    MAX(IF(item = 'commercial_papers', value, NULL)) AS commercial_papers\n  FROM `stock-analyzer-edinet.edinet.financial_items`\n  WHERE item IN ('gross_profit', 'rnd_expenses', 'eps', 'bps', 'dividend_per_share', 'payout_ratio',\n                 'num_employees', 'shares_issued', 'treasury_end_period_holding_count', 'ibd_current', 'ibd_noncurrent',\n                 'ibd_total_unsplit_ifrs', 'short_term_loans', 'long_term_loans', 'current_portion_lt_loans', 'bonds_payable',\n                 'current_portion_bonds_payable', 'short_term_bonds_payable', 'commercial_papers')\n  GROUP BY edinet_code, fiscal_year\n),\nitems AS (\n  SELECT *,\n    IF(COALESCE(short_term_loans, long_term_loans, current_portion_lt_loans, bonds_payable, current_portion_bonds_payable, short_term_bonds_payable, commercial_papers) IS NULL, NULL,\n       COALESCE(short_term_loans, 0) + COALESCE(long_term_loans, 0) + COALESCE(current_portion_lt_loans, 0) + COALESCE(bonds_payable, 0) + COALESCE(current_portion_bonds_payable, 0) + COALESCE(short_term_bonds_payable, 0) + COALESCE(commercial_papers, 0)) AS loan_debt\n  FROM items_raw\n),\nfin AS (\n  SELECT edinet_code, fiscal_year, fiscal_year_end, net_sales, operating_income, ordinary_income, net_income,\n         total_assets, equity, interest_bearing_debt, cash_and_equiv, employee_count, avg_annual_salary, roe, roa, operating_margin\n  FROM `stock-analyzer-edinet.edinet.financials`\n),\nlatest AS (\n  SELECT * FROM fin WHERE net_sales IS NOT NULL\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY edinet_code ORDER BY fiscal_year DESC) = 1\n),\nsnap AS (\n  SELECT * FROM (\n    SELECT ticker, snapshot_date, ingested_at, current_price, market_cap_b, per, pbr, dividend_yield, composite_score, value_score, quality_score,\n           MAX(snapshot_date) OVER () AS max_d\n    FROM `stock-analyzer-edinet.analytics.stock_snapshot`\n    WHERE market = 'JP'\n  )\n  WHERE snapshot_date >= DATE_SUB(max_d, INTERVAL 14 DAY)\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY ticker ORDER BY snapshot_date DESC, ingested_at DESC) = 1\n),\ntech AS (\n  SELECT * FROM (\n    SELECT ticker, snapshot_date, rsi14, week52_position_pct, above_ma200, MAX(snapshot_date) OVER () AS max_d\n    FROM `stock-analyzer-edinet.analytics.stock_snapshot`\n    WHERE market = 'JP' AND week52_position_pct IS NOT NULL\n  )\n  WHERE snapshot_date >= DATE_SUB(max_d, INTERVAL 14 DAY)\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY ticker ORDER BY snapshot_date DESC) = 1\n),\npx AS (\n  SELECT * FROM (\n    SELECT ticker, trade_date, close, MAX(trade_date) OVER () AS max_d, ingested_at\n    FROM `stock-analyzer-edinet.analytics.price_daily`\n    WHERE close IS NOT NULL\n  )\n  WHERE trade_date >= DATE_SUB(max_d, INTERVAL 14 DAY)\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY ticker ORDER BY trade_date DESC, ingested_at DESC) = 1\n),\nj AS (\n  SELECT\n    c.edinet_code AS edinet_code,\n    SUBSTR(c.sec_code, 1, 4) AS sec_code4,\n    CASE WHEN c.sec_code IS NOT NULL THEN CONCAT(SUBSTR(c.sec_code, 1, 4), '.T') END AS ticker,\n    c.name AS name,\n    c.industry AS industry,\n    c.accounting_standard AS accounting_standard,\n    l.fiscal_year AS fiscal_year,\n    l.fiscal_year_end AS fiscal_year_end,\n    l.net_sales AS net_sales,\n    l.operating_income AS operating_income,\n    l.ordinary_income AS ordinary_income,\n    l.net_income AS net_income,\n    l.total_assets AS total_assets,\n    l.equity AS equity,\n    COALESCE(i.num_employees, l.employee_count) AS employees,\n    l.avg_annual_salary AS avg_annual_salary,\n    l.operating_income / NULLIF(l.net_sales, 0) AS operating_margin,\n    l.net_income / NULLIF(l.net_sales, 0) AS net_margin,\n    i.gross_profit / NULLIF(l.net_sales, 0) AS gross_margin,\n    l.roe AS roe,\n    l.roa AS roa,\n    i.rnd_expenses / NULLIF(l.net_sales, 0) AS rnd_ratio,\n    l.equity / NULLIF(l.total_assets, 0) AS equity_ratio,\n    ibd.v AS interest_bearing_debt,\n    ibd.basis AS interest_bearing_debt_basis,\n    l.cash_and_equiv AS cash_and_equiv,\n    l.cash_and_equiv - ibd.v AS net_cash,\n    ibd.v / NULLIF(l.equity, 0) AS de_ratio,\n    IF(p1.net_sales > 0, l.net_sales / p1.net_sales - 1, NULL) AS sales_growth_1y,\n    IF(p1.operating_income > 0, l.operating_income / p1.operating_income - 1, NULL) AS op_income_growth_1y,\n    IF(p1.net_income > 0, l.net_income / p1.net_income - 1, NULL) AS net_income_growth_1y,\n    IF(p3.net_sales > 0 AND l.net_sales > 0, POWER(l.net_sales / p3.net_sales, 1.0 / 3) - 1, NULL) AS sales_cagr_3y,\n    i.eps AS eps,\n    i.bps AS bps,\n    i.dividend_per_share AS dividend_per_share,\n    i.payout_ratio AS payout_ratio,\n    i.shares_issued AS shares_issued,\n    i.shares_issued - COALESCE(i.treasury_shares, 0) AS shares_out,\n    CASE WHEN s.ticker IS NOT NULL THEN 'snapshot' WHEN x.ticker IS NOT NULL THEN 'price_daily' END AS price_source,\n    COALESCE(s.current_price, x.close) AS current_price,\n    s.snapshot_date AS snapshot_date,\n    IF(s.ticker IS NOT NULL, s.snapshot_date, x.trade_date) AS price_date,\n    s.market_cap_b AS snap_cap_b,\n    s.per AS snap_per,\n    s.pbr AS snap_pbr,\n    s.dividend_yield AS snap_yield,\n    x.close AS px_close,\n    s.composite_score AS composite_score,\n    s.value_score AS value_score,\n    s.quality_score AS quality_score,\n    t.rsi14 AS rsi14,\n    t.week52_position_pct AS week52_position_pct,\n    t.above_ma200 AS above_ma200,\n    t.snapshot_date AS technical_date\n  FROM latest AS l\n  JOIN `stock-analyzer-edinet.edinet.company` AS c ON c.edinet_code = l.edinet_code\n  LEFT JOIN items AS i ON i.edinet_code = l.edinet_code AND i.fiscal_year = l.fiscal_year\n  CROSS JOIN UNNEST([STRUCT(COALESCE(l.interest_bearing_debt, i.ibd_current + i.ibd_noncurrent, i.ibd_total, i.loan_debt) AS v, CASE WHEN l.interest_bearing_debt IS NOT NULL OR i.ibd_current + i.ibd_noncurrent IS NOT NULL OR i.ibd_total IS NOT NULL THEN 'reported' WHEN i.loan_debt IS NOT NULL THEN 'estimated' END AS basis)]) AS ibd\n  LEFT JOIN fin AS p1 ON p1.edinet_code = l.edinet_code AND p1.fiscal_year = l.fiscal_year - 1\n  LEFT JOIN fin AS p3 ON p3.edinet_code = l.edinet_code AND p3.fiscal_year = l.fiscal_year - 3\n  LEFT JOIN snap AS s ON s.ticker = CONCAT(SUBSTR(c.sec_code, 1, 4), '.T')\n  LEFT JOIN tech AS t ON t.ticker = CONCAT(SUBSTR(c.sec_code, 1, 4), '.T')\n  LEFT JOIN px AS x ON x.ticker = CONCAT(SUBSTR(c.sec_code, 1, 4), '.T')\n  WHERE COALESCE(c.is_delisted, FALSE) = FALSE\n)\nSELECT\n  edinet_code,\n  sec_code4,\n  ticker,\n  name,\n  industry,\n  accounting_standard,\n  fiscal_year,\n  fiscal_year_end,\n  net_sales,\n  operating_income,\n  ordinary_income,\n  net_income,\n  total_assets,\n  equity,\n  employees,\n  avg_annual_salary,\n  operating_margin,\n  net_margin,\n  gross_margin,\n  roe,\n  roa,\n  rnd_ratio,\n  equity_ratio,\n  interest_bearing_debt,\n  interest_bearing_debt_basis,\n  cash_and_equiv,\n  net_cash,\n  de_ratio,\n  sales_growth_1y,\n  op_income_growth_1y,\n  net_income_growth_1y,\n  sales_cagr_3y,\n  eps,\n  bps,\n  dividend_per_share,\n  payout_ratio,\n  shares_issued,\n  price_source,\n  current_price,\n  price_date,\n  snapshot_date,\n  CASE price_source WHEN 'snapshot' THEN snap_cap_b WHEN 'price_daily' THEN px_close * shares_out / 1e8 END AS market_cap_b,\n  CASE price_source WHEN 'snapshot' THEN snap_cap_b * 1e8 WHEN 'price_daily' THEN px_close * shares_out END AS market_cap,\n  CASE price_source WHEN 'snapshot' THEN snap_per WHEN 'price_daily' THEN IF(eps > 0, px_close / eps, NULL) END AS per,\n  CASE price_source WHEN 'snapshot' THEN snap_pbr WHEN 'price_daily' THEN IF(bps > 0, px_close / bps, NULL) END AS pbr,\n  CASE price_source WHEN 'snapshot' THEN snap_yield WHEN 'price_daily' THEN IF(dividend_per_share IS NOT NULL, dividend_per_share / px_close, NULL) END AS dividend_yield,\n  IF(net_cash IS NOT NULL AND price_source = 'snapshot' AND snap_cap_b > 0, net_cash / (snap_cap_b * 1e8), IF(net_cash IS NOT NULL AND price_source = 'price_daily' AND px_close * shares_out > 0, net_cash / (px_close * shares_out), NULL)) AS net_cash_to_mcap,\n  composite_score,\n  value_score,\n  quality_score,\n  rsi14,\n  week52_position_pct,\n  above_ma200,\n  technical_date\nFROM j\n", "desc": "企業スクリーナー。1社1行（最新の決算期×最新の株価）。株価系の列は約700社のみ", "columns": [{"name": "edinet_code", "type": "string", "label": "EDINETコード"}, {"name": "sec_code4", "type": "string", "label": "証券コード"}, {"name": "ticker", "type": "string", "label": "ティッカー"}, {"name": "name", "type": "string", "label": "社名"}, {"name": "industry", "type": "string", "label": "業種"}, {"name": "accounting_standard", "type": "string", "label": "会計基準"}, {"name": "fiscal_year", "type": "int64", "label": "年度"}, {"name": "fiscal_year_end", "type": "date", "label": "決算期末"}, {"name": "net_sales", "type": "double", "label": "売上高"}, {"name": "operating_income", "type": "double", "label": "営業利益"}, {"name": "ordinary_income", "type": "double", "label": "経常利益"}, {"name": "net_income", "type": "double", "label": "純利益"}, {"name": "total_assets", "type": "double", "label": "総資産"}, {"name": "equity", "type": "double", "label": "自己資本"}, {"name": "employees", "type": "double", "label": "従業員数"}, {"name": "avg_annual_salary", "type": "double", "label": "平均年収"}, {"name": "operating_margin", "type": "double", "label": "営業利益率"}, {"name": "net_margin", "type": "double", "label": "純利益率"}, {"name": "gross_margin", "type": "double", "label": "粗利率"}, {"name": "roe", "type": "double", "label": "ROE"}, {"name": "roa", "type": "double", "label": "ROA"}, {"name": "rnd_ratio", "type": "double", "label": "研究開発費率"}, {"name": "equity_ratio", "type": "double", "label": "自己資本比率"}, {"name": "interest_bearing_debt", "type": "double", "label": "有利子負債"}, {"name": "interest_bearing_debt_basis", "type": "string", "label": "有利子負債の算出方法"}, {"name": "cash_and_equiv", "type": "double", "label": "現金同等物"}, {"name": "net_cash", "type": "double", "label": "ネットキャッシュ"}, {"name": "de_ratio", "type": "double", "label": "D/Eレシオ"}, {"name": "sales_growth_1y", "type": "double", "label": "売上成長率(1年)"}, {"name": "op_income_growth_1y", "type": "double", "label": "営業利益成長率(1年)"}, {"name": "net_income_growth_1y", "type": "double", "label": "純利益成長率(1年)"}, {"name": "sales_cagr_3y", "type": "double", "label": "売上CAGR(3年)"}, {"name": "eps", "type": "double", "label": "EPS"}, {"name": "bps", "type": "double", "label": "BPS"}, {"name": "dividend_per_share", "type": "double", "label": "1株配当"}, {"name": "payout_ratio", "type": "double", "label": "配当性向"}, {"name": "shares_issued", "type": "double", "label": "発行済株式数"}, {"name": "price_source", "type": "string", "label": "株価の出所"}, {"name": "current_price", "type": "double", "label": "株価"}, {"name": "price_date", "type": "date", "label": "株価の日付"}, {"name": "snapshot_date", "type": "date", "label": "スナップショット日"}, {"name": "market_cap_b", "type": "double", "label": "時価総額(億円)"}, {"name": "market_cap", "type": "double", "label": "時価総額"}, {"name": "per", "type": "double", "label": "PER"}, {"name": "pbr", "type": "double", "label": "PBR"}, {"name": "dividend_yield", "type": "double", "label": "配当利回り"}, {"name": "net_cash_to_mcap", "type": "double", "label": "ネットキャッシュ÷時価総額"}, {"name": "composite_score", "type": "double", "label": "総合スコア"}, {"name": "value_score", "type": "double", "label": "割安スコア"}, {"name": "quality_score", "type": "double", "label": "質スコア"}, {"name": "rsi14", "type": "double", "label": "RSI(14)"}, {"name": "week52_position_pct", "type": "double", "label": "52週レンジ内の位置"}, {"name": "above_ma200", "type": "bool", "label": "200日線より上"}, {"name": "technical_date", "type": "date", "label": "テクニカルの日付"}], "table": "stock-analyzer-edinet.bi.m_screener"}, "m_tax_node": {"sql": "-- m_tax_node: 技術分類ノード1行（キー node_id）。taxonomy.taxonomy_node は node_id が一意（293ノード・孤児親なし）。\n-- 階層は node_level 1（領域）〜4。親をたどって最上位（領域）と「領域 > … > 自ノード」のパス名を持つ。\n-- company_count は直接このノードに紐づく会社数（上場企業のみ・sector: 始まりの業種単位の行と company_id='nan' は除く）、\n-- company_count_rollup は自ノード以下（子孫）に紐づく会社の重複なしの数。\n-- 親子の鎖は最大4段なので、親を3回自己結合して祖先を引く（再帰クエリは使わない）。\nWITH n AS (\n  SELECT node_id, parent_id, node_name_ja, node_name_en, node_level, node_type, supply_chain_pos\n  FROM `stock-analyzer-edinet.taxonomy.taxonomy_node`\n  WHERE is_active IS NOT FALSE AND effective_to IS NULL\n),\nmp AS (\n  SELECT company_id, node_id\n  FROM `stock-analyzer-edinet.taxonomy.company_taxonomy_map`\n  WHERE company_id <> 'nan' AND NOT STARTS_WITH(company_id, 'sector:') AND (valid_to IS NULL OR valid_to >= CURRENT_DATE())\n  GROUP BY company_id, node_id\n),\nup AS (\n  SELECT mp.company_id, mp.node_id AS leaf_id, mp.node_id AS anc_id FROM mp\n  UNION ALL\n  SELECT mp.company_id, mp.node_id, n1.parent_id FROM mp JOIN n AS n1 ON n1.node_id = mp.node_id WHERE n1.parent_id IS NOT NULL\n  UNION ALL\n  SELECT mp.company_id, mp.node_id, n2.parent_id FROM mp JOIN n AS n1 ON n1.node_id = mp.node_id JOIN n AS n2 ON n2.node_id = n1.parent_id WHERE n2.parent_id IS NOT NULL\n  UNION ALL\n  SELECT mp.company_id, mp.node_id, n3.parent_id FROM mp JOIN n AS n1 ON n1.node_id = mp.node_id JOIN n AS n2 ON n2.node_id = n1.parent_id JOIN n AS n3 ON n3.node_id = n2.parent_id WHERE n3.parent_id IS NOT NULL\n),\ncnt AS (\n  SELECT anc_id AS node_id, COUNT(DISTINCT company_id) AS company_count_rollup\n  FROM up\n  GROUP BY anc_id\n),\ndirect AS (\n  SELECT node_id, COUNT(DISTINCT company_id) AS company_count\n  FROM mp\n  GROUP BY node_id\n),\nkids AS (\n  SELECT parent_id AS node_id, COUNT(*) AS child_count\n  FROM n\n  WHERE parent_id IS NOT NULL\n  GROUP BY parent_id\n)\nSELECT\n  a0.node_id,\n  a0.parent_id,\n  a0.node_name_ja,\n  a0.node_name_en,\n  a0.node_level,\n  a0.node_type,\n  a0.supply_chain_pos,\n  CASE a0.node_level WHEN 1 THEN a0.node_id WHEN 2 THEN a1.node_id WHEN 3 THEN a2.node_id ELSE a3.node_id END AS domain_id,\n  CASE a0.node_level WHEN 1 THEN a0.node_name_ja WHEN 2 THEN a1.node_name_ja WHEN 3 THEN a2.node_name_ja ELSE a3.node_name_ja END AS domain_name_ja,\n  CASE a0.node_level WHEN 1 THEN a0.node_name_ja WHEN 2 THEN CONCAT(a1.node_name_ja, ' > ', a0.node_name_ja) WHEN 3 THEN CONCAT(a2.node_name_ja, ' > ', a1.node_name_ja, ' > ', a0.node_name_ja) ELSE CONCAT(a3.node_name_ja, ' > ', a2.node_name_ja, ' > ', a1.node_name_ja, ' > ', a0.node_name_ja) END AS path_name,\n  COALESCE(k.child_count, 0) AS child_count,\n  COALESCE(d.company_count, 0) AS company_count,\n  COALESCE(c.company_count_rollup, 0) AS company_count_rollup\nFROM n AS a0\nLEFT JOIN n AS a1 ON a1.node_id = a0.parent_id\nLEFT JOIN n AS a2 ON a2.node_id = a1.parent_id\nLEFT JOIN n AS a3 ON a3.node_id = a2.parent_id\nLEFT JOIN kids AS k ON k.node_id = a0.node_id\nLEFT JOIN direct AS d ON d.node_id = a0.node_id\nLEFT JOIN cnt AS c ON c.node_id = a0.node_id\n", "desc": "技術分類ツリー。1ノード1行（階層・領域・紐づく企業数）", "columns": [{"name": "node_id", "type": "string", "label": "技術分類ID"}, {"name": "parent_id", "type": "string", "label": "親ノードID"}, {"name": "node_name_ja", "type": "string", "label": "技術分類名"}, {"name": "node_name_en", "type": "string", "label": "技術分類名（英）"}, {"name": "node_level", "type": "int64", "label": "階層"}, {"name": "node_type", "type": "string", "label": "ノード種別"}, {"name": "supply_chain_pos", "type": "string", "label": "サプライチェーン上の位置"}, {"name": "domain_id", "type": "string", "label": "領域ID"}, {"name": "domain_name_ja", "type": "string", "label": "技術領域"}, {"name": "path_name", "type": "string", "label": "分類パス"}, {"name": "child_count", "type": "int64", "label": "子ノード数"}, {"name": "company_count", "type": "int64", "label": "企業数"}, {"name": "company_count_rollup", "type": "int64", "label": "企業数（下位含む）"}], "table": "stock-analyzer-edinet.bi.m_tax_node"}, "m_theme": {"sql": "-- m_theme: テーマ(subtheme)×銘柄1行（キー theme_name, ticker）。edinet.ticker_subtheme_mapping の実在銘柄だけ。\n-- 元表は同じ ticker×subtheme が取り込みのたびに重複して入る（実測 4 時点）ため、updated_at が最新の1行に絞る。\n-- source='json_sync' の行は ticker が 'SECTOR_<業種コード>' のプレースホルダ（業種単位のテーマ定義）で銘柄ではないので除く\n-- （テーマの定義は m_theme_def）。実在銘柄は source='config_representative'＝業種ごとの代表銘柄（2〜3社）に、\n-- その業種のテーマ全部を付けたもの。会社ごとに選んだテーマではない（同じ業種の代表銘柄は同じテーマ集合を持つ）。\n-- ticker は日本株が '6501.T'。証券コード4桁で edinet.company と結合する（同じ sec_code4 が複数社なら上場中を優先して1社）。\n-- 財務は会社ごとに「売上が入っている最新の fiscal_year」1年分と、その前年（fiscal_year - 1 が実在するときだけ）の売上。\n-- sales_growth は前年比（小数。0.1＝+10%）。前年が無い会社は空。\nWITH mp AS (\n  SELECT\n    ticker,\n    market,\n    subtheme AS theme_name,\n    sector_code,\n    relevance,\n    source,\n    ROW_NUMBER() OVER (PARTITION BY ticker, subtheme, sector_code ORDER BY updated_at DESC) AS rn\n  FROM `stock-analyzer-edinet.edinet.ticker_subtheme_mapping`\n  WHERE NOT STARTS_WITH(ticker, 'SECTOR_')\n),\nco AS (\n  SELECT\n    edinet_code,\n    SUBSTR(sec_code, 1, 4) AS sec_code4,\n    name,\n    industry,\n    ROW_NUMBER() OVER (PARTITION BY SUBSTR(sec_code, 1, 4) ORDER BY IF(is_delisted, 1, 0), edinet_code) AS rn\n  FROM `stock-analyzer-edinet.edinet.company`\n  WHERE sec_code IS NOT NULL\n),\nfin AS (\n  SELECT\n    edinet_code,\n    fiscal_year,\n    net_sales,\n    operating_income,\n    net_income,\n    ROW_NUMBER() OVER (PARTITION BY edinet_code ORDER BY fiscal_year DESC) AS rn\n  FROM `stock-analyzer-edinet.edinet.financials`\n  WHERE net_sales IS NOT NULL\n),\nsm AS (\n  SELECT sector_code, market, name_ja, supply_chain_position\n  FROM `stock-analyzer-edinet.edinet.sub_theme_master`\n)\nSELECT\n  mp.theme_name,\n  mp.market,\n  mp.sector_code,\n  sm.name_ja AS sector_name_ja,\n  sm.supply_chain_position,\n  mp.ticker,\n  REPLACE(mp.ticker, '.T', '') AS sec_code4,\n  co.edinet_code,\n  co.name,\n  co.industry,\n  mp.relevance,\n  mp.source,\n  fin.fiscal_year,\n  fin.net_sales,\n  fin.operating_income,\n  fin.net_income,\n  fin.operating_income / NULLIF(fin.net_sales, 0) AS operating_margin,\n  fin.net_sales / NULLIF(prev.net_sales, 0) - 1 AS sales_growth\nFROM mp\nLEFT JOIN sm ON sm.sector_code = mp.sector_code AND sm.market = mp.market\nLEFT JOIN co ON co.sec_code4 = REPLACE(mp.ticker, '.T', '') AND co.rn = 1 AND mp.market = 'JP'\nLEFT JOIN fin ON fin.edinet_code = co.edinet_code AND fin.rn = 1\nLEFT JOIN `stock-analyzer-edinet.edinet.financials` AS prev ON prev.edinet_code = fin.edinet_code AND prev.fiscal_year = fin.fiscal_year - 1\nWHERE mp.rn = 1\n", "desc": "テーマ×銘柄。業種ごとの代表銘柄にその業種のテーマが付く（同じ業種のテーマは同じ銘柄集合）", "columns": [{"name": "theme_name", "type": "string", "label": ""}, {"name": "market", "type": "string", "label": "市場"}, {"name": "sector_code", "type": "string", "label": ""}, {"name": "sector_name_ja", "type": "string", "label": ""}, {"name": "supply_chain_position", "type": "string", "label": ""}, {"name": "ticker", "type": "string", "label": "ティッカー"}, {"name": "sec_code4", "type": "string", "label": "証券コード"}, {"name": "edinet_code", "type": "string", "label": "EDINETコード"}, {"name": "name", "type": "string", "label": "社名"}, {"name": "industry", "type": "string", "label": "業種"}, {"name": "relevance", "type": "double", "label": ""}, {"name": "source", "type": "string", "label": ""}, {"name": "fiscal_year", "type": "int64", "label": "年度"}, {"name": "net_sales", "type": "double", "label": "売上高"}, {"name": "operating_income", "type": "double", "label": "営業利益"}, {"name": "net_income", "type": "double", "label": "純利益"}, {"name": "operating_margin", "type": "double", "label": "営業利益率"}, {"name": "sales_growth", "type": "double", "label": ""}], "table": "stock-analyzer-edinet.bi.m_theme"}, "m_theme_def": {"sql": "-- m_theme_def: テーマの定義1行（キー theme_name, sector_code, market）。edinet.sub_theme_master は業種1行に\n-- テーマ名の JSON 配列（subthemes）を持つ（日本33業種＋米国11業種＝44行）ので、配列を1テーマ1行に開く。\n-- company_count は m_theme に実在銘柄として紐づく社数（実在銘柄の無い米国のテーマは 0）。\n-- theme_order は業種内でのテーマの並び（0始まり）。\nWITH th AS (\n  SELECT\n    m.sector_code,\n    m.market,\n    m.name_ja AS sector_name_ja,\n    m.supply_chain_position,\n    theme_name,\n    pos AS theme_order\n  FROM `stock-analyzer-edinet.edinet.sub_theme_master` AS m, UNNEST(JSON_VALUE_ARRAY(m.subthemes)) AS theme_name WITH OFFSET AS pos\n),\ncnt AS (\n  SELECT subtheme AS theme_name, sector_code, market, COUNT(DISTINCT ticker) AS company_count\n  FROM `stock-analyzer-edinet.edinet.ticker_subtheme_mapping`\n  WHERE NOT STARTS_WITH(ticker, 'SECTOR_')\n  GROUP BY subtheme, sector_code, market\n)\nSELECT\n  th.theme_name,\n  th.market,\n  th.sector_code,\n  th.sector_name_ja,\n  th.supply_chain_position,\n  th.theme_order,\n  COALESCE(cnt.company_count, 0) AS company_count\nFROM th\nLEFT JOIN cnt ON cnt.theme_name = th.theme_name AND cnt.sector_code = th.sector_code AND cnt.market = th.market\n", "desc": "テーマ定義。業種サブテーマの一覧（米国を含む）", "columns": [{"name": "theme_name", "type": "string", "label": ""}, {"name": "market", "type": "string", "label": "市場"}, {"name": "sector_code", "type": "string", "label": ""}, {"name": "sector_name_ja", "type": "string", "label": ""}, {"name": "supply_chain_position", "type": "string", "label": ""}, {"name": "theme_order", "type": "int64", "label": ""}, {"name": "company_count", "type": "int64", "label": "企業数"}], "table": "stock-analyzer-edinet.bi.m_theme_def"}, "m_theme_signal": {"sql": "-- m_theme_signal: テーマ×日×シグナル種別×方向1行（キー theme_name, sector_code, fired_at, signal_category, direction）。\n-- 元は ontology.signal_event（location=US）。asia-northeast1 のテーマ表と1本のクエリで結合できないため、\n-- bi_export.py が list_rows → load job（どちらも無料）で asia の bi.src_signal_event へ写してからここで読む。\n-- 結合は業種コードで行う（signal_event.sector_code ＝ sub_theme_master.sector_code）。テーマは業種ごとに定義され\n-- 銘柄ごとの割当ではないため、同じ業種のテーマは同じシグナル件数になる点に注意。日本の業種だけ（米国のテーマに対応するシグナルは無い）。\n-- signal_event は同じ event_id が再取り込みで重複して入るので event_id の重複を除いて数える。\n-- ticker が空のシグナルは業種単位。ticker_signal_count は銘柄つきの件数、ticker_count はその銘柄数。\n-- days_before_latest は表内の最新シグナル日からの日数（日付関数を使わず「直近N日」を絞れる。更新日に依存しない）。\nWITH th AS (\n  SELECT m.sector_code, m.name_ja AS sector_name_ja, theme_name\n  FROM `stock-analyzer-edinet.edinet.sub_theme_master` AS m, UNNEST(JSON_VALUE_ARRAY(m.subthemes)) AS theme_name\n  WHERE m.market = 'JP'\n),\nsig AS (\n  SELECT\n    sector_code,\n    fired_at,\n    signal_category,\n    direction,\n    COUNT(DISTINCT event_id) AS signal_count,\n    COUNT(DISTINCT IF(ticker IS NOT NULL, event_id, NULL)) AS ticker_signal_count,\n    COUNT(DISTINCT ticker) AS ticker_count,\n    AVG(signal_value) AS avg_signal_value\n  FROM `stock-analyzer-edinet.bi.src_signal_event`\n  WHERE sector_code IS NOT NULL\n  GROUP BY sector_code, fired_at, signal_category, direction\n),\nlatest AS (\n  SELECT MAX(fired_at) AS latest_date\n  FROM `stock-analyzer-edinet.bi.src_signal_event`\n)\nSELECT\n  th.theme_name,\n  th.sector_code,\n  th.sector_name_ja,\n  sig.fired_at,\n  DATE_DIFF(latest.latest_date, sig.fired_at, DAY) AS days_before_latest,\n  sig.signal_category,\n  sig.direction,\n  sig.signal_count,\n  sig.ticker_signal_count,\n  sig.ticker_count,\n  sig.avg_signal_value\nFROM sig\nINNER JOIN th ON th.sector_code = sig.sector_code\nCROSS JOIN latest\n", "desc": "テーマ×日×シグナル種別。days_before_latest で直近N日に絞れる", "columns": [{"name": "theme_name", "type": "string", "label": ""}, {"name": "sector_code", "type": "string", "label": ""}, {"name": "sector_name_ja", "type": "string", "label": ""}, {"name": "fired_at", "type": "date", "label": ""}, {"name": "days_before_latest", "type": "int64", "label": ""}, {"name": "signal_category", "type": "string", "label": ""}, {"name": "direction", "type": "string", "label": ""}, {"name": "signal_count", "type": "int64", "label": ""}, {"name": "ticker_signal_count", "type": "int64", "label": ""}, {"name": "ticker_count", "type": "int64", "label": ""}, {"name": "avg_signal_value", "type": "double", "label": ""}], "table": "stock-analyzer-edinet.bi.m_theme_signal"}}, "templates": [{"id": "fin_company_10y", "domain": "finance", "title": "会社の10年推移", "question": "この会社の売上・営業利益・純利益は直近10年でどう動いたか", "mart": "m_fin_annual", "sql": "SELECT fiscal_year, name, net_sales, operating_income, net_income,\n       ROUND(operating_margin * 100, 2) AS operating_margin_pct\nFROM m_fin_annual\nWHERE sec_code4 = {{sec_code4}}\n  AND fiscal_year > (SELECT MAX(fiscal_year) FROM m_fin_annual WHERE sec_code4 = {{sec_code4}} AND net_sales IS NOT NULL) - {{years}}\nORDER BY fiscal_year", "params": [{"name": "sec_code4", "label": "証券コード（4桁）", "type": "string", "default": "7203"}, {"name": "years", "label": "遡る年数", "type": "int", "default": 10, "min": 1, "max": 15}], "chart": {"type": "line", "x": "fiscal_year", "y": ["net_sales", "operating_income", "net_income"], "series": null}, "note": "金額は円。最新期は決算発表前だと空欄になることがある。"}, {"id": "fin_industry_opm", "domain": "finance", "title": "業種別の営業利益率", "question": "どの業種が儲かっているか（営業利益率の業種平均と社数）", "mart": "m_fin_annual", "sql": "WITH d AS (\n  SELECT COALESCE(industry, '(不明)') AS industry_name, operating_margin\n  FROM m_fin_annual\n  WHERE fiscal_year = {{fiscal_year}} AND operating_margin BETWEEN -1 AND 1\n)\nSELECT industry_name, ROUND(AVG(operating_margin) * 100, 2) AS avg_operating_margin_pct, COUNT(*) AS companies\nFROM d\nGROUP BY industry_name\nHAVING COUNT(*) >= {{min_companies}}\nORDER BY avg_operating_margin_pct DESC", "params": [{"name": "fiscal_year", "label": "決算年（期末の年）", "type": "int", "default": 2025, "min": 2016, "max": 2030}, {"name": "min_companies", "label": "最低社数", "type": "int", "default": 5, "min": 1, "max": 1000}], "chart": {"type": "bar", "x": "industry_name", "y": "avg_operating_margin_pct", "series": null}, "note": "単純平均（社の大きさは加味しない）。営業利益率が±100%を超える外れ値は除く。"}, {"id": "fin_rnd_ranking", "domain": "finance", "title": "研究開発費率ランキング", "question": "売上に対する研究開発費の割合が高い会社は", "mart": "m_fin_annual", "sql": "SELECT sec_code4, name, industry, ROUND(rnd_ratio * 100, 2) AS rnd_ratio_pct, rnd_expenses, net_sales\nFROM m_fin_annual\nWHERE fiscal_year = {{fiscal_year}} AND rnd_ratio IS NOT NULL AND rnd_ratio <= 1 AND net_sales >= {{min_sales}}\nORDER BY rnd_ratio DESC\nLIMIT {{limit}}", "params": [{"name": "fiscal_year", "label": "決算年（期末の年）", "type": "int", "default": 2025, "min": 2016, "max": 2030}, {"name": "min_sales", "label": "売上高の下限（円）", "type": "number", "default": 10000000000, "min": 0}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 500}], "chart": {"type": "bar", "x": "name", "y": "rnd_ratio_pct", "series": null}, "note": "売上100億円未満は研究開発費率が極端に出やすいので既定で除外。"}, {"id": "fin_sales_growth_3y", "domain": "finance", "title": "売上3年成長率の上位", "question": "3年前から売上を最も伸ばした会社は", "mart": "m_fin_annual", "sql": "WITH w AS (\n  SELECT edinet_code, sec_code4, name, industry, fiscal_year, net_sales,\n         LAG(net_sales, 3) OVER (PARTITION BY edinet_code ORDER BY fiscal_year) AS sales_3y_ago,\n         LAG(fiscal_year, 3) OVER (PARTITION BY edinet_code ORDER BY fiscal_year) AS year_3y_ago\n  FROM m_fin_annual\n  WHERE net_sales IS NOT NULL\n)\nSELECT sec_code4, name, industry, sales_3y_ago, net_sales,\n       ROUND((net_sales / NULLIF(sales_3y_ago, 0) - 1) * 100, 1) AS growth_3y_pct\nFROM w\nWHERE fiscal_year = {{fiscal_year}} AND year_3y_ago = fiscal_year - 3 AND sales_3y_ago >= {{min_sales}}\nORDER BY growth_3y_pct DESC\nLIMIT {{limit}}", "params": [{"name": "fiscal_year", "label": "決算年（期末の年）", "type": "int", "default": 2025, "min": 2016, "max": 2030}, {"name": "min_sales", "label": "3年前の売上高の下限（円）", "type": "number", "default": 10000000000, "min": 0}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 500}], "chart": {"type": "bar", "x": "name", "y": "growth_3y_pct", "series": null}, "note": "3年前の決算が欠けている会社は対象外（行の並びではなく年で3年前を確認している）。合併・買収による増加も含む。"}, {"id": "fin_up_up_trend", "domain": "finance", "title": "増収増益企業数の年次推移", "question": "売上も営業利益も前年より増えた会社は毎年どれだけあるか", "mart": "m_fin_annual", "sql": "WITH w AS (\n  SELECT edinet_code, fiscal_year, net_sales, operating_income,\n         LAG(net_sales) OVER (PARTITION BY edinet_code ORDER BY fiscal_year) AS prev_sales,\n         LAG(operating_income) OVER (PARTITION BY edinet_code ORDER BY fiscal_year) AS prev_op,\n         LAG(fiscal_year) OVER (PARTITION BY edinet_code ORDER BY fiscal_year) AS prev_year\n  FROM m_fin_annual\n  WHERE net_sales IS NOT NULL AND operating_income IS NOT NULL\n)\nSELECT fiscal_year,\n       COUNT(*) AS companies,\n       SUM(CASE WHEN net_sales > prev_sales AND operating_income > prev_op THEN 1 ELSE 0 END) AS up_up_companies,\n       ROUND(SUM(CASE WHEN net_sales > prev_sales AND operating_income > prev_op THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) AS up_up_pct\nFROM w\nWHERE prev_year = fiscal_year - 1 AND fiscal_year BETWEEN {{from_year}} AND {{to_year}}\nGROUP BY fiscal_year\nORDER BY fiscal_year", "params": [{"name": "from_year", "label": "開始年", "type": "int", "default": 2017, "min": 2016, "max": 2030}, {"name": "to_year", "label": "終了年", "type": "int", "default": 2025, "min": 2016, "max": 2030}], "chart": {"type": "line", "x": "fiscal_year", "y": ["up_up_companies", "up_up_pct"], "series": null}, "note": "前年の決算が両方そろう会社だけが母数。母数は年によって変わるので割合も併記。"}, {"id": "fin_industry_salary", "domain": "finance", "title": "業種別の平均年収", "question": "業種ごとの平均年間給与（万円）", "mart": "m_fin_annual", "sql": "WITH d AS (\n  SELECT COALESCE(industry, '(不明)') AS industry_name, avg_annual_salary\n  FROM m_fin_annual\n  WHERE fiscal_year = {{fiscal_year}} AND avg_annual_salary > 0\n)\nSELECT industry_name, ROUND(AVG(avg_annual_salary) / 10000, 0) AS avg_salary_man_yen, COUNT(*) AS companies\nFROM d\nGROUP BY industry_name\nHAVING COUNT(*) >= {{min_companies}}\nORDER BY avg_salary_man_yen DESC", "params": [{"name": "fiscal_year", "label": "決算年（期末の年）", "type": "int", "default": 2025, "min": 2016, "max": 2030}, {"name": "min_companies", "label": "最低社数", "type": "int", "default": 5, "min": 1, "max": 1000}], "chart": {"type": "bar", "x": "industry_name", "y": "avg_salary_man_yen", "series": null}, "note": "有報の「平均年間給与」（提出会社単体・持株会社は社員が少なく高く出ることがある）。"}, {"id": "fin_sales_per_employee", "domain": "finance", "title": "1人当たり売上ランキング", "question": "従業員1人当たりの売上が大きい会社は", "mart": "m_fin_annual", "sql": "SELECT sec_code4, name, industry, employee_count, net_sales,\n       ROUND(net_sales / NULLIF(employee_count, 0) / 1000000, 1) AS sales_per_employee_m_yen\nFROM m_fin_annual\nWHERE fiscal_year = {{fiscal_year}} AND net_sales > 0 AND employee_count >= {{min_employees}}\nORDER BY sales_per_employee_m_yen DESC\nLIMIT {{limit}}", "params": [{"name": "fiscal_year", "label": "決算年（期末の年）", "type": "int", "default": 2025, "min": 2016, "max": 2030}, {"name": "min_employees", "label": "従業員数の下限", "type": "int", "default": 100, "min": 1, "max": 1000000}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 500}], "chart": {"type": "bar", "x": "name", "y": "sales_per_employee_m_yen", "series": null}, "note": "単位は百万円/人。売上は連結、従業員数は連結の人数（employee_count）。商社・持株会社が上位に出やすい。"}, {"id": "fin_fcf_positive_share", "domain": "finance", "title": "フリーCF黒字企業の割合", "question": "フリーキャッシュフローが黒字の会社は毎年どれだけあるか", "mart": "m_fin_annual", "sql": "SELECT fiscal_year,\n       COUNT(*) AS companies,\n       SUM(CASE WHEN free_cf > 0 THEN 1 ELSE 0 END) AS fcf_positive,\n       ROUND(SUM(CASE WHEN free_cf > 0 THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) AS fcf_positive_pct\nFROM m_fin_annual\nWHERE free_cf IS NOT NULL AND fiscal_year BETWEEN {{from_year}} AND {{to_year}}\nGROUP BY fiscal_year\nORDER BY fiscal_year", "params": [{"name": "from_year", "label": "開始年", "type": "int", "default": 2017, "min": 2016, "max": 2030}, {"name": "to_year", "label": "終了年", "type": "int", "default": 2025, "min": 2016, "max": 2030}], "chart": {"type": "line", "x": "fiscal_year", "y": "fcf_positive_pct", "series": null}, "note": "フリーCF＝営業CF＋投資CF（財務データの定義）。"}, {"id": "fin_equity_ratio_dist", "domain": "finance", "title": "自己資本比率の分布", "question": "自己資本比率はどの区間に何社いるか", "mart": "m_fin_annual", "sql": "WITH d AS (\n  SELECT CASE WHEN equity_ratio < 0 THEN 0\n              WHEN equity_ratio < 0.2 THEN 1\n              WHEN equity_ratio < 0.4 THEN 2\n              WHEN equity_ratio < 0.6 THEN 3\n              WHEN equity_ratio < 0.8 THEN 4\n              ELSE 5 END AS bucket_no,\n         CASE WHEN equity_ratio < 0 THEN '債務超過'\n              WHEN equity_ratio < 0.2 THEN '0〜20%'\n              WHEN equity_ratio < 0.4 THEN '20〜40%'\n              WHEN equity_ratio < 0.6 THEN '40〜60%'\n              WHEN equity_ratio < 0.8 THEN '60〜80%'\n              ELSE '80%以上' END AS bucket\n  FROM m_fin_annual\n  WHERE fiscal_year = {{fiscal_year}} AND equity_ratio IS NOT NULL\n)\nSELECT bucket_no, bucket, COUNT(*) AS companies\nFROM d\nGROUP BY bucket_no, bucket\nORDER BY bucket_no", "params": [{"name": "fiscal_year", "label": "決算年（期末の年）", "type": "int", "default": 2025, "min": 2016, "max": 2030}], "chart": {"type": "bar", "x": "bucket", "y": "companies", "series": null}, "note": "自己資本比率＝純資産(equity)÷総資産。銀行・保険は構造上低く出る。"}, {"id": "fin_goodwill_heavy", "domain": "finance", "title": "のれんが純資産に占める割合が大きい会社", "question": "買収で積んだのれんが純資産に比べて重い会社は", "mart": "m_fin_annual", "sql": "SELECT sec_code4, name, industry, goodwill, net_assets,\n       ROUND(goodwill / NULLIF(net_assets, 0) * 100, 1) AS goodwill_to_net_assets_pct\nFROM m_fin_annual\nWHERE fiscal_year = {{fiscal_year}} AND goodwill > 0 AND net_assets > {{min_net_assets}}\nORDER BY goodwill_to_net_assets_pct DESC\nLIMIT {{limit}}", "params": [{"name": "fiscal_year", "label": "決算年（期末の年）", "type": "int", "default": 2025, "min": 2016, "max": 2030}, {"name": "min_net_assets", "label": "純資産の下限（円）", "type": "number", "default": 1000000000, "min": 0}, {"name": "limit", "label": "表示件数", "type": "int", "default": 30, "min": 1, "max": 500}], "chart": {"type": "bar", "x": "name", "y": "goodwill_to_net_assets_pct", "series": null}, "note": "のれん/純資産が100%超は、のれんが減損されると債務超過に近づく目安。IFRS採用会社はのれんの扱いが違う。"}, {"id": "fin_payout_dist", "domain": "finance", "title": "配当性向の分布", "question": "配当性向はどの区間に何社いるか", "mart": "m_fin_annual", "sql": "WITH d AS (\n  SELECT CASE WHEN payout_ratio <= 0 THEN 0\n              WHEN payout_ratio < 0.2 THEN 1\n              WHEN payout_ratio < 0.4 THEN 2\n              WHEN payout_ratio < 0.6 THEN 3\n              WHEN payout_ratio < 1 THEN 4\n              ELSE 5 END AS bucket_no,\n         CASE WHEN payout_ratio <= 0 THEN '無配・0%'\n              WHEN payout_ratio < 0.2 THEN '0〜20%'\n              WHEN payout_ratio < 0.4 THEN '20〜40%'\n              WHEN payout_ratio < 0.6 THEN '40〜60%'\n              WHEN payout_ratio < 1 THEN '60〜100%'\n              ELSE '100%以上' END AS bucket\n  FROM m_fin_annual\n  WHERE fiscal_year = {{fiscal_year}} AND payout_ratio IS NOT NULL\n)\nSELECT bucket_no, bucket, COUNT(*) AS companies\nFROM d\nGROUP BY bucket_no, bucket\nORDER BY bucket_no", "params": [{"name": "fiscal_year", "label": "決算年（期末の年）", "type": "int", "default": 2025, "min": 2016, "max": 2030}], "chart": {"type": "bar", "x": "bucket", "y": "companies", "series": null}, "note": "配当性向は連結ベースの自前計算値（小数）。赤字で配当を出す会社は100%以上に入る。"}, {"id": "fin_roe_pbr_scatter", "domain": "finance", "title": "ROE × PBR 散布図", "question": "ROEが高い会社ほどPBRも高いか", "mart": "m_fin_annual", "sql": "SELECT sec_code4, name, COALESCE(industry, '(不明)') AS industry_name,\n       ROUND(roe * 100, 2) AS roe_pct, ROUND(pbr, 2) AS pbr\nFROM m_fin_annual\nWHERE fiscal_year = {{fiscal_year}} AND roe BETWEEN -0.5 AND 0.6 AND pbr > 0 AND pbr <= {{max_pbr}}", "params": [{"name": "fiscal_year", "label": "決算年（期末の年）", "type": "int", "default": 2025, "min": 2016, "max": 2030}, {"name": "max_pbr", "label": "PBRの上限（外れ値除去）", "type": "number", "default": 10, "min": 1, "max": 300}], "chart": {"type": "scatter", "x": "roe_pct", "y": "pbr", "series": "industry_name"}, "note": "PBRは有報記載の期末ベース。ROEが-50%〜60%の範囲だけを描く。"}, {"id": "fin_gross_vs_sga", "domain": "finance", "title": "粗利率と販管費率の業種比較", "question": "業種ごとの粗利率と販管費率の違い", "mart": "m_fin_annual", "sql": "WITH d AS (\n  SELECT COALESCE(industry, '(不明)') AS industry_name, gross_margin, sga_ratio\n  FROM m_fin_annual\n  WHERE fiscal_year = {{fiscal_year}} AND gross_margin BETWEEN 0 AND 1 AND sga_ratio BETWEEN 0 AND 1\n)\nSELECT industry_name,\n       ROUND(AVG(gross_margin) * 100, 1) AS avg_gross_margin_pct,\n       ROUND(AVG(sga_ratio) * 100, 1) AS avg_sga_ratio_pct,\n       COUNT(*) AS companies\nFROM d\nGROUP BY industry_name\nHAVING COUNT(*) >= {{min_companies}}\nORDER BY avg_gross_margin_pct DESC", "params": [{"name": "fiscal_year", "label": "決算年（期末の年）", "type": "int", "default": 2025, "min": 2016, "max": 2030}, {"name": "min_companies", "label": "最低社数", "type": "int", "default": 5, "min": 1, "max": 1000}], "chart": {"type": "bar", "x": "industry_name", "y": ["avg_gross_margin_pct", "avg_sga_ratio_pct"], "series": null}, "note": "粗利と販管費の両方を開示している会社だけ。粗利を開示しない業種（銀行・一部サービス）は出ない。"}, {"id": "fin_loss_companies", "domain": "finance", "title": "赤字企業数の推移", "question": "純損失の会社は毎年どれだけあるか", "mart": "m_fin_annual", "sql": "SELECT fiscal_year,\n       COUNT(*) AS companies,\n       SUM(CASE WHEN net_income < 0 THEN 1 ELSE 0 END) AS loss_companies,\n       ROUND(SUM(CASE WHEN net_income < 0 THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) AS loss_pct\nFROM m_fin_annual\nWHERE net_income IS NOT NULL AND fiscal_year BETWEEN {{from_year}} AND {{to_year}}\nGROUP BY fiscal_year\nORDER BY fiscal_year", "params": [{"name": "from_year", "label": "開始年", "type": "int", "default": 2017, "min": 2016, "max": 2030}, {"name": "to_year", "label": "終了年", "type": "int", "default": 2025, "min": 2016, "max": 2030}], "chart": {"type": "line", "x": "fiscal_year", "y": ["loss_companies", "loss_pct"], "series": null}, "note": "純利益＝親会社株主に帰属する当期純利益で判定。"}, {"id": "fin_employee_change", "domain": "finance", "title": "従業員数の増減ランキング", "question": "前年から従業員が最も増えた（減った）会社は", "mart": "m_fin_annual", "sql": "WITH w AS (\n  SELECT edinet_code, sec_code4, name, industry, fiscal_year, employee_count,\n         LAG(employee_count) OVER (PARTITION BY edinet_code ORDER BY fiscal_year) AS prev_count,\n         LAG(fiscal_year) OVER (PARTITION BY edinet_code ORDER BY fiscal_year) AS prev_year\n  FROM m_fin_annual\n  WHERE employee_count > 0\n)\nSELECT sec_code4, name, industry, prev_count, employee_count,\n       employee_count - prev_count AS change_count,\n
