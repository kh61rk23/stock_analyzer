<title>株式DWH 分析室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* layout: 左＝テンプレの棚（有価証券報告書の目次のように領域→問い）、右＝作業台（パラメータ→グラフ→表→SQL）。自由分析と「Claudeに聞く」は作業台のタブ */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --ink:#18221f; --sub:#5b6964; --line:#d9e0dd;
  --accent:#1d6b5a; --accent-soft:#e2efeb; --warn:#a15c07; --bad:#b3261e; --good:#2f7d32;
  --chip:#eef2f0;
  --f-body:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --panel:#18201d; --ink:#e4ebe8; --sub:#93a39d; --line:#2b3632;
  --accent:#5cc2a7; --accent-soft:#1d3029; --warn:#e0a24a; --bad:#f08a80; --good:#7bc77e; --chip:#212b27; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --panel:#18201d; --ink:#e4ebe8; --sub:#93a39d; --line:#2b3632;
  --accent:#5cc2a7; --accent-soft:#1d3029; --warn:#e0a24a; --bad:#f08a80; --good:#7bc77e; --chip:#212b27; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
.wrap{padding-inline:16px;padding-block:16px 40px;max-width:1400px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:14px}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em}
.meta{color:var(--sub);font-size:12px}
.status{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--chip);color:var(--sub)}
.status.ok{color:var(--good)} .status.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.shelf,.bench{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.shelf{padding:12px;max-height:calc(100vh - 120px);overflow:auto;position:sticky;top:env(safe-area-inset-top,0px)}
@media (max-width:860px){.shelf{position:static;max-height:none}}
.shelf h2{font-size:11px;letter-spacing:.12em;color:var(--sub);margin:14px 4px 6px;text-transform:uppercase;font-weight:500}
.shelf h2:first-child{margin-top:4px}
.tpl{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;color:var(--ink);font:inherit;cursor:pointer}
.tpl:hover{background:var(--chip)} .tpl.on{background:var(--accent-soft)}
.tpl b{display:block;font-weight:500;font-size:13.5px}
.tpl span{display:block;font-size:12px;color:var(--sub)}
.bench{padding:14px 16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px -4px 14px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;font:inherit;color:var(--sub);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--sub)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{width:100%;font-family:var(--f-mono);font-size:12.5px;min-height:110px}
button.go{background:var(--accent);color:var(--panel);border:0;border-radius:6px;padding:7px 16px;font:inherit;font-weight:500;cursor:pointer}
button.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font:inherit;color:var(--ink);cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,.tpl:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{font-size:16px;font-weight:500;margin:0 0 2px;text-wrap:balance}
.note{color:var(--sub);font-size:12.5px;margin:2px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--accent-soft);border-radius:99px;padding:2px 4px 2px 10px;font-size:12px}
.chip button{background:none;border:0;color:var(--sub);cursor:pointer;font-size:14px;line-height:1;padding:0 6px}
.chartbox{position:relative;height:340px;margin:12px 0}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:6px;max-height:420px}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);color:var(--sub);font-weight:500}
td.n{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--chip)}
details.sql{margin-top:10px} details.sql pre{font-family:var(--f-mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto;white-space:pre-wrap}
.msg{padding:8px 10px;border-radius:6px;background:var(--chip);font-size:13px;margin:8px 0}
.msg.err{color:var(--bad)} .msg.warn{color:var(--warn)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mlist{display:flex;flex-direction:column;gap:6px}
.mrow{display:flex;gap:6px;flex-wrap:wrap}
.answer{white-space:pre-wrap;font-size:13.5px;margin:8px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
<header>
  <h1>株式DWH 分析室</h1>
  <span class="meta">BigQuery（stock-analyzer-edinet）を開いたその場で集計します。テンプレは board の「分析」タブと共通です。</span>
  <span id="status" class="status">接続を確認中…</span>
</header>
<div class="grid">
  <nav class="shelf" id="shelf" aria-label="テンプレート"></nav>
  <section class="bench">
    <div class="tabs" role="tablist">
      <button role="tab" id="t-tpl" aria-selected="true" data-tab="tpl">テンプレ</button>
      <button role="tab" id="t-free" aria-selected="false" data-tab="free">自由分析</button>
      <button role="tab" id="t-ask" aria-selected="false" data-tab="ask">Claudeに聞く</button>
      <button role="tab" id="t-scr" aria-selected="false" data-tab="scr">スクリーナー</button>
      <button role="tab" id="t-sql" aria-selected="false" data-tab="sql">SQL</button>
      <button role="tab" id="t-slot" aria-selected="false" data-tab="slot">スロット</button>
    </div>
    <div id="p-tpl"></div>
    <div id="p-free" hidden></div>
    <div id="p-ask" hidden>
      <p class="q">日本語で聞くと、Claude が SQL を組んで BigQuery で実行します</p>
      <p class="note">使える表はテンプレと同じマート（下の一覧）。質問は1回ごとにあなたの Claude の利用枠を使います。</p>
      <textarea id="askText" placeholder="例：情報・通信業で、直近3年の売上成長率が高い会社を10社。営業利益率も並べて"></textarea>
      <div class="row" style="margin-top:8px"><button class="go" id="askGo">質問する</button><button class="ghost" id="askStop" hidden>止める</button></div>
      <div id="askOut"></div>
    </div>
    <div id="p-scr" hidden></div>
    <div id="p-slot" hidden></div>
    <div id="p-sql" hidden>
      <p class="note">マート名（例 m_fin_annual）をそのまま FROM に書けます。読み取りのみ・最大1,000行。下のボタンで組み立てることもできます。</p>
      <details class="sql" id="builder" open><summary>ボタンで SQL を組み立てる</summary><div id="bld"></div></details>
      <textarea id="sqlText"></textarea>
      <div class="row" style="margin-top:8px"><button class="go" id="sqlGo">実行</button>
        <label class="f">スロット名<input id="slotName" placeholder="例：高ROE割安"></label><button class="ghost" id="slotSave">SQLをスロットに保存</button><span class="note" id="slotMsg"></span></div>
      <div id="sqlOut"></div>
    </div>
    <div id="result"></div>
  </section>
</div>
</div>

<script>
/* ── 埋め込みデータ（ビルド時に stock_analyzer/bi から差し込む）── */
const BI = {"project": "stock-analyzer-edinet", "marts": {"m_arxiv_keywords": {"sql": "-- m_arxiv_keywords: arXiv の論文×採点キーワード。1論文1キーワード1行（キー paper_id, keyword）。\n-- m_arxiv_papers と同じ重複の畳み方をしたうえで keywords（「|」区切り）を縦に並べる。キーワードの流行（月ごとの件数）を見るための表。\nWITH r AS (\n  SELECT * FROM `stock-analyzer-edinet.analytics.arxiv_papers`\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY paper_id ORDER BY fetched_at DESC, (summary IS NOT NULL) DESC) = 1\n)\nSELECT\n  r.paper_id AS paper_id,\n  r.fetched_date AS fetched_date,\n  DATE_TRUNC(r.fetched_date, MONTH) AS fetched_month,\n  r.primary_category AS primary_category,\n  TRIM(k) AS keyword,\n  r.investment_score AS investment_score,\n  r.is_idea AS is_idea\nFROM r, UNNEST(SPLIT(r.keywords, '|')) AS k\nWHERE r.keywords IS NOT NULL AND TRIM(k) != ''\n", "desc": "arXiv の論文×採点キーワード。キーワードの流行を見る", "columns": [{"name": "paper_id", "type": "string", "label": "arXiv ID"}, {"name": "fetched_date", "type": "date", "label": "取得日"}, {"name": "fetched_month", "type": "date", "label": ""}, {"name": "primary_category", "type": "string", "label": "分野"}, {"name": "keyword", "type": "string", "label": "キーワード"}, {"name": "investment_score", "type": "int64", "label": "点数"}, {"name": "is_idea", "type": "bool", "label": "投資アイデア候補"}], "table": "stock-analyzer-edinet.bi.m_arxiv_keywords"}, "m_arxiv_papers": {"sql": "-- m_arxiv_papers: arXiv の論文。1論文1行（キー paper_id）。元は analytics.arxiv_papers（arxiv_monitor が週1回追記・arxiv_store.py）。\n-- 同じ論文が別の回にも入ったときは fetched_at が新しい行（過去の md レポートから取り込んだ行は題名が55字で切れ・要旨なしのことがあるため、\n-- 取得時の行が後から入れば置き換わる）。keywords は採点に当たったキーワードを「|」区切り。\n-- investment_score は arxiv_monitor の点数（キーワード×機関×引用×カテゴリ×再現性×新しさ）。is_idea は ARXIV_INVESTMENT_THRESHOLD 以上。\nWITH r AS (\n  SELECT * FROM `stock-analyzer-edinet.analytics.arxiv_papers`\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY paper_id ORDER BY fetched_at DESC, (summary IS NOT NULL) DESC) = 1\n)\nSELECT\n  paper_id,\n  fetched_date,\n  DATE_TRUNC(fetched_date, MONTH) AS fetched_month,\n  published_date,\n  primary_category,\n  categories,\n  title,\n  title_ja,\n  summary,\n  authors,\n  url,\n  investment_score,\n  is_idea,\n  keywords,\n  source\nFROM r\n", "desc": "arXiv の論文（金融・計量経済の5分野・週1回取得・2026-07-27〜）。1論文1行。日本語タイトル・要旨・点数・キーワード・URL", "columns": [{"name": "paper_id", "type": "string", "label": "arXiv ID"}, {"name": "fetched_date", "type": "date", "label": "取得日"}, {"name": "fetched_month", "type": "date", "label": ""}, {"name": "published_date", "type": "date", "label": "公開日"}, {"name": "primary_category", "type": "string", "label": "分野"}, {"name": "categories", "type": "string", "label": ""}, {"name": "title", "type": "string", "label": ""}, {"name": "title_ja", "type": "string", "label": "日本語タイトル"}, {"name": "summary", "type": "string", "label": "要旨"}, {"name": "authors", "type": "string", "label": "著者"}, {"name": "url", "type": "string", "label": ""}, {"name": "investment_score", "type": "int64", "label": "点数"}, {"name": "is_idea", "type": "bool", "label": "投資アイデア候補"}, {"name": "keywords", "type": "string", "label": "キーワード"}, {"name": "source", "type": "string", "label": ""}], "table": "stock-analyzer-edinet.bi.m_arxiv_papers"}, "m_company": {"sql": "-- m_company: 1社1行（キー edinet_code）。edinet.company は edinet_code が一意（4,010社＝4,010キー）なので重複除去は不要。\n-- sec_code は5桁（末尾に検査用の0）。先頭4桁が銘柄コード（英字入り '285A' 含む）。\nSELECT\n  c.edinet_code,\n  SUBSTR(c.sec_code, 1, 4) AS sec_code4,\n  c.name,\n  c.industry,\n  c.accounting_standard,\n  c.listing_status,\n  c.is_delisted\nFROM `stock-analyzer-edinet.edinet.company` AS c\n", "desc": "上場会社マスタ。1社1行", "columns": [{"name": "edinet_code", "type": "string", "label": "EDINETコード"}, {"name": "sec_code4", "type": "string", "label": "証券コード"}, {"name": "name", "type": "string", "label": "社名"}, {"name": "industry", "type": "string", "label": "業種"}, {"name": "accounting_standard", "type": "string", "label": "会計基準"}, {"name": "listing_status", "type": "string", "label": "上場状態"}, {"name": "is_delisted", "type": "bool", "label": "上場廃止"}], "table": "stock-analyzer-edinet.bi.m_company"}, "m_company_country": {"sql": "-- m_company_country: 1社(ticker)×1国につき1行（キー ticker, country_code）。\n-- company_country_exposure には同じ ticker×国×種別が重複して入ることがある（取り込みの再実行）ため、\n-- exposure_strength / revenue_share_est は合算せず MAX を採る（足すと依存度が膨らむ）。\n-- 種別が複数ある国は最も強い行の exposure_type を代表にし、種類数は exposure_type_count に持つ。\n-- 期限切れ（valid_to が過去）の権益は除く。\n-- ticker は日本株が '1605.T'、米国株が 'AAPL'。日本株だけ証券コード4桁で edinet.company と結合する\n-- （edinet_code・社名・業種は米国株では空）。同じ sec_code4 が複数社に付く場合は上場中を優先して1社に絞る。\n-- 国の最新リスクは country_risk_daily の最新日の値。\nWITH e AS (\n  SELECT\n    ticker,\n    market,\n    country_code,\n    exposure_type,\n    exposure_strength,\n    revenue_share_est,\n    review_flag,\n    ROW_NUMBER() OVER (PARTITION BY ticker, country_code ORDER BY exposure_strength DESC, exposure_type) AS rn,\n    MAX(exposure_strength) OVER (PARTITION BY ticker, country_code) AS max_strength,\n    MAX(revenue_share_est) OVER (PARTITION BY ticker, country_code) AS max_revenue_share,\n    COUNT(DISTINCT exposure_type) OVER (PARTITION BY ticker, country_code) AS type_count,\n    MAX(IF(review_flag, 1, 0)) OVER (PARTITION BY ticker, country_code) AS any_review\n  FROM `stock-analyzer-edinet.geopolitics.company_country_exposure`\n  WHERE valid_to IS NULL OR valid_to >= CURRENT_DATE()\n),\nco AS (\n  SELECT\n    edinet_code,\n    SUBSTR(sec_code, 1, 4) AS sec_code4,\n    name,\n    industry,\n    ROW_NUMBER() OVER (PARTITION BY SUBSTR(sec_code, 1, 4) ORDER BY IF(is_delisted, 1, 0), edinet_code) AS rn\n  FROM `stock-analyzer-edinet.edinet.company`\n  WHERE sec_code IS NOT NULL\n),\nlr AS (\n  SELECT\n    country_code,\n    composite_risk_score,\n    gdelt_instability,\n    foreign_ministry_level,\n    state_dept_level,\n    risk_date,\n    ROW_NUMBER() OVER (PARTITION BY country_code ORDER BY risk_date DESC, updated_at DESC) AS rn\n  FROM `stock-analyzer-edinet.geopolitics.country_risk_daily`\n)\nSELECT\n  e.ticker,\n  e.market,\n  IF(REGEXP_CONTAINS(e.ticker, r'^[0-9A-Z]{4}\\.T$'), SUBSTR(e.ticker, 1, 4), NULL) AS sec_code4,\n  co.edinet_code,\n  co.name,\n  co.industry,\n  e.country_code,\n  p.country_name_ja,\n  p.region,\n  p.sanction_flag,\n  e.exposure_type,\n  e.type_count AS exposure_type_count,\n  e.max_strength AS exposure_strength,\n  e.max_revenue_share AS revenue_share_est,\n  e.any_review = 1 AS review_flag,\n  lr.composite_risk_score AS latest_risk_score,\n  lr.gdelt_instability AS latest_gdelt_instability,\n  lr.foreign_ministry_level AS latest_foreign_ministry_level,\n  lr.state_dept_level AS latest_state_dept_level,\n  lr.risk_date AS latest_risk_date,\n  e.max_strength * lr.composite_risk_score AS risk_weighted_score\nFROM e\nLEFT JOIN co\n  ON co.sec_code4 = IF(REGEXP_CONTAINS(e.ticker, r'^[0-9A-Z]{4}\\.T$'), SUBSTR(e.ticker, 1, 4), NULL) AND co.rn = 1\nLEFT JOIN `stock-analyzer-edinet.geopolitics.country_profile` AS p\n  ON p.country_code = e.country_code\nLEFT JOIN lr\n  ON lr.country_code = e.country_code AND lr.rn = 1\nWHERE e.rn = 1\n", "desc": "企業×国の権益・依存。1社1国1行（最新の国リスク付き）", "columns": [{"name": "ticker", "type": "string", "label": "ティッカー"}, {"name": "market", "type": "string", "label": "市場"}, {"name": "sec_code4", "type": "string", "label": "証券コード"}, {"name": "edinet_code", "type": "string", "label": "EDINETコード"}, {"name": "name", "type": "string", "label": "社名"}, {"name": "industry", "type": "string", "label": "業種"}, {"name": "country_code", "type": "string", "label": "国コード"}, {"name": "country_name_ja", "type": "string", "label": "国名"}, {"name": "region", "type": "string", "label": "地域"}, {"name": "sanction_flag", "type": "bool", "label": "制裁対象"}, {"name": "exposure_type", "type": "string", "label": "権益の種類"}, {"name": "exposure_type_count", "type": "int64", "label": "権益の種類数"}, {"name": "exposure_strength", "type": "double", "label": "依存度"}, {"name": "revenue_share_est", "type": "double", "label": "売上比率(推定)"}, {"name": "review_flag", "type": "bool", "label": "要レビュー"}, {"name": "latest_risk_score", "type": "double", "label": "最新の国リスク"}, {"name": "latest_gdelt_instability", "type": "double", "label": ""}, {"name": "latest_foreign_ministry_level", "type": "int64", "label": ""}, {"name": "latest_state_dept_level", "type": "int64", "label": ""}, {"name": "latest_risk_date", "type": "date", "label": "リスク日付"}, {"name": "risk_weighted_score", "type": "double", "label": "依存度×国リスク"}], "table": "stock-analyzer-edinet.bi.m_company_country"}, "m_company_tax": {"sql": "-- m_company_tax: 会社(company_id)×技術分類ノード1行（キー company_id, node_id）。\n-- company_taxonomy_map は週次の map_id（…:日付）で同じ company_id×node_id が重複して入るため、updated_at が最新の1行に絞る。\n-- company_id は上場会社が証券コード4桁（edinet.company の sec_code 先頭4桁）、業種単位の行は 'sector:JP:<業種コード>'\n-- （entity_type='sector'・社名等は空）。company_id='nan' の行（欠損が文字列化したもの）は意味を持たないので除く。\n-- 同じ sec_code4 が複数社に付く場合は上場中を優先して1社に絞る（m_company_country と同じ）。\n-- 財務は会社ごとに「売上が入っている最新の fiscal_year」1年分。研究開発費は financial_items の rnd_expenses。\n-- revenue_share_est は会社単位の推定値で、同じ会社の全ノードに同じ値が入る（足し合わせない）。valid_to が過去の行は除く。\nWITH mp AS (\n  SELECT\n    company_id,\n    node_id,\n    relevance_score,\n    confidence,\n    revenue_share_est,\n    confidence_type,\n    auto_derived,\n    verified_flag,\n    ROW_NUMBER() OVER (PARTITION BY company_id, node_id ORDER BY updated_at DESC, map_id DESC) AS rn\n  FROM `stock-analyzer-edinet.taxonomy.company_taxonomy_map`\n  WHERE company_id <> 'nan' AND (valid_to IS NULL OR valid_to >= CURRENT_DATE())\n),\nco AS (\n  SELECT\n    edinet_code,\n    SUBSTR(sec_code, 1, 4) AS sec_code4,\n    name,\n    industry,\n    ROW_NUMBER() OVER (PARTITION BY SUBSTR(sec_code, 1, 4) ORDER BY IF(is_delisted, 1, 0), edinet_code) AS rn\n  FROM `stock-analyzer-edinet.edinet.company`\n  WHERE sec_code IS NOT NULL\n),\nfin AS (\n  SELECT\n    edinet_code,\n    fiscal_year,\n    net_sales,\n    operating_income,\n    ROW_NUMBER() OVER (PARTITION BY edinet_code ORDER BY fiscal_year DESC) AS rn\n  FROM `stock-analyzer-edinet.edinet.financials`\n  WHERE net_sales IS NOT NULL\n),\nrnd AS (\n  SELECT edinet_code, fiscal_year, MAX(value) AS rnd_expenses\n  FROM `stock-analyzer-edinet.edinet.financial_items`\n  WHERE item = 'rnd_expenses'\n  GROUP BY edinet_code, fiscal_year\n),\nnd AS (\n  SELECT\n    a0.node_id,\n    a0.node_name_ja,\n    a0.node_level,\n    a0.parent_id,\n    CASE a0.node_level WHEN 1 THEN a0.node_id WHEN 2 THEN a1.node_id WHEN 3 THEN a2.node_id ELSE a3.node_id END AS domain_id,\n    CASE a0.node_level WHEN 1 THEN a0.node_name_ja WHEN 2 THEN a1.node_name_ja WHEN 3 THEN a2.node_name_ja ELSE a3.node_name_ja END AS domain_name_ja,\n    CASE a0.node_level WHEN 1 THEN a0.node_name_ja WHEN 2 THEN CONCAT(a1.node_name_ja, ' > ', a0.node_name_ja) WHEN 3 THEN CONCAT(a2.node_name_ja, ' > ', a1.node_name_ja, ' > ', a0.node_name_ja) ELSE CONCAT(a3.node_name_ja, ' > ', a2.node_name_ja, ' > ', a1.node_name_ja, ' > ', a0.node_name_ja) END AS path_name\n  FROM `stock-analyzer-edinet.taxonomy.taxonomy_node` AS a0\n  LEFT JOIN `stock-analyzer-edinet.taxonomy.taxonomy_node` AS a1 ON a1.node_id = a0.parent_id\n  LEFT JOIN `stock-analyzer-edinet.taxonomy.taxonomy_node` AS a2 ON a2.node_id = a1.parent_id\n  LEFT JOIN `stock-analyzer-edinet.taxonomy.taxonomy_node` AS a3 ON a3.node_id = a2.parent_id\n  WHERE a0.is_active IS NOT FALSE AND a0.effective_to IS NULL\n)\nSELECT\n  mp.company_id,\n  IF(STARTS_WITH(mp.company_id, 'sector:'), 'sector', 'company') AS entity_type,\n  co.edinet_code,\n  co.name,\n  co.industry,\n  mp.node_id,\n  nd.node_name_ja,\n  nd.node_level,\n  nd.parent_id,\n  nd.domain_id,\n  nd.domain_name_ja,\n  nd.path_name,\n  mp.relevance_score,\n  mp.confidence,\n  mp.revenue_share_est,\n  mp.confidence_type,\n  mp.auto_derived,\n  mp.verified_flag,\n  fin.fiscal_year,\n  fin.net_sales,\n  fin.operating_income,\n  fin.operating_income / NULLIF(fin.net_sales, 0) AS operating_margin,\n  rnd.rnd_expenses,\n  rnd.rnd_expenses / NULLIF(fin.net_sales, 0) AS rnd_ratio\nFROM mp\nLEFT JOIN co ON co.sec_code4 = mp.company_id AND co.rn = 1\nLEFT JOIN nd ON nd.node_id = mp.node_id\nLEFT JOIN fin ON fin.edinet_code = co.edinet_code AND fin.rn = 1\nLEFT JOIN rnd ON rnd.edinet_code = fin.edinet_code AND rnd.fiscal_year = fin.fiscal_year\nWHERE mp.rn = 1\n", "desc": "企業×技術分類。1社1ノード1行＋直近年度の財務（紐づくのは一部の会社のみ・自動推定）", "columns": [{"name": "company_id", "type": "string", "label": "企業ID"}, {"name": "entity_type", "type": "string", "label": "主体の種別"}, {"name": "edinet_code", "type": "string", "label": "EDINETコード"}, {"name": "name", "type": "string", "label": "社名"}, {"name": "industry", "type": "string", "label": "業種"}, {"name": "node_id", "type": "string", "label": "技術分類ID"}, {"name": "node_name_ja", "type": "string", "label": "技術分類名"}, {"name": "node_level", "type": "int64", "label": "階層"}, {"name": "parent_id", "type": "string", "label": "親ノードID"}, {"name": "domain_id", "type": "string", "label": "領域ID"}, {"name": "domain_name_ja", "type": "string", "label": "技術領域"}, {"name": "path_name", "type": "string", "label": "分類パス"}, {"name": "relevance_score", "type": "double", "label": "関連度"}, {"name": "confidence", "type": "double", "label": "確からしさ"}, {"name": "revenue_share_est", "type": "double", "label": "売上比率(推定)"}, {"name": "confidence_type", "type": "string", "label": "確からしさの種別"}, {"name": "auto_derived", "type": "bool", "label": "自動推定"}, {"name": "verified_flag", "type": "bool", "label": "確認済み"}, {"name": "fiscal_year", "type": "int64", "label": "年度"}, {"name": "net_sales", "type": "double", "label": "売上高"}, {"name": "operating_income", "type": "double", "label": "営業利益"}, {"name": "operating_margin", "type": "double", "label": "営業利益率"}, {"name": "rnd_expenses", "type": "double", "label": "研究開発費"}, {"name": "rnd_ratio", "type": "double", "label": "研究開発費率"}], "table": "stock-analyzer-edinet.bi.m_company_tax"}, "m_country_profile": {"sql": "-- m_country_profile: 1か国1行（キー country_code＝ISO3）。geopolitics.country_profile は 59 か国。\n-- JSON 列は BI の軸にしにくいので文字列化して持つ（軸・集計には使わず、参照用）。\nSELECT\n  p.country_code,\n  p.country_name_ja,\n  p.region,\n  p.democracy_index,\n  p.corruption_index,\n  p.rule_of_law,\n  p.gdp_usd_bn,\n  p.export_concentration,\n  p.is_landlocked,\n  p.sanction_flag,\n  p.trade_dependency_jp,\n  IF(p.top_export_commodities IS NULL, NULL, TO_JSON_STRING(p.top_export_commodities)) AS top_export_commodities,\n  IF(p.sealane_adjacency IS NULL, NULL, TO_JSON_STRING(p.sealane_adjacency)) AS sealane_adjacency,\n  IF(p.military_alliances IS NULL, NULL, TO_JSON_STRING(p.military_alliances)) AS military_alliances\nFROM `stock-analyzer-edinet.geopolitics.country_profile` AS p\n", "desc": "国プロファイル。1か国1行（民主主義・汚職・法の支配・GDP・制裁など）", "columns": [{"name": "country_code", "type": "string", "label": "国コード"}, {"name": "country_name_ja", "type": "string", "label": "国名"}, {"name": "region", "type": "string", "label": "地域"}, {"name": "democracy_index", "type": "double", "label": "民主主義指数"}, {"name": "corruption_index", "type": "double", "label": "汚職認識指数"}, {"name": "rule_of_law", "type": "double", "label": "法の支配"}, {"name": "gdp_usd_bn", "type": "double", "label": "GDP(十億ドル)"}, {"name": "export_concentration", "type": "double", "label": "輸出集中度"}, {"name": "is_landlocked", "type": "bool", "label": "内陸国"}, {"name": "sanction_flag", "type": "bool", "label": "制裁対象"}, {"name": "trade_dependency_jp", "type": "double", "label": "対日貿易依存"}, {"name": "top_export_commodities", "type": "string", "label": ""}, {"name": "sealane_adjacency", "type": "string", "label": ""}, {"name": "military_alliances", "type": "string", "label": ""}], "table": "stock-analyzer-edinet.bi.m_country_profile"}, "m_country_risk": {"sql": "-- m_country_risk: 1国1日1行（キー country_code, risk_date）。country_risk_daily は国×日で一意のはずだが、\n-- 取り込みの再実行で重複しても1行に落とすよう updated_at が新しい方を採る。\n-- composite_risk_score は大きいほど高リスク。foreign_ministry_level / state_dept_level は外務省・米国務省の渡航レベル（1〜4）。\nWITH r AS (\n  SELECT\n    country_code,\n    risk_date,\n    gdelt_instability,\n    foreign_ministry_level,\n    state_dept_level,\n    composite_risk_score,\n    ROW_NUMBER() OVER (PARTITION BY country_code, risk_date ORDER BY updated_at DESC) AS rn\n  FROM `stock-analyzer-edinet.geopolitics.country_risk_daily`\n)\nSELECT\n  r.country_code,\n  r.risk_date,\n  p.country_name_ja,\n  p.region,\n  p.sanction_flag,\n  r.gdelt_instability,\n  r.foreign_ministry_level,\n  r.state_dept_level,\n  r.composite_risk_score\nFROM r\nLEFT JOIN `stock-analyzer-edinet.geopolitics.country_profile` AS p\n  ON p.country_code = r.country_code\nWHERE r.rn = 1\n", "desc": "国別リスクの日次。1国1日1行（総合リスク・GDELT不安定度・渡航レベル）", "columns": [{"name": "country_code", "type": "string", "label": "国コード"}, {"name": "risk_date", "type": "date", "label": "日付"}, {"name": "country_name_ja", "type": "string", "label": "国名"}, {"name": "region", "type": "string", "label": "地域"}, {"name": "sanction_flag", "type": "bool", "label": "制裁対象"}, {"name": "gdelt_instability", "type": "double", "label": "GDELT不安定度"}, {"name": "foreign_ministry_level", "type": "int64", "label": "外務省レベル"}, {"name": "state_dept_level", "type": "int64", "label": "国務省レベル"}, {"name": "composite_risk_score", "type": "double", "label": "総合リスク"}], "table": "stock-analyzer-edinet.bi.m_country_risk"}, "m_fin_annual": {"sql": "-- m_fin_annual: 1社1年度1行（キー edinet_code, fiscal_year。fiscal_year は決算期末の年）。\n-- 基準表は edinet.financials。実測（2026-10）で financial_items の (edinet_code, fiscal_year) 36,654 組は\n-- すべて financials（36,656 組）に含まれ、両表とも同キーの重複は0。items だけにある年度は無いため、\n-- financials を基準に LEFT JOIN で細目を横持ちする。items 側が将来 financials に無い年度を持った場合は、\n-- 主要約列（売上・利益など）が空のままその年度が落ちる点に注意（落とさない方が分析上の欠けに気づける）。\n-- 細目は1表1スキャンで済むよう、対象項目だけに絞って先に横持ちする。\nWITH items AS (\n  SELECT\n    edinet_code,\n    fiscal_year,\n    MAX(IF(item = 'gross_profit', value, NULL)) AS gross_profit,\n    MAX(IF(item = 'sga', value, NULL)) AS sga,\n    MAX(IF(item = 'rnd_expenses', value, NULL)) AS rnd_expenses,\n    MAX(IF(item = 'cost_of_sales', value, NULL)) AS cost_of_sales,\n    MAX(IF(item = 'goodwill', value, NULL)) AS goodwill,\n    MAX(IF(item = 'inventories', value, NULL)) AS inventories,\n    MAX(IF(item = 'trade_receivables', value, NULL)) AS trade_receivables,\n    MAX(IF(item = 'total_liabilities', value, NULL)) AS total_liabilities,\n    MAX(IF(item = 'net_assets', value, NULL)) AS net_assets,\n    MAX(IF(item = 'shareholders_equity', value, NULL)) AS shareholders_equity,\n    MAX(IF(item = 'eps', value, NULL)) AS eps,\n    MAX(IF(item = 'bps', value, NULL)) AS bps,\n    MAX(IF(item = 'dividend_per_share', value, NULL)) AS dividend_per_share,\n    MAX(IF(item = 'payout_ratio', value, NULL)) AS payout_ratio,\n    MAX(IF(item = 'per', value, NULL)) AS per,\n    MAX(IF(item = 'pbr', value, NULL)) AS pbr,\n    MAX(IF(item = 'num_employees', value, NULL)) AS num_employees,\n    MAX(IF(item = 'female_manager_ratio', value, NULL)) AS female_manager_ratio,\n    MAX(IF(item = 'avg_tenure_years', value, NULL)) AS avg_tenure_years,\n    MAX(IF(item = 'cash_dividends_paid', value, NULL)) AS cash_dividends_paid\n  FROM `stock-analyzer-edinet.edinet.financial_items`\n  WHERE item IN (\n    'gross_profit', 'sga', 'rnd_expenses', 'cost_of_sales', 'goodwill', 'inventories',\n    'trade_receivables', 'total_liabilities', 'net_assets', 'shareholders_equity', 'eps', 'bps',\n    'dividend_per_share', 'payout_ratio', 'per', 'pbr', 'num_employees', 'female_manager_ratio',\n    'avg_tenure_years', 'cash_dividends_paid')\n  GROUP BY edinet_code, fiscal_year\n),\nbase AS (\n  SELECT\n    f.edinet_code,\n    f.fiscal_year,\n    f.fiscal_year_end,\n    f.net_sales,\n    f.operating_income,\n    f.ordinary_income,\n    f.net_income,\n    f.total_assets,\n    f.equity,\n    f.interest_bearing_debt,\n    f.cash_and_equiv,\n    f.operating_cf,\n    f.investing_cf,\n    f.free_cf,\n    f.employee_count,\n    f.avg_annual_salary,\n    f.capex,\n    f.depreciation,\n    f.roe,\n    f.roa,\n    f.operating_margin\n  FROM `stock-analyzer-edinet.edinet.financials` AS f\n)\nSELECT\n  b.edinet_code,\n  b.fiscal_year,\n  b.fiscal_year_end,\n  m.name,\n  SUBSTR(m.sec_code, 1, 4) AS sec_code4,\n  m.industry,\n  b.net_sales,\n  b.operating_income,\n  b.ordinary_income,\n  b.net_income,\n  b.total_assets,\n  b.equity,\n  b.interest_bearing_debt,\n  b.cash_and_equiv,\n  b.operating_cf,\n  b.investing_cf,\n  b.free_cf,\n  b.employee_count,\n  b.avg_annual_salary,\n  b.capex,\n  b.depreciation,\n  b.roe,\n  b.roa,\n  b.operating_margin,\n  i.gross_profit,\n  i.sga,\n  i.rnd_expenses,\n  i.cost_of_sales,\n  i.goodwill,\n  i.inventories,\n  i.trade_receivables,\n  i.total_liabilities,\n  i.net_assets,\n  i.shareholders_equity,\n  i.eps,\n  i.bps,\n  i.dividend_per_share,\n  i.payout_ratio,\n  i.per,\n  i.pbr,\n  i.num_employees,\n  i.female_manager_ratio,\n  i.avg_tenure_years,\n  i.cash_dividends_paid,\n  i.gross_profit / NULLIF(b.net_sales, 0) AS gross_margin,\n  i.sga / NULLIF(b.net_sales, 0) AS sga_ratio,\n  i.rnd_expenses / NULLIF(b.net_sales, 0) AS rnd_ratio,\n  b.equity / NULLIF(b.total_assets, 0) AS equity_ratio,\n  b.net_income / NULLIF(b.net_sales, 0) AS net_margin\nFROM base AS b\nLEFT JOIN items AS i\n  ON i.edinet_code = b.edinet_code AND i.fiscal_year = b.fiscal_year\nLEFT JOIN `stock-analyzer-edinet.edinet.company` AS m\n  ON m.edinet_code = b.edinet_code\n", "desc": "年次財務。1社1年度1行（fiscal_year＝決算期末の年）", "columns": [{"name": "edinet_code", "type": "string", "label": "EDINETコード"}, {"name": "fiscal_year", "type": "int64", "label": "年度"}, {"name": "fiscal_year_end", "type": "date", "label": "決算期末"}, {"name": "name", "type": "string", "label": "社名"}, {"name": "sec_code4", "type": "string", "label": "証券コード"}, {"name": "industry", "type": "string", "label": "業種"}, {"name": "net_sales", "type": "double", "label": "売上高"}, {"name": "operating_income", "type": "double", "label": "営業利益"}, {"name": "ordinary_income", "type": "double", "label": "経常利益"}, {"name": "net_income", "type": "double", "label": "純利益"}, {"name": "total_assets", "type": "double", "label": "総資産"}, {"name": "equity", "type": "double", "label": "自己資本"}, {"name": "interest_bearing_debt", "type": "double", "label": "有利子負債"}, {"name": "cash_and_equiv", "type": "double", "label": "現金同等物"}, {"name": "operating_cf", "type": "double", "label": "営業CF"}, {"name": "investing_cf", "type": "double", "label": "投資CF"}, {"name": "free_cf", "type": "double", "label": "フリーCF"}, {"name": "employee_count", "type": "int64", "label": "従業員数"}, {"name": "avg_annual_salary", "type": "double", "label": "平均年収"}, {"name": "capex", "type": "double", "label": "設備投資"}, {"name": "depreciation", "type": "double", "label": "減価償却費"}, {"name": "roe", "type": "double", "label": "ROE"}, {"name": "roa", "type": "double", "label": "ROA"}, {"name": "operating_margin", "type": "double", "label": "営業利益率"}, {"name": "gross_profit", "type": "double", "label": "売上総利益"}, {"name": "sga", "type": "double", "label": "販管費"}, {"name": "rnd_expenses", "type": "double", "label": "研究開発費"}, {"name": "cost_of_sales", "type": "double", "label": "売上原価"}, {"name": "goodwill", "type": "double", "label": "のれん"}, {"name": "inventories", "type": "double", "label": "棚卸資産"}, {"name": "trade_receivables", "type": "double", "label": "売上債権"}, {"name": "total_liabilities", "type": "double", "label": "負債合計"}, {"name": "net_assets", "type": "double", "label": "純資産"}, {"name": "shareholders_equity", "type": "double", "label": "株主資本"}, {"name": "eps", "type": "double", "label": "EPS"}, {"name": "bps", "type": "double", "label": "BPS"}, {"name": "dividend_per_share", "type": "double", "label": "1株配当"}, {"name": "payout_ratio", "type": "double", "label": "配当性向"}, {"name": "per", "type": "double", "label": "PER"}, {"name": "pbr", "type": "double", "label": "PBR"}, {"name": "num_employees", "type": "double", "label": "従業員数（細目）"}, {"name": "female_manager_ratio", "type": "double", "label": "女性管理職比率"}, {"name": "avg_tenure_years", "type": "double", "label": "平均勤続年数"}, {"name": "cash_dividends_paid", "type": "double", "label": "支払配当金"}, {"name": "gross_margin", "type": "double", "label": "粗利率"}, {"name": "sga_ratio", "type": "double", "label": "販管費率"}, {"name": "rnd_ratio", "type": "double", "label": "研究開発費率"}, {"name": "equity_ratio", "type": "double", "label": "自己資本比率"}, {"name": "net_margin", "type": "double", "label": "純利益率"}], "table": "stock-analyzer-edinet.bi.m_fin_annual"}, "m_macro_indicators": {"sql": "-- m_macro_indicators: マクロ指標の日次。1日×出どころ×指標1行（キー report_date, source, indicator）。\n-- 元は analytics.macro_indicators_daily。source＝macro_report（ドル円・米10年債・WTI・金・VIX・S&P500・日経平均）／\n-- bond_commodity（米国債の年限別利回り％と1か月差）。2026-10-11 より前の macro_report は有効3桁に丸めた値（日経 6.91e+04 など）。\nWITH r AS (\n  SELECT * FROM `stock-analyzer-edinet.analytics.macro_indicators_daily`\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY report_date, source, indicator ORDER BY fetched_at DESC) = 1\n)\nSELECT\n  report_date,\n  source,\n  indicator,\n  value,\n  change_1m,\n  value - LAG(value) OVER (PARTITION BY source, indicator ORDER BY report_date) AS change_1d\nFROM r\n", "desc": "マクロ指標（ドル円・米10年債・原油・金・VIX・S&P500・日経平均）と米国債の年限別利回りの日次", "columns": [], "table": ""}, "m_macro_signals": {"sql": "-- m_macro_signals: マクロシグナル×業種の判定。1日×シグナル×業種1行（キー report_date, signal, sector_name）。\n-- 元は analytics.macro_signals_daily（macro_report の「アクティブなマクロシグナル」節）。judgement＝tailwind（追い風）／headwind（逆風）／watch（注意）。\nWITH r AS (\n  SELECT * FROM `stock-analyzer-edinet.analytics.macro_signals_daily`\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY report_date, signal, sector_name ORDER BY fetched_at DESC) = 1\n)\nSELECT\n  report_date,\n  signal,\n  trigger_value,\n  sector_name,\n  judgement,\n  CASE judgement WHEN 'tailwind' THEN '追い風' WHEN 'headwind' THEN '逆風' WHEN 'watch' THEN '注意' END AS judgement_ja,\n  reason\nFROM r\n", "desc": "マクロシグナル（金利上昇・円安など）×業種の追い風／逆風／注意の日次", "columns": [], "table": ""}, "m_market_breadth": {"sql": "-- m_market_breadth: 市場×営業日（キー market, trade_date）。market は 'JP'（.T）と 'US'（英字ティッカー。先物・指数は除く）。約2市場×約240営業日＝約500行。\n-- 元は analytics.price_daily_latest の直近約400日だけ。全上場の日次終値から、その日の騰落の広がりを数える。\n-- 日々の前日比が 0.6倍未満／1.7倍超の日（分割の調整漏れ・異常値）があれば、その日以降の価格だけ使う（m_screener と同じ規則）。\n-- n_stocks＝その日に前日比が付いた銘柄数。is_complete＝n_stocks が直近21営業日の最大の9割以上（株価の取り込みが途中の日は FALSE。その日の比率・新高値数は母数が欠けるので、テンプレは is_complete の日だけ使う）。n_up／n_down／n_flat＝上がった／下がった／変わらず。\n-- ad_ratio_25d＝騰落レシオ（直近25営業日のうち is_complete の日の上昇銘柄数の合計 ÷ 下落銘柄数の合計 × 100。そろった日が20日以上あるときだけ）。120以上が過熱、70以下が売られすぎの目安。\n-- n_new_high／n_new_low＝終値が直前252営業日の終値の最高値を上回った／最安値を下回った銘柄数（直前の履歴が120営業日以上ある銘柄だけ。履歴が約1年しか無いため、\n--   取得期間の序盤は母数 n_hl_base が少なく0に近い。比較するときは n_hl_base を見る）。\n-- pct_above_ma50／pct_above_ma200＝終値が50／200営業日移動平均（当日を含む）より上の銘柄の比率（その日数ぶんの履歴がある銘柄だけが母数 n_ma50／n_ma200。\n--   200日は取得開始から約200営業日後（2026年7月ごろ）から出る）。\n-- ret_ew＝全銘柄の日次騰落率の単純平均、idx_ew＝それを掛け合わせた等加重指数（is_complete でない日は動かさない。取得期間の頭の前営業日＝100）。turnover＝終値×出来高の合計（現地通貨）。\nWITH px_raw AS (\n  SELECT ticker, trade_date, close, volume,\n         LAG(close) OVER (PARTITION BY ticker ORDER BY trade_date) AS prev_close\n  FROM `stock-analyzer-edinet.analytics.price_daily_latest`\n  WHERE trade_date >= DATE_SUB(CURRENT_DATE('Asia/Tokyo'), INTERVAL 400 DAY)\n    AND close > 0 AND close < 10000000\n    AND (ticker LIKE '%.T' OR REGEXP_CONTAINS(ticker, r'^[A-Z][A-Z.\\-]*$'))\n),\npx_brk AS (\n  SELECT *,\n         MAX(IF(prev_close > 0 AND (close / prev_close < 0.6 OR close / prev_close > 1.7), trade_date, NULL)) OVER (PARTITION BY ticker) AS break_date\n  FROM px_raw\n),\npx AS (\n  SELECT ticker, trade_date, close, volume, prev_close FROM px_brk WHERE break_date IS NULL OR trade_date >= break_date\n),\nd AS (\n  SELECT IF(ticker LIKE '%.T', 'JP', 'US') AS market, ticker, trade_date, close, volume, prev_close,\n    MAX(close) OVER (PARTITION BY ticker ORDER BY trade_date ROWS BETWEEN 252 PRECEDING AND 1 PRECEDING) AS hi_prev,\n    MIN(close) OVER (PARTITION BY ticker ORDER BY trade_date ROWS BETWEEN 252 PRECEDING AND 1 PRECEDING) AS lo_prev,\n    COUNT(close) OVER (PARTITION BY ticker ORDER BY trade_date ROWS BETWEEN 252 PRECEDING AND 1 PRECEDING) AS n_prev,\n    AVG(close) OVER (PARTITION BY ticker ORDER BY trade_date ROWS BETWEEN 49 PRECEDING AND CURRENT ROW) AS ma50,\n    COUNT(close) OVER (PARTITION BY ticker ORDER BY trade_date ROWS BETWEEN 49 PRECEDING AND CURRENT ROW) AS c50,\n    AVG(close) OVER (PARTITION BY ticker ORDER BY trade_date ROWS BETWEEN 199 PRECEDING AND CURRENT ROW) AS ma200,\n    COUNT(close) OVER (PARTITION BY ticker ORDER BY trade_date ROWS BETWEEN 199 PRECEDING AND CURRENT ROW) AS c200\n  FROM px\n),\na AS (\n  SELECT market, trade_date,\n    COUNT(*) AS n_stocks,\n    COUNTIF(close > prev_close) AS n_up,\n    COUNTIF(close < prev_close) AS n_down,\n    COUNTIF(close = prev_close) AS n_flat,\n    COUNTIF(n_prev >= 120) AS n_hl_base,\n    COUNTIF(n_prev >= 120 AND close > hi_prev) AS n_new_high,\n    COUNTIF(n_prev >= 120 AND close < lo_prev) AS n_new_low,\n    COUNTIF(c50 = 50) AS n_ma50,\n    COUNTIF(c50 = 50 AND close > ma50) AS n_above_ma50,\n    COUNTIF(c200 = 200) AS n_ma200,\n    COUNTIF(c200 = 200 AND close > ma200) AS n_above_ma200,\n    AVG(close / prev_close - 1) AS ret_ew,\n    SUM(close * volume) AS turnover\n  FROM d\n  WHERE prev_close > 0\n  GROUP BY market, trade_date\n),\nc AS (\n  SELECT *,\n    n_stocks >= 0.9 * MAX(n_stocks) OVER (PARTITION BY market ORDER BY trade_date ROWS BETWEEN 20 PRECEDING AND CURRENT ROW) AS is_complete\n  FROM a\n),\nb AS (\n  SELECT *,\n    SUM(IF(is_complete, n_up, 0)) OVER w25 AS up25,\n    SUM(IF(is_complete, n_down, 0)) OVER w25 AS down25,\n    COUNTIF(is_complete) OVER w25 AS days25,\n    100 * EXP(SUM(IF(is_complete, LN(1 + ret_ew), 0)) OVER (PARTITION BY market ORDER BY trade_date)) AS idx_ew\n  FROM c\n  WINDOW w25 AS (PARTITION BY market ORDER BY trade_date ROWS BETWEEN 24 PRECEDING AND CURRENT ROW)\n)\nSELECT\n  market,\n  trade_date,\n  n_stocks,\n  is_complete,\n  n_up,\n  n_down,\n  n_flat,\n  ROUND(n_up / NULLIF(n_up + n_down, 0), 4) AS up_ratio,\n  IF(days25 >= 20, ROUND(up25 / NULLIF(down25, 0) * 100, 2), NULL) AS ad_ratio_25d,\n  n_hl_base,\n  n_new_high,\n  n_new_low,\n  n_ma50,\n  ROUND(n_above_ma50 / NULLIF(n_ma50, 0), 4) AS pct_above_ma50,\n  n_ma200,\n  ROUND(n_above_ma200 / NULLIF(n_ma200, 0), 4) AS pct_above_ma200,\n  ROUND(ret_ew, 5) AS ret_ew,\n  ROUND(idx_ew, 4) AS idx_ew,\n  ROUND(turnover, 0) AS turnover\nFROM b\n", "desc": "", "columns": [{"name": "market", "type": "string", "label": "市場"}, {"name": "trade_date", "type": "date", "label": ""}, {"name": "n_stocks", "type": "int64", "label": ""}, {"name": "is_complete", "type": "bool", "label": ""}, {"name": "n_up", "type": "int64", "label": ""}, {"name": "n_down", "type": "int64", "label": ""}, {"name": "n_flat", "type": "int64", "label": ""}, {"name": "up_ratio", "type": "double", "label": ""}, {"name": "ad_ratio_25d", "type": "double", "label": ""}, {"name": "n_hl_base", "type": "int64", "label": ""}, {"name": "n_new_high", "type": "int64", "label": ""}, {"name": "n_new_low", "type": "int64", "label": ""}, {"name": "n_ma50", "type": "int64", "label": ""}, {"name": "pct_above_ma50", "type": "double", "label": ""}, {"name": "n_ma200", "type": "int64", "label": ""}, {"name": "pct_above_ma200", "type": "double", "label": ""}, {"name": "ret_ew", "type": "double", "label": ""}, {"name": "idx_ew", "type": "double", "label": ""}, {"name": "turnover", "type": "double", "label": ""}], "table": "stock-analyzer-edinet.bi.m_market_breadth"}, "m_price_monthly": {"sql": "-- m_price_monthly: 銘柄×月（キー ticker, month）。日本株（.T）と米国株（英字ティッカー）の全上場について、月末終値・騰落率・月間売買代金・月中の高安を持つ。\n-- 日次の全件ではなく月に畳むので行数が小さい（約1.2万銘柄×最大14か月）。元は analytics.price_daily_latest の直近約400日だけ（日次パーティションで読み取りを絞る）。\n-- market は 'JP'/'US'（ティッカーが .T で終わるか、英字・ピリオド・ハイフンだけ。先物 CC=F や指数 ^ は除く）。市場区分（プライム等）は元表に無いので持たない。\n-- 通貨は日本株が円、米国株が米ドル（turnover・close とも現地通貨）。終値は分割調整済み・配当未調整。\n-- 日々の前日比が 0.6倍未満／1.7倍超の日（分割の調整漏れ・異常値）があれば、その日以降の価格だけ使う（m_screener と同じ規則）。\n-- month は月初日。close は月内で最後の営業日の終値、month_end_date はその日。\n--   return_1m／3m／6m は「ちょうど1／3／6か月前の月」の月末終値との比（その月が無ければ NULL。欠けた月を跨がない）。\n--   is_partial は月がまだ終わっていない（当月）か、取得期間の頭で月の途中から始まる月。TRUE の月の騰落率・売買代金は他の月と比べない。\n--   turnover＝月内の 終値×出来高 の合計。turnover_ratio_3m＝その月の turnover ÷ 直前3か月の turnover の平均（3か月そろうときだけ。当月は日数が少ないので小さく出る）。\n--   month_high／month_low は日足の高値・安値（無ければ終値）。range_pct＝month_high÷month_low－1。\n-- 価格・騰落率は小数4桁、売買代金は整数に丸めて持つ（日々 parquet をコミットするので、有効桁を落としてファイルを小さくする）。\n-- name・industry は日本株が edinet.company、米国株は stock_snapshot の最新行（約400銘柄だけ。無ければ NULL）。\nWITH px_raw AS (\n  SELECT ticker, trade_date, high, low, close, volume,\n         LAG(close) OVER (PARTITION BY ticker ORDER BY trade_date) AS prev_close\n  FROM `stock-analyzer-edinet.analytics.price_daily_latest`\n  WHERE trade_date >= DATE_SUB(CURRENT_DATE('Asia/Tokyo'), INTERVAL 400 DAY)\n    AND close > 0 AND close < 10000000\n    AND (ticker LIKE '%.T' OR REGEXP_CONTAINS(ticker, r'^[A-Z][A-Z.\\-]*$'))\n),\npx_brk AS (\n  SELECT *,\n         MAX(IF(prev_close > 0 AND (close / prev_close < 0.6 OR close / prev_close > 1.7), trade_date, NULL)) OVER (PARTITION BY ticker) AS break_date\n  FROM px_raw\n),\npx AS (\n  SELECT * FROM px_brk WHERE break_date IS NULL OR trade_date >= break_date\n),\nmon AS (\n  SELECT ticker, DATE_TRUNC(trade_date, MONTH) AS month,\n         ARRAY_AGG(close ORDER BY trade_date DESC LIMIT 1)[OFFSET(0)] AS close,\n         MAX(trade_date) AS month_end_date,\n         COUNT(*) AS trading_days,\n         MAX(IF(high > 0, high, close)) AS month_high,\n         MIN(IF(low > 0, low, close)) AS month_low,\n         SUM(close * volume) AS turnover,\n         SUM(volume) AS volume_sum,\n         MIN(trade_date) AS first_date\n  FROM px\n  GROUP BY ticker, month\n),\nw AS (\n  SELECT *,\n    LAG(month, 1) OVER o AS m1, LAG(close, 1) OVER o AS c1,\n    LAG(month, 3) OVER o AS m3, LAG(close, 3) OVER o AS c3,\n    LAG(month, 6) OVER o AS m6, LAG(close, 6) OVER o AS c6,\n    AVG(turnover) OVER (PARTITION BY ticker ORDER BY month ROWS BETWEEN 3 PRECEDING AND 1 PRECEDING) AS t_avg3,\n    COUNT(turnover) OVER (PARTITION BY ticker ORDER BY month ROWS BETWEEN 3 PRECEDING AND 1 PRECEDING) AS t_n3,\n    MIN(first_date) OVER () AS data_start\n  FROM mon\n  WINDOW o AS (PARTITION BY ticker ORDER BY month)\n),\njp AS (\n  SELECT CONCAT(SUBSTR(sec_code, 1, 4), '.T') AS ticker, ANY_VALUE(name) AS name, ANY_VALUE(industry) AS industry\n  FROM `stock-analyzer-edinet.edinet.company`\n  WHERE sec_code IS NOT NULL AND COALESCE(is_delisted, FALSE) = FALSE\n  GROUP BY ticker\n),\nus AS (\n  SELECT ticker, name FROM `stock-analyzer-edinet.analytics.stock_snapshot`\n  WHERE market = 'US'\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY ticker ORDER BY snapshot_date DESC, ingested_at DESC) = 1\n)\nSELECT\n  w.ticker AS ticker,\n  IF(w.ticker LIKE '%.T', 'JP', 'US') AS market,\n  COALESCE(jp.name, us.name) AS name,\n  jp.industry AS industry,\n  w.month AS month,\n  w.month_end_date AS month_end_date,\n  w.trading_days AS trading_days,\n  (w.month = DATE_TRUNC(CURRENT_DATE('Asia/Tokyo'), MONTH) OR w.month < DATE_TRUNC(w.data_start, MONTH) OR (w.month = DATE_TRUNC(w.data_start, MONTH) AND EXTRACT(DAY FROM w.data_start) > 5)) AS is_partial,\n  ROUND(w.close, 4) AS close,\n  ROUND(w.c1, 4) AS prev_month_close,\n  IF(w.m1 = DATE_SUB(w.month, INTERVAL 1 MONTH), ROUND(w.close / w.c1 - 1, 4), NULL) AS return_1m,\n  IF(w.m3 = DATE_SUB(w.month, INTERVAL 3 MONTH), ROUND(w.close / w.c3 - 1, 4), NULL) AS return_3m,\n  IF(w.m6 = DATE_SUB(w.month, INTERVAL 6 MONTH), ROUND(w.close / w.c6 - 1, 4), NULL) AS return_6m,\n  ROUND(w.month_high, 4) AS month_high,\n  ROUND(w.month_low, 4) AS month_low,\n  ROUND(w.month_high / NULLIF(w.month_low, 0) - 1, 4) AS range_pct,\n  ROUND(w.turnover, 0) AS turnover,\n  w.volume_sum AS volume,\n  IF(w.t_n3 = 3 AND w.m3 = DATE_SUB(w.month, INTERVAL 3 MONTH), ROUND(w.turnover / NULLIF(w.t_avg3, 0), 2), NULL) AS turnover_ratio_3m\nFROM w\nLEFT JOIN jp ON jp.ticker = w.ticker\nLEFT JOIN us ON us.ticker = w.ticker\n", "desc": "", "columns": [{"name": "ticker", "type": "string", "label": "ティッカー"}, {"name": "market", "type": "string", "label": "市場"}, {"name": "name", "type": "string", "label": "社名"}, {"name": "industry", "type": "string", "label": "業種"}, {"name": "month", "type": "date", "label": ""}, {"name": "month_end_date", "type": "date", "label": ""}, {"name": "trading_days", "type": "int64", "label": ""}, {"name": "is_partial", "type": "bool", "label": ""}, {"name": "close", "type": "double", "label": ""}, {"name": "prev_month_close", "type": "double", "label": ""}, {"name": "return_1m", "type": "double", "label": "騰落率1か月"}, {"name": "return_3m", "type": "double", "label": "騰落率3か月"}, {"name": "return_6m", "type": "double", "label": ""}, {"name": "month_high", "type": "double", "label": ""}, {"name": "month_low", "type": "double", "label": ""}, {"name": "range_pct", "type": "double", "label": ""}, {"name": "turnover", "type": "double", "label": ""}, {"name": "volume", "type": "double", "label": ""}, {"name": "turnover_ratio_3m", "type": "double", "label": ""}], "table": "stock-analyzer-edinet.bi.m_price_monthly"}, "m_re_area": {"sql": "-- m_re_area: 1市区町村1行（キー municipality_code＝5桁）。real_estate.area_profile_p1 の実測（2026-10）で\n-- latest_land_price・land_price_yoy・total_transactions は全行 NULL のため持たない（入るようになったら足す）。\n-- 単位：地価は円/m2、land_price_yoy_change は％（5.2＝+5.2%）、flood_risk_area_pct は割合（0.3＝30%）。\n-- 取り込みの再実行で同じ市区町村が重複しても updated_at が新しい1行に絞る。\nWITH a AS (\n  SELECT\n    municipality_code,\n    prefecture_name,\n    municipality_name,\n    median_price,\n    avg_land_price_commercial,\n    avg_land_price_residential,\n    land_price_yoy_change,\n    flood_risk_area_pct,\n    latest_avg_price_condo,\n    hospital_count,\n    ROW_NUMBER() OVER (PARTITION BY municipality_code ORDER BY updated_at DESC) AS rn\n  FROM `stock-analyzer-edinet.real_estate.area_profile_p1`\n)\nSELECT\n  a.municipality_code,\n  a.prefecture_name,\n  a.municipality_name,\n  a.median_price,\n  a.avg_land_price_commercial,\n  a.avg_land_price_residential,\n  a.land_price_yoy_change,\n  a.flood_risk_area_pct,\n  a.latest_avg_price_condo,\n  a.hospital_count\nFROM a\nWHERE a.rn = 1\n", "desc": "市区町村の地価・取引・災害リスク。1市区町村1行", "columns": [{"name": "municipality_code", "type": "string", "label": "市区町村コード"}, {"name": "prefecture_name", "type": "string", "label": "都道府県"}, {"name": "municipality_name", "type": "string", "label": "市区町村"}, {"name": "median_price", "type": "double", "label": "取引価格の中央値"}, {"name": "avg_land_price_commercial", "type": "double", "label": "商業地の平均地価"}, {"name": "avg_land_price_residential", "type": "double", "label": "住宅地の平均地価"}, {"name": "land_price_yoy_change", "type": "double", "label": "地価の前年比(%)"}, {"name": "flood_risk_area_pct", "type": "double", "label": "洪水リスク地域率"}, {"name": "latest_avg_price_condo", "type": "double", "label": "マンション平均価格"}, {"name": "hospital_count", "type": "int64", "label": "病院数"}], "table": "stock-analyzer-edinet.bi.m_re_area"}, "m_re_holdings": {"sql": "-- m_re_holdings: 1社×1市区町村×1年度につき1行（キー edinet_code, fiscal_year, municipality_code）。\n-- 元の corporate_holdings_p1 は施設単位で 14.9 万行あり、parquet が大きくなるため市区町村単位に集約する\n-- （施設名は持たない。同じ市区町村の複数施設は合算し facility_count に数を入れる）。\n-- 単位：簿価は百万円、面積は m2、地価は円/m2、population_change_pct は％（2050年までの増減）、\n--       flood_risk_area_pct・landslide_risk_area_pct は割合（0.3＝30%）。\n-- 時価の目安：土地面積 × 参照地価（工業地→商業地→住宅地の順で最初にある値）。\n--   land_value_est_m_yen は面積と参照地価がある施設の合計、\n--   unrealized_gain_est_m_yen は上に加えて土地簿価がある施設だけの（時価目安 − 簿価）の合計。\n--   本社欄に会社全体の面積が入っている施設（出光興産の本社欄 569万m2 を千代田区の地価で評価すると 22兆円になる等）が実在するため、\n--   土地簿価がある施設で時価の目安が簿価の20倍を超えるものは紐づけ違いの疑いとして時価・含み益から除き、\n--   その施設数を est_excluded_count に持つ（簿価が無い施設は検証できないので除かない）。あくまで概算で、投資判断の根拠にしない。\n-- 市区町村名と地価の上昇率は area_profile_p1 から付ける。\nWITH h AS (\n  SELECT\n    edinet_code,\n    fiscal_year,\n    prefecture,\n    municipality_code,\n    book_value_land_m_yen,\n    book_value_buildings_m_yen,\n    land_area_m2,\n    COALESCE(industrial_land_price_per_m2, commercial_land_price_per_m2, residential_land_price_per_m2) AS ref_price,\n    population_current,\n    population_2050,\n    population_change_pct,\n    flood_risk_area_pct,\n    landslide_risk_area_pct\n  FROM `stock-analyzer-edinet.real_estate.corporate_holdings_p1`\n),\nh1 AS (\n  SELECT\n    h.*,\n    IF(h.land_area_m2 > 0 AND h.ref_price IS NOT NULL, h.land_area_m2 * h.ref_price / 1000000, NULL) AS est_raw\n  FROM h\n),\nh2 AS (\n  SELECT\n    h1.*,\n    IF(COALESCE(h1.book_value_land_m_yen, 0) > 0 AND h1.est_raw > 20 * h1.book_value_land_m_yen, NULL, h1.est_raw) AS est_m_yen,\n    IF(COALESCE(h1.book_value_land_m_yen, 0) > 0 AND h1.est_raw > 20 * h1.book_value_land_m_yen, 1, 0) AS excl\n  FROM h1\n),\nagg AS (\n  SELECT\n    edinet_code,\n    fiscal_year,\n    municipality_code,\n    MAX(prefecture) AS prefecture,\n    COUNT(*) AS facility_count,\n    SUM(land_area_m2) AS land_area_m2,\n    SUM(book_value_land_m_yen) AS book_value_land_m_yen,\n    SUM(book_value_buildings_m_yen) AS book_value_buildings_m_yen,\n    SUM(est_m_yen) AS land_value_est_m_yen,\n    SUM(excl) AS est_excluded_count,\n    SUM(IF(book_value_land_m_yen > 0 AND est_m_yen IS NOT NULL, est_m_yen - book_value_land_m_yen, NULL)) AS unrealized_gain_est_m_yen,\n    AVG(ref_price) AS land_price_ref_per_m2,\n    MAX(population_current) AS population_current,\n    MAX(population_2050) AS population_2050,\n    AVG(population_change_pct) AS population_change_pct,\n    AVG(flood_risk_area_pct) AS flood_risk_area_pct,\n    AVG(landslide_risk_area_pct) AS landslide_risk_area_pct\n  FROM h2\n  GROUP BY edinet_code, fiscal_year, municipality_code\n)\nSELECT\n  g.edinet_code,\n  c.name,\n  SUBSTR(c.sec_code, 1, 4) AS sec_code4,\n  c.industry,\n  g.fiscal_year,\n  g.prefecture,\n  g.municipality_code,\n  a.municipality_name,\n  g.facility_count,\n  g.land_area_m2,\n  g.book_value_land_m_yen,\n  g.book_value_buildings_m_yen,\n  g.land_price_ref_per_m2,\n  g.land_value_est_m_yen,\n  g.est_excluded_count,\n  g.unrealized_gain_est_m_yen,\n  g.population_current,\n  g.population_2050,\n  g.population_change_pct,\n  g.flood_risk_area_pct,\n  g.landslide_risk_area_pct,\n  a.land_price_yoy_change AS area_land_price_yoy_change\nFROM agg AS g\nLEFT JOIN `stock-analyzer-edinet.edinet.company` AS c\n  ON c.edinet_code = g.edinet_code\nLEFT JOIN (\n  SELECT municipality_code, municipality_name, land_price_yoy_change,\n         ROW_NUMBER() OVER (PARTITION BY municipality_code ORDER BY updated_at DESC) AS rn\n  FROM `stock-analyzer-edinet.real_estate.area_profile_p1`\n) AS a\n  ON a.municipality_code = g.municipality_code AND a.rn = 1\n", "desc": "企業の保有不動産。1社×市区町村×年度1行（時価の目安・含み益の目安は概算）", "columns": [{"name": "edinet_code", "type": "string", "label": "EDINETコード"}, {"name": "name", "type": "string", "label": "社名"}, {"name": "sec_code4", "type": "string", "label": "証券コード"}, {"name": "industry", "type": "string", "label": "業種"}, {"name": "fiscal_year", "type": "int64", "label": "年度"}, {"name": "prefecture", "type": "string", "label": "都道府県"}, {"name": "municipality_code", "type": "string", "label": "市区町村コード"}, {"name": "municipality_name", "type": "string", "label": "市区町村"}, {"name": "facility_count", "type": "int64", "label": "施設数"}, {"name": "land_area_m2", "type": "double", "label": "土地面積(m2)"}, {"name": "book_value_land_m_yen", "type": "double", "label": "土地簿価(百万円)"}, {"name": "book_value_buildings_m_yen", "type": "double", "label": "建物簿価(百万円)"}, {"name": "land_price_ref_per_m2", "type": "double", "label": "参照地価(円/m2)"}, {"name": "land_value_est_m_yen", "type": "double", "label": "土地時価の目安(百万円)"}, {"name": "est_excluded_count", "type": "int64", "label": "時価目安から除外した施設数"}, {"name": "unrealized_gain_est_m_yen", "type": "double", "label": "含み益の目安(百万円)"}, {"name": "population_current", "type": "int64", "label": "現在人口"}, {"name": "population_2050", "type": "int64", "label": "2050年人口"}, {"name": "population_change_pct", "type": "double", "label": "人口増減(%)"}, {"name": "flood_risk_area_pct", "type": "double", "label": "洪水リスク地域率"}, {"name": "landslide_risk_area_pct", "type": "double", "label": "土砂災害リスク地域率"}, {"name": "area_land_price_yoy_change", "type": "double", "label": "地域の地価前年比(%)"}], "table": "stock-analyzer-edinet.bi.m_re_holdings"}, "m_re_holdings_pref": {"sql": "-- m_re_holdings_pref: 1社×1都道府県×1年度につき1行（キー edinet_code, fiscal_year, prefecture）。\n-- m_re_holdings をさらに都道府県で畳んだ集約マート（都道府県別・会社別の見通しを軽くするため）。\n-- 単位・時価の目安の定義（簿価20倍超の除外を含む）は m_re_holdings と同じ（百万円・m2・円/m2。概算）。\n-- population_change_pct は施設数で重み付けせず、市区町村値の単純平均（地域の傾向を見る目安）。\nWITH h AS (\n  SELECT\n    edinet_code,\n    fiscal_year,\n    prefecture,\n    municipality_code,\n    book_value_land_m_yen,\n    land_area_m2,\n    COALESCE(industrial_land_price_per_m2, commercial_land_price_per_m2, residential_land_price_per_m2) AS ref_price,\n    population_change_pct,\n    flood_risk_area_pct\n  FROM `stock-analyzer-edinet.real_estate.corporate_holdings_p1`\n),\nh1 AS (\n  SELECT\n    h.*,\n    IF(h.land_area_m2 > 0 AND h.ref_price IS NOT NULL, h.land_area_m2 * h.ref_price / 1000000, NULL) AS est_raw\n  FROM h\n),\nh2 AS (\n  SELECT\n    h1.*,\n    IF(COALESCE(h1.book_value_land_m_yen, 0) > 0 AND h1.est_raw > 20 * h1.book_value_land_m_yen, NULL, h1.est_raw) AS est_m_yen,\n    IF(COALESCE(h1.book_value_land_m_yen, 0) > 0 AND h1.est_raw > 20 * h1.book_value_land_m_yen, 1, 0) AS excl\n  FROM h1\n),\nagg AS (\n  SELECT\n    edinet_code,\n    fiscal_year,\n    prefecture,\n    COUNT(*) AS facility_count,\n    COUNT(DISTINCT municipality_code) AS municipality_count,\n    SUM(land_area_m2) AS land_area_m2,\n    SUM(book_value_land_m_yen) AS book_value_land_m_yen,\n    SUM(est_m_yen) AS land_value_est_m_yen,\n    SUM(excl) AS est_excluded_count,\n    SUM(IF(book_value_land_m_yen > 0 AND est_m_yen IS NOT NULL, est_m_yen - book_value_land_m_yen, NULL)) AS unrealized_gain_est_m_yen,\n    AVG(population_change_pct) AS population_change_pct,\n    AVG(flood_risk_area_pct) AS flood_risk_area_pct\n  FROM h2\n  WHERE prefecture IS NOT NULL\n  GROUP BY edinet_code, fiscal_year, prefecture\n)\nSELECT\n  g.edinet_code,\n  c.name,\n  SUBSTR(c.sec_code, 1, 4) AS sec_code4,\n  c.industry,\n  g.fiscal_year,\n  g.prefecture,\n  g.facility_count,\n  g.municipality_count,\n  g.land_area_m2,\n  g.book_value_land_m_yen,\n  g.land_value_est_m_yen,\n  g.est_excluded_count,\n  g.unrealized_gain_est_m_yen,\n  g.population_change_pct,\n  g.flood_risk_area_pct\nFROM agg AS g\nLEFT JOIN `stock-analyzer-edinet.edinet.company` AS c\n  ON c.edinet_code = g.edinet_code\n", "desc": "企業の保有不動産の都道府県別集約。1社×都道府県×年度1行", "columns": [{"name": "edinet_code", "type": "string", "label": "EDINETコード"}, {"name": "name", "type": "string", "label": "社名"}, {"name": "sec_code4", "type": "string", "label": "証券コード"}, {"name": "industry", "type": "string", "label": "業種"}, {"name": "fiscal_year", "type": "int64", "label": "年度"}, {"name": "prefecture", "type": "string", "label": "都道府県"}, {"name": "facility_count", "type": "int64", "label": "施設数"}, {"name": "municipality_count", "type": "int64", "label": "市区町村数"}, {"name": "land_area_m2", "type": "double", "label": "土地面積(m2)"}, {"name": "book_value_land_m_yen", "type": "double", "label": "土地簿価(百万円)"}, {"name": "land_value_est_m_yen", "type": "double", "label": "土地時価の目安(百万円)"}, {"name": "est_excluded_count", "type": "int64", "label": "時価目安から除外した施設数"}, {"name": "unrealized_gain_est_m_yen", "type": "double", "label": "含み益の目安(百万円)"}, {"name": "population_change_pct", "type": "double", "label": "人口増減(%)"}, {"name": "flood_risk_area_pct", "type": "double", "label": "洪水リスク地域率"}], "table": "stock-analyzer-edinet.bi.m_re_holdings_pref"}, "m_reports": {"sql": "-- m_reports: マクロ・業種の md レポート。1日×種類×キー1行（キー report_date, report_type, report_key）。直近31日分・本文は先頭3,000字。\n-- 元は analytics.report_texts（全期間・全文）。board の parquet は毎日コミットされるので、肥大しないよう期間と字数を絞る。\n-- 全文・全期間は BigQuery の analytics.report_texts を直接引く（分析室の「Claudeに聞く」や SQL 欄から）。\n-- report_type: sector（日本の業種・report_key＝業種コード）／macro_report／bond_commodity／daily_movers／anomaly／us_sector_report／monthly_trend／policy_changes\nWITH r AS (\n  SELECT * FROM `stock-analyzer-edinet.analytics.report_texts`\n  WHERE report_date >= DATE_SUB(CURRENT_DATE('Asia/Tokyo'), INTERVAL 31 DAY)\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY report_date, report_type, report_key ORDER BY fetched_at DESC) = 1\n)\nSELECT\n  report_date,\n  report_type,\n  report_key,\n  title,\n  SUBSTR(body_md, 1, 3000) AS body_head,\n  chars,\n  source_path\nFROM r\n", "desc": "マクロ・業種の md レポート（直近31日・本文は先頭3,000字）。全期間・全文は analytics.report_texts", "columns": [], "table": ""}, "m_screener": {"sql": "-- m_screener: 1社1行（キー edinet_code）。会社ごとに「売上がある最新年度」の財務と、株価系指標を横に並べたスクリーナー用の表（日本株・円）。\n-- 金額は円、比率は小数（0.12＝12%）。market_cap は円。market_cap_b は「億円（1e8円）」（列名の b は十億ではない。トヨタ 7203 で約34.5兆円＝344,775）。\n-- 株価系（current_price・price_date・market_cap・per・pbr・dividend_yield・net_cash_to_mcap）・騰落率・52週高安・平均売買代金は、\n-- analytics.price_daily_latest（ticker×営業日で重複除去したビュー）の直近約400日から全上場について作る（price_source は株価があれば 'price_daily'、無ければ NULL）。\n-- 終値は分割調整済み・配当未調整。EPS・BPS・1株配当・株数は決算期末の値で、期末後に株式分割があると終値と単位がずれる。\n-- 細目の adjusted_eps / adjusted_bps / adjusted_dividend_per_share（分割調整後）があればそれを使い、\n-- 調整前EPS÷調整後EPS を分割倍率として株数にも掛ける（東京海上 8766 は期末後の分割で EPS が15倍に見えていた）。\n-- stock_snapshot はスコア（composite_score 等）とテクニカル（rsi14・above_ma200）にだけ使う。株価・時価総額・PER 等には使わない。\n-- 騰落率は営業日ベース（return_1m＝21営業日前・return_3m＝63営業日前・return_1y＝252営業日前の終値との比。足りなければ 360日前以前で最も新しい終値。それも無ければ NULL）。\n-- 52週高値・安値は終値ベースで直近252営業日、履歴が120営業日未満なら NULL。\n-- 最新日が全体の最新日から14日以内の株価だけ使う（上場廃止・取込停止の古い株価を最新として出さないため）。\n-- 成長率は「ちょうど1年前／3年前の年度」が財務表にあるときだけ計算し、無ければ NULL（年が欠けた期を跨がない）。\n-- 営業利益・純利益の成長率は前年値が正のときだけ計算する（赤字からの回復を％で表すと意味が逆転するため）。\n-- 有利子負債は financials の値を優先し、無ければ細目の合計（interest_bearing_debt_basis='reported'）、さらに無ければ\n-- 借入金・社債・CPの合計（'estimated'。リース負債は含まない概算）。\n-- 多面的な指標（式・単位・注意の正本は SPEC_bi_marts §11）:\n--   資本効率 roic（NOPAT÷(有利子負債＋純資産)の期末ベース。税率は effective_tax_rate が 5〜50% なら報告値、無ければ法定実効税率の近似 30.6%）・営業CF率・FCF率・粗利率の前年差、\n--   企業価値倍率 ev（時価総額＋有利子負債−現金）・ev_ebitda（EBITDA＝営業利益＋減価償却費）・ev_sales・psr・peg（PER÷純利益3年CAGR%）・fcf_yield・earnings_yield、\n--   資産の裏付け re_*（bi.m_re_holdings_pref の最新年度を会社で合計した土地の含み益目安。施設ごとの簿価20倍超除外はそちらで適用済み）・adj_pbr・asset_value_ratio、\n--   安全性と質 interest_coverage・current_ratio・goodwill_to_equity・accrual_ratio・f_score（ピオトロスキー。前年が取れる項目だけ）、\n--   還元 buyback_est（自己株式簿価の増加＋消却額。簿価は会社により負値（純資産の控除）で入るので絶対値で比べる。下限寄りの推定）・total_payout_yield・doe、成長の質 op_income_cagr_3y・net_income_cagr_3y・consec_up_years。\n-- 含み益が時価総額の3倍超の会社は re_gain_flag='gt_3x_mcap' とし、含み益を使う派生列（re_gain_to_mcap・re_land_value_to_mcap・adj_pbr・asset_value_ratio・re_gain_after_tax）を空にする（再取得・単位違いの疑い）。re_unrealized_gain は元の値のまま残す。\n-- bi.m_re_holdings_pref は bi_export が前回実体化した表を読む（数MB。マート名順で m_re_holdings_pref が先に作られるので通常は当日分）。\n-- PER・PBR・配当利回りが意味を持たない会社は valuation_flag で理由を示し、per・pbr・dividend_yield を NULL にする（規則は SPEC_bi_marts §11）。\nWITH items_raw AS (\n  SELECT edinet_code, fiscal_year,\n    MAX(IF(item = 'gross_profit', value, NULL)) AS gross_profit,\n    MAX(IF(item = 'rnd_expenses', value, NULL)) AS rnd_expenses,\n    MAX(IF(item = 'eps', value, NULL)) AS eps,\n    MAX(IF(item = 'adjusted_eps', value, NULL)) AS adjusted_eps,\n    MAX(IF(item = 'bps', value, NULL)) AS bps,\n    MAX(IF(item = 'adjusted_bps', value, NULL)) AS adjusted_bps,\n    MAX(IF(item = 'dividend_per_share', value, NULL)) AS dividend_per_share,\n    MAX(IF(item = 'adjusted_dividend_per_share', value, NULL)) AS adjusted_dividend_per_share,\n    MAX(IF(item = 'payout_ratio', value, NULL)) AS payout_ratio,\n    MAX(IF(item = 'num_employees', value, NULL)) AS num_employees,\n    MAX(IF(item = 'shares_issued', value, NULL)) AS shares_issued,\n    MAX(IF(item = 'treasury_end_period_holding_count', value, NULL)) AS treasury_shares,\n    MAX(IF(item = 'ibd_current', value, NULL)) AS ibd_current,\n    MAX(IF(item = 'ibd_noncurrent', value, NULL)) AS ibd_noncurrent,\n    MAX(IF(item = 'ibd_total_unsplit_ifrs', value, NULL)) AS ibd_total,\n    MAX(IF(item = 'short_term_loans', value, NULL)) AS short_term_loans,\n    MAX(IF(item = 'long_term_loans', value, NULL)) AS long_term_loans,\n    MAX(IF(item = 'current_portion_lt_loans', value, NULL)) AS current_portion_lt_loans,\n    MAX(IF(item = 'bonds_payable', value, NULL)) AS bonds_payable,\n    MAX(IF(item = 'current_portion_bonds_payable', value, NULL)) AS current_portion_bonds_payable,\n    MAX(IF(item = 'short_term_bonds_payable', value, NULL)) AS short_term_bonds_payable,\n    MAX(IF(item = 'commercial_papers', value, NULL)) AS commercial_papers,\n    MAX(IF(item = 'effective_tax_rate', value, NULL)) AS effective_tax_rate,\n    MAX(IF(item = 'interest_expenses', value, NULL)) AS interest_expenses,\n    MAX(IF(item = 'current_assets', value, NULL)) AS current_assets,\n    MAX(IF(item = 'current_liabilities', value, NULL)) AS current_liabilities,\n    MAX(IF(item = 'goodwill', value, NULL)) AS goodwill,\n    MAX(IF(item = 'cash_dividends_paid', value, NULL)) AS cash_dividends_paid,\n    MAX(IF(item = 'treasury_stock', value, NULL)) AS treasury_stock,\n    MAX(IF(item = 'treasury_cancelled_amount', value, NULL)) AS treasury_cancelled\n  FROM `stock-analyzer-edinet.edinet.financial_items`\n  WHERE item IN ('gross_profit', 'rnd_expenses', 'eps', 'adjusted_eps', 'bps', 'adjusted_bps', 'dividend_per_share',\n                 'adjusted_dividend_per_share', 'payout_ratio',\n                 'num_employees', 'shares_issued', 'treasury_end_period_holding_count', 'ibd_current', 'ibd_noncurrent',\n                 'ibd_total_unsplit_ifrs', 'short_term_loans', 'long_term_loans', 'current_portion_lt_loans', 'bonds_payable',\n                 'current_portion_bonds_payable', 'short_term_bonds_payable', 'commercial_papers',\n                 'effective_tax_rate', 'interest_expenses', 'current_assets', 'current_liabilities', 'goodwill',\n                 'cash_dividends_paid', 'treasury_stock', 'treasury_cancelled_amount')\n  GROUP BY edinet_code, fiscal_year\n),\nitems AS (\n  SELECT *,\n    IF(COALESCE(short_term_loans, long_term_loans, current_portion_lt_loans, bonds_payable, current_portion_bonds_payable, short_term_bonds_payable, commercial_papers) IS NULL, NULL,\n       COALESCE(short_term_loans, 0) + COALESCE(long_term_loans, 0) + COALESCE(current_portion_lt_loans, 0) + COALESCE(bonds_payable, 0) + COALESCE(current_portion_bonds_payable, 0) + COALESCE(short_term_bonds_payable, 0) + COALESCE(commercial_papers, 0)) AS loan_debt,\n    -- 期末後の株式分割・併合の倍率（調整前EPS÷調整後EPS。BPSで代用。差が1%以内なら分割なし）\n    COALESCE(\n      IF(eps IS NOT NULL AND adjusted_eps IS NOT NULL AND eps != 0 AND adjusted_eps != 0 AND eps / adjusted_eps > 0 AND ABS(eps / adjusted_eps - 1) > 0.01, eps / adjusted_eps, NULL),\n      IF(bps IS NOT NULL AND adjusted_bps IS NOT NULL AND bps != 0 AND adjusted_bps != 0 AND bps / adjusted_bps > 0 AND ABS(bps / adjusted_bps - 1) > 0.01, bps / adjusted_bps, NULL),\n      1.0) AS split_factor\n  FROM items_raw\n),\nfin AS (\n  SELECT edinet_code, fiscal_year, fiscal_year_end, net_sales, operating_income, ordinary_income, net_income,\n         total_assets, equity, interest_bearing_debt, cash_and_equiv, employee_count, avg_annual_salary, roe, roa, operating_margin,\n         operating_cf, capex, depreciation\n  FROM `stock-analyzer-edinet.edinet.financials`\n),\n-- 増収増益（売上・営業利益がともに前年超え。前年がちょうど1年前の年度にあるときだけ）が何期続いているか。途切れた期の翌期から数える\ngrow_flag AS (\n  SELECT edinet_code, fiscal_year,\n    COALESCE(fiscal_year - LAG(fiscal_year) OVER w = 1\n             AND net_sales > LAG(net_sales) OVER w\n             AND operating_income > LAG(operating_income) OVER w, FALSE) AS up\n  FROM fin\n  WINDOW w AS (PARTITION BY edinet_code ORDER BY fiscal_year)\n),\ngrow AS (\n  SELECT edinet_code, fiscal_year,\n    IF(up, fiscal_year - MAX(IF(NOT up, fiscal_year, NULL)) OVER (PARTITION BY edinet_code ORDER BY fiscal_year ROWS UNBOUNDED PRECEDING), 0) AS streak\n  FROM grow_flag\n),\n-- 土地の含み益目安は最新年度を会社で合計（円）。unrealized は土地簿価のある施設だけの（時価目安−簿価）なので、簿価の無い施設（不動産業の販売用不動産など）は入らない\nre AS (\n  SELECT edinet_code,\n    fiscal_year AS re_fiscal_year,\n    SUM(facility_count) AS re_facility_count,\n    SUM(est_excluded_count) AS re_est_excluded_count,\n    SUM(land_value_est_m_yen) * 1e6 AS re_land_value_est,\n    SUM(unrealized_gain_est_m_yen) * 1e6 AS re_gain_raw\n  FROM `stock-analyzer-edinet.bi.m_re_holdings_pref`\n  GROUP BY edinet_code, fiscal_year\n  QUALIFY fiscal_year = MAX(fiscal_year) OVER (PARTITION BY edinet_code)\n),\nlatest AS (\n  SELECT * FROM fin WHERE net_sales IS NOT NULL\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY edinet_code ORDER BY fiscal_year DESC) = 1\n),\nsnap AS (\n  SELECT * FROM (\n    SELECT ticker, snapshot_date, ingested_at, composite_score, value_score, quality_score,\n           MAX(snapshot_date) OVER () AS max_d\n    FROM `stock-analyzer-edinet.analytics.stock_snapshot`\n    WHERE market = 'JP'\n  )\n  WHERE snapshot_date >= DATE_SUB(max_d, INTERVAL 14 DAY)\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY ticker ORDER BY snapshot_date DESC, ingested_at DESC) = 1\n),\ntech AS (\n  SELECT * FROM (\n    SELECT ticker, snapshot_date, rsi14, above_ma200, MAX(snapshot_date) OVER () AS max_d\n    FROM `stock-analyzer-edinet.analytics.stock_snapshot`\n    WHERE market = 'JP' AND rsi14 IS NOT NULL\n  )\n  WHERE snapshot_date >= DATE_SUB(max_d, INTERVAL 14 DAY)\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY ticker ORDER BY snapshot_date DESC) = 1\n),\npx_raw AS (\n  SELECT ticker, trade_date, close, volume,\n         LAG(close) OVER (PARTITION BY ticker ORDER BY trade_date) AS prev_close\n  FROM `stock-analyzer-edinet.analytics.price_daily_latest`\n  WHERE trade_date >= DATE_SUB(CURRENT_DATE('Asia/Tokyo'), INTERVAL 400 DAY)\n    AND ticker LIKE '%.T' AND close > 0 AND close < 10000000\n),\npx_brk AS (\n  SELECT *,\n         MAX(IF(prev_close > 0 AND (close / prev_close < 0.6 OR close / prev_close > 1.7), trade_date, NULL)) OVER (PARTITION BY ticker) AS break_date\n  FROM px_raw\n),\npx_rows AS (\n  SELECT ticker, trade_date, close, volume, break_date,\n         ROW_NUMBER() OVER (PARTITION BY ticker ORDER BY trade_date DESC) AS rn,\n         MAX(trade_date) OVER (PARTITION BY ticker) AS tm,\n         MAX(trade_date) OVER () AS max_d\n  FROM px_brk\n  WHERE break_date IS NULL OR trade_date >= break_date\n),\npx AS (\n  SELECT ticker,\n    MAX(IF(rn = 1, trade_date, NULL)) AS price_date,\n    MAX(IF(rn = 1, close, NULL)) AS close,\n    MAX(IF(rn = 22, close, NULL)) AS c_1m,\n    MAX(IF(rn = 64, close, NULL)) AS c_3m,\n    COALESCE(MAX(IF(rn = 253, close, NULL)),\n             ARRAY_AGG(IF(trade_date <= DATE_SUB(tm, INTERVAL 360 DAY), close, NULL) IGNORE NULLS ORDER BY trade_date DESC LIMIT 1)[SAFE_OFFSET(0)]) AS c_1y,\n    COUNT(*) AS price_days,\n    MAX(break_date) AS break_date,\n    MAX(IF(rn <= 252, close, NULL)) AS hi_52w,\n    MIN(IF(rn <= 252, close, NULL)) AS lo_52w,\n    IF(COUNTIF(rn <= 20) >= 15, AVG(IF(rn <= 20, close * volume, NULL)), NULL) AS turnover_20d\n  FROM px_rows\n  WHERE tm >= DATE_SUB(max_d, INTERVAL 14 DAY)\n  GROUP BY ticker\n),\nj AS (\n  SELECT\n    c.edinet_code AS edinet_code,\n    SUBSTR(c.sec_code, 1, 4) AS sec_code4,\n    CASE WHEN c.sec_code IS NOT NULL THEN CONCAT(SUBSTR(c.sec_code, 1, 4), '.T') END AS ticker,\n    c.name AS name,\n    c.industry AS industry,\n    c.accounting_standard AS accounting_standard,\n    l.fiscal_year AS fiscal_year,\n    l.fiscal_year_end AS fiscal_year_end,\n    l.net_sales AS net_sales,\n    l.operating_income AS operating_income,\n    l.ordinary_income AS ordinary_income,\n    l.net_income AS net_income,\n    l.total_assets AS total_assets,\n    l.equity AS equity,\n    COALESCE(i.num_employees, l.employee_count) AS employees,\n    l.avg_annual_salary AS avg_annual_salary,\n    l.operating_income / NULLIF(l.net_sales, 0) AS operating_margin,\n    l.net_income / NULLIF(l.net_sales, 0) AS net_margin,\n    i.gross_profit / NULLIF(l.net_sales, 0) AS gross_margin,\n    l.roe AS roe,\n    l.roa AS roa,\n    i.rnd_expenses / NULLIF(l.net_sales, 0) AS rnd_ratio,\n    l.equity / NULLIF(l.total_assets, 0) AS equity_ratio,\n    ibd.v AS interest_bearing_debt,\n    ibd.basis AS interest_bearing_debt_basis,\n    l.cash_and_equiv AS cash_and_equiv,\n    l.cash_and_equiv - ibd.v AS net_cash,\n    ibd.v / NULLIF(l.equity, 0) AS de_ratio,\n    IF(p1.net_sales > 0, l.net_sales / p1.net_sales - 1, NULL) AS sales_growth_1y,\n    IF(p1.operating_income > 0, l.operating_income / p1.operating_income - 1, NULL) AS op_income_growth_1y,\n    IF(p1.net_income > 0, l.net_income / p1.net_income - 1, NULL) AS net_income_growth_1y,\n    IF(p3.net_sales > 0 AND l.net_sales > 0, POWER(l.net_sales / p3.net_sales, 1.0 / 3) - 1, NULL) AS sales_cagr_3y,\n    COALESCE(i.adjusted_eps, i.eps) AS eps,\n    COALESCE(i.adjusted_bps, i.bps) AS bps,\n    COALESCE(i.adjusted_dividend_per_share, i.dividend_per_share) AS dividend_per_share,\n    i.payout_ratio AS payout_ratio,\n    i.shares_issued AS shares_issued,\n    (i.shares_issued - COALESCE(i.treasury_shares, 0)) * i.split_factor AS shares_out,\n    IF(x.ticker IS NOT NULL, 'price_daily', NULL) AS price_source,\n    x.close AS current_price,\n    x.price_date AS price_date,\n    s.snapshot_date AS snapshot_date,\n    x.close * (i.shares_issued - COALESCE(i.treasury_shares, 0)) * i.split_factor AS mcap,\n    x.close / x.c_1m - 1 AS return_1m,\n    x.close / x.c_3m - 1 AS return_3m,\n    x.close / x.c_1y - 1 AS return_1y,\n    IF(x.price_days >= 120, x.hi_52w, NULL) AS high_52w,\n    IF(x.price_days >= 120, x.lo_52w, NULL) AS low_52w,\n    IF(x.price_days >= 120 AND x.hi_52w > x.lo_52w, (x.close - x.lo_52w) / (x.hi_52w - x.lo_52w) * 100, NULL) AS week52_position_pct,\n    x.turnover_20d AS avg_turnover_20d,\n    x.price_days AS price_days,\n    x.break_date AS break_date,\n    s.composite_score AS composite_score,\n    s.value_score AS value_score,\n    s.quality_score AS quality_score,\n    t.rsi14 AS rsi14,\n    t.above_ma200 AS above_ma200,\n    t.snapshot_date AS technical_date,\n    l.operating_cf AS operating_cf,\n    l.capex AS capex,\n    l.depreciation AS depreciation,\n    IF(i.effective_tax_rate BETWEEN 0.05 AND 0.5, i.effective_tax_rate, NULL) AS tax_rate_reported,\n    i.interest_expenses AS interest_expenses,\n    i.current_assets AS current_assets,\n    i.current_liabilities AS current_liabilities,\n    i.goodwill AS goodwill,\n    i.cash_dividends_paid AS cash_dividends_paid,\n    i.treasury_stock AS treasury_stock,\n    ip1.treasury_stock AS treasury_stock_p1,\n    i.treasury_cancelled AS treasury_cancelled,\n    i.gross_profit AS gp,\n    ip1.gross_profit AS gp_p1,\n    p1.net_sales AS sales_p1,\n    p1.net_income AS ni_p1,\n    p1.total_assets AS ta_p1,\n    ip1.current_assets AS ca_p1,\n    ip1.current_liabilities AS cl_p1,\n    ip1.shares_issued AS shares_issued_p1,\n    COALESCE(p1.interest_bearing_debt, ip1.ibd_current + ip1.ibd_noncurrent, ip1.ibd_total, ip1.loan_debt) AS ibd_p1,\n    IF(p3.operating_income > 0 AND l.operating_income > 0, POWER(l.operating_income / p3.operating_income, 1.0 / 3) - 1, NULL) AS op_income_cagr_3y,\n    IF(p3.net_income > 0 AND l.net_income > 0, POWER(l.net_income / p3.net_income, 1.0 / 3) - 1, NULL) AS net_income_cagr_3y,\n    gr.streak AS consec_up_years,\n    r.re_fiscal_year AS re_fiscal_year,\n    r.re_facility_count AS re_facility_count,\n    r.re_est_excluded_count AS re_est_excluded_count,\n    r.re_land_value_est AS re_land_value_est,\n    r.re_gain_raw AS re_gain_raw\n  FROM latest AS l\n  JOIN `stock-analyzer-edinet.edinet.company` AS c ON c.edinet_code = l.edinet_code\n  LEFT JOIN items AS i ON i.edinet_code = l.edinet_code AND i.fiscal_year = l.fiscal_year\n  CROSS JOIN UNNEST([STRUCT(COALESCE(l.interest_bearing_debt, i.ibd_current + i.ibd_noncurrent, i.ibd_total, i.loan_debt) AS v, CASE WHEN l.interest_bearing_debt IS NOT NULL OR i.ibd_current + i.ibd_noncurrent IS NOT NULL OR i.ibd_total IS NOT NULL THEN 'reported' WHEN i.loan_debt IS NOT NULL THEN 'estimated' END AS basis)]) AS ibd\n  LEFT JOIN items AS ip1 ON ip1.edinet_code = l.edinet_code AND ip1.fiscal_year = l.fiscal_year - 1\n  LEFT JOIN grow AS gr ON gr.edinet_code = l.edinet_code AND gr.fiscal_year = l.fiscal_year\n  LEFT JOIN re AS r ON r.edinet_code = l.edinet_code\n  LEFT JOIN fin AS p1 ON p1.edinet_code = l.edinet_code AND p1.fiscal_year = l.fiscal_year - 1\n  LEFT JOIN fin AS p3 ON p3.edinet_code = l.edinet_code AND p3.fiscal_year = l.fiscal_year - 3\n  LEFT JOIN snap AS s ON s.ticker = CONCAT(SUBSTR(c.sec_code, 1, 4), '.T')\n  LEFT JOIN tech AS t ON t.ticker = CONCAT(SUBSTR(c.sec_code, 1, 4), '.T')\n  LEFT JOIN px AS x ON x.ticker = CONCAT(SUBSTR(c.sec_code, 1, 4), '.T')\n  WHERE COALESCE(c.is_delisted, FALSE) = FALSE\n),\nv AS (\n  SELECT *,\n    IF(current_price IS NOT NULL AND eps > 0, current_price / eps, NULL) AS per_raw,\n    IF(current_price IS NOT NULL AND bps > 0, current_price / bps, NULL) AS pbr_raw,\n    IF(current_price IS NOT NULL AND dividend_per_share IS NOT NULL, dividend_per_share / current_price, NULL) AS yield_raw\n  FROM j\n),\nd1 AS (\n  SELECT *,\n    COALESCE(tax_rate_reported, 0.306) AS tax_rate,\n    IF(tax_rate_reported IS NOT NULL, 'reported', 'assumed') AS roic_tax_basis,\n    operating_income + depreciation AS ebitda,\n    operating_cf - capex AS fcf,\n    mcap + interest_bearing_debt - cash_and_equiv AS ev,\n    COALESCE(cash_dividends_paid, dividend_per_share * shares_out) AS dividends_paid,\n    IF(treasury_stock IS NOT NULL AND treasury_stock_p1 IS NOT NULL, GREATEST(0, ABS(treasury_stock) - ABS(treasury_stock_p1) + ABS(COALESCE(treasury_cancelled, 0))), NULL) AS buyback_est,\n    IF(re_gain_raw IS NOT NULL AND mcap > 0 AND re_gain_raw > 3 * mcap, 'gt_3x_mcap', NULL) AS re_gain_flag,\n    IF(re_gain_raw IS NOT NULL AND NOT (mcap > 0 AND re_gain_raw > 3 * mcap), re_gain_raw, NULL) AS re_gain_use,\n    IF(interest_bearing_debt IS NOT NULL AND interest_bearing_debt + equity > 0, interest_bearing_debt + equity, NULL) AS invested_capital\n  FROM v\n),\nd2 AS (\n  SELECT *,\n    operating_income * (1 - tax_rate) AS nopat,\n    operating_income * (1 - tax_rate) / invested_capital AS roic,\n    operating_cf / NULLIF(net_sales, 0) AS ocf_margin,\n    fcf / NULLIF(net_sales, 0) AS fcf_margin,\n    gp / NULLIF(net_sales, 0) - gp_p1 / NULLIF(sales_p1, 0) AS gross_margin_chg_1y,\n    IF(ev > 0 AND ebitda > 0, ev / ebitda, NULL) AS ev_ebitda,\n    IF(ev > 0, ev / NULLIF(net_sales, 0), NULL) AS ev_sales,\n    IF(mcap > 0, mcap / NULLIF(net_sales, 0), NULL) AS psr,\n    IF(mcap > 0, fcf / mcap, NULL) AS fcf_yield,\n    IF(interest_expenses > 0, operating_income / interest_expenses, NULL) AS interest_coverage,\n    current_assets / NULLIF(current_liabilities, 0) AS current_ratio,\n    IF(equity > 0, goodwill / equity, NULL) AS goodwill_to_equity,\n    (net_income - operating_cf) / NULLIF(total_assets, 0) AS accrual_ratio,\n    IF(equity > 0, dividends_paid / equity, NULL) AS doe,\n    IF(mcap > 0, buyback_est / mcap, NULL) AS buyback_yield,\n    IF(mcap > 0 AND dividends_paid IS NOT NULL, (dividends_paid + COALESCE(buyback_est, 0)) / mcap, NULL) AS total_payout_yield,\n    IF(mcap > 0, re_gain_use / mcap, NULL) AS re_gain_to_mcap,\n    IF(mcap > 0 AND re_gain_use IS NOT NULL, re_land_value_est / mcap, NULL) AS re_land_value_to_mcap,\n    re_gain_use * (1 - 0.306) AS re_gain_after_tax,\n    IF(mcap > 0 AND equity + re_gain_use * (1 - 0.306) > 0, equity + re_gain_use * (1 - 0.306), NULL) AS adj_equity,\n    IF(mcap > 0 AND re_gain_use IS NOT NULL AND net_cash IS NOT NULL, (net_cash + re_gain_use * (1 - 0.306)) / mcap, NULL) AS asset_value_ratio,\n    CAST(net_income / NULLIF(total_assets, 0) > 0 AS INT64) AS f1,\n    CAST(operating_cf > 0 AS INT64) AS f2,\n    CAST(net_income / NULLIF(total_assets, 0) > ni_p1 / NULLIF(ta_p1, 0) AS INT64) AS f3,\n    CAST(operating_cf > net_income AS INT64) AS f4,\n    CAST(interest_bearing_debt / NULLIF(total_assets, 0) <= ibd_p1 / NULLIF(ta_p1, 0) AS INT64) AS f5,\n    CAST(current_assets / NULLIF(current_liabilities, 0) > ca_p1 / NULLIF(cl_p1, 0) AS INT64) AS f6,\n    CAST(shares_issued / NULLIF(shares_issued_p1, 0) <= 1.01 OR shares_issued / NULLIF(shares_issued_p1, 0) >= 1.2 AS INT64) AS f7,\n    CAST(gp / NULLIF(net_sales, 0) > gp_p1 / NULLIF(sales_p1, 0) AS INT64) AS f8,\n    CAST(net_sales / NULLIF(total_assets, 0) > sales_p1 / NULLIF(ta_p1, 0) AS INT64) AS f9\n  FROM d1\n),\nf AS (\n  SELECT *,\n    CASE\n      -- EPS×株数が純利益と合わない（株数・EPSの単位不整合）\n      WHEN eps > 0 AND net_income > 0 AND shares_out > 0 AND (eps * shares_out / net_income < 0.5 OR eps * shares_out / net_income > 2) THEN 'eps_mismatch'\n      -- 純利益が純資産の半分を超え PER が3倍未満＝負ののれん発生益など一過性の利益で EPS が膨らんでいる\n      WHEN per_raw < 3 AND equity > 0 AND net_income / equity > 0.5 THEN 'one_off_profit'\n      -- 配当利回り15%超は特別配当・単位違いの疑い\n      WHEN yield_raw > 0.15 THEN 'yield_outlier'\n    END AS valuation_flag\n  FROM d2\n),\ng AS (\n  SELECT *,\n    IF(valuation_flag IN ('eps_mismatch', 'one_off_profit'), NULL, per_raw) AS per_final,\n    IF(adj_equity > 0, mcap / adj_equity, NULL) AS adj_pbr,\n    IF(f1 IS NULL, 0, 1) + IF(f2 IS NULL, 0, 1) + IF(f3 IS NULL, 0, 1) + IF(f4 IS NULL, 0, 1) + IF(f5 IS NULL, 0, 1) + IF(f6 IS NULL, 0, 1) + IF(f7 IS NULL, 0, 1) + IF(f8 IS NULL, 0, 1) + IF(f9 IS NULL, 0, 1) AS f_items,\n    COALESCE(f1, 0) + COALESCE(f2, 0) + COALESCE(f3, 0) + COALESCE(f4, 0) + COALESCE(f5, 0) + COALESCE(f6, 0) + COALESCE(f7, 0) + COALESCE(f8, 0) + COALESCE(f9, 0) AS f_sum\n  FROM f\n)\nSELECT\n  edinet_code,\n  sec_code4,\n  ticker,\n  name,\n  industry,\n  accounting_standard,\n  fiscal_year,\n  fiscal_year_end,\n  net_sales,\n  operating_income,\n  ordinary_income,\n  net_income,\n  total_assets,\n  equity,\n  employees,\n  avg_annual_salary,\n  operating_margin,\n  net_margin,\n  gross_margin,\n  roe,\n  roa,\n  rnd_ratio,\n  equity_ratio,\n  interest_bearing_debt,\n  interest_bearing_debt_basis,\n  cash_and_equiv,\n  net_cash,\n  de_ratio,\n  sales_growth_1y,\n  op_income_growth_1y,\n  net_income_growth_1y,\n  sales_cagr_3y,\n  eps,\n  bps,\n  dividend_per_share,\n  payout_ratio,\n  shares_issued,\n  shares_out,\n  price_source,\n  current_price,\n  price_date,\n  snapshot_date,\n  mcap / 1e8 AS market_cap_b,\n  mcap AS market_cap,\n  IF(valuation_flag IN ('eps_mismatch', 'one_off_profit'), NULL, per_raw) AS per,\n  pbr_raw AS pbr,\n  IF(valuation_flag = 'yield_outlier', NULL, yield_raw) AS dividend_yield,\n  valuation_flag,\n  IF(net_cash IS NOT NULL AND mcap > 0, net_cash / mcap, NULL) AS net_cash_to_mcap,\n  return_1m,\n  return_3m,\n  return_1y,\n  high_52w,\n  low_52w,\n  week52_position_pct,\n  avg_turnover_20d,\n  price_days,\n  break_date AS price_break_date,\n  composite_score,\n  value_score,\n  quality_score,\n  rsi14,\n  above_ma200,\n  technical_date,\n  nopat,\n  invested_capital,\n  tax_rate,\n  roic_tax_basis,\n  roic,\n  ocf_margin,\n  fcf_margin,\n  gross_margin_chg_1y,\n  operating_cf,\n  fcf,\n  ebitda,\n  ev,\n  ev_ebitda,\n  ev_sales,\n  psr,\n  IF(per_final > 0 AND net_income_cagr_3y > 0, per_final / (net_income_cagr_3y * 100), NULL) AS peg,\n  fcf_yield,\n  IF(valuation_flag IN ('eps_mismatch', 'one_off_profit') OR current_price IS NULL, NULL, eps / current_price) AS earnings_yield,\n  re_fiscal_year,\n  re_facility_count,\n  re_est_excluded_count,\n  re_land_value_est,\n  re_gain_raw AS re_unrealized_gain,\n  re_gain_flag,\n  re_gain_to_mcap,\n  re_land_value_to_mcap,\n  re_gain_after_tax,\n  adj_equity,\n  adj_pbr,\n  asset_value_ratio,\n  interest_coverage,\n  current_ratio,\n  goodwill_to_equity,\n  accrual_ratio,\n  IF(f_items >= 7, f_sum, NULL) AS f_score,\n  f_items AS f_score_items,\n  buyback_est,\n  buyback_yield,\n  total_payout_yield,\n  doe,\n  op_income_cagr_3y,\n  net_income_cagr_3y,\n  consec_up_years\nFROM g\n", "desc": "企業スクリーナー。1社1行（最新の決算期×全上場の最新株価）。ROIC・EV/EBITDA・土地含み益倍率・Fスコア・総還元など多面指標つき", "columns": [{"name": "edinet_code", "type": "string", "label": "EDINETコード"}, {"name": "sec_code4", "type": "string", "label": "証券コード"}, {"name": "ticker", "type": "string", "label": "ティッカー"}, {"name": "name", "type": "string", "label": "社名"},
